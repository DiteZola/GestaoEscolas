<script type="module">
// ============================================================
// MÓDULO: HISTÓRICO ESCOLAR
// ============================================================
window.PageHistorico = {
  async render(container) {
    const schoolId = APP.currentSchool ? APP.currentSchool.id : null;
    if (!schoolId) {
      container.innerHTML = '<div class="empty-state"><i class="fas fa-school"></i><p>Selecione uma escola primeiro</p></div>';
      return;
    }

    container.innerHTML = `
      <h2 class="page-title"><i class="fas fa-history"></i> Histórico Escolar</h2>
      <div class="tabs no-print">
        <div class="tab-item active" onclick="PageHistorico.switchTab('consulta')">Consultar Histórico</div>
        <div class="tab-item" onclick="PageHistorico.switchTab('adicionar')">Adicionar Notas Históricas</div>
      </div>

      <div id="tabHistConsulta" class="tab-content active">
        <div class="card mb-3">
          <div class="card-body">
            <div class="form-group">
              <label>Pesquisar Aluno (nome, BI, matrícula ou processo)</label>
              <input type="text" id="histSearchAluno" class="search-input w-full" placeholder="Digite para pesquisar..." oninput="PageHistorico.searchAluno()">
            </div>
            <div id="histSearchResults" style="max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius);display:none"></div>
          </div>
        </div>
        <div id="histContent"></div>
      </div>

      <div id="tabHistAdicionar" class="tab-content">
        <div class="card mb-3">
          <div class="card-body">
            <p style="color:var(--text-light);margin-bottom:12px"><i class="fas fa-info-circle"></i> Adicione notas de classes anteriores (6ª, 9ª, 12ª, 13ª) que serão utilizadas nos certificados.</p>
            <div class="form-group">
              <label>Pesquisar Aluno</label>
              <input type="text" id="histAddSearch" class="search-input w-full" placeholder="Digite nome, BI ou matrícula..." oninput="PageHistorico.searchAlunoAdd()">
            </div>
            <div id="histAddResults" style="max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius);display:none"></div>
            <div id="histAddForm" style="display:none"></div>
          </div>
        </div>
      </div>`;
  },

  _allAlunos: [],
  _selectedAluno: null,

  async _loadAllAlunos() {
    if (this._allAlunos.length > 0) return;
    this._allAlunos = await DB.getCollection('alunos', [FB.where('schoolId', '==', APP.currentSchool.id)]);
    this._allAlunos.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  },

  switchTab(tab) {
    document.querySelectorAll('.tab-item').forEach((t, i) => t.classList.toggle('active', (i === 0 && tab === 'consulta') || (i === 1 && tab === 'adicionar')));
    document.getElementById('tabHistConsulta').classList.toggle('active', tab === 'consulta');
    document.getElementById('tabHistAdicionar').classList.toggle('active', tab === 'adicionar');
  },

  async searchAluno() {
    await this._loadAllAlunos();
    const term = (document.getElementById('histSearchAluno')?.value || '').toLowerCase().trim();
    const div = document.getElementById('histSearchResults');
    if (!term || term.length < 2) { div.style.display = 'none'; return; }
    const matches = this._allAlunos.filter(a =>
      (a.name || '').toLowerCase().includes(term) || (a.bi || '').toLowerCase().includes(term) ||
      (a.matricula || '').toLowerCase().includes(term) || (a.processo || '').toLowerCase().includes(term)
    ).slice(0, 10);
    if (matches.length === 0) { div.innerHTML = '<div style="padding:12px;color:var(--text-light)">Nenhum aluno encontrado</div>'; }
    else {
      div.innerHTML = matches.map(a => `
        <div style="padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px"
             onmouseover="this.style.background='#f0f4ff'" onmouseout="this.style.background=''"
             onclick="PageHistorico.selectAluno('${a.id}')">
          ${a.photo ? `<img src="${a.photo}" class="photo-small">` : '<i class="fas fa-user-circle" style="font-size:24px;color:var(--text-light)"></i>'}
          <div><strong style="color:var(--angola-red)">${a.name}</strong><br><small>${a.classeName || ''} | Mat: ${a.matricula || ''} | ${a.yearName || ''}</small></div>
        </div>`).join('');
    }
    div.style.display = 'block';
  },

  async selectAluno(id) {
    document.getElementById('histSearchResults').style.display = 'none';
    this._selectedAluno = this._allAlunos.find(a => a.id === id);
    if (!this._selectedAluno) return;

    showLoading(true);
    try {
      // Carregar todas as notas do aluno (todos os anos)
      const notas = await DB.getCollection('notas', [FB.where('alunoId', '==', id)]);
      // Carregar notas históricas
      const notasHist = await DB.getCollection('notasHistorico', [FB.where('alunoId', '==', id)]);
      // Carregar disciplinas
      const disciplinas = await DB.getCollection('disciplinas', [FB.where('schoolId', '==', APP.currentSchool.id)]);
      disciplinas.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));

      // Agrupar por classe/ano
      const porClasse = {};
      [...notas, ...notasHist].forEach(n => {
        const key = n.classeName || n.classe || 'N/D';
        if (!porClasse[key]) porClasse[key] = [];
        porClasse[key].push(n);
      });

      // Ordenar classes
      const classesOrdenadas = Object.keys(porClasse).sort((a, b) => Utils.getClasseNum(a) - Utils.getClasseNum(b));

      const aluno = this._selectedAluno;
      const notaPos = Utils.getNotaPositiva(aluno.classeName || '');

      let html = `
        <div class="card mb-3">
          <div class="card-header">
            <div>
              <h3 style="color:var(--angola-red)">${aluno.name}</h3>
              <small>Matrícula: ${aluno.matricula || 'N/D'} | Processo: ${aluno.processo || 'N/D'} | BI: ${aluno.bi || 'N/D'}</small>
            </div>
            <div class="no-print" style="display:flex;gap:6px">
              <button class="btn btn-sm btn-primary" onclick="PageHistorico.exportPDF('${id}')"><i class="fas fa-file-pdf"></i> PDF</button>
            </div>
          </div>
          <div class="card-body">`;

      if (classesOrdenadas.length === 0) {
        html += '<div class="empty-state"><p>Nenhuma nota encontrada para este aluno</p></div>';
      } else {
        classesOrdenadas.forEach(classe => {
          const notasDaClasse = porClasse[classe];
          const pos = Utils.getNotaPositiva(classe);
          const max = Utils.getMaxNota(classe);

          // Ordenar disciplinas conforme ordem cadastrada
          notasDaClasse.sort((a, b) => {
            const da = disciplinas.find(d => d.id === a.disciplinaId || d.name === a.disciplina || d.name === a.disciplinaName);
            const db2 = disciplinas.find(d => d.id === b.disciplinaId || d.name === b.disciplina || d.name === b.disciplinaName);
            return ((da?.ordem || 99) - (db2?.ordem || 99));
          });

          html += `<h4 style="margin:16px 0 8px;color:var(--primary)"><i class="fas fa-layer-group"></i> ${classe}</h4>`;
          html += '<div class="table-container mb-3"><table class="table-sm"><thead><tr><th>Disciplina</th><th class="text-center">MAC₁</th><th class="text-center">NPT₁</th><th class="text-center">MT₁</th><th class="text-center">MAC₂</th><th class="text-center">NPT₂</th><th class="text-center">MT₂</th><th class="text-center">MAC₃</th><th class="text-center">MFD</th></tr></thead><tbody>';

          notasDaClasse.forEach(n => {
            const calc = Utils.calcularMedia(n, classe);
            html += `<tr>
              <td><strong>${n.disciplina || n.disciplinaName || ''}</strong></td>
              <td class="text-center">${n.mac1 ?? ''}</td><td class="text-center">${n.npt1 ?? ''}</td>
              <td class="text-center ${calc.mt1 !== null ? (calc.mt1 >= pos ? 'nota-positiva' : 'nota-negativa') : ''}">${calc.mt1 ?? ''}</td>
              <td class="text-center">${n.mac2 ?? ''}</td><td class="text-center">${n.npt2 ?? ''}</td>
              <td class="text-center ${calc.mt2 !== null ? (calc.mt2 >= pos ? 'nota-positiva' : 'nota-negativa') : ''}">${calc.mt2 ?? ''}</td>
              <td class="text-center">${n.mac3 ?? ''}</td>
              <td class="text-center ${calc.mfd !== null ? (calc.mfd >= pos ? 'nota-positiva' : 'nota-negativa') : ''}"><strong>${calc.mfd ?? (n.mfd ?? '')}</strong></td>
            </tr>`;
          });
          html += '</tbody></table></div>';
        });
      }

      html += '</div></div>';
      document.getElementById('histContent').innerHTML = html;

    } catch (e) { console.error(e); Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  // ====== ADICIONAR NOTAS HISTÓRICAS ======
  async searchAlunoAdd() {
    await this._loadAllAlunos();
    const term = (document.getElementById('histAddSearch')?.value || '').toLowerCase().trim();
    const div = document.getElementById('histAddResults');
    if (!term || term.length < 2) { div.style.display = 'none'; return; }
    const matches = this._allAlunos.filter(a =>
      (a.name || '').toLowerCase().includes(term) || (a.bi || '').toLowerCase().includes(term) ||
      (a.matricula || '').toLowerCase().includes(term)
    ).slice(0, 10);
    div.innerHTML = matches.length === 0 ? '<div style="padding:12px;color:var(--text-light)">Nenhum aluno encontrado</div>' :
      matches.map(a => `
        <div style="padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border)"
             onmouseover="this.style.background='#f0f4ff'" onmouseout="this.style.background=''"
             onclick="PageHistorico.selectAlunoAdd('${a.id}')">
          <strong style="color:var(--angola-red)">${a.name}</strong> - ${a.classeName || ''} (${a.yearName || ''})
        </div>`).join('');
    div.style.display = 'block';
  },

  async selectAlunoAdd(id) {
    document.getElementById('histAddResults').style.display = 'none';
    const aluno = this._allAlunos.find(a => a.id === id);
    if (!aluno) return;
    this._selectedAluno = aluno;

    // Carregar classes e disciplinas
    const classes = await DB.getCollection('classes', [FB.where('schoolId', '==', APP.currentSchool.id)]);
    classes.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));

    // Carregar notas históricas existentes
    const notasHist = await DB.getCollection('notasHistorico', [FB.where('alunoId', '==', id)]);

    const formDiv = document.getElementById('histAddForm');
    formDiv.style.display = 'block';
    formDiv.innerHTML = `
      <hr>
      <h4 class="mb-2"><i class="fas fa-user"></i> <span style="color:var(--angola-red)">${aluno.name}</span></h4>
      <p class="mb-3">Classe actual: ${aluno.classeName || 'N/D'} | Matrícula: ${aluno.matricula || 'N/D'}</p>
      <div class="form-row mb-3">
        <div class="form-group">
          <label>Classe para adicionar notas *</label>
          <select id="histAddClasse" onchange="PageHistorico.loadDiscHistorico()">
            <option value="">Selecione a classe</option>
            ${classes.map(c => `<option value="${c.id}" data-name="${c.name}">${c.name}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label>Ano Letivo</label>
          <input type="text" id="histAddAno" placeholder="Ex: 2023/2024">
        </div>
      </div>
      <div id="histAddDiscContainer"></div>`;
  },

  async loadDiscHistorico() {
    const classeId = document.getElementById('histAddClasse').value;
    const sel = document.getElementById('histAddClasse');
    const classeName = sel.options[sel.selectedIndex]?.dataset?.name || '';
    if (!classeId) return;

    const disciplinas = await DB.getCollection('disciplinas', [
      FB.where('schoolId', '==', APP.currentSchool.id),
      FB.where('classeId', '==', classeId)
    ]);
    disciplinas.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));

    // Carregar notas existentes para esta classe
    const notasHist = await DB.getCollection('notasHistorico', [
      FB.where('alunoId', '==', this._selectedAluno.id),
      FB.where('classeId', '==', classeId)
    ]);
    const notasMap = {};
    notasHist.forEach(n => { notasMap[n.disciplinaId] = n; });

    const maxNota = Utils.getMaxNota(classeName);
    const container = document.getElementById('histAddDiscContainer');

    if (disciplinas.length === 0) {
      container.innerHTML = '<div class="empty-state"><p>Nenhuma disciplina cadastrada para esta classe. Cadastre disciplinas primeiro.</p></div>';
      return;
    }

    container.innerHTML = `
      <div class="table-container">
        <table class="table-sm">
          <thead><tr><th>Disciplina</th><th class="text-center">MAC₁</th><th class="text-center">NPT₁</th><th class="text-center">MAC₂</th><th class="text-center">NPT₂</th><th class="text-center">MAC₃</th>
          ${Utils.isClasseFinal(classeName) ? '<th class="text-center">Exame</th>' : '<th class="text-center">NPT₃</th>'}
          <th class="text-center">MFD</th></tr></thead>
          <tbody>
            ${disciplinas.map(d => {
              const n = notasMap[d.id] || {};
              const inputS = `style="width:50px;padding:3px;text-align:center;border:1px solid var(--border);border-radius:4px;font-size:12px"`;
              return `<tr>
                <td><strong>${d.name}</strong></td>
                <td class="text-center"><input type="number" ${inputS} min="0" max="${maxNota}" step="0.1" value="${n.mac1 ?? ''}" data-disc="${d.id}" data-field="mac1"></td>
                <td class="text-center"><input type="number" ${inputS} min="0" max="${maxNota}" step="0.1" value="${n.npt1 ?? ''}" data-disc="${d.id}" data-field="npt1"></td>
                <td class="text-center"><input type="number" ${inputS} min="0" max="${maxNota}" step="0.1" value="${n.mac2 ?? ''}" data-disc="${d.id}" data-field="mac2"></td>
                <td class="text-center"><input type="number" ${inputS} min="0" max="${maxNota}" step="0.1" value="${n.npt2 ?? ''}" data-disc="${d.id}" data-field="npt2"></td>
                <td class="text-center"><input type="number" ${inputS} min="0" max="${maxNota}" step="0.1" value="${n.mac3 ?? ''}" data-disc="${d.id}" data-field="mac3"></td>
                ${Utils.isClasseFinal(classeName) ?
                  `<td class="text-center"><input type="number" ${inputS} min="0" max="${maxNota}" step="0.1" value="${n.exame ?? ''}" data-disc="${d.id}" data-field="exame"></td>` :
                  `<td class="text-center"><input type="number" ${inputS} min="0" max="${maxNota}" step="0.1" value="${n.npt3 ?? ''}" data-disc="${d.id}" data-field="npt3"></td>`
                }
                <td class="text-center"><strong id="mfd_${d.id}">${n.mfd ?? ''}</strong></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
      <div style="margin-top:12px;text-align:right">
        <button class="btn btn-success" onclick="PageHistorico.salvarNotasHistorico()"><i class="fas fa-save"></i> Salvar Notas Históricas</button>
      </div>`;
  },

  async salvarNotasHistorico() {
    const classeId = document.getElementById('histAddClasse').value;
    const sel = document.getElementById('histAddClasse');
    const classeName = sel.options[sel.selectedIndex]?.dataset?.name || '';
    const anoLetivo = document.getElementById('histAddAno').value;
    const aluno = this._selectedAluno;
    if (!classeId || !aluno) return;

    const inputs = document.querySelectorAll('#histAddDiscContainer input[data-disc]');
    const discNotas = {};
    inputs.forEach(inp => {
      const discId = inp.dataset.disc;
      const field = inp.dataset.field;
      if (!discNotas[discId]) discNotas[discId] = {};
      discNotas[discId][field] = inp.value !== '' ? parseFloat(inp.value) : null;
    });

    const disciplinas = await DB.getCollection('disciplinas', [
      FB.where('schoolId', '==', APP.currentSchool.id),
      FB.where('classeId', '==', classeId)
    ]);

    showLoading(true);
    let saved = 0;
    try {
      for (const discId in discNotas) {
        const vals = discNotas[discId];
        const disc = disciplinas.find(d => d.id === discId);
        const calc = Utils.calcularMedia(vals, classeName);

        const data = {
          ...vals,
          mt1: calc.mt1, mt2: calc.mt2, ct1: calc.ct1, ct2: calc.ct2, ct3: calc.ct3, mfd: calc.mfd,
          alunoId: aluno.id,
          alunoName: aluno.name,
          disciplinaId: discId,
          disciplina: disc ? disc.name : '',
          disciplinaName: disc ? disc.name : '',
          classeId: classeId,
          classeName: classeName,
          classe: classeName,
          anoLetivo: anoLetivo,
          schoolId: APP.currentSchool.id,
          tipo: 'historico'
        };

        // Verificar se já existe
        const existing = await DB.getCollection('notasHistorico', [
          FB.where('alunoId', '==', aluno.id),
          FB.where('disciplinaId', '==', discId),
          FB.where('classeId', '==', classeId)
        ]);

        const docId = existing.length > 0 ? existing[0].id : Utils.generateId();
        await DB.saveDoc('notasHistorico', docId, data);
        saved++;
      }
      Utils.toast(`${saved} notas históricas salvas!`, 'success');
      this.loadDiscHistorico();
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  async exportPDF(alunoId) {
    const aluno = this._allAlunos.find(a => a.id === alunoId) || this._selectedAluno;
    if (!aluno) return;

    const notas = await DB.getCollection('notas', [FB.where('alunoId', '==', alunoId)]);
    const notasHist = await DB.getCollection('notasHistorico', [FB.where('alunoId', '==', alunoId)]);
    const disciplinas = await DB.getCollection('disciplinas', [FB.where('schoolId', '==', APP.currentSchool.id)]);
    disciplinas.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));

    const todas = [...notas, ...notasHist];
    const porClasse = {};
    todas.forEach(n => {
      const key = n.classeName || n.classe || 'N/D';
      if (!porClasse[key]) porClasse[key] = [];
      porClasse[key].push(n);
    });
    const classesOrdenadas = Object.keys(porClasse).sort((a, b) => Utils.getClasseNum(a) - Utils.getClasseNum(b));

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    let y = PDFHelper.addHeader(doc, APP.currentSchool, { title: 'HISTÓRICO ESCOLAR' });
    const pw = doc.internal.pageSize.getWidth();

    doc.setFontSize(11); doc.setFont('helvetica', 'bold');
    doc.setTextColor(206, 17, 38);
    doc.text(aluno.name, pw / 2, y + 3, { align: 'center' });
    doc.setTextColor(0, 0, 0);
    y += 8;
    doc.setFontSize(8); doc.setFont('helvetica', 'normal');
    doc.text(`Matrícula: ${aluno.matricula || 'N/D'} | Processo: ${aluno.processo || 'N/D'} | BI: ${aluno.bi || 'N/D'}`, pw / 2, y, { align: 'center' });
    y += 8;

    classesOrdenadas.forEach(classe => {
      const notasDaClasse = porClasse[classe];
      notasDaClasse.sort((a, b) => {
        const da = disciplinas.find(d => d.id === a.disciplinaId || d.name === a.disciplina);
        const db2 = disciplinas.find(d => d.id === b.disciplinaId || d.name === b.disciplina);
        return ((da?.ordem || 99) - (db2?.ordem || 99));
      });

      if (y > 250) { doc.addPage(); y = 15; }
      doc.setFontSize(10); doc.setFont('helvetica', 'bold');
      doc.text(classe, 14, y); y += 2;

      doc.autoTable({
        startY: y,
        head: [['Disciplina', 'MFD', 'Classificação']],
        body: notasDaClasse.map(n => {
          const calc = Utils.calcularMedia(n, classe);
          const mfd = calc.mfd ?? n.mfd ?? '';
          return [n.disciplina || n.disciplinaName || '', mfd, mfd !== '' ? Utils.valorExtenso(mfd) : ''];
        }),
        styles: { fontSize: 8 },
        headStyles: { fillColor: [15, 23, 42] },
        margin: { left: 14, right: 14 }
      });
      y = doc.lastAutoTable.finalY + 8;
    });

    doc.save(`historico_${(aluno.name || '').replace(/\s/g, '_')}.pdf`);
    Utils.toast('Histórico PDF gerado!', 'success');
  }
};

// ============================================================
// MÓDULO: BOLETINS
// ============================================================
window.PageBoletins = {
  async render(container) {
    const schoolId = APP.currentSchool ? APP.currentSchool.id : null;
    if (!schoolId) {
      container.innerHTML = '<div class="empty-state"><i class="fas fa-school"></i><p>Selecione uma escola primeiro</p></div>';
      return;
    }

    container.innerHTML = `
      <h2 class="page-title"><i class="fas fa-file-contract"></i> Boletins</h2>
      <div class="card mb-3 no-print">
        <div class="card-body">
          <div class="filter-grid" style="padding:0;box-shadow:none">
            <div class="form-group"><label>Classe</label>
              <select id="bolClasse" onchange="PageBoletins.onClasseChange()"><option value="">Selecione</option></select></div>
            <div class="form-group"><label>Turma</label>
              <select id="bolTurma"><option value="">Selecione</option></select></div>
            <div class="form-group"><label>Trimestre</label>
              <select id="bolTrimestre"><option value="1">I Trimestre</option><option value="2">II Trimestre</option><option value="3">III Trimestre</option></select></div>
            <div class="form-group" style="padding-top:20px">
              <button class="btn btn-primary" onclick="PageBoletins.gerar()"><i class="fas fa-cogs"></i> Gerar Boletins</button>
            </div>
          </div>
        </div>
      </div>
      <div id="boletinsContent"></div>`;

    await this.loadFilters();
  },

  _classes: [], _turmas: [], _disciplinas: [],

  async loadFilters() {
    const sid = APP.currentSchool.id;
    this._classes = await DB.getCollection('classes', [FB.where('schoolId', '==', sid)]);
    this._classes.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
    let tQ = [FB.where('schoolId', '==', sid)];
    if (APP.currentYearId) tQ.push(FB.where('yearId', '==', APP.currentYearId));
    this._turmas = await DB.getCollection('turmas', tQ);
    this._disciplinas = await DB.getCollection('disciplinas', [FB.where('schoolId', '==', sid)]);
    this._disciplinas.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));

    const sel = document.getElementById('bolClasse');
    this._classes.forEach(c => { sel.innerHTML += `<option value="${c.id}">${c.name}</option>`; });
  },

  onClasseChange() {
    const cid = document.getElementById('bolClasse').value;
    const sel = document.getElementById('bolTurma');
    sel.innerHTML = '<option value="">Selecione</option>';
    this._turmas.filter(t => t.classeId === cid).forEach(t => {
      sel.innerHTML += `<option value="${t.id}">${t.name} ${t.curso ? '(' + t.curso + ')' : ''}</option>`;
    });
  },

  async gerar() {
    const classeId = document.getElementById('bolClasse').value;
    const turmaId = document.getElementById('bolTurma').value;
    const trimestre = document.getElementById('bolTrimestre').value;
    if (!classeId || !turmaId) { Utils.toast('Selecione classe e turma', 'warning'); return; }

    const classe = this._classes.find(c => c.id === classeId);
    const turma = this._turmas.find(t => t.id === turmaId);
    const trimNomes = { '1': 'I Trimestre', '2': 'II Trimestre', '3': 'III Trimestre' };

    showLoading(true);
    try {
      let alunoQ = [FB.where('schoolId', '==', APP.currentSchool.id), FB.where('turmaId', '==', turmaId)];
      if (APP.currentYearId) alunoQ.push(FB.where('yearId', '==', APP.currentYearId));
      let alunos = await DB.getCollection('alunos', alunoQ);
      alunos = alunos.filter(a => a.estado === 'Activo' || a.estado === 'Ativo');
      alunos.sort((a, b) => (a.name || '').localeCompare(b.name || ''));

      let discs = this._disciplinas.filter(d => d.classeId === classeId);
      if (turma && turma.curso) discs = discs.filter(d => !d.curso || d.curso === turma.curso || d.curso === '');

      let notasQ = [FB.where('schoolId', '==', APP.currentSchool.id), FB.where('turmaId', '==', turmaId)];
      if (APP.currentYearId) notasQ.push(FB.where('yearId', '==', APP.currentYearId));
      const todasNotas = await DB.getCollection('notas', notasQ);
      const notasMap = {};
      todasNotas.forEach(n => { notasMap[`${n.alunoId}_${n.disciplinaId}`] = n; });

      const notaPos = Utils.getNotaPositiva(classe ? classe.name : '');
      const school = APP.currentSchool;

      // Gerar preview
      let html = `<div class="flex-between mb-3 no-print">
        <p>${alunos.length} boletins gerados</p>
        <div style="display:flex;gap:6px">
          <button class="btn btn-primary" onclick="PageBoletins.exportAllPDF()"><i class="fas fa-file-pdf"></i> Baixar Todos (PDF - 4 por folha A4)</button>
        </div>
      </div>`;

      alunos.forEach((aluno, idx) => {
        html += `<div class="card mb-3" id="boletim_${idx}">
          <div class="card-body" style="max-width:500px;margin:0 auto">
            <div style="text-align:center;margin-bottom:8px">
              ${APP.insigniaBase64 ? `<img src="${APP.insigniaBase64}" style="height:35px;margin-bottom:4px"><br>` : ''}
              <strong style="font-size:10px">REPÚBLICA DE ANGOLA</strong><br>
              <span style="font-size:9px">MINISTÉRIO DA EDUCAÇÃO</span><br>
              <strong style="font-size:11px">${school.name || ''}</strong><br>
              <span style="font-size:9px">${school.municipality || ''} - ${school.province || ''}</span>
              <h4 style="margin:6px 0">BOLETIM DE NOTAS</h4>
              <span style="font-size:10px">${trimNomes[trimestre]} - Ano Letivo: ${APP.currentYear?.name || ''}</span>
            </div>
            <div style="margin-bottom:8px;font-size:11px">
              <p><strong>Aluno(a):</strong> <span style="color:var(--angola-red);font-weight:700">${aluno.name}</span></p>
              <p><strong>Classe:</strong> ${classe?.name || ''} | <strong>Turma:</strong> ${turma?.name || ''} ${turma?.curso ? '(' + turma.curso + ')' : ''}</p>
              <p><strong>N° Processo:</strong> ${aluno.processo || 'N/D'}</p>
            </div>
            <table class="table-sm" style="font-size:10px">
              <thead><tr><th>Disciplina</th><th class="text-center">MAC</th><th class="text-center">NPT</th><th class="text-center">MT</th></tr></thead>
              <tbody>`;

        discs.forEach(d => {
          const nota = notasMap[`${aluno.id}_${d.id}`];
          const calc = nota ? Utils.calcularMedia(nota, classe.name) : {};
          let mac = '', npt = '', mt = null;
          if (trimestre === '1') { mac = nota?.mac1 ?? ''; npt = nota?.npt1 ?? ''; mt = calc.mt1; }
          else if (trimestre === '2') { mac = nota?.mac2 ?? ''; npt = nota?.npt2 ?? ''; mt = calc.mt2; }
          else { mac = nota?.mac3 ?? ''; npt = nota?.npt3 ?? ''; mt = calc.mfd; }
          const mtClass = mt !== null ? (mt >= notaPos ? 'nota-positiva' : 'nota-negativa') : '';
          html += `<tr><td>${d.name}</td><td class="text-center">${mac}</td><td class="text-center">${npt}</td><td class="text-center ${mtClass}"><strong>${mt ?? ''}</strong></td></tr>`;
        });

        html += `</tbody></table>
            <p style="text-align:right;font-size:10px;margin-top:8px">${Utils.getCurrentDate()}</p>
          </div>
        </div>`;
      });

      this._currentData = { alunos, discs, notasMap, classe, turma, trimestre, notaPos, school };
      document.getElementById('boletinsContent').innerHTML = html;

    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  _currentData: null,

  async exportAllPDF() {
    if (!this._currentData) return;
    const d = this._currentData;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const pw = doc.internal.pageSize.getWidth();
    const ph = doc.internal.pageSize.getHeight();
    const trimNomes = { '1': 'I Trimestre', '2': 'II Trimestre', '3': 'III Trimestre' };

    // 4 boletins por página A4
    const bw = (pw - 30) / 2;
    const bh = (ph - 30) / 2;
    const positions = [{ x: 10, y: 10 }, { x: 10 + bw + 10, y: 10 }, { x: 10, y: 10 + bh + 10 }, { x: 10 + bw + 10, y: 10 + bh + 10 }];

    for (let i = 0; i < d.alunos.length; i++) {
      const posIdx = i % 4;
      if (i > 0 && posIdx === 0) doc.addPage();
      const pos = positions[posIdx];
      const aluno = d.alunos[i];

      const startY = pos.y;
      let y = startY;

      // Insígnia
      if (APP.insigniaBase64) {
        try { doc.addImage(APP.insigniaBase64, 'PNG', pos.x + bw / 2 - 6, y, 12, 12); } catch (e) {}
        y += 14;
      }

      doc.setFontSize(6); doc.setFont('helvetica', 'bold');
      doc.text('REPÚBLICA DE ANGOLA', pos.x + bw / 2, y, { align: 'center' }); y += 3;
      doc.setFontSize(5); doc.setFont('helvetica', 'normal');
      doc.text('MINISTÉRIO DA EDUCAÇÃO', pos.x + bw / 2, y, { align: 'center' }); y += 3;
      doc.setFontSize(6); doc.setFont('helvetica', 'bold');
      doc.text(d.school.name || '', pos.x + bw / 2, y, { align: 'center' }); y += 3;
      doc.setFontSize(7); doc.text('BOLETIM DE NOTAS', pos.x + bw / 2, y, { align: 'center' }); y += 3;
      doc.setFontSize(5); doc.setFont('helvetica', 'normal');
      doc.text(`${trimNomes[d.trimestre]} - ${APP.currentYear?.name || ''}`, pos.x + bw / 2, y, { align: 'center' }); y += 4;

      // Foto
      if (aluno.photo) {
        try { doc.addImage(aluno.photo, 'JPEG', pos.x + bw - 18, startY + 2, 15, 18); } catch (e) {}
      }

      doc.setFontSize(6); doc.setFont('helvetica', 'bold');
      doc.setTextColor(206, 17, 38);
      doc.text(`Aluno: ${aluno.name}`, pos.x + 2, y); y += 3;
      doc.setTextColor(0, 0, 0);
      doc.setFont('helvetica', 'normal');
      doc.text(`Classe: ${d.classe?.name} | Turma: ${d.turma?.name} ${d.turma?.curso ? '(' + d.turma.curso + ')' : ''}`, pos.x + 2, y); y += 4;

      // Tabela
      const head = [['Disciplina', 'MAC', 'NPT', 'MT']];
      const body = d.discs.map(disc => {
        const nota = d.notasMap[`${aluno.id}_${disc.id}`];
        const calc = nota ? Utils.calcularMedia(nota, d.classe.name) : {};
        let mac = '', npt = '', mt = null;
        if (d.trimestre === '1') { mac = nota?.mac1 ?? ''; npt = nota?.npt1 ?? ''; mt = calc.mt1; }
        else if (d.trimestre === '2') { mac = nota?.mac2 ?? ''; npt = nota?.npt2 ?? ''; mt = calc.mt2; }
        else { mac = nota?.mac3 ?? ''; npt = nota?.npt3 ?? ''; mt = calc.mfd; }
        return [disc.name, mac, npt, mt ?? ''];
      });

      doc.autoTable({
        startY: y,
        head, body,
        styles: { fontSize: 5, cellPadding: 1.2, halign: 'center' },
        headStyles: { fillColor: [15, 23, 42], fontSize: 5 },
        columnStyles: { 0: { halign: 'left', cellWidth: bw * 0.45 } },
        tableWidth: bw - 4,
        margin: { left: pos.x + 2, right: pw - pos.x - bw + 2 }
      });
    }

    doc.save(`boletins_${d.classe?.name}_${d.turma?.name}.pdf`);
    Utils.toast('Boletins PDF gerados (4 por folha)!', 'success');
  }
};

// MÓDULO: DECLARAÇÕES
// ============================================================
window.PageDeclaracoes = {
  async render(container) {
    const schoolId = APP.currentSchool ? APP.currentSchool.id : null;
    if (!schoolId) {
      container.innerHTML = '<div class="empty-state"><i class="fas fa-school"></i><p>Selecione uma escola primeiro</p></div>';
      return;
    }

    container.innerHTML = `
      <h2 class="page-title"><i class="fas fa-file-signature"></i> Declarações</h2>
      <div class="card mb-3 no-print">
        <div class="card-body">
          <div class="filter-grid" style="padding:0;box-shadow:none">
            <div class="form-group"><label>Ano Letivo</label>
              <select id="declAno"><option value="">Selecione</option></select></div>
            <div class="form-group"><label>Classe</label>
              <select id="declClasse" onchange="PageDeclaracoes.onClasseChange()"><option value="">Selecione</option></select></div>
            <div class="form-group"><label>Turma</label>
              <select id="declTurma"><option value="">Selecione</option></select></div>
            <div class="form-group" style="padding-top:20px">
              <button class="btn btn-primary" onclick="PageDeclaracoes.gerar()"><i class="fas fa-cogs"></i> Gerar</button>
            </div>
          </div>
          <div class="form-group mt-2">
            <label>Ou pesquisar aluno individual</label>
            <input type="text" id="declSearchAluno" class="search-input w-full" placeholder="Nome, BI ou matrícula..." oninput="PageDeclaracoes.searchAluno()">
          </div>
          <div id="declSearchResults" style="max-height:150px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius);display:none"></div>
        </div>
      </div>
      <div id="declContent"></div>`;

    await this.loadFilters();
  },

  _classes: [], _turmas: [], _disciplinas: [], _allAlunos: [],

  async loadFilters() {
    const sid = APP.currentSchool.id;
    this._classes = await DB.getCollection('classes', [FB.where('schoolId', '==', sid)]);
    this._classes.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
    let tQ = [FB.where('schoolId', '==', sid)];
    if (APP.currentYearId) tQ.push(FB.where('yearId', '==', APP.currentYearId));
    this._turmas = await DB.getCollection('turmas', tQ);
    this._disciplinas = await DB.getCollection('disciplinas', [FB.where('schoolId', '==', sid)]);
    this._disciplinas.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
    this._allAlunos = await DB.getCollection('alunos', [FB.where('schoolId', '==', sid)]);

    // Anos letivos
    const anos = await DB.getCollection('academicYears', [FB.where('schoolId', '==', sid)]);
    const selA = document.getElementById('declAno');
    anos.sort((a, b) => (b.name || '').localeCompare(a.name || '')).forEach(a => {
      selA.innerHTML += `<option value="${a.id}" ${a.id === APP.currentYearId ? 'selected' : ''}>${a.name}</option>`;
    });

    const sel = document.getElementById('declClasse');
    this._classes.forEach(c => { sel.innerHTML += `<option value="${c.id}">${c.name}</option>`; });
  },

  onClasseChange() {
    const cid = document.getElementById('declClasse').value;
    const sel = document.getElementById('declTurma');
    sel.innerHTML = '<option value="">Todas</option>';
    this._turmas.filter(t => t.classeId === cid).forEach(t => {
      sel.innerHTML += `<option value="${t.id}">${t.name} ${t.curso ? '(' + t.curso + ')' : ''}</option>`;
    });
  },

  searchAluno() {
    const term = (document.getElementById('declSearchAluno')?.value || '').toLowerCase().trim();
    const div = document.getElementById('declSearchResults');
    if (!term || term.length < 2) { div.style.display = 'none'; return; }
    const matches = this._allAlunos.filter(a =>
      (a.name || '').toLowerCase().includes(term) || (a.bi || '').toLowerCase().includes(term) ||
      (a.matricula || '').toLowerCase().includes(term)
    ).slice(0, 8);
    div.innerHTML = matches.map(a => `
      <div style="padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--border)"
           onmouseover="this.style.background='#f0f4ff'" onmouseout="this.style.background=''"
           onclick="PageDeclaracoes.gerarIndividual('${a.id}')">
        <strong style="color:var(--angola-red)">${a.name}</strong> - ${a.classeName || ''} (${a.yearName || ''})
      </div>`).join('');
    div.style.display = 'block';
  },

  async gerarIndividual(alunoId) {
    document.getElementById('declSearchResults').style.display = 'none';
    showLoading(true);
    try {
      const aluno = this._allAlunos.find(a => a.id === alunoId);
      if (!aluno) return;
      await this._gerarDeclaracaoPDF(aluno);
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  async gerar() {
    const classeId = document.getElementById('declClasse').value;
    const turmaId = document.getElementById('declTurma').value;
    if (!classeId) { Utils.toast('Selecione a classe', 'warning'); return; }

    showLoading(true);
    try {
      let alunoQ = [FB.where('schoolId', '==', APP.currentSchool.id), FB.where('classeId', '==', classeId)];
      if (turmaId) alunoQ.push(FB.where('turmaId', '==', turmaId));
      const yearId = document.getElementById('declAno').value || APP.currentYearId;
      if (yearId) alunoQ.push(FB.where('yearId', '==', yearId));

      let alunos = await DB.getCollection('alunos', alunoQ);
      alunos = alunos.filter(a => a.estado === 'Activo' || a.estado === 'Ativo');
      alunos.sort((a, b) => (a.name || '').localeCompare(b.name || ''));

      if (alunos.length === 0) { Utils.toast('Nenhum aluno encontrado', 'warning'); showLoading(false); return; }

      // Gerar PDFs em lote
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      for (let i = 0; i < alunos.length; i++) {
        if (i > 0) doc.addPage();
        await this._renderDeclaracaoPage(doc, alunos[i]);
      }

      const classe = this._classes.find(c => c.id === classeId);
      doc.save(`declaracoes_${classe?.name || ''}.pdf`);
      Utils.toast(`${alunos.length} declarações geradas!`, 'success');

    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  async _gerarDeclaracaoPDF(aluno) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    await this._renderDeclaracaoPage(doc, aluno);
    doc.save(`declaracao_${(aluno.name || '').replace(/\s/g, '_')}.pdf`);
    Utils.toast('Declaração PDF gerada!', 'success');
  },

  async _renderDeclaracaoPage(doc, aluno) {
    const pw = doc.internal.pageSize.getWidth();
    const school = APP.currentSchool;
    const users = await DB.getCollection('users', [FB.where('schoolId', '==', school.id)]);
    const diretor = users.find(u => u.role === 'diretor');
    const pedagogico = users.find(u => u.role === 'subdiretor_pedagogico');

    // Carregar notas
    let notas = await DB.getCollection('notas', [FB.where('alunoId', '==', aluno.id)]);
    const notasHist = await DB.getCollection('notasHistorico', [FB.where('alunoId', '==', aluno.id), FB.where('classeId', '==', aluno.classeId)]);
    notas = [...notas.filter(n => n.classeId === aluno.classeId), ...notasHist];

    const disciplinas = await DB.getCollection('disciplinas', [FB.where('schoolId', '==', school.id), FB.where('classeId', '==', aluno.classeId)]);
    disciplinas.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));

    let y = 15;
    // Insígnia
    if (APP.insigniaBase64) {
      try { doc.addImage(APP.insigniaBase64, 'PNG', pw / 2 - 12, y, 24, 24); y += 27; } catch (e) { y += 5; }
    }

    doc.setFontSize(11); doc.setFont('helvetica', 'bold');
    doc.text('REPÚBLICA DE ANGOLA', pw / 2, y, { align: 'center' }); y += 5;
    doc.setFontSize(9); doc.setFont('helvetica', 'normal');
    doc.text('MINISTÉRIO DA EDUCAÇÃO', pw / 2, y, { align: 'center' }); y += 10;
    doc.setFontSize(14); doc.setFont('helvetica', 'bold');
    doc.text('DECLARAÇÃO', pw / 2, y, { align: 'center' }); y += 12;

    // Corpo
    const dirNome = diretor ? diretor.name : '____________________';
    const dirCargo = diretor ? (diretor.sexo === 'F' ? 'Subdirectora Pedagógica' : 'Subdirector Pedagógico') : 'Subdirector Pedagógico';
    const pedNome = pedagogico ? pedagogico.name : '____________________';
    const nivelEnsino = Utils.getNivelEnsino(aluno.classeName || '');

    const nascData = aluno.nascimento ? aluno.nascimento.split('-').reverse().join('/') : '.../.../....';

    doc.setFontSize(10); doc.setFont('helvetica', 'normal');
    const corpo = `${pedNome}, ${dirCargo} ${school.name || '________'}, declara para os devidos efeitos que ${aluno.name}, ${Utils.genero(aluno.sexo, 'filho')} de ${aluno.nomePai || '________'} e de ${aluno.nomeMae || '________'}, ${Utils.genero(aluno.sexo, 'nascido')} aos ${nascData}, ${Utils.genero(aluno.sexo, 'natural')} de ${aluno.naturalidade || '________'}, município de ${aluno.municipio || '________'}, província ${aluno.provincia || '________'}, ${Utils.genero(aluno.sexo, 'portador')} do B.I. n° ${aluno.bi || '________'}, passado pelo Arquivo de Identificação de ${aluno.biLocal || '________'}, frequentou neste estabelecimento de ensino no ano lectivo ${aluno.yearName || '20.../20...'}, a ${aluno.classeName || '________'}, com as seguintes classificações:`;

    const lines = doc.splitTextToSize(corpo, pw - 30);
    doc.text(lines, 15, y, { align: 'justify', maxWidth: pw - 30 });
    y += lines.length * 5 + 6;

    // Tabela de notas
    if (notas.length > 0) {
      const notasMap = {};
      notas.forEach(n => { notasMap[n.disciplinaId] = n; });

      const tableData = disciplinas.map(d => {
        const n = notasMap[d.id];
        const calc = n ? Utils.calcularMedia(n, aluno.classeName) : {};
        const mfd = calc.mfd ?? n?.mfd ?? '';
        return [d.name, mfd !== '' ? mfd : '-', mfd !== '' ? Utils.valorExtenso(mfd) : '-'];
      }).filter(r => r[1] !== '-');

      doc.autoTable({
        startY: y,
        head: [['Disciplina', 'Nota', 'Por Extenso']],
        body: tableData,
        styles: { fontSize: 9, halign: 'center' },
        headStyles: { fillColor: [15, 23, 42] },
        columnStyles: { 0: { halign: 'left' } },
        margin: { left: 15, right: 15 }
      });
      y = doc.lastAutoTable.finalY + 8;
    }

    // Fecho
    doc.setFontSize(9); doc.setFont('helvetica', 'normal');
    const fecho = `Para efeitos legais lhe é passada a presente DECLARAÇÃO, assinada e autenticada com carimbo a óleo/selo branco em uso neste estabelecimento de Ensino.`;
    const fechoLines = doc.splitTextToSize(fecho, pw - 30);
    doc.text(fechoLines, 15, y, { maxWidth: pw - 30 });
    y += fechoLines.length * 4.5 + 5;

    // Local e data
    doc.text(`${school.province || school.municipality || '________'}, ${Utils.getCurrentDate()}`, pw / 2, y, { align: 'center' });
    y += 20;

    // Assinaturas - Subdirector Pedagógico e Director
    const pedLabel = pedagogico ? (pedagogico.sexo === 'F' ? 'A Subdirectora Pedagógica' : 'O Subdirector Pedagógico') : 'O Subdirector Pedagógico';
    const dirLabel = diretor ? (diretor.sexo === 'F' ? 'A Directora' : 'O Director') : 'O Director';

    // Pedagógico (esquerda)
    doc.line(30, y, 90, y);
    doc.setFontSize(8);
    doc.text(pedLabel, 60, y + 4, { align: 'center' });
    doc.text(pedNome, 60, y + 8, { align: 'center' });

    // Director (direita)
    doc.line(pw - 90, y, pw - 30, y);
    doc.text(dirLabel, pw - 60, y + 4, { align: 'center' });
    doc.text(dirNome, pw - 60, y + 8, { align: 'center' });
  }
};

window.PageCertificados = {
  async render(container) {
    const schoolId = APP.currentSchool ? APP.currentSchool.id : null;
    if (!schoolId) {
      container.innerHTML = '<div class="empty-state"><i class="fas fa-school"></i><p>Selecione uma escola primeiro</p></div>';
      return;
    }

    container.innerHTML = `
      <h2 class="page-title"><i class="fas fa-certificate"></i> Certificados</h2>
      <div class="card mb-3 no-print">
        <div class="card-body">
          <p style="color:var(--text-light);margin-bottom:12px"><i class="fas fa-info-circle"></i> Certificados para classes finais: 6ª, 9ª, 12ª e 13ª Classe</p>
          <div class="filter-grid" style="padding:0;box-shadow:none">
            <div class="form-group"><label>Ano Letivo</label>
              <select id="certAno"><option value="">Selecione</option></select></div>
            <div class="form-group"><label>Classe (Final)</label>
              <select id="certClasse" onchange="PageCertificados.onClasseChange()"><option value="">Selecione</option></select></div>
            <div class="form-group"><label>Turma</label>
              <select id="certTurma"><option value="">Selecione</option></select></div>
            <div class="form-group" style="padding-top:20px">
              <button class="btn btn-primary" onclick="PageCertificados.gerar()"><i class="fas fa-cogs"></i> Gerar</button>
            </div>
          </div>
          <div class="form-group mt-2">
            <label>Ou pesquisar aluno individual</label>
            <input type="text" id="certSearchAluno" class="search-input w-full" placeholder="Nome, BI ou matrícula..." oninput="PageCertificados.searchAluno()">
          </div>
          <div id="certSearchResults" style="max-height:150px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius);display:none"></div>
        </div>
      </div>
      <div id="certContent"></div>`;

    await this.loadFilters();
  },

  _classes: [], _turmas: [], _disciplinas: [], _allAlunos: [],

  async loadFilters() {
    const sid = APP.currentSchool.id;
    this._classes = await DB.getCollection('classes', [FB.where('schoolId', '==', sid)]);
    this._classes.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
    let tQ = [FB.where('schoolId', '==', sid)];
    this._turmas = await DB.getCollection('turmas', tQ);
    this._disciplinas = await DB.getCollection('disciplinas', [FB.where('schoolId', '==', sid)]);
    this._disciplinas.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
    this._allAlunos = await DB.getCollection('alunos', [FB.where('schoolId', '==', sid)]);

    const anos = await DB.getCollection('academicYears', [FB.where('schoolId', '==', sid)]);
    const selA = document.getElementById('certAno');
    anos.sort((a, b) => (b.name || '').localeCompare(a.name || '')).forEach(a => {
      selA.innerHTML += `<option value="${a.id}" ${a.id === APP.currentYearId ? 'selected' : ''}>${a.name}</option>`;
    });

    const selC = document.getElementById('certClasse');
    // Só classes finais
    this._classes.filter(c => Utils.isClasseFinal(c.name)).forEach(c => {
      selC.innerHTML += `<option value="${c.id}">${c.name}</option>`;
    });
  },

  onClasseChange() {
    const cid = document.getElementById('certClasse').value;
    const sel = document.getElementById('certTurma');
    sel.innerHTML = '<option value="">Todas</option>';
    this._turmas.filter(t => t.classeId === cid).forEach(t => {
      sel.innerHTML += `<option value="${t.id}">${t.name} ${t.curso ? '(' + t.curso + ')' : ''}</option>`;
    });
  },

  searchAluno() {
    const term = (document.getElementById('certSearchAluno')?.value || '').toLowerCase().trim();
    const div = document.getElementById('certSearchResults');
    if (!term || term.length < 2) { div.style.display = 'none'; return; }
    // Filtrar apenas alunos de classes finais
    const matches = this._allAlunos.filter(a => {
      const isFinal = Utils.isClasseFinal(a.classeName || '');
      return isFinal && ((a.name || '').toLowerCase().includes(term) || (a.bi || '').toLowerCase().includes(term) || (a.matricula || '').toLowerCase().includes(term));
    }).slice(0, 8);
    div.innerHTML = matches.map(a => `
      <div style="padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--border)"
           onmouseover="this.style.background='#f0f4ff'" onmouseout="this.style.background=''"
           onclick="PageCertificados.gerarIndividual('${a.id}')">
        <strong style="color:var(--angola-red)">${a.name}</strong> - ${a.classeName || ''} (${a.yearName || ''})
      </div>`).join('');
    div.style.display = 'block';
  },

  async gerarIndividual(alunoId) {
    document.getElementById('certSearchResults').style.display = 'none';
    showLoading(true);
    try {
      const aluno = this._allAlunos.find(a => a.id === alunoId);
      if (!aluno) return;
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      await this._renderCertificadoPage(doc, aluno);
      doc.save(`certificado_${(aluno.name || '').replace(/\s/g, '_')}.pdf`);
      Utils.toast('Certificado PDF gerado!', 'success');
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  async gerar() {
    const classeId = document.getElementById('certClasse').value;
    const turmaId = document.getElementById('certTurma').value;
    if (!classeId) { Utils.toast('Selecione a classe', 'warning'); return; }

    showLoading(true);
    try {
      let alunoQ = [FB.where('schoolId', '==', APP.currentSchool.id), FB.where('classeId', '==', classeId)];
      if (turmaId) alunoQ.push(FB.where('turmaId', '==', turmaId));
      const yearId = document.getElementById('certAno').value || APP.currentYearId;
      if (yearId) alunoQ.push(FB.where('yearId', '==', yearId));

      let alunos = await DB.getCollection('alunos', alunoQ);
      alunos = alunos.filter(a => a.estado === 'Activo' || a.estado === 'Ativo');
      alunos.sort((a, b) => (a.name || '').localeCompare(b.name || ''));

      if (alunos.length === 0) { Utils.toast('Nenhum aluno encontrado', 'warning'); showLoading(false); return; }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      for (let i = 0; i < alunos.length; i++) {
        if (i > 0) doc.addPage();
        await this._renderCertificadoPage(doc, alunos[i]);
      }

      const classe = this._classes.find(c => c.id === classeId);
      doc.save(`certificados_${classe?.name || ''}.pdf`);
      Utils.toast(`${alunos.length} certificados gerados!`, 'success');

    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  async _renderCertificadoPage(doc, aluno) {
    const pw = doc.internal.pageSize.getWidth();
    const school = APP.currentSchool;
    const users = await DB.getCollection('users', [FB.where('schoolId', '==', school.id)]);
    const diretor = users.find(u => u.role === 'diretor');

    const classeNum = Utils.getClasseNum(aluno.classeName || '');
    const ciclo = Utils.getCiclo(aluno.classeName || '');
    const nivelEnsino = Utils.getNivelEnsino(aluno.classeName || '');
    const alinea = Utils.getAlinea(aluno.classeName || '');

    // Determinar classes para o certificado
    let classesParaNotas = [];
    if (classeNum <= 6) {
      classesParaNotas = ['1ª Classe', '2ª Classe', '3ª Classe', '4ª Classe', '5ª Classe', '6ª Classe'];
      if (classeNum === 0) classesParaNotas = ['Iniciação'];
    } else if (classeNum <= 9) {
      classesParaNotas = ['7ª Classe', '8ª Classe', '9ª Classe'];
    } else {
      classesParaNotas = ['10ª Classe', '11ª Classe', '12ª Classe'];
      if (classeNum === 13) classesParaNotas.push('13ª Classe');
    }

    // Carregar todas as notas e histórico
    const notas = await DB.getCollection('notas', [FB.where('alunoId', '==', aluno.id)]);
    const notasHist = await DB.getCollection('notasHistorico', [FB.where('alunoId', '==', aluno.id)]);
    const todasNotas = [...notas, ...notasHist];

    // Disciplinas do ciclo (ordenadas)
    const allDiscs = await DB.getCollection('disciplinas', [FB.where('schoolId', '==', school.id)]);
    allDiscs.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));

    // Para II Ciclo, agrupar por categoria
    const isCiclo2 = ciclo === 'ciclo2';

    // Obter disciplinas únicas deste ciclo
    const discNames = new Set();
    const discsPorCategoria = { geral: [], especifica: [], opcional: [] };

    classesParaNotas.forEach(cn => {
      const classeObj = this._classes.find(c => c.name === cn);
      if (!classeObj) return;
      let discsClasse = allDiscs.filter(d => d.classeId === classeObj.id);
      if (aluno.curso) discsClasse = discsClasse.filter(d => !d.curso || d.curso === aluno.curso || d.curso === '');
      discsClasse.forEach(d => {
        if (!discNames.has(d.name)) {
          discNames.add(d.name);
          const cat = d.categoria || 'geral';
          if (!discsPorCategoria[cat]) discsPorCategoria[cat] = [];
          discsPorCategoria[cat].push(d);
        }
      });
    });

    // Construir tabela de médias por classe
    const tabelaNotas = [];
    const discList = isCiclo2 ? [...discsPorCategoria.geral, ...discsPorCategoria.especifica, ...discsPorCategoria.opcional] :
      [...discsPorCategoria.geral, ...discsPorCategoria.especifica, ...discsPorCategoria.opcional];

    let somaMediaFinal = 0, countMediaFinal = 0;

    discList.forEach(disc => {
      const row = { disciplina: disc.name, categoria: disc.categoria || 'geral', notas: {}, mediaFinal: null };
      let soma = 0, count = 0;

      classesParaNotas.forEach(cn => {
        const classeObj = this._classes.find(c => c.name === cn);
        if (!classeObj) { row.notas[cn] = '–'; return; }

        const nota = todasNotas.find(n =>
          (n.disciplinaId === disc.id || n.disciplina === disc.name || n.disciplinaName === disc.name) &&
          (n.classeId === classeObj.id || n.classeName === cn || n.classe === cn)
        );

        if (nota) {
          const calc = Utils.calcularMedia(nota, cn);
          const mfd = calc.mfd ?? nota.mfd;
          if (mfd !== null && mfd !== undefined) {
            row.notas[cn] = Math.round(mfd);
            soma += Math.round(mfd);
            count++;
          } else {
            row.notas[cn] = '–';
          }
        } else {
          row.notas[cn] = '–';
        }
      });

      row.mediaFinal = count > 0 ? Math.round(soma / count) : null;
      if (row.mediaFinal !== null) { somaMediaFinal += row.mediaFinal; countMediaFinal++; }
      tabelaNotas.push(row);
    });

    const mediaGeral = countMediaFinal > 0 ? Math.round(somaMediaFinal / countMediaFinal) : null;

    // ===== RENDER PDF =====
    let y = 12;
    if (APP.insigniaBase64) {
      try { doc.addImage(APP.insigniaBase64, 'PNG', pw / 2 - 12, y, 24, 24); y += 27; } catch (e) { y += 5; }
    }

    doc.setFontSize(11); doc.setFont('helvetica', 'bold');
    doc.text('REPÚBLICA DE ANGOLA', pw / 2, y, { align: 'center' }); y += 5;
    doc.setFontSize(9); doc.setFont('helvetica', 'normal');
    doc.text('MINISTÉRIO DA EDUCAÇÃO', pw / 2, y, { align: 'center' }); y += 10;
    doc.setFontSize(14); doc.setFont('helvetica', 'bold');
    doc.text('CERTIFICADO', pw / 2, y, { align: 'center' }); y += 10;

    // Corpo do certificado
    const dirNome = diretor ? diretor.name : '____________________';
    const dirGenero = diretor ? (diretor.sexo === 'F' ? 'Directora' : 'Director') : 'Director';
    const nascData = aluno.nascimento ? aluno.nascimento.split('-').reverse().join('/') : '.../.../....';
    const biData = aluno.biData ? aluno.biData.split('-').reverse().join('/') : '.../.../....';
    const cursoText = aluno.curso ? `, na área de ${aluno.curso}` : '';
    const denominado = aluno.curso ? `, denominado ${aluno.curso},` : ',';

    const corpo = `${dirNome}, ${dirGenero} ${school.denominacao ? 'do ' + school.denominacao : 'do ' + (school.name || '________')}${denominado} criado${school.decretoExecutivo ? ' sobre Decreto Executivo n° ' + school.decretoExecutivo : ''}, ao abrigo do disposto na alínea ${alinea} do artigo 109° da Lei n° 32/20 de 12 de Agosto, certifica que ${aluno.name}, ${Utils.genero(aluno.sexo, 'filho')} de ${aluno.nomePai || '________'} e de ${aluno.nomeMae || '________'}, ${Utils.genero(aluno.sexo, 'nascido')} aos ${nascData}, ${Utils.genero(aluno.sexo, 'natural')} de ${aluno.naturalidade || '________'}, município de ${aluno.municipio || '________'}, província ${aluno.provincia || '________'}, ${Utils.genero(aluno.sexo, 'portador')} do B.I. n° ${aluno.bi || '________'}, passado pelo Arquivo de Identificação de ${aluno.biLocal || '________'}, aos ${biData}, concluiu no ano lectivo ${aluno.yearName || '20.../20...'} o ${nivelEnsino}${cursoText}, conforme consta do processo individual n° ${aluno.processo || '____/20__'}, com a média final de ${mediaGeral !== null ? mediaGeral + ' valores' : '_____ valores'}, obtida${aluno.sexo === 'F' ? 's' : 's'} pelas seguintes classificações por disciplina${isCiclo2 ? 's' : 's'}:`;

    doc.setFontSize(9); doc.setFont('helvetica', 'normal');
    const lines = doc.splitTextToSize(corpo, pw - 30);
    doc.text(lines, 15, y, { align: 'justify', maxWidth: pw - 30 });
    y += lines.length * 4.2 + 6;

    // Tabela de notas do certificado
    const head = [['Disciplinas', ...classesParaNotas.map(c => { const n = Utils.getClasseNum(c); return n > 0 ? n + '.ª Classe' : c; }), 'Média Final', 'Média por extenso']];

    const bodyRows = [];
    let lastCat = '';
    tabelaNotas.forEach(row => {
      if (isCiclo2 && row.categoria !== lastCat) {
        const catNames = { geral: 'Formação geral', especifica: 'Formação específica', opcional: 'Disciplina Opcional' };
        bodyRows.push([{ content: catNames[row.categoria] || '', colSpan: head[0].length, styles: { fontStyle: 'bold', fillColor: [240, 240, 240] } }]);
        lastCat = row.categoria;
      }
      const r = [row.disciplina];
      classesParaNotas.forEach(cn => { r.push(row.notas[cn] ?? '–'); });
      r.push(row.mediaFinal !== null ? row.mediaFinal : '–');
      r.push(row.mediaFinal !== null ? Utils.valorExtenso(row.mediaFinal).replace(' valores', '') : '–');
      bodyRows.push(r);
    });

    doc.autoTable({
      startY: y,
      head: head,
      body: bodyRows,
      styles: { fontSize: 7, halign: 'center', cellPadding: 1.8 },
      headStyles: { fillColor: [15, 23, 42], fontSize: 7 },
      columnStyles: { 0: { halign: 'left' } },
      margin: { left: 15, right: 15 }
    });
    y = doc.lastAutoTable.finalY + 8;

    // Fecho
    doc.setFontSize(9); doc.setFont('helvetica', 'normal');
    const fecho = `Para efeitos legais lhe é passado o presente CERTIFICADO, que consta no livro de registo n° ${aluno.processo || '______'}, folha ${isCiclo2 && aluno.curso ? aluno.curso.substring(0, 2).toUpperCase() + '-' : ''}${aluno.yearName || '____'}, assinado por mim e autenticado com carimbo a óleo/selo branco em uso neste estabelecimento de Ensino.`;
    const fechoLines = doc.splitTextToSize(fecho, pw - 30);
    doc.text(fechoLines, 15, y, { maxWidth: pw - 30 });
    y += fechoLines.length * 4.5 + 5;

    // Local e data
    const localData = `${school.province || school.municipality || '________'}, ${Utils.getCurrentDate()}`;
    doc.text(localData, pw / 2, y, { align: 'center' });
    y += 5;
    doc.text('Conferido por', pw / 2, y, { align: 'center' });
    y += 18;

    // Assinatura centralizada do Director
    doc.line(pw / 2 - 35, y, pw / 2 + 35, y);
    doc.setFontSize(8);
    const dirLabel = diretor ? (diretor.sexo === 'F' ? 'A Directora' : 'O Director') : 'O Director';
    doc.text(dirLabel, pw / 2, y + 4, { align: 'center' });
    doc.text(dirNome, pw / 2, y + 8, { align: 'center' });
  }
};

    showLoading(true);
    try {
      let users = await DB.getCollection('users', [FB.where('schoolId', '==', APP.currentSchool.id)]);
      users = users.filter(u => u.role !== 'superadmin' && u.active !== false);
      if (cargo) users = users.filter(u => u.role === cargo);
      users.sort((a, b) => (a.name || '').localeCompare(b.name || ''));

      if (users.length === 0) { Utils.toast('Nenhum funcionário encontrado', 'warning'); showLoading(false); return; }

      this._funcData = users;
      let html = `<div class="flex-between mb-3 no-print">
        <p>${users.length} passes gerados</p>
        <button class="btn btn-primary" onclick="PagePasses.exportFuncPDF()"><i class="fas fa-file-pdf"></i> Baixar PDF (6 por folha A4)</button>
      </div>`;

      html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px">';
      users.slice(0, 12).forEach(u => {
        html += this._renderPasseCard(u, 'funcionario');
      });
      html += '</div>';

      document.getElementById('passFuncContent').innerHTML = html;
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  _renderPasseCard(pessoa, tipo) {
    const school = APP.currentSchool;
    const isAluno = tipo === 'aluno';
    return `
      <div class="card" style="border:2px solid var(--angola-red);border-radius:10px;overflow:hidden">
        <div style="background:linear-gradient(135deg,var(--angola-red),#8b0000);color:#fff;padding:8px 12px;text-align:center">
          <strong style="font-size:10px">${school.name || 'ESCOLA'}</strong><br>
          <span style="font-size:8px">${school.municipality || ''} - ${school.province || ''}</span>
        </div>
        <div style="display:flex;padding:10px;gap:10px;align-items:center">
          <div style="flex-shrink:0">
            ${pessoa.photo ? `<img src="${pessoa.photo}" style="width:55px;height:65px;border-radius:6px;object-fit:cover;border:2px solid var(--angola-red)">` :
              '<div style="width:55px;height:65px;border-radius:6px;background:#f0f0f0;display:flex;align-items:center;justify-content:center"><i class="fas fa-user" style="font-size:22px;color:#ccc"></i></div>'}
          </div>
          <div style="flex:1;min-width:0;font-size:10px">
            <p style="font-weight:700;color:var(--angola-red);font-size:11px;margin-bottom:2px">${pessoa.name || ''}</p>
            ${isAluno ? `
              <p><strong>Classe:</strong> ${pessoa.classeName || ''}</p>
              <p><strong>Turma:</strong> ${pessoa.turmaName || ''}</p>
              <p><strong>N° Mat.:</strong> ${pessoa.matricula || ''}</p>
              <p><strong>Ano:</strong> ${APP.currentYear?.name || ''}</p>
            ` : `
              <p><strong>Cargo:</strong> ${getRoleName(pessoa.role)}</p>
              <p><strong>N° Agente:</strong> ${pessoa.agente || 'N/D'}</p>
              <p><strong>BI:</strong> ${pessoa.bi || ''}</p>
              <p><strong>Tel:</strong> ${pessoa.phone || pessoa.telefone || ''}</p>
            `}
          </div>
        </div>
        <div style="background:var(--angola-yellow);padding:3px;text-align:center">
          <span style="font-size:7px;font-weight:600;color:#000">ANO LECTIVO ${APP.currentYear?.name || ''}</span>
        </div>
      </div>`;
  },

  _alunosData: [],
  _funcData: [],

  _exportPassesPDF(pessoas, tipo) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const pw = doc.internal.pageSize.getWidth();
    const ph = doc.internal.pageSize.getHeight();
    const school = APP.currentSchool;
    const isAluno = tipo === 'aluno';

    // 6 passes por página (2 colunas x 3 linhas)
    const cardW = (pw - 25) / 2;
    const cardH = (ph - 25) / 3;
    const positions = [];
    for (let row = 0; row < 3; row++) {
      for (let col = 0; col < 2; col++) {
        positions.push({ x: 8 + col * (cardW + 6), y: 8 + row * (cardH + 3) });
      }
    }

    for (let i = 0; i < pessoas.length; i++) {
      const posIdx = i % 6;
      if (i > 0 && posIdx === 0) doc.addPage();

      const pos = positions[posIdx];
      const p = pessoas[i];
      let y = pos.y;

      // Borda
      doc.setDrawColor(206, 17, 38);
      doc.setLineWidth(0.8);
      doc.roundedRect(pos.x, pos.y, cardW, cardH - 4, 3, 3);

      // Header vermelho
      doc.setFillColor(206, 17, 38);
      doc.roundedRect(pos.x, pos.y, cardW, 12, 3, 3, 'F');
      doc.rect(pos.x, pos.y + 6, cardW, 6, 'F');

      // Insígnia
      if (APP.insigniaBase64) {
        try { doc.addImage(APP.insigniaBase64, 'PNG', pos.x + cardW / 2 - 4, y + 1, 8, 8); } catch (e) {}
      }

      doc.setTextColor(255, 255, 255);
      doc.setFontSize(5.5); doc.setFont('helvetica', 'bold');
      doc.text(school.name || '', pos.x + cardW / 2, y + 11, { align: 'center', maxWidth: cardW - 6 });
      y += 15;

      doc.setTextColor(0, 0, 0);

      // Foto
      const photoX = pos.x + 4;
      const photoY = y;
      if (p.photo) {
        try { doc.addImage(p.photo, 'JPEG', photoX, photoY, 18, 22); } catch (e) {
          doc.setDrawColor(200, 200, 200);
          doc.rect(photoX, photoY, 18, 22);
        }
      } else {
        doc.setDrawColor(200, 200, 200);
        doc.rect(photoX, photoY, 18, 22);
        doc.setFontSize(6);
        doc.text('FOTO', photoX + 9, photoY + 12, { align: 'center' });
      }

      // Dados
      const dataX = pos.x + 25;
      let dataY = y + 2;
      doc.setFontSize(7); doc.setFont('helvetica', 'bold');
      doc.setTextColor(206, 17, 38);
      const nameLines = doc.splitTextToSize(p.name || '', cardW - 28);
      doc.text(nameLines, dataX, dataY);
      dataY += nameLines.length * 3.2 + 1;

      doc.setTextColor(0, 0, 0);
      doc.setFontSize(5.5); doc.setFont('helvetica', 'normal');

      if (isAluno) {
        doc.text(`Classe: ${p.classeName || ''}`, dataX, dataY); dataY += 3;
        doc.text(`Turma: ${p.turmaName || ''} ${p.curso ? '(' + p.curso + ')' : ''}`, dataX, dataY); dataY += 3;
        doc.text(`N° Mat.: ${p.matricula || ''}`, dataX, dataY); dataY += 3;
        doc.text(`Processo: ${p.processo || ''}`, dataX, dataY); dataY += 3;
      } else {
        doc.text(`Cargo: ${getRoleName(p.role)}`, dataX, dataY); dataY += 3;
        doc.text(`N° Agente: ${p.agente || 'N/D'}`, dataX, dataY); dataY += 3;
        doc.text(`BI: ${p.bi || ''}`, dataX, dataY); dataY += 3;
        doc.text(`Tel: ${p.phone || p.telefone || ''}`, dataX, dataY); dataY += 3;
      }

      // Barra amarela no fundo
      const barY = pos.y + cardH - 9;
      doc.setFillColor(249, 214, 22);
      doc.rect(pos.x, barY, cardW, 5, 'F');
      doc.setFontSize(5); doc.setFont('helvetica', 'bold');
      doc.setTextColor(0, 0, 0);
      doc.text(`ANO LECTIVO ${APP.currentYear?.name || ''}`, pos.x + cardW / 2, barY + 3.5, { align: 'center' });
    }

    doc.save(`passes_${tipo}s.pdf`);
    Utils.toast('Passes PDF gerados (6 por folha)!', 'success');
  },

  exportAlunosPDF() {
    if (!this._alunosData.length) return;
    this._exportPassesPDF(this._alunosData, 'aluno');
  },

  exportFuncPDF() {
    if (!this._funcData.length) return;
    this._exportPassesPDF(this._funcData, 'funcionario');
  }
};

            <form id="catForm">
              <input type="hidden" id="catId">
              <div class="form-group"><label>Nome *</label><input type="text" id="catNome" required></div>
              <div class="form-group"><label>Tipo</label>
                <select id="catTipo"><option value="despesa">Despesa</option><option value="receita">Receita</option></select></div>
              <div class="form-group"><label>Descrição</label><textarea id="catDesc" rows="2"></textarea></div>
              <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="PageConfigFinanceira.closeCatModal()">Cancelar</button>

      </div>`;

    await this.loadData();

    document.getElementById('tituloForm').onsubmit = async (e) => { e.preventDefault(); await PageConfigFinanceira.saveTitulo(); };

    const classes = await DB.getCollection('classes', [FB.where('schoolId', '==', schoolId)]);
    const selC = document.getElementById('tituloClasses');

  _titulos: [], _categorias: [], _filteredTitulos: [],

  async loadData() {
    const sid = APP.currentSchool.id;
    this._titulos = await DB.getCollection('titulosPagamento', [FB.where('schoolId', '==', sid)]);
    this._titulos.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    this._filteredTitulos = [...this._titulos];
    this._categorias = await DB.getCollection('categoriasDespesa', [FB.where('schoolId', '==', sid)]);
    this.renderTitulos();
    this.renderCategorias();
  },

  switchTab(tab) {
    document.querySelectorAll('.tab-item').forEach((t, i) => t.classList.toggle('active', (i === 0 && tab === 'titulos') || (i === 1 && tab === 'categorias')));
    document.getElementById('tabTitulos').classList.toggle('active', tab === 'titulos');
    document.getElementById('tabCategorias').classList.toggle('active', tab === 'categorias');
  },

  filterTitulos() {
    const term = (document.getElementById('searchTitulo')?.value || '').toLowerCase();
    this._filteredTitulos = this._titulos.filter(t => (t.name || '').toLowerCase().includes(term));
    this.renderTitulos();
  },

  renderTitulos() {
    const tbody = document.getElementById('tituloTableBody');
    if (!tbody) return;
    const canEdit = ['superadmin', 'diretor', 'subdiretor_administrativo'].includes(APP.currentUser.role);
    if (this._filteredTitulos.length === 0) { tbody.innerHTML = '<tr><td colspan="7" class="text-center">Nenhum título cadastrado</td></tr>'; return; }
    tbody.innerHTML = this._filteredTitulos.map((t, i) => `<tr>
      <td>${i + 1}</td>
      <td><strong>${t.name || ''}</strong><br><small style="color:var(--text-light)">${t.periodo || ''}</small></td>
      <td><strong style="color:var(--success)">${(parseFloat(t.valor) || 0).toLocaleString('pt-AO')} Kz</strong></td>
      <td><small>${t.classesNomes || (t.classes && t.classes.includes('todas') ? 'Todas' : '')}</small></td>
      <td><small>${t.descricao || ''}</small></td>
      <td><span class="badge ${t.status === 'Activo' ? 'badge-success' : 'badge-danger'}">${t.status || 'Activo'}</span></td>
      ${canEdit ? `<td>
        <button class="btn btn-sm btn-info" onclick="PageConfigFinanceira.openTituloModal('${t.id}')"><i class="fas fa-edit"></i></button>
        <button class="btn btn-sm btn-danger" onclick="PageConfigFinanceira.deleteTitulo('${t.id}')"><i class="fas fa-trash"></i></button>
      </td>` : ''}
    </tr>`).join('');
  },

  renderCategorias() {
    const tbody = document.getElementById('catTableBody');
    if (!tbody) return;
    const canEdit = ['superadmin', 'diretor', 'subdiretor_administrativo'].includes(APP.currentUser.role);
    if (this._categorias.length === 0) { tbody.innerHTML = '<tr><td colspan="5" class="text-center">Nenhuma categoria cadastrada</td></tr>'; return; }
    tbody.innerHTML = this._categorias.map((c, i) => `<tr>
      <td>${i + 1}</td>
      <td><strong>${c.name || ''}</strong></td>
      <td><span class="badge ${c.tipo === 'receita' ? 'badge-success' : 'badge-danger'}">${c.tipo || 'despesa'}</span></td>
      <td>${c.descricao || ''}</td>
      ${canEdit ? `<td>
        <button class="btn btn-sm btn-info" onclick="PageConfigFinanceira.openCatModal('${c.id}')"><i class="fas fa-edit"></i></button>
        <button class="btn btn-sm btn-danger" onclick="PageConfigFinanceira.deleteCat('${c.id}')"><i class="fas fa-trash"></i></button>
      </td>` : ''}
    </tr>`).join('');
  },

  openTituloModal(id = null) {
    document.getElementById('tituloModalTitle').textContent = id ? 'Editar Título' : 'Novo Título';
    document.getElementById('tituloId').value = id || '';
    if (id) {
      const t = this._titulos.find(x => x.id === id);
      if (t) {
        document.getElementById('tituloNome').value = t.name || '';
        document.getElementById('tituloValor').value = t.valor || '';
        document.getElementById('tituloPeriodo').value = t.periodo || 'mensal';
        document.getElementById('tituloStatus').value = t.status || 'Activo';
        document.getElementById('tituloDesc').value = t.descricao || '';
        if (t.classes) {
          const selC = document.getElementById('tituloClasses');
          Array.from(selC.options).forEach(opt => { opt.selected = t.classes.includes(opt.value); });
        }
      }
    } else { document.getElementById('tituloForm').reset(); }
    document.getElementById('tituloModal').classList.add('active');
  },

  closeTituloModal() { document.getElementById('tituloModal').classList.remove('active'); },

  async saveTitulo() {
    const id = document.getElementById('tituloId').value;
    const selC = document.getElementById('tituloClasses');
    const classes = Array.from(selC.selectedOptions).map(o => o.value);
    const classesNomes = Array.from(selC.selectedOptions).map(o => o.text).join(', ');

    const data = {
      name: document.getElementById('tituloNome').value.trim(),
      valor: parseFloat(document.getElementById('tituloValor').value) || 0,
      classes: classes,
      classesNomes: classesNomes,
      periodo: document.getElementById('tituloPeriodo').value,
      status: document.getElementById('tituloStatus').value,
      descricao: document.getElementById('tituloDesc').value.trim(),
      schoolId: APP.currentSchool.id
    };

    showLoading(true);
    try {
      await DB.saveDoc('titulosPagamento', id || Utils.generateId(), data);
      Utils.toast(id ? 'Título atualizado!' : 'Título criado!', 'success');
      this.closeTituloModal();
      await this.loadData();
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  async deleteTitulo(id) {
    const ok = await Utils.confirm('Excluir este título?');
    if (!ok) return;
    showLoading(true);
    try { await DB.deleteDocument('titulosPagamento', id); Utils.toast('Excluído!', 'success'); await this.loadData(); }
    catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  openCatModal(id = null) {
    document.getElementById('catModalTitle').textContent = id ? 'Editar Categoria' : 'Nova Categoria';
    document.getElementById('catId').value = id || '';
    if (id) {
      const c = this._categorias.find(x => x.id === id);
      if (c) {
        document.getElementById('catNome').value = c.name || '';
        document.getElementById('catTipo').value = c.tipo || 'despesa';
        document.getElementById('catDesc').value = c.descricao || '';
      }
    } else { document.getElementById('catForm').reset(); }
    document.getElementById('catModal').classList.add('active');
  },

  closeCatModal() { document.getElementById('catModal').classList.remove('active'); },

  async saveCat() {
    const id = document.getElementById('catId').value;
    const data = {
      name: document.getElementById('catNome').value.trim(),
      tipo: document.getElementById('catTipo').value,
      descricao: document.getElementById('catDesc').value.trim(),
      schoolId: APP.currentSchool.id
    };
    showLoading(true);
    try {
      await DB.saveDoc('categoriasDespesa', id || Utils.generateId(), data);
      Utils.toast('Categoria salva!', 'success');
      this.closeCatModal();
      await this.loadData();
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  async deleteCat(id) {
    const ok = await Utils.confirm('Excluir esta categoria?');
    if (!ok) return;
    showLoading(true);
    try { await DB.deleteDocument('categoriasDespesa', id); Utils.toast('Excluída!', 'success'); await this.loadData(); }
    catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  }
};

            <button class="btn btn-outline" onclick="PagePagamentos.exportDevedoresPDF()"><i class="fas fa-file-pdf"></i> PDF</button>
            <button class="btn btn-outline" onclick="PagePagamentos.exportDevedoresXLSX()"><i class="fas fa-file-excel"></i> XLSX</button>
