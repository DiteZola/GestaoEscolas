<script type="module">
// ============================================================
// MÓDULO: MENSAGENS
// ============================================================
window.PageMensagens = {
  async render(container) {
    const schoolId = APP.currentSchool ? APP.currentSchool.id : null;

    container.innerHTML = `
      <h2 class="page-title"><i class="fas fa-envelope"></i> Mensagens</h2>
      <div class="tabs no-print">
        <div class="tab-item active" onclick="PageMensagens.switchTab('inbox')">Caixa de Entrada</div>
        <div class="tab-item" onclick="PageMensagens.switchTab('enviadas')">Enviadas</div>
        <div class="tab-item" onclick="PageMensagens.switchTab('nova')">Nova Mensagem</div>
      </div>

      <div id="tabMsgInbox" class="tab-content active">
        <div class="toolbar mb-3">
          <div class="toolbar-left">
            <input type="text" class="search-input" id="searchMsgIn" placeholder="Pesquisar mensagens..." oninput="PageMensagens.filterInbox()">
          </div>
          <div class="toolbar-right">
            <button class="btn btn-sm btn-outline" onclick="PageMensagens.loadData()"><i class="fas fa-sync"></i> Actualizar</button>
          </div>
        </div>
        <div id="msgInboxList"></div>
      </div>

      <div id="tabMsgEnviadas" class="tab-content">
        <div class="toolbar mb-3">
          <div class="toolbar-left">
            <input type="text" class="search-input" id="searchMsgOut" placeholder="Pesquisar enviadas..." oninput="PageMensagens.filterEnviadas()">
          </div>
        </div>
        <div id="msgEnviadasList"></div>
      </div>

      <div id="tabMsgNova" class="tab-content">
        <div class="card">
          <div class="card-header"><h4><i class="fas fa-paper-plane"></i> Nova Mensagem</h4></div>
          <div class="card-body">
            <div class="form-row">
              <div class="form-group">
                <label>Enviar para</label>
                <select id="msgDestinoTipo" onchange="PageMensagens.onDestinoChange()">
                  <option value="individual">Usuário Individual</option>
                  <option value="cargo">Por Cargo/Função</option>
                  <option value="todos">Todos da Escola</option>
                </select>
              </div>
              <div class="form-group" id="msgCargoGroup" style="display:none">
                <label>Cargo</label>
                <select id="msgCargo">
                  <option value="">Selecione</option>
                  <option value="diretor">Director</option>
                  <option value="subdiretor_pedagogico">Subdir. Pedagógico</option>
                  <option value="subdiretor_administrativo">Subdir. Administrativo</option>
                  <option value="secretario">Secretário(a)</option>
                  <option value="coordenador">Coordenador</option>
                  <option value="professor">Professor</option>
                </select>
              </div>
            </div>
            <div class="form-group" id="msgIndividualGroup">
              <label>Destinatário</label>
              <input type="text" id="msgSearchDest" placeholder="Pesquisar por nome..." oninput="PageMensagens.searchDestinatario()">
              <div id="msgDestResults" style="max-height:150px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius);display:none;margin-top:4px"></div>
              <div id="msgDestSelected" style="margin-top:6px"></div>
              <input type="hidden" id="msgDestinatarioId">
              <input type="hidden" id="msgDestinatarioName">
            </div>
            <div class="form-group">
              <label>Assunto *</label>
              <input type="text" id="msgAssunto" required placeholder="Assunto da mensagem">
            </div>
            <div class="form-group">
              <label>Mensagem *</label>
              <textarea id="msgCorpo" rows="6" required placeholder="Escreva a sua mensagem aqui..." style="resize:vertical"></textarea>
            </div>
            <div class="form-group">
              <label>Prioridade</label>
              <select id="msgPrioridade">
                <option value="normal">Normal</option>
                <option value="alta">Alta</option>
                <option value="urgente">Urgente</option>
              </select>
            </div>
            <div style="text-align:right">
              <button class="btn btn-primary" onclick="PageMensagens.enviar()"><i class="fas fa-paper-plane"></i> Enviar Mensagem</button>
            </div>
          </div>
        </div>
      </div>

      <div id="msgViewModal" class="modal-overlay">
        <div class="modal-content modal-lg">
          <div class="modal-header"><h3 id="msgViewTitle">Mensagem</h3><button class="modal-close" onclick="document.getElementById('msgViewModal').classList.remove('active')">&times;</button></div>
          <div class="modal-body" id="msgViewBody"></div>
          <div class="modal-footer">
            <button class="btn btn-primary" id="msgReplyBtn" style="display:none" onclick="PageMensagens.responder()"><i class="fas fa-reply"></i> Responder</button>
            <button class="btn btn-outline" onclick="document.getElementById('msgViewModal').classList.remove('active')">Fechar</button>
          </div>
        </div>
      </div>`;

    await this.loadData();
  },

  _inbox: [], _enviadas: [], _filteredIn: [], _filteredOut: [], _users: [], _selectedDests: [],

  switchTab(tab) {
    const tabs = ['inbox', 'enviadas', 'nova'];
    document.querySelectorAll('.tab-item').forEach((t, i) => t.classList.toggle('active', tabs[i] === tab));
    tabs.forEach(t => {
      const el = document.getElementById('tabMsg' + t.charAt(0).toUpperCase() + t.slice(1));
      if (el) el.classList.toggle('active', t === tab);
    });
  },

  onDestinoChange() {
    const tipo = document.getElementById('msgDestinoTipo').value;
    document.getElementById('msgIndividualGroup').style.display = tipo === 'individual' ? 'block' : 'none';
    document.getElementById('msgCargoGroup').style.display = tipo === 'cargo' ? 'block' : 'none';
  },

  async loadData() {
    const uid = APP.currentUser.uid;
    const sid = APP.currentSchool ? APP.currentSchool.id : null;

    try {
      // Carregar usuários da escola para pesquisa
      if (sid) {
        this._users = await DB.getCollection('users', [FB.where('schoolId', '==', sid)]);
        this._users = this._users.filter(u => u.active !== false && u.uid !== uid);
      }

      // Inbox - mensagens recebidas
      this._inbox = await DB.getCollection('mensagens', [FB.where('destinatarioId', '==', uid)]);
      // Também mensagens para "todos" ou por cargo
      if (sid) {
        const msgTodos = await DB.getCollection('mensagens', [FB.where('schoolId', '==', sid), FB.where('destinatarioTipo', '==', 'todos')]);
        const msgCargo = await DB.getCollection('mensagens', [FB.where('schoolId', '==', sid), FB.where('destinatarioCargo', '==', APP.currentUser.role)]);
        // Merge sem duplicados
        const ids = new Set(this._inbox.map(m => m.id));
        msgTodos.forEach(m => { if (!ids.has(m.id) && m.remetenteId !== uid) { this._inbox.push(m); ids.add(m.id); } });
        msgCargo.forEach(m => { if (!ids.has(m.id) && m.remetenteId !== uid) { this._inbox.push(m); ids.add(m.id); } });
      }
      this._inbox.sort((a, b) => {
        const da = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(a.dataEnvio || 0);
        const db2 = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(b.dataEnvio || 0);
        return db2 - da;
      });
      this._filteredIn = [...this._inbox];

      // Enviadas
      this._enviadas = await DB.getCollection('mensagens', [FB.where('remetenteId', '==', uid)]);
      this._enviadas.sort((a, b) => {
        const da = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(a.dataEnvio || 0);
        const db2 = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(b.dataEnvio || 0);
        return db2 - da;
      });
      this._filteredOut = [...this._enviadas];

      this.renderInbox();
      this.renderEnviadas();
    } catch (e) {
      console.error('Erro mensagens:', e);
      this.renderInbox();
      this.renderEnviadas();
    }
  },

  filterInbox() {
    const term = (document.getElementById('searchMsgIn')?.value || '').toLowerCase();
    this._filteredIn = this._inbox.filter(m =>
      (m.assunto || '').toLowerCase().includes(term) ||
      (m.remetenteName || '').toLowerCase().includes(term) ||
      (m.corpo || '').toLowerCase().includes(term)
    );
    this.renderInbox();
  },

  filterEnviadas() {
    const term = (document.getElementById('searchMsgOut')?.value || '').toLowerCase();
    this._filteredOut = this._enviadas.filter(m =>
      (m.assunto || '').toLowerCase().includes(term) ||
      (m.destinatarioName || '').toLowerCase().includes(term) ||
      (m.corpo || '').toLowerCase().includes(term)
    );
    this.renderEnviadas();
  },

  renderInbox() {
    const div = document.getElementById('msgInboxList');
    if (!div) return;
    if (this._filteredIn.length === 0) {
      div.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>Nenhuma mensagem recebida</p></div>';
      return;
    }
    div.innerHTML = this._filteredIn.map(m => {
      const data = m.dataEnvio || (m.createdAt?.toDate ? m.createdAt.toDate().toLocaleDateString('pt-AO') : '');
      const lida = m.lida;
      const priorBadge = m.prioridade === 'urgente' ? 'badge-danger' : m.prioridade === 'alta' ? 'badge-warning' : 'badge-secondary';
      return `
        <div class="card mb-2 clickable" onclick="PageMensagens.viewMsg('${m.id}','inbox')" style="${!lida ? 'border-left:3px solid var(--primary);background:#f0f7ff' : ''}">
          <div class="card-body" style="padding:12px 16px">
            <div class="flex-between">
              <div>
                <strong style="font-size:13px">${!lida ? '● ' : ''}${m.assunto || 'Sem assunto'}</strong>
                <span class="badge ${priorBadge}" style="margin-left:6px">${m.prioridade || 'normal'}</span>
              </div>
              <small style="color:var(--text-light)">${data}</small>
            </div>
            <p style="font-size:12px;color:var(--text-light);margin-top:4px">
              <i class="fas fa-user"></i> De: <strong>${m.remetenteName || 'Sistema'}</strong>
              ${m.remetenteCargo ? ' (' + getRoleName(m.remetenteCargo) + ')' : ''}
            </p>
            <p style="font-size:12px;color:var(--text-light);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:500px">${(m.corpo || '').substring(0, 120)}...</p>
          </div>
        </div>`;
    }).join('');
  },

  renderEnviadas() {
    const div = document.getElementById('msgEnviadasList');
    if (!div) return;
    if (this._filteredOut.length === 0) {
      div.innerHTML = '<div class="empty-state"><i class="fas fa-paper-plane"></i><p>Nenhuma mensagem enviada</p></div>';
      return;
    }
    div.innerHTML = this._filteredOut.map(m => {
      const data = m.dataEnvio || (m.createdAt?.toDate ? m.createdAt.toDate().toLocaleDateString('pt-AO') : '');
      let destText = m.destinatarioName || '';
      if (m.destinatarioTipo === 'todos') destText = 'Todos da Escola';
      else if (m.destinatarioTipo === 'cargo') destText = getRoleName(m.destinatarioCargo) + ' (grupo)';
      return `
        <div class="card mb-2 clickable" onclick="PageMensagens.viewMsg('${m.id}','enviadas')">
          <div class="card-body" style="padding:12px 16px">
            <div class="flex-between">
              <strong style="font-size:13px">${m.assunto || 'Sem assunto'}</strong>
              <small style="color:var(--text-light)">${data}</small>
            </div>
            <p style="font-size:12px;color:var(--text-light);margin-top:4px">
              <i class="fas fa-user"></i> Para: <strong>${destText}</strong>
            </p>
            <p style="font-size:12px;color:var(--text-light);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:500px">${(m.corpo || '').substring(0, 120)}...</p>
          </div>
        </div>`;
    }).join('');
  },

  searchDestinatario() {
    const term = (document.getElementById('msgSearchDest')?.value || '').toLowerCase().trim();
    const div = document.getElementById('msgDestResults');
    if (!term || term.length < 2) { div.style.display = 'none'; return; }

    const matches = this._users.filter(u =>
      (u.name || '').toLowerCase().includes(term) ||
      (getRoleName(u.role) || '').toLowerCase().includes(term)
    ).slice(0, 10);

    if (matches.length === 0) {
      div.innerHTML = '<div style="padding:10px;color:var(--text-light)">Nenhum utilizador encontrado</div>';
    } else {
      div.innerHTML = matches.map(u => `
        <div style="padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px"
             onmouseover="this.style.background='#f0f4ff'" onmouseout="this.style.background=''"
             onclick="PageMensagens.selectDestinatario('${u.uid || u.id}','${(u.name || '').replace(/'/g, "\\'")}','${u.role}')">
          ${u.photo ? `<img src="${u.photo}" class="photo-small">` : '<i class="fas fa-user-circle" style="font-size:22px;color:var(--text-light)"></i>'}
          <div><strong>${u.name}</strong><br><small style="color:var(--text-light)">${getRoleName(u.role)}</small></div>
        </div>`).join('');
    }
    div.style.display = 'block';
  },

  selectDestinatario(id, name, role) {
    document.getElementById('msgDestResults').style.display = 'none';
    document.getElementById('msgDestinatarioId').value = id;
    document.getElementById('msgDestinatarioName').value = name;
    document.getElementById('msgSearchDest').value = '';
    document.getElementById('msgDestSelected').innerHTML = `
      <span class="badge badge-primary" style="padding:6px 12px;font-size:12px">
        ${name} (${getRoleName(role)})
        <span style="cursor:pointer;margin-left:6px" onclick="PageMensagens.clearDest()">&times;</span>
      </span>`;
  },

  clearDest() {
    document.getElementById('msgDestinatarioId').value = '';
    document.getElementById('msgDestinatarioName').value = '';
    document.getElementById('msgDestSelected').innerHTML = '';
  },

  async enviar() {
    const tipo = document.getElementById('msgDestinoTipo').value;
    const assunto = document.getElementById('msgAssunto').value.trim();
    const corpo = document.getElementById('msgCorpo').value.trim();
    const prioridade = document.getElementById('msgPrioridade').value;

    if (!assunto || !corpo) { Utils.toast('Preencha assunto e mensagem', 'warning'); return; }

    const sid = APP.currentSchool ? APP.currentSchool.id : '';
    const baseData = {
      assunto, corpo, prioridade,
      remetenteId: APP.currentUser.uid,
      remetenteName: APP.currentUser.name,
      remetenteCargo: APP.currentUser.role,
      schoolId: sid,
      dataEnvio: new Date().toISOString().split('T')[0],
      lida: false
    };

    showLoading(true);
    try {
      if (tipo === 'individual') {
        const destId = document.getElementById('msgDestinatarioId').value;
        const destName = document.getElementById('msgDestinatarioName').value;
        if (!destId) { Utils.toast('Selecione um destinatário', 'warning'); showLoading(false); return; }
        await DB.saveDoc('mensagens', Utils.generateId(), {
          ...baseData,
          destinatarioId: destId,
          destinatarioName: destName,
          destinatarioTipo: 'individual'
        });
        Utils.toast('Mensagem enviada para ' + destName + '!', 'success');

      } else if (tipo === 'cargo') {
        const cargo = document.getElementById('msgCargo').value;
        if (!cargo) { Utils.toast('Selecione o cargo', 'warning'); showLoading(false); return; }
        await DB.saveDoc('mensagens', Utils.generateId(), {
          ...baseData,
          destinatarioId: '',
          destinatarioName: getRoleName(cargo),
          destinatarioCargo: cargo,
          destinatarioTipo: 'cargo'
        });
        Utils.toast('Mensagem enviada para todos ' + getRoleName(cargo) + '!', 'success');

      } else {
        await DB.saveDoc('mensagens', Utils.generateId(), {
          ...baseData,
          destinatarioId: '',
          destinatarioName: 'Todos',
          destinatarioTipo: 'todos'
        });
        Utils.toast('Mensagem enviada para todos!', 'success');
      }

      // Limpar
      document.getElementById('msgAssunto').value = '';
      document.getElementById('msgCorpo').value = '';
      this.clearDest();
      this.switchTab('enviadas');
      await this.loadData();
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  async viewMsg(id, tab) {
    const list = tab === 'inbox' ? this._inbox : this._enviadas;
    const msg = list.find(m => m.id === id);
    if (!msg) return;

    // Marcar como lida
    if (tab === 'inbox' && !msg.lida) {
      try {
        await DB.saveDoc('mensagens', id, { lida: true });
        msg.lida = true;
        this.renderInbox();
      } catch (e) {}
    }

    const data = msg.dataEnvio || (msg.createdAt?.toDate ? msg.createdAt.toDate().toLocaleDateString('pt-AO') : '');
    const priorBadge = msg.prioridade === 'urgente' ? 'badge-danger' : msg.prioridade === 'alta' ? 'badge-warning' : 'badge-secondary';

    let destText = msg.destinatarioName || '';
    if (msg.destinatarioTipo === 'todos') destText = 'Todos da Escola';
    else if (msg.destinatarioTipo === 'cargo') destText = getRoleName(msg.destinatarioCargo) + ' (grupo)';

    document.getElementById('msgViewTitle').textContent = msg.assunto || 'Sem assunto';
    document.getElementById('msgViewBody').innerHTML = `
      <div style="background:#f8fafc;padding:12px;border-radius:var(--radius);margin-bottom:16px">
        <div class="flex-between">
          <div>
            <p><strong>De:</strong> ${msg.remetenteName || 'Sistema'} ${msg.remetenteCargo ? '(' + getRoleName(msg.remetenteCargo) + ')' : ''}</p>
            <p><strong>Para:</strong> ${destText}</p>
          </div>
          <div style="text-align:right">
            <p><small>${data}</small></p>
            <span class="badge ${priorBadge}">${msg.prioridade || 'normal'}</span>
          </div>
        </div>
      </div>
      <div style="white-space:pre-wrap;font-size:14px;line-height:1.6;padding:0 4px">${msg.corpo || ''}</div>`;

    // Botão responder só no inbox
    const replyBtn = document.getElementById('msgReplyBtn');
    if (tab === 'inbox') {
      replyBtn.style.display = 'inline-flex';
      replyBtn.onclick = () => {
        document.getElementById('msgViewModal').classList.remove('active');
        this.switchTab('nova');
        document.getElementById('msgDestinoTipo').value = 'individual';
        this.onDestinoChange();
        document.getElementById('msgDestinatarioId').value = msg.remetenteId;
        document.getElementById('msgDestinatarioName').value = msg.remetenteName;
        document.getElementById('msgDestSelected').innerHTML = `<span class="badge badge-primary" style="padding:6px 12px">${msg.remetenteName} <span style="cursor:pointer;margin-left:6px" onclick="PageMensagens.clearDest()">&times;</span></span>`;
        document.getElementById('msgAssunto').value = 'RE: ' + (msg.assunto || '');
        document.getElementById('msgCorpo').focus();
      };
    } else {
      replyBtn.style.display = 'none';
    }

    document.getElementById('msgViewModal').classList.add('active');
  },

  responder() {}
};

// ============================================================
// MÓDULO: EVENTOS
// ============================================================
window.PageEventos = {
  async render(container) {
    const schoolId = APP.currentSchool ? APP.currentSchool.id : null;
    if (!schoolId) {
      container.innerHTML = '<div class="empty-state"><i class="fas fa-school"></i><p>Selecione uma escola primeiro</p></div>';
      return;
    }

    const canEdit = ['superadmin', 'diretor', 'subdiretor_pedagogico', 'subdiretor_administrativo'].includes(APP.currentUser.role);

    container.innerHTML = `

        <div class="tab-item active" onclick="PageEventos.switchTab('lista')">Lista de Eventos</div>

      <div id="tabEvLista" class="tab-content active">

          <div class="toolbar-left">

              <option value="cultural">Actividade Cultural</option>

              <option value="formacao">Formação/Capacitação</option>
              <option value="feriado">Feriado/Efeméride</option>
              <option value="administrativo">Administrativo</option>
              <option value="comemoracao">Comemoração</option>
              <option value="outro">Outro</option>

          </div>
          <div class="toolbar-right">
            ${canEdit ? '<button class="btn btn-primary" onclick="PageEventos.openModal()"><i class="fas fa-plus"></i> Novo Evento</button>' : ''}
            <button class="btn btn-outline" onclick="PageEventos.exportPDF()"><i class="fas fa-file-pdf"></i></button>
          </div>
        </div>
        <div id="eventosStats" class="stats-grid mb-3"></div>
        <div class="table-container">
          <table>
            <thead><tr>
              <th>#</th><th>Data</th><th>Hora</th><th>Evento</th><th>Tipo</th>
              <th>Local</th><th>Responsável</th><th>Público-Alvo</th><th>Estado</th>
              ${canEdit ? '<th>Acções</th>' : ''}
            </tr></thead>
            <tbody id="eventoTableBody"><tr><td colspan="10" class="text-center">Carregando...</td></tr></tbody>

  _data: [], _filtered: [], _currentMonth: 0, _currentYear: 2025,

  switchTab(tab) {
    document.querySelectorAll('.tab-item').forEach((t, i) => t.classList.toggle('active', (i === 0 && tab === 'lista') || (i === 1 && tab === 'calendario')));
    document.getElementById('tabEvLista').classList.toggle('active', tab === 'lista');
    document.getElementById('tabEvCalendario').classList.toggle('active', tab === 'calendario');
    if (tab === 'calendario') this.renderCalendar();
  },

  async loadData() {
    try {
      this._data = await DB.getCollection('eventos', [FB.where('schoolId', '==', APP.currentSchool.id)]);
      this._data.sort((a, b) => (a.dataInicio || '').localeCompare(b.dataInicio || ''));
      this._filtered = [...this._data];
      this.renderTable();
      this.renderStats();
    } catch (e) { console.error(e); }
  },

  filter() {
    const term = (document.getElementById('searchEvento')?.value || '').toLowerCase();
    const tipo = document.getElementById('filterEvTipo')?.value || '';
    this._filtered = this._data.filter(e =>
      ((e.nome || '').toLowerCase().includes(term) || (e.descricao || '').toLowerCase().includes(term)) &&
      (!tipo || e.tipo === tipo)
    );
    this.renderTable();
  },

  renderStats() {
    const planificados = this._data.filter(e => e.estado === 'Planificado').length;
    const realizados = this._data.filter(e => e.estado === 'Realizado').length;
    const emCurso = this._data.filter(e => e.estado === 'Em Curso').length;
    const totalOrc = this._data.reduce((s, e) => s + (parseFloat(e.orcamento) || 0), 0);

    document.getElementById('eventosStats').innerHTML = `
      <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-calendar"></i></div><div class="stat-info"><h3>${this._data.length}</h3><p>Total Eventos</p></div></div>
      <div class="stat-card"><div class="stat-icon orange"><i class="fas fa-clock"></i></div><div class="stat-info"><h3>${planificados}</h3><p>Planificados</p></div></div>
      <div class="stat-card"><div class="stat-icon green"><i class="fas fa-check-circle"></i></div><div class="stat-info"><h3>${realizados}</h3><p>Realizados</p></div></div>
      <div class="stat-card"><div class="stat-icon purple"><i class="fas fa-money-bill"></i></div><div class="stat-info"><h3>${totalOrc.toLocaleString('pt-AO')} Kz</h3><p>Orçamento Total</p></div></div>
    `;
  },

  renderTable() {
    const tbody = document.getElementById('eventoTableBody');
    if (!tbody) return;
    const canEdit = ['superadmin', 'diretor', 'subdiretor_pedagogico', 'subdiretor_administrativo'].includes(APP.currentUser.role);
    const tipoIcons = { reuniao: '🤝', avaliacao: '📝', cultural: '🎭', desportivo: '⚽', formacao: '📚', feriado: '🎉', administrativo: '📋', comemoracao: '🎊', outro: '📌' };
    const estadoBadge = { 'Planificado': 'badge-warning', 'Em Curso': 'badge-info', 'Realizado': 'badge-success', 'Cancelado': 'badge-danger', 'Adiado': 'badge-secondary' };

    if (this._filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="10" class="text-center">Nenhum evento cadastrado</td></tr>`;
      return;
    }

    tbody.innerHTML = this._filtered.map((e, i) => `<tr>
      <td>${i + 1}</td>
      <td>${e.dataInicio || ''}</td>
      <td>${e.horaInicio || ''} ${e.horaFim ? '- ' + e.horaFim : ''}</td>
      <td><strong>${tipoIcons[e.tipo] || '📌'} ${e.nome || ''}</strong></td>
      <td>${e.tipo || ''}</td>
      <td>${e.local || ''}</td>
      <td>${e.responsavel || ''}</td>
      <td>${e.publico || ''}</td>
      <td><span class="badge ${estadoBadge[e.estado] || 'badge-secondary'}">${e.estado || 'N/D'}</span></td>
      ${canEdit ? `<td>
        <button class="btn btn-sm btn-info" onclick="PageEventos.openModal('${e.id}')"><i class="fas fa-edit"></i></button>
        <button class="btn btn-sm btn-danger" onclick="PageEventos.delete('${e.id}')"><i class="fas fa-trash"></i></button>
      </td>` : ''}
    </tr>`).join('');
  },

  renderCalendar() {
    const meses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
    document.getElementById('calMonthTitle').textContent = meses[this._currentMonth] + ' ' + this._currentYear;

    const firstDay = new Date(this._currentYear, this._currentMonth, 1).getDay();
    const daysInMonth = new Date(this._currentYear, this._currentMonth + 1, 0).getDate();
    const today = new Date();

    let html = '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">';
    ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'].forEach(d => {
      html += `<div style="text-align:center;padding:8px;font-weight:700;font-size:11px;color:var(--text-light)">${d}</div>`;
    });

    for (let i = 0; i < firstDay; i++) html += '<div></div>';

    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${this._currentYear}-${String(this._currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const isToday = today.getDate() === d && today.getMonth() === this._currentMonth && today.getFullYear() === this._currentYear;
      const eventos = this._data.filter(e => e.dataInicio === dateStr);

      html += `<div style="min-height:60px;border:1px solid var(--border);border-radius:4px;padding:4px;${isToday ? 'background:#eff6ff;border-color:var(--primary)' : ''}">
        <div style="font-size:12px;font-weight:${isToday ? '700' : '500'};color:${isToday ? 'var(--primary)' : 'var(--text)'}">${d}</div>
        ${eventos.map(e => `<div style="font-size:8px;background:${e.tipo === 'feriado' ? '#fee2e2' : '#dbeafe'};color:${e.tipo === 'feriado' ? '#991b1b' : '#1e40af'};padding:1px 3px;border-radius:2px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${e.nome}">${e.nome}</div>`).join('')}
      </div>`;
    }

    html += '</div>';
    document.getElementById('calendarBody').innerHTML = html;
  },

  changeMonth(dir) {
    this._currentMonth += dir;
    if (this._currentMonth > 11) { this._currentMonth = 0; this._currentYear++; }
    if (this._currentMonth < 0) { this._currentMonth = 11; this._currentYear--; }
    this.renderCalendar();
  },

  openModal(id = null) {
    document.getElementById('eventoModalTitle').textContent = id ? 'Editar Evento' : 'Novo Evento';
    document.getElementById('eventoId').value = id || '';
    if (id) {
      const e = this._data.find(x => x.id === id);
      if (e) {
        document.getElementById('eventoNome').value = e.nome || '';
        document.getElementById('eventoDataInicio').value = e.dataInicio || '';
        document.getElementById('eventoDataFim').value = e.dataFim || '';
        document.getElementById('eventoHoraInicio').value = e.horaInicio || '';
        document.getElementById('eventoHoraFim').value = e.horaFim || '';
        document.getElementById('eventoTipo').value = e.tipo || '';
        document.getElementById('eventoLocal').value = e.local || '';
        document.getElementById('eventoResponsavel').value = e.responsavel || '';
        document.getElementById('eventoPublico').value = e.publico || 'todos';
        document.getElementById('eventoObjectivos').value = e.objectivos || '';
        document.getElementById('eventoRecursos').value = e.recursos || '';
        document.getElementById('eventoOrcamento').value = e.orcamento || '';
        document.getElementById('eventoEstado').value = e.estado || 'Planificado';
        document.getElementById('eventoDescricao').value = e.descricao || '';
      }
    } else { document.getElementById('eventoForm').reset(); document.getElementById('eventoEstado').value = 'Planificado'; }
    document.getElementById('eventoModal').classList.add('active');
  },

  closeModal() { document.getElementById('eventoModal').classList.remove('active'); },

  async save() {
    const id = document.getElementById('eventoId').value;
    const data = {
      nome: document.getElementById('eventoNome').value.trim(),
      dataInicio: document.getElementById('eventoDataInicio').value,
      dataFim: document.getElementById('eventoDataFim').value,
      horaInicio: document.getElementById('eventoHoraInicio').value,
      horaFim: document.getElementById('eventoHoraFim').value,
      tipo: document.getElementById('eventoTipo').value,
      local: document.getElementById('eventoLocal').value.trim(),
      responsavel: document.getElementById('eventoResponsavel').value.trim(),
      publico: document.getElementById('eventoPublico').value,
      objectivos: document.getElementById('eventoObjectivos').value.trim(),
      recursos: document.getElementById('eventoRecursos').value.trim(),
      orcamento: parseFloat(document.getElementById('eventoOrcamento').value) || 0,
      estado: document.getElementById('eventoEstado').value,
      descricao: document.getElementById('eventoDescricao').value.trim(),
      schoolId: APP.currentSchool.id
    };
    showLoading(true);
    try {
      await DB.saveDoc('eventos', id || Utils.generateId(), data);
      Utils.toast(id ? 'Evento atualizado!' : 'Evento criado!', 'success');
      this.closeModal();
      await this.loadData();
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  async delete(id) {
    const ok = await Utils.confirm('Excluir este evento?');
    if (!ok) return;
    showLoading(true);
    try { await DB.deleteDocument('eventos', id); Utils.toast('Excluído!', 'success'); await this.loadData(); }
    catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  exportPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('landscape');
    let y = PDFHelper.addHeader(doc, APP.currentSchool, { title: 'PLANO DE ACTIVIDADES / EVENTOS' });
    doc.autoTable({
      startY: y + 5,
      head: [['#', 'Data', 'Hora', 'Evento', 'Tipo', 'Local', 'Responsável', 'Público', 'Objectivos', 'Estado']],
      body: this._filtered.map((e, i) => [i + 1, e.dataInicio, e.horaInicio || '', e.nome, e.tipo, e.local || '', e.responsavel || '', e.publico || '', (e.objectivos || '').substring(0, 50), e.estado]),
      styles: { fontSize: 6 }, headStyles: { fillColor: [15, 23, 42] }
    });
    doc.save('plano_actividades.pdf');
    Utils.toast('PDF exportado!', 'success');
  }
};

  },

  renderTable() {
    const tbody = document.getElementById('escolaTableBody');
    if (!tbody) return;
    const tipoNames = { primario: 'Primário', ciclo1: 'I Ciclo', ciclo2: 'II Ciclo', primario_ciclo1: 'Primário+I Ciclo', primario_ciclo2: 'Primário-II Ciclo', ciclo1_ciclo2: 'I+II Ciclo' };

    if (this._filtered.length === 0) { tbody.innerHTML = '<tr><td colspan="10" class="text-center">Nenhuma escola cadastrada</td></tr>'; return; }

    tbody.innerHTML = this._filtered.map((e, i) => `<tr>
      <td>${i + 1}</td>
      <td><strong>${e.name || ''}</strong><br><small style="color:var(--text-light)">${e.denominacao || ''}</small></td>
      <td><span class="badge badge-primary">${tipoNames[e.tipo] || e.tipo || ''}</span></td>
      <td>${e.code || ''}</td>
      <td>${e.directorName || 'N/D'}</td>
      <td>${e.province || ''}</td>
      <td>${e.municipality || ''}</td>
      <td>${e.phone || ''}</td>
      <td><span class="badge ${e.status === 'Activo' ? 'badge-success' : 'badge-danger'}">${e.status || 'Activo'}</span></td>
      <td>
        <div style="display:flex;gap:3px;flex-wrap:wrap">
          <button class="btn btn-sm btn-info" onclick="PageEscolas.openModal('${e.id}')" title="Editar"><i class="fas fa-edit"></i></button>
          <button class="btn btn-sm btn-warning" onclick="PageEscolas.changeDirector('${e.id}')" title="Alterar Director"><i class="fas fa-user-cog"></i></button>
          <button class="btn btn-sm btn-danger" onclick="PageEscolas.delete('${e.id}')" title="Excluir"><i class="fas fa-trash"></i></button>
        </div>
      </td>
    </tr>`).join('');
  },

  openModal(id = null) {
    document.getElementById('escolaModalTitle').textContent = id ? 'Editar Escola' : 'Nova Escola';
    document.getElementById('escolaId').value = id || '';
    const pwRow = document.getElementById('dirPasswordRow');

    if (id) {
      const e = this._data.find(x => x.id === id);
      if (e) {
        document.getElementById('escolaNome').value = e.name || '';
        document.getElementById('escolaDenominacao').value = e.denominacao || '';
        document.getElementById('escolaCodigo').value = e.code || '';
        document.getElementById('escolaTipo').value = e.tipo || '';
        document.getElementById('escolaDecreto').value = e.decretoExecutivo || '';
        document.getElementById('escolaProvincia').value = e.province || '';
        document.getElementById('escolaMunicipio').value = e.municipality || '';
        document.getElementById('escolaComuna').value = e.comuna || '';
        document.getElementById('escolaBairro').value = e.bairro || '';
        document.getElementById('escolaEndereco').value = e.address || '';
        document.getElementById('escolaTelefone').value = e.phone || '';
        document.getElementById('escolaEmail').value = e.email || '';
        document.getElementById('escolaNif').value = e.nif || '';
        document.getElementById('escolaStatus').value = e.status || 'Activo';
        document.getElementById('dirNome').value = e.directorName || '';
        document.getElementById('dirSexo').value = e.directorSexo || '';
        document.getElementById('dirEmail').value = e.directorEmail || '';
        document.getElementById('dirTelefone').value = e.directorPhone || '';
        document.getElementById('dirBi').value = e.directorBi || '';
        document.getElementById('dirAgente').value = e.directorAgente || '';
        pwRow.style.display = 'none';
      }
    } else {
      document.getElementById('escolaForm').reset();
      document.getElementById('escolaStatus').value = 'Activo';
      pwRow.style.display = 'grid';
    }
    document.getElementById('escolaModal').classList.add('active');
  },

  closeModal() { document.getElementById('escolaModal').classList.remove('active'); },

  async save() {
    const id = document.getElementById('escolaId').value;
    const isNew = !id;

    if (isNew) {
      const pw = document.getElementById('dirPassword').value;
      if (!pw || pw.length < 6) { Utils.toast('Senha do director deve ter pelo menos 6 caracteres', 'warning'); return; }
      if (pw !== document.getElementById('dirPassword2').value) { Utils.toast('Senhas não coincidem', 'error'); return; }
    }

    const schoolData = {
      name: document.getElementById('escolaNome').value.trim(),
      denominacao: document.getElementById('escolaDenominacao').value.trim(),
      code: document.getElementById('escolaCodigo').value.trim(),
      tipo: document.getElementById('escolaTipo').value,
      decretoExecutivo: document.getElementById('escolaDecreto').value.trim(),
      province: document.getElementById('escolaProvincia').value,
      municipality: document.getElementById('escolaMunicipio').value.trim(),
      comuna: document.getElementById('escolaComuna').value.trim(),
      bairro: document.getElementById('escolaBairro').value.trim(),
      address: document.getElementById('escolaEndereco').value.trim(),
      phone: document.getElementById('escolaTelefone').value.trim(),
      email: document.getElementById('escolaEmail').value.trim(),
      nif: document.getElementById('escolaNif').value.trim(),
      status: document.getElementById('escolaStatus').value,
      directorName: document.getElementById('dirNome').value.trim(),
      directorSexo: document.getElementById('dirSexo').value,
      directorEmail: document.getElementById('dirEmail').value.trim(),
      directorPhone: document.getElementById('dirTelefone').value.trim(),
      directorBi: document.getElementById('dirBi').value.trim(),
      directorAgente: document.getElementById('dirAgente').value.trim()
    };

    showLoading(true);
    try {
      if (isNew) {
        const ok = await Utils.confirm('Confirma a criação desta escola e as credenciais do director?');
        if (!ok) { showLoading(false); return; }

        // Criar escola
        const schoolId = Utils.generateId();
        await DB.saveDoc('schools', schoolId, schoolData);

        // Criar conta do director
        const dirEmail = document.getElementById('dirEmail').value.trim();
        const dirPw = document.getElementById('dirPassword').value;
        const cred = await FB.createUserWithEmailAndPassword(FB.auth, dirEmail, dirPw);
        await FB.setDoc(FB.doc(FB.db, 'users', cred.user.uid), {
          uid: cred.user.uid,
          role: 'diretor',
          name: schoolData.directorName,
          email: dirEmail,
          sexo: schoolData.directorSexo,
          phone: schoolData.directorPhone,
          bi: schoolData.directorBi,
          agente: schoolData.directorAgente,
          schoolId: schoolId,
          active: true,
          createdAt: FB.serverTimestamp()
        });

        // Atualizar escola com directorId
        await DB.saveDoc('schools', schoolId, { directorId: cred.user.uid });

        Utils.toast('Escola e director cadastrados com sucesso!', 'success');
      } else {
        const ok = await Utils.confirm('Confirma as alterações nesta escola?');
        if (!ok) { showLoading(false); return; }
        await DB.saveDoc('schools', id, schoolData);
        Utils.toast('Escola atualizada!', 'success');
      }

      this.closeModal();
      await this.loadData();
      if (typeof loadSchoolSelector === 'function') loadSchoolSelector();
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  async changeDirector(schoolId) {
    const school = this._data.find(e => e.id === schoolId);
    if (!school) return;

    const modal = document.createElement('div');
    modal.className = 'modal-overlay active';
    modal.innerHTML = `<div class="modal-content" style="max-width:500px">
      <div class="modal-header"><h3>Alterar Director - ${school.name}</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button></div>
      <div class="modal-body">
        <p class="mb-3"><strong>Director actual:</strong> ${school.directorName || 'N/D'} (${school.directorEmail || 'N/D'})</p>
        <div class="form-group"><label>Pesquisar novo director (por email)</label>
          <input type="email" id="newDirEmail" placeholder="Email do novo director"></div>
        <p style="font-size:11px;color:var(--text-light)">O utilizador já deve estar cadastrado no sistema.</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">Cancelar</button>
        <button class="btn btn-primary" id="confirmNewDir">Confirmar</button>
      </div>
    </div>`;
    document.body.appendChild(modal);

    document.getElementById('confirmNewDir').onclick = async () => {
      const email = document.getElementById('newDirEmail').value.trim();
      if (!email) { Utils.toast('Digite o email', 'warning'); return; }
      showLoading(true);
      try {
        const users = await DB.getCollection('users', [FB.where('email', '==', email)]);
        if (users.length === 0) { Utils.toast('Utilizador não encontrado', 'error'); showLoading(false); return; }
        const newDir = users[0];

        // Remover escola do antigo director
        if (school.directorId) {
          await DB.saveDoc('users', school.directorId, { role: 'professor' });
        }

        // Atribuir novo director
        await DB.saveDoc('users', newDir.uid || newDir.id, { role: 'diretor', schoolId: schoolId });
        await DB.saveDoc('schools', schoolId, {
          directorId: newDir.uid || newDir.id,
          directorName: newDir.name,
          directorEmail: newDir.email,
          directorSexo: newDir.sexo || '',
          directorPhone: newDir.phone || ''
        });

        Utils.toast('Director alterado com sucesso!', 'success');
        modal.remove();
        await this.loadData();
      } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
      showLoading(false);
    };
  },

  async delete(id) {
    const ok = await Utils.confirm('Excluir esta escola? Esta acção é irreversível!');
    if (!ok) return;
    showLoading(true);
    try {
      await DB.deleteDocument('schools', id);
      Utils.toast('Escola excluída!', 'success');
      await this.loadData();
      if (typeof loadSchoolSelector === 'function') loadSchoolSelector();
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  }
};

<script type="module">
// ============================================================
// MÓDULO: BACKUP E RESTAURO

window.PageBackup = {
  async render(container) {
    const role = APP.currentUser.role;
    if (!['superadmin', 'diretor'].includes(role)) {
      container.innerHTML = '<div class="empty-state"><i class="fas fa-lock"></i><p>Acesso restrito</p></div>';
      return;
    }

    const isSA = role === 'superadmin';

    container.innerHTML = `
      <h2 class="page-title"><i class="fas fa-database"></i> Backup e Restauro</h2>
      <div class="tabs no-print">
        <div class="tab-item active" onclick="PageBackup.switchTab('backup')">Criar Backup</div>
        <div class="tab-item" onclick="PageBackup.switchTab('restauro')">Restaurar</div>
        <div class="tab-item" onclick="PageBackup.switchTab('historico')">Histórico</div>
      </div>

      <div id="tabBkpBackup" class="tab-content active">
        <div class="grid-2">
          <div class="card">
            <div class="card-header"><h4><i class="fas fa-file-code"></i> Backup JSON</h4></div>
            <div class="card-body">
              <p style="color:var(--text-light);margin-bottom:12px">Exporta todos os dados em formato JSON (estrutura completa). Ideal para restauração total.</p>
              <div class="form-group">
                <label>Escopo do Backup</label>
                <select id="bkpJsonScope">
                  ${isSA ? '<option value="total">Total (Todas as Escolas)</option>' : ''}

                </select>
              </div>
              <div id="bkpJsonCollections" class="mb-3">
                <label style="font-size:12px;font-weight:600;margin-bottom:8px;display:block">Colecções a exportar:</label>
                ${this._getCollectionCheckboxes()}
              </div>
              <button class="btn btn-primary btn-full" onclick="PageBackup.exportJSON()">
                <i class="fas fa-download"></i> Exportar JSON
              </button>
            </div>
          </div>
          <div class="card">
            <div class="card-header"><h4><i class="fas fa-file-excel"></i> Backup XLSX</h4></div>
            <div class="card-body">
              <p style="color:var(--text-light);margin-bottom:12px">Exporta dados tabulares em Excel com abas organizadas por colecção.</p>
              <div class="form-group">
                <label>Escopo do Backup</label>
                <select id="bkpXlsxScope">
                  ${isSA ? '<option value="total">Total (Todas as Escolas)</option>' : ''}
                  <option value="escola" ${!isSA ? 'selected' : ''}>Esta Escola</option>
                </select>
              </div>
              <button class="btn btn-success btn-full" onclick="PageBackup.exportXLSX()">
                <i class="fas fa-download"></i> Exportar XLSX
              </button>
            </div>
          </div>
        </div>
        <div class="card mt-3">
          <div class="card-header"><h4><i class="fas fa-info-circle"></i> Informações</h4></div>
          <div class="card-body" id="bkpInfoContent">
            <p style="color:var(--text-light)">Carregando informações do sistema...</p>
          </div>
        </div>
      </div>

      <div id="tabBkpRestauro" class="tab-content">
        <div class="card">
          <div class="card-header"><h4><i class="fas fa-upload"></i> Restaurar Dados</h4></div>
          <div class="card-body">
            <div style="background:#fef3c7;color:#92400e;padding:16px;border-radius:var(--radius);margin-bottom:16px">
              <i class="fas fa-exclamation-triangle"></i>
              <strong>ATENÇÃO:</strong> A restauração pode substituir dados existentes. Certifique-se de fazer backup antes de restaurar.
            </div>
            <div class="form-group">
              <label>Selecione o ficheiro de backup (JSON)</label>
              <input type="file" id="bkpRestoreFile" accept=".json" style="padding:8px">
            </div>
            <div id="bkpRestorePreview" style="display:none" class="mb-3"></div>
            <div style="display:flex;gap:10px">
              <button class="btn btn-warning" onclick="PageBackup.previewRestore()"><i class="fas fa-eye"></i> Pré-visualizar</button>
              <button class="btn btn-danger" id="bkpRestoreBtn" style="display:none" onclick="PageBackup.executeRestore()"><i class="fas fa-upload"></i> Restaurar Dados</button>
            </div>
          </div>
        </div>
      </div>

      <div id="tabBkpHistorico" class="tab-content">
        <div class="table-container">
          <table>
            <thead><tr><th>#</th><th>Data</th><th>Tipo</th><th>Escopo</th><th>Tamanho</th><th>Utilizador</th><th>Status</th></tr></thead>
            <tbody id="bkpHistTableBody"><tr><td colspan="7" class="text-center">Carregando...</td></tr></tbody>
          </table>
        </div>
      </div>`;

    this.loadInfo();
    this.loadHistorico();
  },

  _restoreData: null,

  _getCollectionCheckboxes() {
    const colls = ['alunos', 'notas', 'notasHistorico', 'presencas', 'turmas', 'classes', 'disciplinas',
      'atribuicoes', 'academicYears', 'pagamentos', 'receitas', 'despesas', 'titulosPagamento',
      'categoriasDespesa', 'patrimonio', 'patrimonioMovimentos', 'eventos', 'mensagens', 'users', 'schools'];
    return `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px">
      ${colls.map(c => `<label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer">
        <input type="checkbox" value="${c}" class="bkpCollCheck" checked> ${c}
      </label>`).join('')}
    </div>`;
  },

  switchTab(tab) {
    const tabs = ['backup', 'restauro', 'historico'];
    document.querySelectorAll('.tab-item').forEach((t, i) => t.classList.toggle('active', tabs[i] === tab));
    tabs.forEach(t => {
      const el = document.getElementById('tabBkp' + t.charAt(0).toUpperCase() + t.slice(1));
      if (el) el.classList.toggle('active', t === tab);
    });
  },

  async loadInfo() {
    const infoDiv = document.getElementById('bkpInfoContent');
    if (!infoDiv) return;
    try {
      const sid = APP.currentSchool ? APP.currentSchool.id : null;
      let totalDocs = 0;
      const counts = {};
      const collections = ['alunos', 'notas', 'users', 'turmas', 'classes', 'disciplinas', 'pagamentos', 'eventos'];

      for (const col of collections) {
        let q = sid ? [FB.where('schoolId', '==', sid)] : [];
        try {
          const data = await DB.getCollection(col, q.length ? q : undefined);
          counts[col] = data.length;
          totalDocs += data.length;
        } catch (e) { counts[col] = 0; }
      }

      infoDiv.innerHTML = `
        <div class="grid-2" style="gap:8px">
          ${Object.entries(counts).map(([col, cnt]) => `
            <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)">
              <span style="font-size:13px"><i class="fas fa-database" style="color:var(--primary);margin-right:6px"></i>${col}</span>
              <strong>${cnt}</strong>
            </div>`).join('')}
        </div>
        <div style="margin-top:12px;padding:10px;background:#f0f7ff;border-radius:var(--radius)">
          <strong>Total de documentos:</strong> ${totalDocs}
          <br><strong>Escola:</strong> ${APP.currentSchool ? APP.currentSchool.name : 'Todas'}
          <br><strong>Último backup:</strong> ${new Date().toLocaleDateString('pt-AO')}
        </div>`;
    } catch (e) { infoDiv.innerHTML = '<p style="color:var(--danger)">Erro ao carregar informações</p>'; }
  },

  async exportJSON() {
    const scope = document.getElementById('bkpJsonScope')?.value || 'escola';
    const checked = document.querySelectorAll('.bkpCollCheck:checked');
    const collections = Array.from(checked).map(c => c.value);

    if (collections.length === 0) { Utils.toast('Selecione pelo menos uma colecção', 'warning'); return; }

    showLoading(true);
    try {
      const backup = { version: '1.0', date: new Date().toISOString(), scope, school: APP.currentSchool?.name || 'Todas', data: {} };
      const sid = APP.currentSchool ? APP.currentSchool.id : null;

      for (const col of collections) {
        let q = (scope === 'escola' && sid) ? [FB.where('schoolId', '==', sid)] : [];
        try {
          backup.data[col] = await DB.getCollection(col, q.length ? q : undefined);
        } catch (e) { backup.data[col] = []; }
      }

      const jsonStr = JSON.stringify(backup, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `backup_sge_${scope}_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);

      // Registar no histórico
      await DB.saveDoc('backupLog', Utils.generateId(), {
        data: new Date().toISOString(),
        tipo: 'JSON',
        escopo: scope,
        tamanho: (jsonStr.length / 1024).toFixed(1) + ' KB',
        utilizador: APP.currentUser.name,
        status: 'Sucesso',
        schoolId: sid || ''
      });

      Utils.toast('Backup JSON exportado com sucesso!', 'success');
      this.loadHistorico();
    } catch (e) { Utils.toast('Erro no backup: ' + e.message, 'error'); }
    showLoading(false);
  },

  async exportXLSX() {
    const scope = document.getElementById('bkpXlsxScope')?.value || 'escola';
    showLoading(true);
    try {
      const wb = XLSX.utils.book_new();
      const sid = APP.currentSchool ? APP.currentSchool.id : null;
      const collections = ['alunos', 'notas', 'users', 'turmas', 'classes', 'disciplinas', 'pagamentos', 'receitas', 'despesas', 'patrimonio', 'eventos'];

      for (const col of collections) {
        let q = (scope === 'escola' && sid) ? [FB.where('schoolId', '==', sid)] : [];
        try {
          const data = await DB.getCollection(col, q.length ? q : undefined);
          if (data.length > 0) {
            const cleanData = data.map(d => {
              const clean = {};
              Object.entries(d).forEach(([k, v]) => {
                if (typeof v === 'object' && v !== null && v.toDate) clean[k] = v.toDate().toISOString();
                else if (typeof v === 'object' && v !== null) clean[k] = JSON.stringify(v);
                else clean[k] = v;
              });
              return clean;
            });
            const ws = XLSX.utils.json_to_sheet(cleanData);
            XLSX.utils.book_append_sheet(wb, ws, col.substring(0, 31));
          }
        } catch (e) { console.warn('Skip ' + col); }
      }

      XLSX.writeFile(wb, `backup_sge_${scope}_${new Date().toISOString().split('T')[0]}.xlsx`);

      await DB.saveDoc('backupLog', Utils.generateId(), {
        data: new Date().toISOString(),
        tipo: 'XLSX',
        escopo: scope,
        tamanho: 'N/D',
        utilizador: APP.currentUser.name,
        status: 'Sucesso',
        schoolId: sid || ''
      });

      Utils.toast('Backup XLSX exportado com sucesso!', 'success');
      this.loadHistorico();
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  previewRestore() {
    const file = document.getElementById('bkpRestoreFile').files[0];
    if (!file) { Utils.toast('Selecione um ficheiro JSON', 'warning'); return; }

    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        this._restoreData = JSON.parse(e.target.result);
        const preview = document.getElementById('bkpRestorePreview');
        const data = this._restoreData;

        let html = `<div style="background:#f8fafc;padding:12px;border-radius:var(--radius)">
          <h4>Detalhes do Backup</h4>
          <p><strong>Data:</strong> ${data.date || 'N/D'}</p>
          <p><strong>Escopo:</strong> ${data.scope || 'N/D'}</p>
          <p><strong>Escola:</strong> ${data.school || 'N/D'}</p>
          <p><strong>Versão:</strong> ${data.version || 'N/D'}</p>
          <hr>
          <h4>Colecções encontradas:</h4>
          <div class="grid-2" style="gap:4px;margin-top:8px">`;

        if (data.data) {
          Object.entries(data.data).forEach(([col, items]) => {
            html += `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border)">
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer">
                <input type="checkbox" class="restoreCollCheck" value="${col}" checked> ${col}
              </label>
              <span style="font-size:12px;font-weight:600">${Array.isArray(items) ? items.length : 0} docs</span>
            </div>`;
          });
        }
        html += '</div></div>';
        preview.innerHTML = html;
        preview.style.display = 'block';
        document.getElementById('bkpRestoreBtn').style.display = 'inline-flex';
      } catch (err) {
        Utils.toast('Ficheiro JSON inválido', 'error');
      }
    };
    reader.readAsText(file);
  },

  async executeRestore() {
    if (!this._restoreData) { Utils.toast('Nenhum dado para restaurar', 'error'); return; }
    const ok = await Utils.confirm('ATENÇÃO: Esta operação vai importar os dados do backup. Dados duplicados poderão ser sobrescritos. Continuar?');
    if (!ok) return;

    const checked = document.querySelectorAll('.restoreCollCheck:checked');
    const collections = Array.from(checked).map(c => c.value);

    showLoading(true);
    let totalImported = 0;
    try {
      for (const col of collections) {
        const items = this._restoreData.data[col];
        if (!Array.isArray(items)) continue;

        for (const item of items) {
          const docId = item.id || Utils.generateId();
          const cleanItem = { ...item };
          delete cleanItem.id;
          try {
            await DB.saveDoc(col, docId, cleanItem);
            totalImported++;
          } catch (e) { console.warn('Erro ao importar:', col, docId, e.message); }
        }
      }

      await DB.saveDoc('backupLog', Utils.generateId(), {
        data: new Date().toISOString(),
        tipo: 'RESTAURO',
        escopo: this._restoreData.scope || 'N/D',
        tamanho: totalImported + ' docs',
        utilizador: APP.currentUser.name,
        status: 'Sucesso',
        schoolId: APP.currentSchool?.id || ''
      });

      Utils.toast(`Restauração concluída! ${totalImported} documentos importados.`, 'success');
      this.loadHistorico();
    } catch (e) { Utils.toast('Erro na restauração: ' + e.message, 'error'); }
    showLoading(false);
  },

  async loadHistorico() {
    try {
      const sid = APP.currentSchool ? APP.currentSchool.id : null;
      let q = sid ? [FB.where('schoolId', '==', sid)] : [];
      const logs = await DB.getCollection('backupLog', q.length ? q : undefined);
      logs.sort((a, b) => (b.data || '').localeCompare(a.data || ''));

      const tbody = document.getElementById('bkpHistTableBody');
      if (!tbody) return;
      if (logs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center">Nenhum backup registado</td></tr>';
        return;
      }
      tbody.innerHTML = logs.map((l, i) => {
        const statusBadge = l.status === 'Sucesso' ? 'badge-success' : 'badge-danger';
        return `<tr>
          <td>${i + 1}</td>
          <td>${l.data ? new Date(l.data).toLocaleDateString('pt-AO') + ' ' + new Date(l.data).toLocaleTimeString('pt-AO', { hour: '2-digit', minute: '2-digit' }) : ''}</td>
          <td><span class="badge ${l.tipo === 'RESTAURO' ? 'badge-warning' : 'badge-primary'}">${l.tipo || ''}</span></td>
          <td>${l.escopo || ''}</td>
          <td>${l.tamanho || ''}</td>
          <td>${l.utilizador || ''}</td>
          <td><span class="badge ${statusBadge}">${l.status || ''}</span></td>
        </tr>`;
      }).join('');
    } catch (e) { console.error(e); }
  }
};

            <div style="background:#fee2e2;color:#991b1b;padding:16px;border-radius:var(--radius);margin-bottom:16px">
              <i class="fas fa-exclamation-triangle"></i> <strong>CUIDADO:</strong> Estas operações são irreversíveis. Faça backup antes de qualquer limpeza.
            </div>
            <div class="grid-2" style="gap:12px">
              <div class="card" style="border:1px solid var(--border)">
                <div class="card-body" style="text-align:center;padding:20px">
                  <i class="fas fa-envelope" style="font-size:28px;color:var(--info);margin-bottom:8px"></i>
                  <h4>Limpar Mensagens Lidas</h4>
                  <p style="font-size:12px;color:var(--text-light);margin:8px 0">Remove mensagens já lidas da caixa de entrada</p>
                  <button class="btn btn-warning btn-sm" onclick="PageUtilidades.limparMensagens()"><i class="fas fa-broom"></i> Limpar</button>
                </div>
              </div>
              <div class="card" style="border:1px solid var(--border)">
                <div class="card-body" style="text-align:center;padding:20px">
                  <i class="fas fa-history" style="font-size:28px;color:var(--warning);margin-bottom:8px"></i>
                  <h4>Limpar Logs Antigos</h4>
                  <p style="font-size:12px;color:var(--text-light);margin:8px 0">Remove logs de backup com mais de 90 dias</p>
                  <button class="btn btn-warning btn-sm" onclick="PageUtilidades.limparLogs()"><i class="fas fa-broom"></i> Limpar</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>`;

    this.onCalcTipoChange();
    this.loadLogs();
  },

  switchTab(tab) {
    const tabs = ['calculadora', 'conversor', 'gerador', 'logs', 'limpeza'];
    document.querySelectorAll('.tab-item').forEach((t, i) => t.classList.toggle('active', tabs[i] === tab));
    tabs.forEach(t => {
      const el = document.getElementById('tabUtil' + t.charAt(0).toUpperCase() + t.slice(1));
      if (el) el.classList.toggle('active', t === tab);
    });
  },

  onCalcTipoChange() {
    const tipo = document.getElementById('calcTipo')?.value;
    const max = tipo === 'primario' ? 10 : 20;
    ['calcMac1', 'calcNpt1', 'calcMac2', 'calcNpt2', 'calcMac3', 'calcNpt3', 'calcExame'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.max = max;
    });

    const isFinal = document.getElementById('calcFinal')?.value === 'sim';
    const npt3 = document.getElementById('calcNpt3Group');
    const exame = document.getElementById('calcExameGroup');
    if (npt3) npt3.style.display = isFinal ? 'none' : 'block';
    if (exame) exame.style.display = isFinal ? 'block' : 'none';
  },

  calcular() {
    this.onCalcTipoChange();
    const tipo = document.getElementById('calcTipo')?.value;
    const isFinal = document.getElementById('calcFinal')?.value === 'sim';
    const max = tipo === 'primario' ? 10 : 20;
    const pos = tipo === 'primario' ? 5 : 10;

    const getVal = (id) => { const el = document.getElementById(id); return el && el.value !== '' ? parseFloat(el.value) : null; };

    const notas = {
      mac1: getVal('calcMac1'), npt1: getVal('calcNpt1'),
      mac2: getVal('calcMac2'), npt2: getVal('calcNpt2'),
      mac3: getVal('calcMac3'), npt3: isFinal ? null : getVal('calcNpt3'),
      exame: isFinal ? getVal('calcExame') : null
    };

    const className = tipo === 'primario' ? (isFinal ? '6ª Classe' : '3ª Classe') : (isFinal ? '9ª Classe' : '7ª Classe');
    const calc = Utils.calcularMedia(notas, className);

    document.getElementById('calcMt1').value = calc.mt1 !== null ? calc.mt1 : '';
    document.getElementById('calcMt2').value = calc.mt2 !== null ? calc.mt2 : '';
    document.getElementById('calcCt3').value = calc.ct3 !== null ? calc.ct3 : '';
    document.getElementById('calcMfd').value = calc.mfd !== null ? calc.mfd : '';

    const resDiv = document.getElementById('calcResultado');
    if (calc.mfd !== null) {
      const aprov = calc.mfd >= pos;
      resDiv.style.display = 'block';
      resDiv.style.background = aprov ? '#d1fae5' : '#fee2e2';
      resDiv.style.color = aprov ? '#065f46' : '#991b1b';
      resDiv.innerHTML = `<strong>${aprov ? '✅ APROVADO' : '❌ REPROVADO'}</strong> - Média Final: <strong>${calc.mfd}</strong> (${Utils.valorExtenso(calc.mfd)})`;
    } else {
      resDiv.style.display = 'none';
    }
  },

  converter10to20() {
    const val = parseFloat(document.getElementById('convNota10')?.value);
    const res = document.getElementById('convResult20');
    if (isNaN(val)) { res.textContent = ''; return; }
    const conv = Math.round(val * 2 * 10) / 10;
    res.textContent = `${val} → ${conv} (escala 0-20)`;
  },

  converter20to10() {
    const val = parseFloat(document.getElementById('convNota20')?.value);
    const res = document.getElementById('convResult10');
    if (isNaN(val)) { res.textContent = ''; return; }
    const conv = Math.round(val / 2 * 10) / 10;
    res.textContent = `${val} → ${conv} (escala 0-10)`;
  },

  gerarSenha() {
    const len = parseInt(document.getElementById('genLength')?.value) || 10;
    const upper = document.getElementById('genUpper')?.checked;
    const numbers = document.getElementById('genNumbers')?.checked;
    const special = document.getElementById('genSpecial')?.checked;

    let chars = 'abcdefghijklmnopqrstuvwxyz';
    if (upper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    if (numbers) chars += '0123456789';
    if (special) chars += '!@#$%&*+-=';

    let password = '';
    for (let i = 0; i < len; i++) {
      password += chars.charAt(Math.floor(Math.random() * chars.length));
    }

    document.getElementById('genPassword').value = password;
    document.getElementById('genResult').style.display = 'block';
  },

  copiarSenha() {
    const pw = document.getElementById('genPassword')?.value;
    if (pw) {
      navigator.clipboard.writeText(pw).then(() => Utils.toast('Senha copiada!', 'success')).catch(() => Utils.toast('Erro ao copiar', 'error'));
    }
  },

  gerarLote() {
    const qtd = parseInt(document.getElementById('genBatchQtd')?.value) || 10;
    const len = parseInt(document.getElementById('genLength')?.value) || 10;
    const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    const senhas = [];
    for (let i = 0; i < qtd; i++) {
      let pw = '';
      for (let j = 0; j < len; j++) pw += chars.charAt(Math.floor(Math.random() * chars.length));
      senhas.push(pw);
    }
    document.getElementById('genBatchResult').innerHTML = `
      <div class="table-container"><table class="table-sm"><thead><tr><th>#</th><th>Senha</th><th>Acção</th></tr></thead>
      <tbody>${senhas.map((s, i) => `<tr><td>${i + 1}</td><td style="font-family:monospace">${s}</td>
        <td><button class="btn btn-sm btn-info" onclick="navigator.clipboard.writeText('${s}');Utils.toast('Copiada!','success')"><i class="fas fa-copy"></i></button></td></tr>`).join('')}
      </tbody></table></div>
      <button class="btn btn-outline mt-2" onclick="PageUtilidades.exportSenhasXLSX([${senhas.map(s => `'${s}'`).join(',')}])"><i class="fas fa-file-excel"></i> Exportar XLSX</button>`;
  },

  exportSenhasXLSX(senhas) {
    const data = senhas.map((s, i) => ({ '#': i + 1, 'Senha': s }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Senhas');
    XLSX.writeFile(wb, 'senhas_geradas.xlsx');
    Utils.toast('Exportado!', 'success');
  },

  async loadLogs() {
    const div = document.getElementById('logsContent');
    if (!div) return;
    try {
      const sid = APP.currentSchool ? APP.currentSchool.id : null;
      let q = sid ? [FB.where('schoolId', '==', sid)] : [];
      const logs = await DB.getCollection('backupLog', q.length ? q : undefined);
      logs.sort((a, b) => (b.data || '').localeCompare(a.data || ''));

      if (logs.length === 0) {
        div.innerHTML = '<p style="color:var(--text-light)">Nenhum log registado</p>';
        return;
      }

      div.innerHTML = `<div class="table-container"><table class="table-sm">
        <thead><tr><th>Data/Hora</th><th>Tipo</th><th>Escopo</th><th>Detalhes</th><th>Utilizador</th><th>Status</th></tr></thead>
        <tbody>${logs.slice(0, 50).map(l => {
          const d = l.data ? new Date(l.data) : null;
          return `<tr>
            <td>${d ? d.toLocaleDateString('pt-AO') + ' ' + d.toLocaleTimeString('pt-AO', { hour: '2-digit', minute: '2-digit' }) : ''}</td>
            <td><span class="badge ${l.tipo === 'RESTAURO' ? 'badge-warning' : 'badge-primary'}">${l.tipo}</span></td>
            <td>${l.escopo || ''}</td>
            <td>${l.tamanho || ''}</td>
            <td>${l.utilizador || ''}</td>
            <td><span class="badge ${l.status === 'Sucesso' ? 'badge-success' : 'badge-danger'}">${l.status}</span></td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>`;
    } catch (e) { div.innerHTML = '<p style="color:var(--danger)">Erro ao carregar logs</p>'; }
  },

  async limparMensagens() {
    const ok = await Utils.confirm('Limpar todas as mensagens lidas?');
    if (!ok) return;
    showLoading(true);
    try {
      const msgs = await DB.getCollection('mensagens', [FB.where('destinatarioId', '==', APP.currentUser.uid), FB.where('lida', '==', true)]);
      let count = 0;
      for (const m of msgs) {
        await DB.deleteDocument('mensagens', m.id);
        count++;
      }
      Utils.toast(`${count} mensagens lidas removidas`, 'success');
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  async limparLogs() {
    const ok = await Utils.confirm('Limpar logs com mais de 90 dias?');
    if (!ok) return;
    showLoading(true);
    try {
      const logs = await DB.getCollection('backupLog');
      const limite = new Date();
      limite.setDate(limite.getDate() - 90);
      let count = 0;
      for (const l of logs) {
        if (l.data && new Date(l.data) < limite) {
          await DB.deleteDocument('backupLog', l.id);
          count++;
        }
      }
      Utils.toast(`${count} logs antigos removidos`, 'success');
      this.loadLogs();
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  }
};
