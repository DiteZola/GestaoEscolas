  previewPhoto(input, previewId) {
    const file = input.files[0];
    if (!file) return;
    if (file.size > 12 * 1024 * 1024) {
      Utils.toast('Ficheiro muito grande (máx 12MB)', 'error');
      input.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById(previewId).innerHTML = `<img src="${e.target.result}" class="photo-preview">`;
    };
    reader.readAsDataURL(file);
  },

  async loadData() {
    try {
      let constraints = [FB.where('schoolId', '==', APP.currentSchool.id)];
      if (APP.currentYearId) constraints.push(FB.where('yearId', '==', APP.currentYearId));
      this._data = await DB.getCollection('alunos', constraints);
      this._data.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
      this._filtered = [...this._data];
      this.renderStats();
      this.renderTable();
    } catch (e) {
      console.error('Erro ao carregar alunos:', e);
      Utils.toast('Erro ao carregar alunos', 'error');
    }
  },

  filter() {
    const term = (document.getElementById('searchAluno')?.value || '').toLowerCase();
    const classeId = document.getElementById('filterAlunoClasse')?.value || '';
    const turmaId = document.getElementById('filterAlunoTurma')?.value || '';
    const estado = document.getElementById('filterAlunoEstado')?.value || '';
    this._filtered = this._data.filter(a => {
      const matchTerm = !term ||
        (a.name || '').toLowerCase().includes(term) ||
        (a.bi || '').toLowerCase().includes(term) ||
        (a.matricula || '').toLowerCase().includes(term) ||
        (a.processo || '').toLowerCase().includes(term);
      const matchClasse = !classeId || a.classeId === classeId;
      const matchTurma = !turmaId || a.turmaId === turmaId;
      const matchEstado = !estado || a.estado === estado;
      return matchTerm && matchClasse && matchTurma && matchEstado;
    });
    this._page = 1;
    this.renderTable();
  },

  renderStats() {
    const statsDiv = document.getElementById('alunoStats');
    if (!statsDiv) return;
    const ativos = this._data.filter(a => a.estado === 'Activo' || a.estado === 'Ativo').length;
    const transf = this._data.filter(a => a.estado === 'Transferido').length;
    const desist = this._data.filter(a => a.estado === 'Desistente').length;
    const masc = this._data.filter(a => (a.sexo || '').toUpperCase() === 'M').length;
    const fem = this._data.filter(a => (a.sexo || '').toUpperCase() === 'F').length;

    statsDiv.innerHTML = `
      <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-users"></i></div><div class="stat-info"><h3>${this._data.length}</h3><p>Total Alunos</p></div></div>
      <div class="stat-card"><div class="stat-icon green"><i class="fas fa-user-check"></i></div><div class="stat-info"><h3>${ativos}</h3><p>Activos</p></div></div>
      <div class="stat-card"><div class="stat-icon orange"><i class="fas fa-exchange-alt"></i></div><div class="stat-info"><h3>${transf}</h3><p>Transferidos</p></div></div>
      <div class="stat-card"><div class="stat-icon red"><i class="fas fa-user-times"></i></div><div class="stat-info"><h3>${desist}</h3><p>Desistentes</p></div></div>
      <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-male"></i></div><div class="stat-info"><h3>${masc}</h3><p>Masculinos</p></div></div>
      <div class="stat-card"><div class="stat-icon purple"><i class="fas fa-female"></i></div><div class="stat-info"><h3>${fem}</h3><p>Femininos</p></div></div>
    `;
  },

  renderTable() {
    const tbody = document.getElementById('alunoTableBody');
    if (!tbody) return;

    const total = this._filtered.length;
    const start = (this._page - 1) * this._perPage;
    const end = start + this._perPage;
    const pageData = this._filtered.slice(start, end);

    if (total === 0) {
      tbody.innerHTML = '<tr><td colspan="9" class="text-center">Nenhum aluno encontrado</td></tr>';
      document.getElementById('alunoPagination').innerHTML = '';
      return;
    }

    tbody.innerHTML = pageData.map((a, i) => {
      const estadoBadge = a.estado === 'Activo' || a.estado === 'Ativo' ? 'badge-success' :
        a.estado === 'Transferido' ? 'badge-warning' : a.estado === 'Desistente' ? 'badge-danger' : 'badge-secondary';
      const turma = this._turmas.find(t => t.id === a.turmaId);
      const classe = this._classes.find(c => c.id === a.classeId);

      return `<tr>
        <td>${start + i + 1}</td>
        <td>${a.photo ? `<img src="${a.photo}" class="photo-small">` : '<i class="fas fa-user-circle" style="font-size:28px;color:var(--text-light)"></i>'}</td>
        <td><strong class="nome-aluno">${a.name || ''}</strong></td>
        <td>${a.sexo === 'M' ? '♂ Masc.' : a.sexo === 'F' ? '♀ Fem.' : ''}</td>
        <td>${classe ? classe.name : a.classeName || ''}</td>
        <td>${turma ? turma.name : a.turmaName || ''} ${a.curso ? '<br><small>(' + a.curso + ')</small>' : ''}</td>
        <td><small>${a.matricula || ''}</small></td>
        <td><span class="badge ${estadoBadge}">${a.estado || 'Activo'}</span></td>
        <td>
          <div style="display:flex;gap:3px;flex-wrap:wrap">
            <button class="btn btn-sm btn-info" onclick="PageEstudantes.viewFicha('${a.id}')" title="Ver Ficha"><i class="fas fa-eye"></i></button>
            <button class="btn btn-sm btn-primary" onclick="PageEstudantes.openModal('${a.id}')" title="Editar"><i class="fas fa-edit"></i></button>
            <button class="btn btn-sm btn-secondary" onclick="PageEstudantes.exportFichaIndividualPDF('${a.id}')" title="Ficha PDF"><i class="fas fa-file-pdf"></i></button>
            <button class="btn btn-sm btn-warning" onclick="PageEstudantes.changeEstado('${a.id}')" title="Alterar Estado"><i class="fas fa-exchange-alt"></i></button>
            <button class="btn btn-sm btn-danger" onclick="PageEstudantes.delete('${a.id}')" title="Excluir"><i class="fas fa-trash"></i></button>
          </div>
        </td>
      </tr>`;
    }).join('');

    // Paginação
    const totalPages = Math.ceil(total / this._perPage);
    const pag = document.getElementById('alunoPagination');
    if (totalPages <= 1) { pag.innerHTML = ''; return; }
    let pagHTML = `<button ${this._page <= 1 ? 'disabled' : ''} onclick="PageEstudantes.goPage(${this._page - 1})"><i class="fas fa-chevron-left"></i></button>`;
    for (let p = 1; p <= totalPages; p++) {
      if (p === 1 || p === totalPages || Math.abs(p - this._page) <= 2) {
        pagHTML += `<button class="${p === this._page ? 'active' : ''}" onclick="PageEstudantes.goPage(${p})">${p}</button>`;
      } else if (Math.abs(p - this._page) === 3) {
        pagHTML += '<button disabled>...</button>';
      }
    }
    pagHTML += `<button ${this._page >= totalPages ? 'disabled' : ''} onclick="PageEstudantes.goPage(${this._page + 1})"><i class="fas fa-chevron-right"></i></button>`;
    pag.innerHTML = pagHTML;
  },

      processo: document.getElementById('alunoProcesso').value.trim(),

      const existing = this._data.find(a => a.id === id);
      if (existing && existing.photo) data.photo = existing.photo;
    }

    showLoading(true);
    try {
      await DB.saveDoc('alunos', id || Utils.generateId(), data);
      Utils.toast(id ? 'Aluno atualizado!' : 'Aluno matriculado com sucesso!', 'success');
      this.closeModal();
      await this.loadData();
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);

  async changeEstado(id) {
    const aluno = this._data.find(a => a.id === id);
    if (!aluno) return;
    const estados = ['Activo', 'Transferido', 'Desistente', 'Inactivo'];
    const current = aluno.estado || 'Activo';
    let html = `<div style="padding:10px"><p><strong>Aluno:</strong> ${aluno.name}</p><p><strong>Estado actual:</strong> ${current}</p><br><select id="novoEstado" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:var(--radius)">`;
    estados.forEach(e => html += `<option value="${e}" ${e === current ? 'selected' : ''}>${e}</option>`);
    html += '</select></div>';

    const modal = document.createElement('div');
    modal.className = 'modal-overlay active';
    modal.innerHTML = `<div class="modal-content" style="max-width:400px">
      <div class="modal-header"><h3>Alterar Estado do Aluno</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button></div>
      <div class="modal-body">${html}</div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">Cancelar</button>
        <button class="btn btn-primary" id="confirmarEstado">Confirmar</button>
      </div></div>`;
    document.body.appendChild(modal);

    document.getElementById('confirmarEstado').onclick = async () => {
      const novoEstado = document.getElementById('novoEstado').value;
      showLoading(true);
      try {
        await DB.saveDoc('alunos', id, { estado: novoEstado });
        Utils.toast(`Estado alterado para: ${novoEstado}`, 'success');
        modal.remove();
        await this.loadData();
      } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
      showLoading(false);
    };
  },

    const ok = await Utils.confirm('Excluir este aluno? Esta acção não pode ser desfeita.');
    if (!ok) return;
    showLoading(true);
    try {
      await DB.deleteDocument('alunos', id);
      Utils.toast('Aluno excluído!', 'success');
      await this.loadData();
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  async exportFichaIndividualPDF(id) {

    if (!aluno) return;
    this._exportAlunoFichaPDF(aluno);
  },

  _exportAlunoFichaPDF(aluno) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    let y = PDFHelper.addHeader(doc, APP.currentSchool, { title: 'FICHA DO ALUNO' });
    const pw = doc.internal.pageSize.getWidth();

    // Foto
    if (aluno.photo) {
      try { doc.addImage(aluno.photo, 'JPEG', pw - 40, y, 25, 30); } catch (e) {}
    }

    doc.setFontSize(12); doc.setFont('helvetica', 'bold');
    doc.setTextColor(206, 17, 38);
    doc.text(aluno.name || '', 14, y + 5);
    doc.setTextColor(0, 0, 0);

    y += 12;
    doc.setFontSize(9); doc.setFont('helvetica', 'normal');
    const fields = [
      ['Data Nascimento', aluno.nascimento], ['Sexo', aluno.sexo === 'M' ? 'Masculino' : 'Feminino'],
      ['Naturalidade', aluno.naturalidade], ['Município', aluno.municipio],
      ['Província', aluno.provincia], ['BI', aluno.bi],
      ['Classe', aluno.classeName], ['Turma', aluno.turmaName + (aluno.curso ? ' (' + aluno.curso + ')' : '')],
      ['Matrícula', aluno.matricula], ['Processo', aluno.processo],
      ['Estado', aluno.estado], ['Ano Letivo', aluno.yearName],
      ['Pai', aluno.nomePai], ['Mãe', aluno.nomeMae],
      ['Encarregado', aluno.encarregado], ['Tel. Encarregado', aluno.telEncarregado],
    ];

    fields.forEach(([label, value]) => {
      if (y > 270) { doc.addPage(); y = 20; }
      doc.setFont('helvetica', 'bold');
      doc.text(label + ': ', 14, y);
      doc.setFont('helvetica', 'normal');
      doc.text(String(value || 'N/D'), 14 + doc.getTextWidth(label + ': '), y);
      y += 5;
    });

    doc.save(`ficha_${(aluno.name || 'aluno').replace(/\s+/g, '_')}.pdf`);
    Utils.toast('Ficha PDF gerada!', 'success');
  },

  // ====== REMATRÍCULA ======
  searchRematricula() {
    const term = (document.getElementById('rematriculaSearch')?.value || '').toLowerCase().trim();
    const resultsDiv = document.getElementById('rematriculaResults');
    if (!term || term.length < 2) {
      resultsDiv.style.display = 'none';
      return;
    }

    // Buscar em todos os alunos (incluindo anos anteriores)
    const matches = this._data.filter(a =>
      (a.name || '').toLowerCase().includes(term) ||
      (a.bi || '').toLowerCase().includes(term) ||
      (a.matricula || '').toLowerCase().includes(term) ||
      (a.processo || '').toLowerCase().includes(term)
    ).slice(0, 10);

    if (matches.length === 0) {
      resultsDiv.innerHTML = '<div style="padding:12px;color:var(--text-light)">Nenhum aluno encontrado</div>';
    } else {
      resultsDiv.innerHTML = matches.map(a => `
        <div style="padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px" 
             onmouseover="this.style.background='#f0f4ff'" onmouseout="this.style.background=''" 
             onclick="PageEstudantes.selectRematricula('${a.id}')">
          ${a.photo ? `<img src="${a.photo}" class="photo-small">` : '<i class="fas fa-user-circle" style="font-size:24px;color:var(--text-light)"></i>'}
          <div>
            <strong style="color:var(--angola-red)">${a.name}</strong>
            <br><small>${a.classeName || ''} - Turma ${a.turmaName || ''} | Mat: ${a.matricula || ''} | ${a.estado || ''}</small>
          </div>
        </div>
      `).join('');
    }
    resultsDiv.style.display = 'block';
  },

  async selectRematricula(id) {
    const aluno = this._data.find(a => a.id === id);
    if (!aluno) return;
    this._selectedAluno = aluno;

    document.getElementById('rematriculaResults').style.display = 'none';
    document.getElementById('rematriculaForm').style.display = 'block';

    // Verificar aprovação do ano anterior
    let notas = [];
    try { notas = await DB.getCollection('notas', [FB.where('alunoId', '==', id)]); } catch (e) {}

    const classeNum = Utils.getClasseNum(aluno.classeName || '');
    let resultado = 'pendente';
    let notasComMFD = notas.filter(n => {
      const calc = Utils.calcularMedia(n, aluno.classeName || '');
      n._mfd = calc.mfd;
      n._disciplina = n.disciplina || n.disciplinaName || '';
      return calc.mfd !== null;
    });

    if (notasComMFD.length > 0) {
      resultado = Utils.checkAprovacao(aluno, aluno.classeName, notasComMFD.map(n => ({ mfd: n._mfd, disciplina: n._disciplina })));
    }

    const sexo = aluno.sexo;
    const aprovTxt = Utils.genero(sexo, resultado === 'aprovado' ? 'aprovado' : resultado === 'reprovado' ? 'reprovado' : 'pendente');

    // Classe sugerida
    let novaClasseNum = classeNum;
    if (resultado === 'aprovado' && classeNum < 13) {
      novaClasseNum = classeNum + 1;
    }

    const infoDiv = document.getElementById('rematriculaAlunoInfo');
    infoDiv.innerHTML = `
      <div style="display:flex;gap:16px;align-items:center;background:#f8fafc;padding:16px;border-radius:var(--radius);margin-bottom:12px">
        ${aluno.photo ? `<img src="${aluno.photo}" class="photo-preview">` : '<i class="fas fa-user-circle" style="font-size:60px;color:var(--text-light)"></i>'}
        <div>
          <h3 style="color:var(--angola-red)">${aluno.name}</h3>
          <p><strong>Classe anterior:</strong> ${aluno.classeName || ''} | <strong>Turma:</strong> ${aluno.turmaName || ''}</p>
          <p><strong>Resultado:</strong> <span class="badge ${resultado === 'aprovado' ? 'badge-success' : resultado === 'reprovado' ? 'badge-danger' : 'badge-warning'}">${aprovTxt.charAt(0).toUpperCase() + aprovTxt.slice(1)}</span></p>
          ${resultado === 'aprovado' ? `<p style="color:var(--success)"><i class="fas fa-arrow-up"></i> Classe sugerida: <strong>${novaClasseNum}ª Classe</strong></p>` :
            resultado === 'reprovado' ? `<p style="color:var(--danger)"><i class="fas fa-redo"></i> Permanece na <strong>${aluno.classeName}</strong></p>` :
            '<p style="color:var(--warning)"><i class="fas fa-exclamation-triangle"></i> Resultado pendente - selecione a classe manualmente</p>'}
        </div>
      </div>`;

    // Pré-selecionar classe sugerida
    const suggestedClasse = this._classes.find(c => {
      const cn = Utils.getClasseNum(c.name);
      return cn === novaClasseNum;
    });
    if (suggestedClasse) {
      document.getElementById('rematriculaClasse').value = suggestedClasse.id;
      this.onRematriculaClasseChange();
    }

    // Nova matrícula
    const sc = APP.currentSchool;
    document.getElementById('rematriculaMatricula').value = Utils.generateMatricula(sc ? sc.code : '', new Date().getFullYear());
  },

  async confirmarRematricula() {
    const aluno = this._selectedAluno;
    if (!aluno) { Utils.toast('Selecione um aluno', 'warning'); return; }

    const classeId = document.getElementById('rematriculaClasse').value;
    const turmaId = document.getElementById('rematriculaTurma').value;
    if (!classeId || !turmaId) { Utils.toast('Selecione classe e turma', 'warning'); return; }

    const classe = this._classes.find(c => c.id === classeId);
    const turma = this._turmas.find(t => t.id === turmaId);

    const ok = await Utils.confirm(`Confirmar rematrícula de ${aluno.name} na ${classe ? classe.name : ''} - Turma ${turma ? turma.name : ''}?`);
    if (!ok) return;

    showLoading(true);
    try {
      const newId = Utils.generateId();
      const newData = {
        ...aluno,
        classeId: classeId,
        classeName: classe ? classe.name : '',
        classeCiclo: classe ? classe.ciclo : '',
        turmaId: turmaId,
        turmaName: turma ? turma.name : '',
        turnoName: turma ? turma.turnoName : '',
        curso: turma ? turma.curso : '',
        matricula: document.getElementById('rematriculaMatricula').value,
        yearId: APP.currentYearId || '',
        yearName: APP.currentYear ? APP.currentYear.name : '',
        estado: 'Activo',
        rematriculadoDe: aluno.id,
        rematriculaData: new Date().toISOString()
      };
      delete newData.id;
      delete newData.createdAt;
      delete newData.updatedAt;

      await DB.saveDoc('alunos', newId, newData);

      // Marcar o antigo como inactivo
      await DB.saveDoc('alunos', aluno.id, { estado: 'Rematriculado' });

      Utils.toast('Rematrícula realizada com sucesso!', 'success');
      document.getElementById('rematriculaForm').style.display = 'none';
      document.getElementById('rematriculaSearch').value = '';
      this._selectedAluno = null;
      await this.loadData();
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  // ====== EXPORT ======
  exportXLSX() {
    const data = this._filtered.map((a, i) => ({
      '#': i + 1, 'Nome': a.name, 'Sexo': a.sexo, 'Nascimento': a.nascimento,
      'Classe': a.classeName, 'Turma': a.turmaName, 'Curso': a.curso || '',
      'Matrícula': a.matricula, 'Processo': a.processo, 'BI': a.bi,
      'Estado': a.estado, 'Pai': a.nomePai, 'Mãe': a.nomeMae,
      'Encarregado': a.encarregado, 'Tel.Enc.': a.telEncarregado,
      'Província': a.provincia, 'Município': a.municipio
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Alunos');
    XLSX.writeFile(wb, 'alunos.xlsx');
    Utils.toast('Excel exportado!', 'success');
  },

  exportPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('landscape');
    let y = PDFHelper.addHeader(doc, APP.currentSchool, { title: 'LISTA DE ALUNOS' });
    doc.autoTable({
      startY: y + 5,
      head: [['#', 'Nome', 'Sexo', 'Classe', 'Turma', 'Matrícula', 'BI', 'Estado']],
      body: this._filtered.map((a, i) => [i + 1, a.name, a.sexo, a.classeName, a.turmaName + (a.curso ? ' (' + a.curso + ')' : ''), a.matricula, a.bi || '', a.estado]),
      styles: { fontSize: 7 }, headStyles: { fillColor: [15, 23, 42] },
      didParseCell: function(data) {
        if (data.column.index === 1 && data.section === 'body') {
          data.cell.styles.textColor = [206, 17, 38];
          data.cell.styles.fontStyle = 'bold';
        }
      }
    });
    doc.save('lista_alunos.pdf');
    Utils.toast('PDF exportado!', 'success');
  }
};

  filter() {
    const term = (document.getElementById('searchFunc')?.value || '').toLowerCase();

  async save() {
    const id = document.getElementById('funcId').value;
    const uid = document.getElementById('funcUid').value;
    const isNew = !id;
    const email = document.getElementById('funcEmail').value.trim();
    const password = document.getElementById('funcPassword')?.value;

    if (isNew && (!password || password.length < 6)) {

    if (isNew && password !== document.getElementById('funcPassword2').value) {

      return;

    // Comprimir foto
    let photo = null;
    const fileInput = document.getElementById('funcFoto');

      try { photo = await Utils.compressImage(fileInput.files[0], 400, 0.7); } catch (e) {}

    const role = document.getElementById('funcCargo').value;
    const data = {
      name: document.getElementById('funcNome').value.trim(),
      nascimento: document.getElementById('funcNascimento').value,
      sexo: document.getElementById('funcSexo').value,
      bi: document.getElementById('funcBi').value.trim(),

      nif: document.getElementById('funcNif').value.trim(),
      inss: document.getElementById('funcInss').value.trim(),

      provincia: document.getElementById('funcProvincia').value,
      endereco: document.getElementById('funcEndereco').value.trim(),
      estadoCivil: document.getElementById('funcEstadoCivil').value,
      role: role,
      agente: document.getElementById('funcAgente').value.trim(),
      categoria: document.getElementById('funcCategoria').value.trim(),
      escalao: document.getElementById('funcEscalao').value.trim(),
      formacao: document.getElementById('funcFormacao').value,
      cursoFormacao: document.getElementById('funcCursoFormacao').value.trim(),
      dataAdmissao: document.getElementById('funcDataAdmissao').value,
      anosServico: parseInt(document.getElementById('funcAnosServico').value) || 0,
      disciplinas: document.getElementById('funcDisciplinas').value.trim(),
      especialidade: document.getElementById('funcEspecialidade').value.trim(),
      email: email,
      phone: document.getElementById('funcTelefone').value.trim(),
      telefone: document.getElementById('funcTelefone').value.trim(),
      active: document.getElementById('funcStatus').value === 'true',
      schoolId: APP.currentSchool.id
    };

    if (photo) data.photo = photo;
    else if (!isNew) {
      const existing = this._data.find(f => (f.uid || f.id) === (uid || id));
      if (existing && existing.photo) data.photo = existing.photo;
    }

    showLoading(true);
    try {
      if (isNew) {
        // Criar conta Firebase Auth
        const cred = await FB.createUserWithEmailAndPassword(FB.auth, email, password);
        data.uid = cred.user.uid;
        await FB.setDoc(FB.doc(FB.db, 'users', cred.user.uid), {
          ...data,
          createdAt: FB.serverTimestamp()
        });
        // Re-login como usuário atual (pois createUser muda o auth)
        // Nota: Em produção, usar Cloud Functions para evitar isso
        Utils.toast('Funcionário cadastrado! Credenciais: ' + email, 'success');
      } else {
        await DB.saveDoc('users', uid || id, data);
        Utils.toast('Funcionário atualizado!', 'success');
      }
      this.closeModal();
      await this.loadData();
    } catch (e) {
      Utils.toast('Erro: ' + e.message, 'error');
    }
    showLoading(false);
  },

  async toggleActive(id) {
    const f = this._data.find(x => (x.uid || x.id) === id);
    if (!f) return;
    const newStatus = f.active === false ? true : false;
    const ok = await Utils.confirm(`${newStatus ? 'Activar' : 'Desactivar'} o funcionário ${f.name}?`);
    if (!ok) return;
    showLoading(true);
    try {
      await DB.saveDoc('users', f.uid || f.id, { active: newStatus });
      Utils.toast(`Funcionário ${newStatus ? 'activado' : 'desactivado'}!`, 'success');
      await this.loadData();
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  exportFichaPDF(id) {
    const f = this._data.find(x => (x.uid || x.id) === id);
    if (!f) return;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    let y = PDFHelper.addHeader(doc, APP.currentSchool, { title: 'FICHA DO FUNCIONÁRIO' });
    const pw = doc.internal.pageSize.getWidth();

    if (f.photo) {
      try { doc.addImage(f.photo, 'JPEG', pw - 40, y, 25, 30); } catch (e) {}
    }

    doc.setFontSize(12); doc.setFont('helvetica', 'bold');
    doc.text(f.name || '', 14, y + 5); y += 14;

    doc.setFontSize(9); doc.setFont('helvetica', 'normal');
    const fields = [
      ['Cargo', getRoleName(f.role)], ['Sexo', f.sexo === 'M' ? 'Masculino' : 'Feminino'],
      ['Data Nascimento', f.nascimento], ['BI', f.bi], ['NIF', f.nif], ['INSS', f.inss],
      ['Naturalidade', f.naturalidade], ['Província', f.provincia],
      ['N° Agente', f.agente], ['Categoria', f.categoria], ['Escalão', f.escalao],
      ['Formação', f.formacao], ['Curso', f.cursoFormacao],
      ['Data Admissão', f.dataAdmissao], ['Anos Serviço', f.anosServico],
      ['Email', f.email], ['Telefone', f.phone || f.telefone],
      ['Estado Civil', f.estadoCivil], ['Endereço', f.endereco]
    ];
    fields.forEach(([label, value]) => {
      if (y > 270) { doc.addPage(); y = 20; }
      doc.setFont('helvetica', 'bold');
      doc.text(label + ': ', 14, y);
      doc.setFont('helvetica', 'normal');
      doc.text(String(value || 'N/D'), 14 + doc.getTextWidth(label + ': '), y);
      y += 5;
    });
    doc.save(`ficha_${(f.name || 'func').replace(/\s+/g, '_')}.pdf`);
    Utils.toast('Ficha PDF gerada!', 'success');
  },

  exportXLSX() {
    const data = this._filtered.map((f, i) => ({
      '#': i + 1, 'Nome': f.name, 'Sexo': f.sexo, 'Cargo': getRoleName(f.role),
      'Email': f.email, 'Telefone': f.phone || f.telefone, 'BI': f.bi, 'NIF': f.nif,
      'INSS': f.inss, 'Agente': f.agente, 'Formação': f.formacao,
      'Data Admissão': f.dataAdmissao, 'Anos Serviço': f.anosServico, 'Status': f.active !== false ? 'Activo' : 'Inactivo'
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Funcionários');
    XLSX.writeFile(wb, 'funcionarios.xlsx');
  },

  exportPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('landscape');
    let y = PDFHelper.addHeader(doc, APP.currentSchool, { title: 'LISTA DE FUNCIONÁRIOS' });
    doc.autoTable({
      startY: y + 5,
      head: [['#', 'Nome', 'Sexo', 'Cargo', 'Email', 'Telefone', 'BI', 'Formação', 'Status']],
      body: this._filtered.map((f, i) => [i + 1, f.name, f.sexo, getRoleName(f.role), f.email, f.phone || '', f.bi || '', f.formacao || '', f.active !== false ? 'Activo' : 'Inactivo']),
      styles: { fontSize: 7 }, headStyles: { fillColor: [15, 23, 42] }
    });
    doc.save('funcionarios.pdf');
  }
};

window.PagePerfil = {
  render(container) {
    const user = APP.currentUser;
    container.innerHTML = `
      <h2 class="page-title"><i class="fas fa-user-cog"></i> Meu Perfil</h2>
      <div class="grid-2">
        <div class="card">
          <div class="card-header"><h4>Informações Pessoais</h4></div>
          <div class="card-body" style="text-align:center">
            ${user.photo ? `<img src="${user.photo}" style="width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid var(--primary)">` :
              '<div style="width:120px;height:120px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;margin:0 auto"><i class="fas fa-user" style="font-size:40px;color:var(--text-light)"></i></div>'}
            <h3 class="mt-3">${user.name || ''}</h3>
            <p style="color:var(--text-light)">${getRoleName(user.role)}</p>
            <p class="mt-2"><i class="fas fa-envelope"></i> ${user.email || ''}</p>
            <p><i class="fas fa-phone"></i> ${user.phone || user.telefone || 'N/D'}</p>
            <p><i class="fas fa-id-card"></i> BI: ${user.bi || 'N/D'}</p>
          </div>
        </div>
        <div class="card">
          <div class="card-header"><h4>Alterar Senha</h4></div>
          <div class="card-body">
            <div class="form-group"><label>Nova Senha</label>
              <input type="password" id="newPassword" minlength="6" placeholder="Nova senha (mín. 6 caracteres)"></div>
            <div class="form-group"><label>Confirmar Nova Senha</label>
              <input type="password" id="confirmNewPassword" minlength="6" placeholder="Confirme a nova senha"></div>
            <button class="btn btn-primary" onclick="PagePerfil.changePassword()"><i class="fas fa-key"></i> Alterar Senha</button>
            <hr>
            <h4 class="mt-3">Actualizar Foto</h4>
            <div class="form-group"><label>Nova Fotografia</label>
              <input type="file" id="perfilFoto" accept="image/*"></div>
            <button class="btn btn-info" onclick="PagePerfil.updatePhoto()"><i class="fas fa-camera"></i> Actualizar Foto</button>
          </div>
        </div>
      </div>`;
  },

  async changePassword() {
    const pw = document.getElementById('newPassword').value;
    const pw2 = document.getElementById('confirmNewPassword').value;
    if (!pw || pw.length < 6) { Utils.toast('Senha deve ter pelo menos 6 caracteres', 'warning'); return; }
    if (pw !== pw2) { Utils.toast('Senhas não coincidem', 'error'); return; }
    showLoading(true);
    try {
      await FB.updatePassword(FB.auth.currentUser, pw);
      Utils.toast('Senha alterada com sucesso!', 'success');
      document.getElementById('newPassword').value = '';
      document.getElementById('confirmNewPassword').value = '';
    } catch (e) { Utils.toast('Erro: ' + e.message + '. Tente fazer logout e login novamente.', 'error'); }
    showLoading(false);
  },

  async updatePhoto() {
    const file = document.getElementById('perfilFoto').files[0];
    if (!file) { Utils.toast('Selecione uma foto', 'warning'); return; }
    showLoading(true);
    try {
      const photo = await Utils.compressImage(file, 400, 0.7);
      await DB.saveDoc('users', APP.currentUser.uid, { photo });
      APP.currentUser.photo = photo;
      // Atualizar avatar no sidebar
      const avatarEl = document.querySelector('.sidebar-footer .user-avatar');
      if (avatarEl) avatarEl.innerHTML = `<img src="${photo}">`;
      Utils.toast('Foto atualizada!', 'success');
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  }
};

<script type="module">
// ============================================================
// MÓDULO: NOTAS
// ============================================================
window.PageNotas = {
  async render(container) {
    const schoolId = APP.currentSchool ? APP.currentSchool.id : null;
    if (!schoolId) {
      container.innerHTML = '<div class="empty-state"><i class="fas fa-school"></i><p>Selecione uma escola primeiro</p></div>';
      return;
    }

    const role = APP.currentUser.role;
    const isProfessor = role === 'professor';

    container.innerHTML = `
      <h2 class="page-title"><i class="fas fa-star"></i> Lançamento de Notas</h2>
      <div class="card mb-3 no-print">
        <div class="card-body">
          <div class="filter-grid" style="padding:0;box-shadow:none">
            <div class="form-group">
              <label>Classe</label>
              <select id="notaClasse" onchange="PageNotas.onClasseChange()"><option value="">Selecione</option></select>
            </div>
            <div class="form-group">
              <label>Turma</label>
              <select id="notaTurma" onchange="PageNotas.onTurmaChange()"><option value="">Selecione</option></select>
            </div>
            <div class="form-group">
              <label>Disciplina</label>
              <select id="notaDisciplina"><option value="">Selecione</option></select>
            </div>
            <div class="form-group">
              <label>Trimestre</label>
              <select id="notaTrimestre">
                <option value="1">I Trimestre</option>
                <option value="2">II Trimestre</option>
                <option value="3">III Trimestre</option>
              </select>
            </div>
            <div class="form-group" style="padding-top:20px">
              <button class="btn btn-primary" onclick="PageNotas.carregarNotas()"><i class="fas fa-search"></i> Carregar</button>
            </div>
          </div>
        </div>
      </div>
      <div id="notasInfo" style="display:none" class="mb-3">
        <div class="flex-between mb-2">
          <div>
            <span id="notasClasseInfo" class="badge badge-primary" style="font-size:13px"></span>
            <span id="notasTurmaInfo" class="badge badge-info" style="font-size:13px;margin-left:4px"></span>
            <span id="notasDiscInfo" class="badge badge-secondary" style="font-size:13px;margin-left:4px"></span>
            <span id="notasTrimInfo" class="badge badge-warning" style="font-size:13px;margin-left:4px"></span>
            <span id="notasMaxInfo" class="badge badge-danger" style="font-size:13px;margin-left:4px"></span>
          </div>
          <div class="no-print" style="display:flex;gap:6px">
            <button class="btn btn-success btn-sm" onclick="PageNotas.salvarTodas()"><i class="fas fa-save"></i> Salvar Todas</button>
            <button class="btn btn-outline btn-sm" onclick="PageNotas.exportXLSX()"><i class="fas fa-file-excel"></i></button>
            <button class="btn btn-outline btn-sm" onclick="PageNotas.exportPDF()"><i class="fas fa-file-pdf"></i></button>
          </div>
        </div>
        <div id="notasLockWarning" style="display:none;background:#fee2e2;color:#991b1b;padding:10px;border-radius:var(--radius);margin-bottom:10px">
          <i class="fas fa-lock"></i> <strong>Trimestre/Ano Letivo fechado</strong> - As notas não podem ser editadas.
        </div>
      </div>
      <div class="table-container scroll-x">
        <table id="notasTable">
          <thead id="notasTableHead"></thead>
          <tbody id="notasTableBody"><tr><td colspan="12" class="text-center" style="padding:40px;color:var(--text-light)">Selecione os filtros acima e clique em "Carregar"</td></tr></tbody>
        </table>
      </div>`;

    await this.loadFilters();
  },

  _classes: [],
  _turmas: [],
  _disciplinas: [],
  _alunos: [],
  _notas: {},
  _atribuicoes: [],
  _isLocked: false,
  _currentClasse: null,
  _currentTurma: null,
  _currentDisc: null,
  _currentTrim: '1',

  async loadFilters() {
    const schoolId = APP.currentSchool.id;
    const role = APP.currentUser.role;
    const isProfessor = role === 'professor';

    this._classes = await DB.getCollection('classes', [FB.where('schoolId', '==', schoolId)]);
    this._classes.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));

    let tQ = [FB.where('schoolId', '==', schoolId)];
    if (APP.currentYearId) tQ.push(FB.where('yearId', '==', APP.currentYearId));
    this._turmas = await DB.getCollection('turmas', tQ);

    this._disciplinas = await DB.getCollection('disciplinas', [FB.where('schoolId', '==', schoolId)]);
    this._disciplinas.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));

    // Se professor, carregar atribuições
    if (isProfessor) {
      let atribQ = [FB.where('schoolId', '==', schoolId), FB.where('professorId', '==', APP.currentUser.uid)];
      if (APP.currentYearId) atribQ.push(FB.where('yearId', '==', APP.currentYearId));
      this._atribuicoes = await DB.getCollection('atribuicoes', atribQ);
    }

    // Preencher classes
    const selC = document.getElementById('notaClasse');
    if (isProfessor) {
      const classeIds = [...new Set(this._atribuicoes.map(a => a.classeId))];
      this._classes.filter(c => classeIds.includes(c.id)).forEach(c => {
        selC.innerHTML += `<option value="${c.id}">${c.name}</option>`;
      });
    } else {
      this._classes.forEach(c => {
        selC.innerHTML += `<option value="${c.id}">${c.name}</option>`;
      });
    }
  },

  onClasseChange() {
    const classeId = document.getElementById('notaClasse').value;
    const selT = document.getElementById('notaTurma');
    const selD = document.getElementById('notaDisciplina');
    selT.innerHTML = '<option value="">Selecione</option>';
    selD.innerHTML = '<option value="">Selecione</option>';

    const isProfessor = APP.currentUser.role === 'professor';

    if (isProfessor) {
      const turmaIds = [...new Set(this._atribuicoes.filter(a => a.classeId === classeId).map(a => a.turmaId))];
      this._turmas.filter(t => turmaIds.includes(t.id)).forEach(t => {
        selT.innerHTML += `<option value="${t.id}">${t.name} ${t.curso ? '(' + t.curso + ')' : ''}</option>`;
      });
    } else {
      this._turmas.filter(t => t.classeId === classeId).forEach(t => {
        selT.innerHTML += `<option value="${t.id}">${t.name} ${t.curso ? '(' + t.curso + ')' : ''}</option>`;
      });
    }
  },

  onTurmaChange() {
    const classeId = document.getElementById('notaClasse').value;
    const turmaId = document.getElementById('notaTurma').value;
    const selD = document.getElementById('notaDisciplina');
    selD.innerHTML = '<option value="">Selecione</option>';

    const turma = this._turmas.find(t => t.id === turmaId);
    const isProfessor = APP.currentUser.role === 'professor';

    if (isProfessor) {
      const discIds = [...new Set(this._atribuicoes.filter(a => a.classeId === classeId && a.turmaId === turmaId).map(a => a.disciplinaId))];
      this._disciplinas.filter(d => discIds.includes(d.id)).forEach(d => {
        selD.innerHTML += `<option value="${d.id}">${d.name}</option>`;
      });
    } else {
      let discs = this._disciplinas.filter(d => d.classeId === classeId);
      if (turma && turma.curso) {
        discs = discs.filter(d => !d.curso || d.curso === turma.curso || d.curso === '');
      }
      discs.forEach(d => {
        selD.innerHTML += `<option value="${d.id}">${d.name} ${d.categoria === 'especifica' ? '(Esp.)' : d.categoria === 'opcional' ? '(Opc.)' : ''}</option>`;
      });
    }
  },

  async carregarNotas() {
    const classeId = document.getElementById('notaClasse').value;
    const turmaId = document.getElementById('notaTurma').value;
    const discId = document.getElementById('notaDisciplina').value;
    const trimestre = document.getElementById('notaTrimestre').value;

    if (!classeId || !turmaId || !discId) {
      Utils.toast('Selecione classe, turma e disciplina', 'warning');
      return;
    }

    this._currentClasse = this._classes.find(c => c.id === classeId);
    this._currentTurma = this._turmas.find(t => t.id === turmaId);
    this._currentDisc = this._disciplinas.find(d => d.id === discId);
    this._currentTrim = trimestre;

    // Verificar se trimestre/ano está fechado
    this._isLocked = false;
    if (APP.currentYear) {
      if (APP.currentYear.status === 'Fechado') this._isLocked = true;
      if (APP.currentYear.trimestres) {
        const trim = APP.currentYear.trimestres[trimestre];
        if (trim && trim.status === 'Fechado') this._isLocked = true;
      }
    }

    showLoading(true);
    try {
      // Carregar alunos da turma
      let alunoQ = [
        FB.where('schoolId', '==', APP.currentSchool.id),
        FB.where('turmaId', '==', turmaId),
        FB.where('estado', '==', 'Activo')
      ];
      if (APP.currentYearId) alunoQ.push(FB.where('yearId', '==', APP.currentYearId));

      this._alunos = await DB.getCollection('alunos', alunoQ);
      this._alunos.sort((a, b) => (a.name || '').localeCompare(b.name || ''));

      // Carregar notas existentes
      this._notas = {};
      const notasExist = await DB.getCollection('notas', [
        FB.where('schoolId', '==', APP.currentSchool.id),
        FB.where('turmaId', '==', turmaId),
        FB.where('disciplinaId', '==', discId)
      ]);

      notasExist.forEach(n => {
        this._notas[n.alunoId] = n;
      });

      this.renderNotasTable();

      // Mostrar info
      document.getElementById('notasInfo').style.display = 'block';
      document.getElementById('notasClasseInfo').textContent = this._currentClasse ? this._currentClasse.name : '';
      document.getElementById('notasTurmaInfo').textContent = 'Turma: ' + (this._currentTurma ? this._currentTurma.name : '');
      document.getElementById('notasDiscInfo').textContent = this._currentDisc ? this._currentDisc.name : '';
      const trimNomes = { '1': 'I Trimestre', '2': 'II Trimestre', '3': 'III Trimestre' };
      document.getElementById('notasTrimInfo').textContent = trimNomes[trimestre];
      const maxNota = Utils.getMaxNota(this._currentClasse ? this._currentClasse.name : '');
      document.getElementById('notasMaxInfo').textContent = 'Nota: 0 a ' + maxNota;
      document.getElementById('notasLockWarning').style.display = this._isLocked ? 'block' : 'none';

    } catch (e) {
      console.error(e);
      Utils.toast('Erro ao carregar notas: ' + e.message, 'error');
    }
    showLoading(false);
  },

  renderNotasTable() {
    const thead = document.getElementById('notasTableHead');
    const tbody = document.getElementById('notasTableBody');
    const trim = this._currentTrim;
    const isFinal = Utils.isClasseFinal(this._currentClasse ? this._currentClasse.name : '');
    const maxNota = Utils.getMaxNota(this._currentClasse ? this._currentClasse.name : '');
    const notaPos = Utils.getNotaPositiva(this._currentClasse ? this._currentClasse.name : '');
    const disabled = this._isLocked ? 'disabled' : '';

    let headerCols = '<th>#</th><th>Nome do Aluno</th>';
    if (trim === '1') {
      headerCols += '<th class="text-center">MAC₁</th><th class="text-center">NPT₁</th><th class="text-center">MT₁</th>';
    } else if (trim === '2') {
      headerCols += '<th class="text-center">MAC₂</th><th class="text-center">NPT₂</th><th class="text-center">MT₂</th>';
    } else {
      if (isFinal) {
        headerCols += '<th class="text-center">CT₁</th><th class="text-center">CT₂</th><th class="text-center">MAC₃</th><th class="text-center">CT₃</th><th class="text-center">Exame</th><th class="text-center">MFD</th>';
      } else {
        headerCols += '<th class="text-center">MAC₃</th><th class="text-center">NPT₃</th><th class="text-center">MT₃</th><th class="text-center">MFD</th>';
      }
    }
    headerCols += '<th class="text-center">Obs.</th>';
    thead.innerHTML = `<tr>${headerCols}</tr>`;

    if (this._alunos.length === 0) {
      tbody.innerHTML = '<tr><td colspan="12" class="text-center">Nenhum aluno encontrado nesta turma</td></tr>';
      return;
    }

    tbody.innerHTML = this._alunos.map((aluno, i) => {
      const n = this._notas[aluno.id] || {};
      const calc = Utils.calcularMedia(n, this._currentClasse ? this._currentClasse.name : '');

      let cells = `<td>${i + 1}</td><td><strong class="nome-aluno">${aluno.name}</strong></td>`;

      const inputStyle = 'width:55px;padding:4px;text-align:center;border:1px solid var(--border);border-radius:4px;font-size:13px';

      if (trim === '1') {
        cells += `<td class="text-center"><input type="number" style="${inputStyle}" min="0" max="${maxNota}" step="0.1" value="${n.mac1 ?? ''}" data-field="mac1" data-aluno="${aluno.id}" ${disabled}></td>`;
        cells += `<td class="text-center"><input type="number" style="${inputStyle}" min="0" max="${maxNota}" step="0.1" value="${n.npt1 ?? ''}" data-field="npt1" data-aluno="${aluno.id}" ${disabled}></td>`;
        const mt1Class = calc.mt1 !== null ? (calc.mt1 >= notaPos ? 'nota-positiva' : 'nota-negativa') : '';
        cells += `<td class="text-center ${mt1Class}"><strong>${calc.mt1 !== null ? calc.mt1 : ''}</strong></td>`;
      } else if (trim === '2') {
        cells += `<td class="text-center"><input type="number" style="${inputStyle}" min="0" max="${maxNota}" step="0.1" value="${n.mac2 ?? ''}" data-field="mac2" data-aluno="${aluno.id}" ${disabled}></td>`;
        cells += `<td class="text-center"><input type="number" style="${inputStyle}" min="0" max="${maxNota}" step="0.1" value="${n.npt2 ?? ''}" data-field="npt2" data-aluno="${aluno.id}" ${disabled}></td>`;
        const mt2Class = calc.mt2 !== null ? (calc.mt2 >= notaPos ? 'nota-positiva' : 'nota-negativa') : '';
        cells += `<td class="text-center ${mt2Class}"><strong>${calc.mt2 !== null ? calc.mt2 : ''}</strong></td>`;
      } else {
        if (isFinal) {
          const ct1Class = calc.ct1 !== null ? (calc.ct1 >= notaPos ? 'nota-positiva' : 'nota-negativa') : '';
          const ct2Class = calc.ct2 !== null ? (calc.ct2 >= notaPos ? 'nota-positiva' : 'nota-negativa') : '';
          cells += `<td class="text-center ${ct1Class}">${calc.ct1 !== null ? calc.ct1 : '-'}</td>`;
          cells += `<td class="text-center ${ct2Class}">${calc.ct2 !== null ? calc.ct2 : '-'}</td>`;
          cells += `<td class="text-center"><input type="number" style="${inputStyle}" min="0" max="${maxNota}" step="0.1" value="${n.mac3 ?? ''}" data-field="mac3" data-aluno="${aluno.id}" ${disabled}></td>`;
          const ct3Class = calc.ct3 !== null ? (calc.ct3 >= notaPos ? 'nota-positiva' : 'nota-negativa') : '';
          cells += `<td class="text-center ${ct3Class}"><strong>${calc.ct3 !== null ? calc.ct3 : ''}</strong></td>`;
          cells += `<td class="text-center"><input type="number" style="${inputStyle}" min="0" max="${maxNota}" step="0.1" value="${n.exame ?? ''}" data-field="exame" data-aluno="${aluno.id}" ${disabled}></td>`;
          const mfdClass = calc.mfd !== null ? (calc.mfd >= notaPos ? 'nota-positiva' : 'nota-negativa') : '';
          cells += `<td class="text-center ${mfdClass}"><strong>${calc.mfd !== null ? calc.mfd : ''}</strong></td>`;
        } else {
          cells += `<td class="text-center"><input type="number" style="${inputStyle}" min="0" max="${maxNota}" step="0.1" value="${n.mac3 ?? ''}" data-field="mac3" data-aluno="${aluno.id}" ${disabled}></td>`;
          cells += `<td class="text-center"><input type="number" style="${inputStyle}" min="0" max="${maxNota}" step="0.1" value="${n.npt3 ?? ''}" data-field="npt3" data-aluno="${aluno.id}" ${disabled}></td>`;
          let mt3 = (n.mac3 !== null && n.mac3 !== undefined && n.npt3 !== null && n.npt3 !== undefined) ? Math.round(((parseFloat(n.mac3) + parseFloat(n.npt3)) / 2) * 10) / 10 : null;
          const mt3Class = mt3 !== null ? (mt3 >= notaPos ? 'nota-positiva' : 'nota-negativa') : '';
          cells += `<td class="text-center ${mt3Class}"><strong>${mt3 !== null ? mt3 : ''}</strong></td>`;
          const mfdClass = calc.mfd !== null ? (calc.mfd >= notaPos ? 'nota-positiva' : 'nota-negativa') : '';
          cells += `<td class="text-center ${mfdClass}"><strong>${calc.mfd !== null ? calc.mfd : ''}</strong></td>`;
        }
      }

      // Observação
      let obs = '';
      if (aluno.estado === 'Transferido') obs = Utils.genero(aluno.sexo, 'transferido');
      else if (aluno.estado === 'Desistente') obs = 'Desistente';
      else if (calc.mfd !== null) obs = calc.mfd >= notaPos ? Utils.genero(aluno.sexo, 'aprovado') : Utils.genero(aluno.sexo, 'reprovado');
      const obsClass = obs.includes('aprov') ? 'nota-positiva' : obs.includes('reprov') ? 'nota-negativa' : obs.includes('ransf') || obs.includes('esist') ? 'text-red' : '';
      cells += `<td class="text-center ${obsClass}"><small>${obs.charAt(0).toUpperCase() + obs.slice(1)}</small></td>`;

      return `<tr>${cells}</tr>`;
    }).join('');
  },

  async salvarTodas() {
    if (this._isLocked) {
      Utils.toast('Trimestre/Ano Letivo fechado - não é possível editar', 'error');
      return;
    }

    const inputs = document.querySelectorAll('#notasTableBody input[data-field]');
    const updates = {};

    inputs.forEach(input => {
      const alunoId = input.dataset.aluno;
      const field = input.dataset.field;
      const val = input.value !== '' ? parseFloat(input.value) : null;

      if (!updates[alunoId]) updates[alunoId] = {};
      updates[alunoId][field] = val;
    });

    showLoading(true);
    let saved = 0;
    try {
      for (const alunoId in updates) {
        const existing = this._notas[alunoId];
        const aluno = this._alunos.find(a => a.id === alunoId);
        const id = existing ? existing.id : Utils.generateId();

        const data = {
          ...(existing || {}),
          ...updates[alunoId],
          alunoId: alunoId,
          alunoName: aluno ? aluno.name : '',
          alunoSexo: aluno ? aluno.sexo : '',
          disciplinaId: this._currentDisc.id,
          disciplina: this._currentDisc.name,
          disciplinaName: this._currentDisc.name,
          classeId: this._currentClasse.id,
          classeName: this._currentClasse.name,
          turmaId: this._currentTurma.id,
          turmaName: this._currentTurma.name,
          curso: this._currentTurma.curso || '',
          schoolId: APP.currentSchool.id,
          yearId: APP.currentYearId || '',
          lastTrimestre: this._currentTrim,
          lastEditBy: APP.currentUser.name,
          lastEditAt: new Date().toISOString()
        };

        // Recalcular médias
        const calc = Utils.calcularMedia(data, this._currentClasse.name);
        data.mt1 = calc.mt1;
        data.mt2 = calc.mt2;
        data.ct1 = calc.ct1;
        data.ct2 = calc.ct2;
        data.ct3 = calc.ct3;
        data.mfd = calc.mfd;

        await DB.saveDoc('notas', id, data);
        this._notas[alunoId] = { id, ...data };
        saved++;
      }

      Utils.toast(`${saved} registos de notas salvos com sucesso!`, 'success');
      this.renderNotasTable();
    } catch (e) {
      Utils.toast('Erro ao salvar notas: ' + e.message, 'error');
    }
    showLoading(false);
  },

  exportXLSX() {
    if (this._alunos.length === 0) { Utils.toast('Nenhum dado para exportar', 'warning'); return; }
    const trim = this._currentTrim;
    const isFinal = Utils.isClasseFinal(this._currentClasse ? this._currentClasse.name : '');
    const notaPos = Utils.getNotaPositiva(this._currentClasse ? this._currentClasse.name : '');

    const data = this._alunos.map((a, i) => {
      const n = this._notas[a.id] || {};
      const calc = Utils.calcularMedia(n, this._currentClasse.name);
      let row = { '#': i + 1, 'Nome': a.name };
      if (trim === '1') { row['MAC₁'] = n.mac1 ?? ''; row['NPT₁'] = n.npt1 ?? ''; row['MT₁'] = calc.mt1 ?? ''; }
      else if (trim === '2') { row['MAC₂'] = n.mac2 ?? ''; row['NPT₂'] = n.npt2 ?? ''; row['MT₂'] = calc.mt2 ?? ''; }
      else {
        if (isFinal) { row['CT₁'] = calc.ct1 ?? ''; row['CT₂'] = calc.ct2 ?? ''; row['MAC₃'] = n.mac3 ?? ''; row['CT₃'] = calc.ct3 ?? ''; row['Exame'] = n.exame ?? ''; row['MFD'] = calc.mfd ?? ''; }
        else { row['MAC₃'] = n.mac3 ?? ''; row['NPT₃'] = n.npt3 ?? ''; row['MFD'] = calc.mfd ?? ''; }
      }
      let obs = calc.mfd !== null ? (calc.mfd >= notaPos ? 'Aprovado' : 'Reprovado') : '';
      if (a.estado === 'Transferido') obs = 'Transferido';
      if (a.estado === 'Desistente') obs = 'Desistente';
      row['Obs.'] = obs;
      return row;
    });

    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Notas');
    XLSX.writeFile(wb, `notas_${(this._currentDisc?.name || 'disc').replace(/\s/g, '_')}.xlsx`);
    Utils.toast('Excel exportado!', 'success');
  },

  exportPDF() {
    if (this._alunos.length === 0) { Utils.toast('Nenhum dado para exportar', 'warning'); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('landscape');
    const trim = this._currentTrim;
    const trimNomes = { '1': 'I Trimestre', '2': 'II Trimestre', '3': 'III Trimestre' };
    const isFinal = Utils.isClasseFinal(this._currentClasse ? this._currentClasse.name : '');
    const notaPos = Utils.getNotaPositiva(this._currentClasse ? this._currentClasse.name : '');

    let y = PDFHelper.addHeader(doc, APP.currentSchool, { title: 'PAUTA DE NOTAS' });
    doc.setFontSize(10);
    doc.text(`Classe: ${this._currentClasse?.name || ''} | Turma: ${this._currentTurma?.name || ''} | Disciplina: ${this._currentDisc?.name || ''} | ${trimNomes[trim]}`, 14, y + 3);
    y += 8;

    let head, body;
    if (trim === '1') {
      head = [['#', 'Nome do Aluno', 'MAC₁', 'NPT₁', 'MT₁', 'Obs.']];
      body = this._alunos.map((a, i) => {
        const n = this._notas[a.id] || {};
        const calc = Utils.calcularMedia(n, this._currentClasse.name);
        let obs = calc.mt1 !== null ? (calc.mt1 >= notaPos ? 'Aprovado' : 'Reprovado') : '';
        return [i + 1, a.name, n.mac1 ?? '', n.npt1 ?? '', calc.mt1 ?? '', obs];
      });
    } else if (trim === '2') {
      head = [['#', 'Nome do Aluno', 'MAC₂', 'NPT₂', 'MT₂', 'Obs.']];
      body = this._alunos.map((a, i) => {
        const n = this._notas[a.id] || {};
        const calc = Utils.calcularMedia(n, this._currentClasse.name);
        let obs = calc.mt2 !== null ? (calc.mt2 >= notaPos ? 'Aprovado' : 'Reprovado') : '';
        return [i + 1, a.name, n.mac2 ?? '', n.npt2 ?? '', calc.mt2 ?? '', obs];
      });
    } else {
      if (isFinal) {
        head = [['#', 'Nome do Aluno', 'CT₁', 'CT₂', 'MAC₃', 'CT₃', 'Exame', 'MFD', 'Obs.']];
        body = this._alunos.map((a, i) => {
          const n = this._notas[a.id] || {};
          const calc = Utils.calcularMedia(n, this._currentClasse.name);
          let obs = calc.mfd !== null ? (calc.mfd >= notaPos ? Utils.genero(a.sexo, 'aprovado') : Utils.genero(a.sexo, 'reprovado')) : '';
          return [i + 1, a.name, calc.ct1 ?? '', calc.ct2 ?? '', n.mac3 ?? '', calc.ct3 ?? '', n.exame ?? '', calc.mfd ?? '', obs];
        });
      } else {
        head = [['#', 'Nome do Aluno', 'MAC₃', 'NPT₃', 'MT₃', 'MFD', 'Obs.']];
        body = this._alunos.map((a, i) => {
          const n = this._notas[a.id] || {};
          const calc = Utils.calcularMedia(n, this._currentClasse.name);
          let obs = calc.mfd !== null ? (calc.mfd >= notaPos ? Utils.genero(a.sexo, 'aprovado') : Utils.genero(a.sexo, 'reprovado')) : '';
          return [i + 1, a.name, n.mac3 ?? '', n.npt3 ?? '', '', calc.mfd ?? '', obs];
        });
      }
    }

    doc.autoTable({
      startY: y,
      head: head,
      body: body,
      styles: { fontSize: 8, halign: 'center' },
      headStyles: { fillColor: [15, 23, 42] },
      columnStyles: { 1: { halign: 'left' } },
      didParseCell: function (data) {
        if (data.column.index === 1 && data.section === 'body') {
          data.cell.styles.textColor = [206, 17, 38];
          data.cell.styles.fontStyle = 'bold';
        }
      }
    });

    doc.save(`notas_${(this._currentDisc?.name || '').replace(/\s/g, '_')}.pdf`);
    Utils.toast('PDF exportado!', 'success');
  }
};

// ============================================================
// MÓDULO: PAUTAS
// ============================================================
window.PagePautas = {
  async render(container) {
    const schoolId = APP.currentSchool ? APP.currentSchool.id : null;
    if (!schoolId) {
      container.innerHTML = '<div class="empty-state"><i class="fas fa-school"></i><p>Selecione uma escola primeiro</p></div>';
      return;
    }

    container.innerHTML = `
      <h2 class="page-title"><i class="fas fa-file-alt"></i> Pautas</h2>
      <div class="card mb-3 no-print">
        <div class="card-body">
          <div class="filter-grid" style="padding:0;box-shadow:none">
            <div class="form-group">
              <label>Classe</label>
              <select id="pautaClasse" onchange="PagePautas.onClasseChange()"><option value="">Selecione</option></select>
            </div>
            <div class="form-group">
              <label>Turma</label>
              <select id="pautaTurma"><option value="">Selecione</option></select>
            </div>
            <div class="form-group">
              <label>Tipo de Pauta</label>
              <select id="pautaTipo">
                <option value="trimestral">Trimestral</option>
                <option value="anual">Anual (Geral)</option>
              </select>
            </div>
            <div class="form-group" id="pautaTrimGroup">
              <label>Trimestre</label>
              <select id="pautaTrimestre">
                <option value="1">I Trimestre</option>
                <option value="2">II Trimestre</option>
                <option value="3">III Trimestre</option>
              </select>
            </div>
            <div class="form-group" style="padding-top:20px">
              <button class="btn btn-primary" onclick="PagePautas.gerarPauta()"><i class="fas fa-cogs"></i> Gerar Pauta</button>
            </div>
          </div>
        </div>
      </div>
      <div id="pautaContent"></div>`;

    // Eventos
    document.getElementById('pautaTipo').onchange = () => {
      document.getElementById('pautaTrimGroup').style.display = document.getElementById('pautaTipo').value === 'trimestral' ? 'block' : 'none';
    };

    await this.loadFilters();
  },

  _classes: [],
  _turmas: [],
  _disciplinas: [],

  async loadFilters() {
    const schoolId = APP.currentSchool.id;
    this._classes = await DB.getCollection('classes', [FB.where('schoolId', '==', schoolId)]);
    this._classes.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));

    let tQ = [FB.where('schoolId', '==', schoolId)];
    if (APP.currentYearId) tQ.push(FB.where('yearId', '==', APP.currentYearId));
    this._turmas = await DB.getCollection('turmas', tQ);

    this._disciplinas = await DB.getCollection('disciplinas', [FB.where('schoolId', '==', schoolId)]);
    this._disciplinas.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));

    const selC = document.getElementById('pautaClasse');
    this._classes.forEach(c => { selC.innerHTML += `<option value="${c.id}">${c.name}</option>`; });
  },

  onClasseChange() {
    const classeId = document.getElementById('pautaClasse').value;
    const selT = document.getElementById('pautaTurma');
    selT.innerHTML = '<option value="">Selecione</option>';
    this._turmas.filter(t => t.classeId === classeId).forEach(t => {
      selT.innerHTML += `<option value="${t.id}">${t.name} ${t.curso ? '(' + t.curso + ')' : ''}</option>`;
    });
  },

  async gerarPauta() {
    const classeId = document.getElementById('pautaClasse').value;
    const turmaId = document.getElementById('pautaTurma').value;
    const tipo = document.getElementById('pautaTipo').value;
    const trimestre = document.getElementById('pautaTrimestre').value;

    if (!classeId || !turmaId) { Utils.toast('Selecione classe e turma', 'warning'); return; }

    const classe = this._classes.find(c => c.id === classeId);
    const turma = this._turmas.find(t => t.id === turmaId);

    showLoading(true);
    try {
      // Carregar alunos APENAS desta turma e com estado Activo
      let alunoQ = [
        FB.where('schoolId', '==', APP.currentSchool.id),
        FB.where('turmaId', '==', turmaId)
      ];
      if (APP.currentYearId) alunoQ.push(FB.where('yearId', '==', APP.currentYearId));

      let alunos = await DB.getCollection('alunos', alunoQ);
      alunos.sort((a, b) => (a.name || '').localeCompare(b.name || ''));

      // Carregar disciplinas da classe (e curso se II ciclo)
      let discs = this._disciplinas.filter(d => d.classeId === classeId);
      if (turma && turma.curso) {
        discs = discs.filter(d => !d.curso || d.curso === turma.curso || d.curso === '');
      }

      // Carregar todas as notas desta turma
      let notasQ = [
        FB.where('schoolId', '==', APP.currentSchool.id),
        FB.where('turmaId', '==', turmaId)
      ];
      if (APP.currentYearId) notasQ.push(FB.where('yearId', '==', APP.currentYearId));
      const todasNotas = await DB.getCollection('notas', notasQ);

      // Organizar notas por aluno e disciplina
      const notasMap = {};
      todasNotas.forEach(n => {
        const key = `${n.alunoId}_${n.disciplinaId}`;
        notasMap[key] = n;
      });

      const notaPos = Utils.getNotaPositiva(classe ? classe.name : '');
      const maxNota = Utils.getMaxNota(classe ? classe.name : '');
      const isFinal = Utils.isClasseFinal(classe ? classe.name : '');
      const trimNomes = { '1': 'I Trimestre', '2': 'II Trimestre', '3': 'III Trimestre' };

      // Buscar funcionários da escola
      const users = await DB.getCollection('users', [FB.where('schoolId', '==', APP.currentSchool.id)]);
      const diretor = users.find(u => u.role === 'diretor');
      const pedagogico = users.find(u => u.role === 'subdiretor_pedagogico');
      const secretario = users.find(u => u.role === 'secretario');

      // Renderizar pauta
      let html = `<div class="card">
        <div class="card-header">
          <h4><i class="fas fa-file-alt"></i> Pauta ${tipo === 'anual' ? 'Anual' : trimNomes[trimestre]} - ${classe ? classe.name : ''} - Turma ${turma ? turma.name : ''} ${turma && turma.curso ? '(' + turma.curso + ')' : ''}</h4>
          <div style="display:flex;gap:6px" class="no-print">
            <button class="btn btn-sm btn-primary" onclick="PagePautas.exportPDF()"><i class="fas fa-file-pdf"></i> PDF</button>
            <button class="btn btn-sm btn-success" onclick="PagePautas.exportXLSX()"><i class="fas fa-file-excel"></i> XLSX</button>
          </div>
        </div>
        <div class="card-body scroll-x">`;

      if (tipo === 'anual') {
        // PAUTA ANUAL - Todas disciplinas e MFD
        html += '<table class="table-sm"><thead><tr><th>#</th><th>Nome do Aluno</th>';
        discs.forEach(d => { html += `<th class="text-center" style="font-size:10px;min-width:50px" title="${d.name}">${d.name.substring(0, 8)}</th>`; });
        html += '<th class="text-center">Média</th><th class="text-center">Obs.</th></tr></thead><tbody>';

        alunos.forEach((a, i) => {
          let somaMedia = 0, countMedia = 0, todasNotasAluno = [];
          html += `<tr><td>${i + 1}</td><td><strong class="nome-aluno">${a.name}</strong></td>`;

          discs.forEach(d => {
            const nota = notasMap[`${a.id}_${d.id}`];
            if (nota) {
              const calc = Utils.calcularMedia(nota, classe.name);
              const mfd = calc.mfd;
              if (mfd !== null) {
                const cls = mfd >= notaPos ? 'nota-positiva' : 'nota-negativa';
                html += `<td class="text-center ${cls}">${mfd}</td>`;
                somaMedia += mfd; countMedia++;
                todasNotasAluno.push({ mfd, disciplina: d.name });
              } else {
                html += '<td class="text-center">-</td>';
              }
            } else {
              html += '<td class="text-center">-</td>';
            }
          });

          const media = countMedia > 0 ? Math.round((somaMedia / countMedia) * 10) / 10 : null;
          const mediaClass = media !== null ? (media >= notaPos ? 'nota-positiva' : 'nota-negativa') : '';
          html += `<td class="text-center ${mediaClass}"><strong>${media !== null ? media : '-'}</strong></td>`;

          // Observação baseada em aprovação
          let obs = '';
          if (a.estado === 'Transferido') obs = Utils.genero(a.sexo, 'transferido');
          else if (a.estado === 'Desistente') obs = 'Desistente';
          else if (todasNotasAluno.length > 0 && todasNotasAluno.length === discs.length) {
            const resultado = Utils.checkAprovacao(a, classe.name, todasNotasAluno);
            obs = Utils.genero(a.sexo, resultado);
          }
          const obsClass = obs.includes('aprov') ? 'nota-positiva' : obs.includes('reprov') ? 'nota-negativa' : '';
          html += `<td class="text-center ${obsClass}"><small>${obs.charAt(0).toUpperCase() + obs.slice(1)}</small></td></tr>`;
        });
        html += '</tbody></table>';

      } else {
        // PAUTA TRIMESTRAL
        html += '<table class="table-sm"><thead><tr><th>#</th><th>Nome do Aluno</th>';
        discs.forEach(d => {
          if (trimestre === '1') html += `<th class="text-center" colspan="3" style="font-size:10px">${d.name.substring(0, 12)}</th>`;
          else if (trimestre === '2') html += `<th class="text-center" colspan="3" style="font-size:10px">${d.name.substring(0, 12)}</th>`;
          else if (isFinal) html += `<th class="text-center" colspan="3" style="font-size:10px">${d.name.substring(0, 12)}</th>`;
          else html += `<th class="text-center" colspan="2" style="font-size:10px">${d.name.substring(0, 12)}</th>`;
        });
        html += '</tr><tr><th></th><th></th>';
        discs.forEach(() => {
          if (trimestre === '1') html += '<th class="text-center" style="font-size:9px">MAC</th><th class="text-center" style="font-size:9px">NPT</th><th class="text-center" style="font-size:9px">MT</th>';
          else if (trimestre === '2') html += '<th class="text-center" style="font-size:9px">MAC</th><th class="text-center" style="font-size:9px">NPT</th><th class="text-center" style="font-size:9px">MT</th>';
          else if (isFinal) html += '<th class="text-center" style="font-size:9px">MAC</th><th class="text-center" style="font-size:9px">Ex.</th><th class="text-center" style="font-size:9px">MFD</th>';
          else html += '<th class="text-center" style="font-size:9px">MAC</th><th class="text-center" style="font-size:9px">MT</th>';
        });
        html += '</tr></thead><tbody>';

        alunos.forEach((a, i) => {
          html += `<tr><td>${i + 1}</td><td><strong class="nome-aluno">${a.name}</strong></td>`;
          discs.forEach(d => {
            const nota = notasMap[`${a.id}_${d.id}`];
            const calc = nota ? Utils.calcularMedia(nota, classe.name) : {};

            if (trimestre === '1') {
              html += `<td class="text-center">${nota?.mac1 ?? ''}</td><td class="text-center">${nota?.npt1 ?? ''}</td>`;
              const mt1Class = calc.mt1 !== null && calc.mt1 !== undefined ? (calc.mt1 >= notaPos ? 'nota-positiva' : 'nota-negativa') : '';
              html += `<td class="text-center ${mt1Class}"><strong>${calc.mt1 ?? ''}</strong></td>`;
            } else if (trimestre === '2') {
              html += `<td class="text-center">${nota?.mac2 ?? ''}</td><td class="text-center">${nota?.npt2 ?? ''}</td>`;
              const mt2Class = calc.mt2 !== null && calc.mt2 !== undefined ? (calc.mt2 >= notaPos ? 'nota-positiva' : 'nota-negativa') : '';
              html += `<td class="text-center ${mt2Class}"><strong>${calc.mt2 ?? ''}</strong></td>`;
            } else if (isFinal) {
              html += `<td class="text-center">${nota?.mac3 ?? ''}</td><td class="text-center">${nota?.exame ?? ''}</td>`;
              const mfdClass = calc.mfd !== null && calc.mfd !== undefined ? (calc.mfd >= notaPos ? 'nota-positiva' : 'nota-negativa') : '';
              html += `<td class="text-center ${mfdClass}"><strong>${calc.mfd ?? ''}</strong></td>`;
            } else {
              html += `<td class="text-center">${nota?.mac3 ?? ''}</td>`;
              const mfdClass = calc.mfd !== null && calc.mfd !== undefined ? (calc.mfd >= notaPos ? 'nota-positiva' : 'nota-negativa') : '';
              html += `<td class="text-center ${mfdClass}"><strong>${calc.mfd ?? ''}</strong></td>`;
            }
          });
          html += '</tr>';
        });
        html += '</tbody></table>';
      }

      // Assinaturas
      html += `<div style="margin-top:40px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:30px">
        <div style="text-align:center;min-width:180px">
          <div style="border-top:1px solid #000;width:200px;margin:0 auto;padding-top:4px">

  exportPDF() {
    if (!this._currentData) return;
    const d = this._currentData;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('landscape');
    const trimNomes = { '1': 'I Trimestre', '2': 'II Trimestre', '3': 'III Trimestre' };

    let y = PDFHelper.addHeader(doc, APP.currentSchool, { title: `PAUTA ${d.tipo === 'anual' ? 'ANUAL' : trimNomes[d.trimestre]}` });
    doc.setFontSize(9);
    doc.text(`Classe: ${d.classe?.name} | Turma: ${d.turma?.name} ${d.turma?.curso ? '(' + d.turma.curso + ')' : ''} | Ano: ${APP.currentYear?.name || ''}`, 14, y + 3);
    y += 7;

    if (d.tipo === 'anual') {
      const head = [['#', 'Nome', ...d.discs.map(dc => dc.name.substring(0, 8)), 'Média', 'Obs.']];
      const body = d.alunos.map((a, i) => {
        let row = [i + 1, a.name];
        let sm = 0, cm = 0, allNotas = [];
        d.discs.forEach(dc => {
          const n = d.notasMap[`${a.id}_${dc.id}`];
          if (n) { const c = Utils.calcularMedia(n, d.classe.name); if (c.mfd !== null) { row.push(c.mfd); sm += c.mfd; cm++; allNotas.push({ mfd: c.mfd, disciplina: dc.name }); } else row.push('-'); }
          else row.push('-');
        });
        const media = cm > 0 ? Math.round((sm / cm) * 10) / 10 : '-';
        row.push(media);
        let obs = a.estado === 'Transferido' ? 'Transf.' : a.estado === 'Desistente' ? 'Desist.' : '';
        if (!obs && allNotas.length === d.discs.length) obs = Utils.genero(a.sexo, Utils.checkAprovacao(a, d.classe.name, allNotas));
        row.push(obs);
        return row;
      });

      doc.autoTable({
        startY: y, head, body,
        styles: { fontSize: 6, halign: 'center', cellPadding: 2 },
        headStyles: { fillColor: [15, 23, 42], fontSize: 6 },
        columnStyles: { 1: { halign: 'left' } },
        didParseCell: (data) => { if (data.column.index === 1 && data.section === 'body') { data.cell.styles.textColor = [206, 17, 38]; data.cell.styles.fontStyle = 'bold'; } }
      });
    } else {
      const head = [['#', 'Nome', ...d.discs.flatMap(dc => [dc.name.substring(0, 6) + ' MAC', 'MT'])]];
      const body = d.alunos.map((a, i) => {
        let row = [i + 1, a.name];
        d.discs.forEach(dc => {
          const n = d.notasMap[`${a.id}_${dc.id}`];
          const c = n ? Utils.calcularMedia(n, d.classe.name) : {};
          if (d.trimestre === '1') { row.push(n?.mac1 ?? '', c.mt1 ?? ''); }
          else if (d.trimestre === '2') { row.push(n?.mac2 ?? '', c.mt2 ?? ''); }
          else { row.push(n?.mac3 ?? '', c.mfd ?? ''); }
        });
        return row;
      });
      doc.autoTable({
        startY: y, head, body,
        styles: { fontSize: 6, halign: 'center', cellPadding: 1.5 },
        headStyles: { fillColor: [15, 23, 42], fontSize: 5 },
        columnStyles: { 1: { halign: 'left' } },
        didParseCell: (data) => { if (data.column.index === 1 && data.section === 'body') { data.cell.styles.textColor = [206, 17, 38]; data.cell.styles.fontStyle = 'bold'; } }
      });
    }

    // Assinaturas
    const finalY = doc.lastAutoTable.finalY + 15;
    const pw = doc.internal.pageSize.getWidth();
    doc.setFontSize(8);
    const assinaturas = [
      { cargo: d.diretor ? (d.diretor.sexo === 'F' ? 'A Directora' : 'O Director') : 'O Director', nome: d.diretor?.name || '' },
      { cargo: d.pedagogico ? (d.pedagogico.sexo === 'F' ? 'A Subdir. Pedagógica' : 'O Subdir. Pedagógico') : 'O Subdir. Pedagógico', nome: d.pedagogico?.name || '' },
      { cargo: d.secretario ? (d.secretario.sexo === 'F' ? 'A Secretária' : 'O Secretário') : 'O Secretário', nome: d.secretario?.name || '' }
    ];
    const spacing = pw / (assinaturas.length + 1);
    assinaturas.forEach((a, i) => {
      const x = spacing * (i + 1);
      doc.line(x - 30, finalY, x + 30, finalY);
      doc.text(a.cargo, x, finalY + 4, { align: 'center' });
      doc.text(a.nome, x, finalY + 8, { align: 'center' });
    });

    doc.save(`pauta_${d.classe?.name}_${d.turma?.name}.pdf`);
    Utils.toast('Pauta PDF gerada!', 'success');
  },

  exportXLSX() {
    if (!this._currentData) return;
    const d = this._currentData;
    const data = d.alunos.map((a, i) => {
      let row = { '#': i + 1, 'Nome': a.name };
      d.discs.forEach(dc => {
        const n = d.notasMap[`${a.id}_${dc.id}`];
        const c = n ? Utils.calcularMedia(n, d.classe.name) : {};
        if (d.tipo === 'anual') { row[dc.name] = c.mfd ?? ''; }
        else if (d.trimestre === '1') { row[dc.name + ' MAC'] = n?.mac1 ?? ''; row[dc.name + ' NPT'] = n?.npt1 ?? ''; row[dc.name + ' MT'] = c.mt1 ?? ''; }
        else if (d.trimestre === '2') { row[dc.name + ' MAC'] = n?.mac2 ?? ''; row[dc.name + ' NPT'] = n?.npt2 ?? ''; row[dc.name + ' MT'] = c.mt2 ?? ''; }
        else { row[dc.name + ' MAC3'] = n?.mac3 ?? ''; row[dc.name + ' MFD'] = c.mfd ?? ''; }
      });
      return row;
    });
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Pauta');
    XLSX.writeFile(wb, `pauta_${d.classe?.name}_${d.turma?.name}.xlsx`);
    Utils.toast('Excel exportado!', 'success');
  },

  _currentData: null
};

        };

        const id = p.id || Utils.generateId();
        await DB.saveDoc('presencas', id, docData);
        this._presencasProf[pid] = { id, ...docData };
        saved++;
      }
      Utils.toast(`${saved} registos salvos!`, 'success');
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  // ====== EXPORTS ======
  exportPresencasPDF() {
    if (!this._alunos.length) return;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const data = document.getElementById('presData').value;
    let y = PDFHelper.addHeader(doc, APP.currentSchool, { title: 'FOLHA DE PRESENÇAS' });
    doc.setFontSize(9);
    doc.text(`Data: ${data}`, 14, y + 3); y += 8;

    const statusMap = { 'P': 'Presente', 'F': 'Falta', 'J': 'Justificada', 'A': 'Atraso' };
    doc.autoTable({
      startY: y,
      head: [['#', 'Nome do Aluno', 'Presença', 'Observação']],
      body: this._alunos.map((a, i) => {
        const p = this._presencas[a.id] || {};
        return [i + 1, a.name, statusMap[p.status] || '', p.observacao || ''];
      }),
      styles: { fontSize: 9 },
      headStyles: { fillColor: [15, 23, 42] },
      didParseCell: (data) => {
        if (data.column.index === 1 && data.section === 'body') { data.cell.styles.textColor = [206, 17, 38]; data.cell.styles.fontStyle = 'bold'; }
        if (data.column.index === 2 && data.section === 'body') {
          const val = data.cell.raw;
          if (val === 'Presente') data.cell.styles.textColor = [5, 150, 105];
          if (val === 'Falta') data.cell.styles.textColor = [220, 38, 38];
        }
      }
    });
    doc.save(`presencas_${data}.pdf`);
    Utils.toast('PDF exportado!', 'success');
  },

  exportPresencasXLSX() {
    if (!this._alunos.length) return;
    const statusMap = { 'P': 'Presente', 'F': 'Falta', 'J': 'Justificada', 'A': 'Atraso' };
    const data = this._alunos.map((a, i) => {
      const p = this._presencas[a.id] || {};
      return { '#': i + 1, 'Nome': a.name, 'Presença': statusMap[p.status] || '', 'Observação': p.observacao || '' };
    });
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Presenças');
    XLSX.writeFile(wb, `presencas_${document.getElementById('presData').value}.xlsx`);
    Utils.toast('Excel exportado!', 'success');
  }
};
