valorExtenso(n){
if(n===null||n===undefined||isNaN(n))return'';
n=Math.round(n*10)/10;
const u=['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','catorze','quinze','dezasseis','dezassete','dezoito','dezanove','vinte'];
if(n>=0&&n<=20&&Number.isInteger(n))return u[n]+' valores';
if(n>0&&n<1)return'zero vírgula '+u[Math.round(n*10)]+' valores';
const intP=Math.floor(n);
const decP=Math.round((n-intP)*10);
let r=u[intP]||intP.toString();
if(decP>0)r+=' vírgula '+u[decP];
return r+' valores';
},
genero(sexo,palavra){

const s=sexo.toLowerCase()==='f'||sexo.toLowerCase()==='feminino'?1:0;
return(map[palavra.toLowerCase()]||[palavra,palavra])[s];
},
async compressImage(file,maxWidth=400,quality=0.7){
return new Promise((resolve,reject)=>{
const reader=new FileReader();
reader.onload=e=>{
const img=new Image();
img.onload=()=>{
const canvas=document.createElement('canvas');
let w=img.width,h=img.height;
if(w>maxWidth){h=h*(maxWidth/w);w=maxWidth}
canvas.width=w;canvas.height=h;
const ctx=canvas.getContext('2d');
ctx.drawImage(img,0,0,w,h);
resolve(canvas.toDataURL('image/jpeg',quality));
};
img.onerror=reject;
img.src=e.target.result;
};
reader.onerror=reject;
reader.readAsDataURL(file);
});
},
async compressImageHQ(file,maxWidth=600,quality=0.85){
return new Promise((resolve,reject)=>{
const reader=new FileReader();
reader.onload=e=>{
const img=new Image();
img.onload=()=>{
const canvas=document.createElement('canvas');
let w=img.width,h=img.height;

canvas.width=w;canvas.height=h;
const ctx=canvas.getContext('2d');
ctx.drawImage(img,0,0,w,h);
resolve(canvas.toDataURL('image/jpeg',quality));
};
img.onerror=reject;
img.src=e.target.result;
};
reader.onerror=reject;
reader.readAsDataURL(file);
});
},
isPrimario(classe){
const c=String(classe).toLowerCase();
return['iniciação','iniciacao','1','2','3','4','5','6','1ª','2ª','3ª','4ª','5ª','6ª'].some(x=>c.includes(x));
},
getMaxNota(classe){
return Utils.isPrimario(classe)?10:20;
},
getNotaPositiva(classe){
return Utils.isPrimario(classe)?5:10;
},
isClasseFinal(classe){
const c=String(classe).replace(/[ªº°]/g,'').trim();
return['6','9','12','13'].includes(c);
},
getCiclo(classe){
const c=String(classe).toLowerCase().replace(/[ªº°]/g,'').trim();
if(['iniciação','iniciacao','init','1','2','3','4','5','6'].includes(c))return'primario';
if(['7','8','9'].includes(c))return'ciclo1';
if(['10','11','12','13'].includes(c))return'ciclo2';
return'primario';
},
getClasseNum(classe){
const c=String(classe).toLowerCase().replace(/[ªº°\s]|classe/g,'').trim();
if(c.includes('ini'))return 0;
return parseInt(c)||0;
},
calcularMedia(notas,classe){
const max=Utils.getMaxNota(classe);
const pos=Utils.getNotaPositiva(classe);
const isFinal=Utils.isClasseFinal(classe);
let mac1=notas.mac1,npt1=notas.npt1,mt1,mac2=notas.mac2,npt2=notas.npt2,mt2,mac3=notas.mac3,ct3,mfd,exame=notas.exame;
mt1=(mac1!==null&&mac1!==undefined&&npt1!==null&&npt1!==undefined)?Math.round(((mac1+npt1)/2)*10)/10:null;
mt2=(mac2!==null&&mac2!==undefined&&npt2!==null&&npt2!==undefined)?Math.round(((mac2+npt2)/2)*10)/10:null;
let ct1=mt1,ct2=mt2;
if(isFinal&&mac3!==null&&mac3!==undefined&&ct1!==null&&ct2!==null){
ct3=Math.round(((ct1+ct2+mac3)/3)*10)/10;
if(exame!==null&&exame!==undefined){
mfd=Math.round(((ct3*0.6)+(exame*0.4))*10)/10;
}
}else if(!isFinal&&ct1!==null&&ct2!==null&&mac3!==null&&mac3!==undefined){
let npt3=notas.npt3;
let mt3=(mac3!==null&&npt3!==null&&npt3!==undefined)?Math.round(((mac3+npt3)/2)*10)/10:null;
ct3=(ct1!==null&&ct2!==null&&mt3!==null)?Math.round(((ct1+ct2+mt3)/3)*10)/10:null;
mfd=ct3;
}
return{mt1,mt2,ct3,mfd,ct1,ct2};
},

const negativas=todasNotas.filter(n=>n.mfd<pos);
if(ciclo==='ciclo2'){
return negativas.length===0?'aprovado':'reprovado';
}
if(cn===9){

if(ciclo==='primario'||cn===7||cn===8){

const temMATneg=negativas.some(n=>(n.disciplina||'').toLowerCase().includes('matem'));
if(!temLPneg&&!temMATneg){
const allAbove=negativas.every(n=>{
const limiar=Utils.isPrimario(classe)?4:8;
return n.mfd>=limiar;
});
return allAbove?'aprovado':'reprovado';
}
return'reprovado';
}
return'reprovado';
}
return negativas.length===0?'aprovado':'reprovado';
},
getCurrentDate(){
const d=new Date();
const meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

window.DB={
async checkSuperAdmin(){
try{
const q=FB.query(FB.collection(FB.db,'users'),FB.where('role','==','superadmin'));
const snap=await FB.getDocs(q);
return!snap.empty;
}catch(e){console.error(e);return false}
},
async createSuperAdmin(data){
try{
const exists=await DB.checkSuperAdmin();
if(exists)throw new Error('Já existe um administrador geral');
const cred=await FB.createUserWithEmailAndPassword(FB.auth,data.email,data.password);
await FB.setDoc(FB.doc(FB.db,'users',cred.user.uid),{
uid:cred.user.uid,role:'superadmin',name:data.name,email:data.email,phone:data.phone||'',
bi:data.bi||'',photo:data.photo||'',createdAt:FB.serverTimestamp(),active:true
});
return cred.user;
}catch(e){throw e}
},
async login(email,password){
try{
const cred=await FB.signInWithEmailAndPassword(FB.auth,email,password);
const userDoc=await FB.getDoc(FB.doc(FB.db,'users',cred.user.uid));
if(!userDoc.exists())throw new Error('Usuário não encontrado no sistema');
const userData=userDoc.data();
if(!userData.active)throw new Error('Conta desativada');
APP.currentUser={uid:cred.user.uid,...userData};
if(userData.schoolId){
const schoolDoc=await FB.getDoc(FB.doc(FB.db,'schools',userData.schoolId));
if(schoolDoc.exists())APP.currentSchool={id:userData.schoolId,...schoolDoc.data()};
}
await FB.updateDoc(FB.doc(FB.db,'users',cred.user.uid),{lastLogin:FB.serverTimestamp()});
return APP.currentUser;
}catch(e){throw e}
},
async logout(){
try{
if(APP.currentUser){
await FB.updateDoc(FB.doc(FB.db,'users',APP.currentUser.uid),{lastLogout:FB.serverTimestamp()}).catch(()=>{});
}
await FB.signOut(FB.auth);
APP.currentUser=null;APP.currentSchool=null;APP.currentYearId=null;APP.currentYear=null;
APP.listeners.forEach(u=>{try{u()}catch(e){}});
APP.listeners=[];
APP.cache={};
}catch(e){throw e}
},
async resetPassword(email){
try{await FB.sendPasswordResetEmail(FB.auth,email)}catch(e){throw e}
},
async getCollection(path,constraints=[]){
try{
let q=FB.collection(FB.db,path);
if(constraints.length>0)q=FB.query(q,...constraints);
const snap=await FB.getDocs(q);
return snap.docs.map(d=>({id:d.id,...d.data()}));
}catch(e){console.error('getCollection error:',e);return[]}
},
async getDoc(path,id){
try{
const d=await FB.getDoc(FB.doc(FB.db,path,id));
return d.exists()?{id:d.id,...d.data()}:null;
}catch(e){console.error(e);return null}
},
async saveDoc(path,id,data){
try{
data.updatedAt=FB.serverTimestamp();
if(id){
await FB.setDoc(FB.doc(FB.db,path,id),data,{merge:true});
return id;
}else{
data.createdAt=FB.serverTimestamp();
const ref=await FB.addDoc(FB.collection(FB.db,path),data);
return ref.id;
}
}catch(e){throw e}
},
async deleteDocument(path,id){
try{await FB.deleteDoc(FB.doc(FB.db,path,id))}catch(e){throw e}
},
listenCollection(path,constraints,callback){
try{
let q=FB.collection(FB.db,path);
if(constraints&&constraints.length>0)q=FB.query(q,...constraints);
const unsub=FB.onSnapshot(q,snap=>{
const data=snap.docs.map(d=>({id:d.id,...d.data()}));
callback(data);
},err=>{console.error('Listen error:',err);callback([])});
APP.listeners.push(unsub);
return unsub;
}catch(e){console.error(e);callback([]);return()=>{}}
},
async getActiveYear(schoolId){
if(!schoolId)return null;
try{
const years=await DB.getCollection('academicYears',[FB.where('schoolId','==',schoolId),FB.where('status','==','Aberto')]);
if(years.length>0){
APP.currentYearId=years[0].id;
APP.currentYear=years[0];
return years[0];
}
return null;
}catch(e){console.error(e);return null}
},
async getSchoolConfig(schoolId){
if(!schoolId)return null;
try{
return await DB.getDoc('schools',schoolId);
}catch(e){return null}
},
async getInsignia(){
try{
const cfg=await DB.getDoc('systemConfig','general');
if(cfg&&cfg.insignia)return cfg.insignia;
return null;
}catch(e){return null}
}
};

// ============ INIT CHECK ============
async function initSystem(){
showLoading(true);
try{
const hasSA=await DB.checkSuperAdmin();
if(!hasSA){
showSetupScreen();
}else{
FB.onAuthStateChanged(FB.auth,async user=>{
if(user){
const userDoc=await FB.getDoc(FB.doc(FB.db,'users',user.uid));
if(userDoc.exists()){
APP.currentUser={uid:user.uid,...userDoc.data()};
if(APP.currentUser.schoolId){
const schoolDoc=await FB.getDoc(FB.doc(FB.db,'schools',APP.currentUser.schoolId));
if(schoolDoc.exists())APP.currentSchool={id:APP.currentUser.schoolId,...schoolDoc.data()};
await DB.getActiveYear(APP.currentUser.schoolId);
}
const ins=await DB.getInsignia();
if(ins)APP.insigniaBase64=ins;
showMainApp();
}else{
showLoginScreen();
}
}else{
showLoginScreen();
}
});
}
}catch(e){
console.error('Init error:',e);
showLoginScreen();
}
showLoading(false);
}

<div class="form-group"><label>Pesquisar por BI, Nº Processo ou Matrícula</label>
<input type="text" id="consultaSearch" placeholder="Digite BI, nº processo ou matrícula">
</div>
<div class="form-group" style="padding-top:24px"><button class="btn btn-primary" id="consultaSearchBtn"><i class="fas fa-search"></i> Pesquisar</button></div>
</div>
<div id="consultaResult"></div>
</div>
</div>
</div>
</div>`;

document.getElementById('loginForm').onsubmit=async e=>{
e.preventDefault();showLoading(true);
try{
await DB.login(document.getElementById('loginEmail').value,document.getElementById('loginPassword').value);
const ins=await DB.getInsignia();if(ins)APP.insigniaBase64=ins;
showMainApp();
Utils.toast('Bem-vindo ao SGE-NG!','success');
}catch(e){Utils.toast('Erro: '+e.message,'error')}
showLoading(false);
};

document.getElementById('forgotPassLink').onclick=e=>{
e.preventDefault();
document.getElementById('loginForm').style.display='none';
document.getElementById('forgotPassForm').style.display='block';
};
document.getElementById('backToLogin').onclick=e=>{
e.preventDefault();
document.getElementById('loginForm').style.display='block';
document.getElementById('forgotPassForm').style.display='none';
};
document.getElementById('resetPassBtn').onclick=async()=>{
const email=document.getElementById('resetEmail').value;
if(!email){Utils.toast('Digite o email','warning');return}
showLoading(true);
try{
await DB.resetPassword(email);
Utils.toast('Email de recuperação enviado! Verifique sua caixa de entrada.','success');
document.getElementById('loginForm').style.display='block';
document.getElementById('forgotPassForm').style.display='none';
}catch(e){Utils.toast('Erro: '+e.message,'error')}
showLoading(false);
};

document.getElementById('consultaBtn').onclick=()=>{
document.getElementById('consultaModal').style.display='flex';
};
document.getElementById('consultaSearchBtn').onclick=async()=>{
const term=document.getElementById('consultaSearch').value.trim();
if(!term){Utils.toast('Digite um termo de pesquisa','warning');return}
showLoading(true);
try{
let results=[];
const allStudents=await DB.getCollection('alunos');
results=allStudents.filter(a=>{
return(a.bi&&a.bi.toLowerCase().includes(term.toLowerCase()))||
(a.processo&&a.processo.toLowerCase().includes(term.toLowerCase()))||
(a.matricula&&a.matricula.toLowerCase().includes(term.toLowerCase()))||
(a.name&&a.name.toLowerCase().includes(term.toLowerCase()));
});
const activeResults=results.filter(a=>a.estado==='Activo'||a.estado==='Ativo');
const resultDiv=document.getElementById('consultaResult');
if(activeResults.length===0){
resultDiv.innerHTML='<div class="empty-state"><i class="fas fa-search"></i><p>Nenhum aluno encontrado ou o ano letivo está fechado.</p></div>';
}else{
let html='';
for(const aluno of activeResults){
const school=aluno.schoolId?await DB.getDoc('schools',aluno.schoolId):null;
const notas=await DB.getCollection('notas',[FB.where('alunoId','==',aluno.id)]);
const faltas=await DB.getCollection('presencas',[FB.where('alunoId','==',aluno.id),FB.where('status','==','F')]);
const pagamentos=await DB.getCollection('pagamentos',[FB.where('alunoId','==',aluno.id)]);
html+=`<div class="card mb-3">
<div class="card-header"><h4 style="color:red">${aluno.name}</h4><span class="badge badge-${aluno.estado==='Activo'||aluno.estado==='Ativo'?'success':'danger'}">${aluno.estado||'N/D'}</span></div>
<div class="card-body">
<p><strong>Escola:</strong> ${school?school.name:'N/D'}</p>
<p><strong>Classe:</strong> ${aluno.classe||'N/D'} | <strong>Turma:</strong> ${aluno.turma||'N/D'}</p>
<p><strong>Matrícula:</strong> ${aluno.matricula||'N/D'} | <strong>Processo:</strong> ${aluno.processo||'N/D'}</p>
<div class="stats-row">
<div class="stat-item"><span class="stat-value">${notas.length}</span><span class="stat-label">Notas</span></div>
<div class="stat-item"><span class="stat-value">${faltas.length}</span><span class="stat-label">Faltas</span></div>
<div class="stat-item"><span class="stat-value">${pagamentos.filter(p=>p.status==='pendente').length}</span><span class="stat-label">Pend. Pgto</span></div>
</div>`;
if(notas.length>0){
html+='<h5>Notas:</h5><table class="table table-sm"><thead><tr><th>Disciplina</th><th>MAC</th><th>NPT</th><th>MT</th></tr></thead><tbody>';
notas.forEach(n=>{
html+=`<tr><td>${n.disciplina||'N/D'}</td><td class="text-center">${n.mac1??''}</td><td class="text-center">${n.npt1??''}</td><td class="text-center">${n.mt1??''}</td></tr>`;
});
html+='</tbody></table>';
}
html+='</div></div>';
}
resultDiv.innerHTML=html;
}
}catch(e){Utils.toast('Erro na consulta: '+e.message,'error')}
showLoading(false);
};
}

window.showSetupScreen=showSetupScreen;
window.showLoginScreen=showLoginScreen;
window.showLoading=showLoading;
window.initSystem=initSystem;

document.addEventListener('DOMContentLoaded',()=>{
setTimeout(initSystem,500);
});
</script>

<style>
/* ============ CSS RESET & BASE ============ */
*{margin:0;padding:0;box-sizing:border-box}

/* ============ LOADING ============ */

/* ============ TOAST ============ */

.toast.show{transform:translateX(0)}
.toast-success{background:var(--success)}.toast-error{background:var(--danger)}.toast-warning{background:var(--warning)}.toast-info{background:var(--info)}

/* ============ CONFIRM MODAL ============ */
.confirm-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:99997}

.confirm-box{background:#fff;padding:30px;border-radius:var(--radius-lg);text-align:center;max-width:400px;width:90%;box-shadow:var(--shadow-lg)}

/* ============ BUTTONS ============ */
.btn{padding:8px 16px;border:none;border-radius:var(--radius);cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:all 0.2s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}

.btn-warning{background:var(--warning);color:#fff}.btn-info{background:var(--info);color:#fff}
.btn-secondary{background:var(--text-light);color:#fff}.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-sm{padding:5px 10px;font-size:12px}.btn-full{width:100%;justify-content:center;padding:12px}
.btn-icon{width:32px;height:32px;padding:0;justify-content:center;border-radius:50%}

/* ============ FORMS ============ */
.form-group{margin-bottom:16px}

.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;transition:border 0.2s;background:#fff;font-family:inherit}

/* ============ TABLES ============ */
.table-container{overflow-x:auto;background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow)}

th{background:var(--bg-sidebar);color:#fff;padding:10px 12px;text-align:left;font-size:12px;font-weight:600;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px}
tr:hover{background:#f8fafc}
.text-center{text-align:center}

.nota-negativa{color:var(--danger);font-weight:600}

/* ============ BADGES ============ */
.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-success{background:#d1fae5;color:#065f46}.badge-danger{background:#fee2e2;color:#991b1b}
.badge-warning{background:#fef3c7;color:#92400e}.badge-info{background:#cffafe;color:#155e75}

/* ============ CARDS ============ */
.card{background:var(--bg-card);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}

.stat-item{text-align:center}.stat-value{display:block;font-size:20px;font-weight:700;color:var(--primary)}.stat-label{font-size:11px;color:var(--text-light)}

/* ============ MODAL ============ */

}

.main-content{margin-left:0!important}
.page-content{padding:0!important}
body{background:#fff}
}

.clickable{cursor:pointer}.text-red{color:var(--angola-red)}.text-green{color:var(--success)}.text-bold{font-weight:700}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.gap-2{gap:8px}.gap-3{gap:12px}.mt-2{margin-top:8px}.mt-3{margin-top:16px}.mb-2{margin-bottom:8px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.w-full{width:100%}
.hidden{display:none}
hr{border:none;border-top:1px solid var(--border);margin:16px 0}
.scroll-x{overflow-x:auto}
</style>
</head>
<body>

<div id="loadingScreen"><div class="loader"></div><p style="margin-top:16px;color:var(--text-light)">Carregando SGE-NG...</p></div>
<div id="toastContainer"></div>
<div id="confirmModal" class="confirm-modal">
<div class="confirm-box">
<i class="fas fa-question-circle" style="font-size:40px;color:var(--warning)"></i>
<p id="confirmMsg"></p>
<div class="btn-row">
<button class="btn btn-danger" id="confirmNo"><i class="fas fa-times"></i> Não</button>
<button class="btn btn-success" id="confirmYes"><i class="fas fa-check"></i> Sim</button>
</div>
</div>
</div>
<div id="app"></div>

<script type="module">
// ============ MAIN APP SHELL ============
window.showMainApp=function(){
const user=APP.currentUser;
if(!user)return showLoginScreen();

const menuItems=getMenuItems(user.role);

document.getElementById('app').innerHTML=`
<div class="main-layout">
<aside class="sidebar" id="sidebar">
<div class="sidebar-header">
<div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
<span class="logo-text">SGE-NG</span>
</div>
<nav class="sidebar-menu" id="sidebarMenu">
${menuItems.map(item=>{
if(item.type==='label')return`<div class="menu-label">${item.text}</div>`;
return`<div class="menu-item" data-page="${item.page}" onclick="navigateTo('${item.page}')">
<i class="${item.icon}"></i><span class="menu-text">${item.text}</span>
</div>`;
}).join('')}
</nav>
<div class="sidebar-footer">
<div class="user-avatar">${user.photo?`<img src="${user.photo}">`:`<i class="fas fa-user"></i>`}</div>
<div class="user-info">
<div class="user-name">${user.name||'Usuário'}</div>
<div class="user-role">${getRoleName(user.role)}</div>
</div>
</div>
</aside>
<div class="main-content">
<header class="top-header">
<div style="display:flex;align-items:center;gap:12px">
<button class="toggle-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
<span style="font-size:13px;color:var(--text-light)" id="headerSchoolName">${APP.currentSchool?APP.currentSchool.name:'SGE-NG'}</span>
</div>
<div class="header-right">
<span id="headerYearDisplay" style="font-size:12px;color:var(--text-light)">${APP.currentYear?APP.currentYear.name:'Sem Ano Letivo'}</span>
${user.role==='superadmin'?`<select id="schoolSelector" onchange="switchSchool(this.value)" style="font-size:12px"><option value="">Todas Escolas</option></select>`:''}
<button class="btn btn-sm btn-outline" onclick="navigateTo('perfil')" title="Perfil"><i class="fas fa-user-cog"></i></button>
<button class="btn btn-sm btn-danger" onclick="doLogout()" title="Sair"><i class="fas fa-sign-out-alt"></i></button>
</div>
</header>
<main class="page-content" id="pageContent">
</main>
</div>
</div>`;

if(user.role==='superadmin')loadSchoolSelector();
navigateTo('dashboard');
};

function getMenuItems(role){
const items=[];
items.push({type:'label',text:'PRINCIPAL'});
items.push({page:'dashboard',icon:'fas fa-tachometer-alt',text:'Painel'});

if(['superadmin','diretor','subdiretor_pedagogico','subdiretor_administrativo','secretario'].includes(role)){
items.push({type:'label',text:'ACADÊMICO'});
if(['superadmin','diretor'].includes(role))items.push({page:'anoletivo',icon:'fas fa-calendar-alt',text:'Ano Letivo'});
items.push({page:'classes',icon:'fas fa-layer-group',text:'Classes'});
items.push({page:'turmas',icon:'fas fa-users-class',text:'Turmas'});
items.push({page:'turnos',icon:'fas fa-clock',text:'Turnos'});
items.push({page:'disciplinas',icon:'fas fa-book',text:'Disciplinas'});
if(['superadmin','diretor','subdiretor_pedagogico'].includes(role))items.push({page:'atribuicoes',icon:'fas fa-link',text:'Atribuições'});
}

items.push({type:'label',text:'GESTÃO'});
if(['superadmin','diretor','subdiretor_pedagogico','subdiretor_administrativo','secretario'].includes(role)){
items.push({page:'estudantes',icon:'fas fa-user-graduate',text:'Estudantes'});
items.push({page:'funcionarios',icon:'fas fa-id-badge',text:'Funcionários'});
}
if(['superadmin','diretor','subdiretor_pedagogico','secretario','professor'].includes(role)){
items.push({page:'notas',icon:'fas fa-star',text:'Notas'});
items.push({page:'pautas',icon:'fas fa-file-alt',text:'Pautas'});
items.push({page:'presencas',icon:'fas fa-clipboard-check',text:'Presenças'});
}
if(['superadmin','diretor','subdiretor_pedagogico','secretario'].includes(role)){
items.push({page:'historico',icon:'fas fa-history',text:'Histórico'});
}

items.push({type:'label',text:'DOCUMENTOS'});
if(['superadmin','diretor','subdiretor_pedagogico','secretario'].includes(role)){
items.push({page:'boletins',icon:'fas fa-file-contract',text:'Boletins'});
items.push({page:'declaracoes',icon:'fas fa-file-signature',text:'Declarações'});
items.push({page:'certificados',icon:'fas fa-certificate',text:'Certificados'});
items.push({page:'passes',icon:'fas fa-id-card',text:'Passes'});
}

if(['superadmin','diretor','subdiretor_administrativo','secretario'].includes(role)){
items.push({type:'label',text:'FINANCEIRO'});
items.push({page:'configFinanceira',icon:'fas fa-cog',text:'Config. Financeira'});
items.push({page:'pagamentos',icon:'fas fa-money-bill-wave',text:'Pagamentos'});
items.push({page:'receitasDespesas',icon:'fas fa-chart-line',text:'Receitas/Despesas'});
}

items.push({type:'label',text:'OUTROS'});
if(['superadmin','diretor','subdiretor_pedagogico','subdiretor_administrativo'].includes(role)){
items.push({page:'estatisticas',icon:'fas fa-chart-bar',text:'Estatísticas'});
items.push({page:'relatorios',icon:'fas fa-file-pdf',text:'Relatórios'});
}
if(['superadmin','diretor','subdiretor_administrativo'].includes(role)){
items.push({page:'patrimonio',icon:'fas fa-warehouse',text:'Património'});
}
items.push({page:'mensagens',icon:'fas fa-envelope',text:'Mensagens'});
items.push({page:'eventos',icon:'fas fa-calendar',text:'Eventos'});

if(['superadmin','diretor'].includes(role)){
items.push({type:'label',text:'SISTEMA'});
if(role==='superadmin')items.push({page:'escolas',icon:'fas fa-school',text:'Escolas'});
items.push({page:'backup',icon:'fas fa-database',text:'Backup/Restauro'});
items.push({page:'configuracoes',icon:'fas fa-cogs',text:'Configurações'});
items.push({page:'utilidades',icon:'fas fa-tools',text:'Utilidades'});
}

items.push({type:'label',text:''});
items.push({page:'logout',icon:'fas fa-sign-out-alt',text:'Sair'});

return items;
}

function getRoleName(role){
const map={superadmin:'Administrador Geral',diretor:'Director Geral',subdiretor_pedagogico:'Subdirector Pedagógico',
subdiretor_administrativo:'Subdirector Administrativo',secretario:'Secretário(a)',coordenador:'Coordenador',
professor:'Professor',encarregado:'Encarregado',aluno:'Aluno'};
return map[role]||role;
}
window.getRoleName=getRoleName;

window.toggleSidebar=function(){
const sb=document.getElementById('sidebar');
if(window.innerWidth<=768){sb.classList.toggle('mobile-open')}
else{sb.classList.toggle('collapsed');APP.menuState=sb.classList.contains('collapsed')?'collapsed':'expanded'}
};

window.doLogout=async function(){
const ok=await Utils.confirm('Deseja realmente sair do sistema?');
if(!ok)return;
showLoading(true);
try{await DB.logout();showLoginScreen();Utils.toast('Sessão encerrada','info')}
catch(e){Utils.toast('Erro ao sair','error')}
showLoading(false);
};

window.navigateTo=function(page){
if(page==='logout'){doLogout();return}
document.querySelectorAll('.menu-item').forEach(m=>{m.classList.toggle('active',m.dataset.page===page)});
if(window.innerWidth<=768)document.getElementById('sidebar').classList.remove('mobile-open');
loadPage(page);
};

async function loadSchoolSelector(){
const sel=document.getElementById('schoolSelector');
if(!sel)return;
const schools=await DB.getCollection('schools');
sel.innerHTML='<option value="">Todas Escolas</option>';
schools.forEach(s=>{sel.innerHTML+=`<option value="${s.id}" ${APP.currentSchool&&APP.currentSchool.id===s.id?'selected':''}>${s.name}</option>`});
}
window.loadSchoolSelector=loadSchoolSelector;

window.switchSchool=async function(schoolId){
if(schoolId){
const s=await DB.getDoc('schools',schoolId);
if(s){APP.currentSchool=s;await DB.getActiveYear(schoolId)}
}else{
APP.currentSchool=null;APP.currentYearId=null;APP.currentYear=null;
}
document.getElementById('headerSchoolName').textContent=APP.currentSchool?APP.currentSchool.name:'SGE-NG';
document.getElementById('headerYearDisplay').textContent=APP.currentYear?APP.currentYear.name:'Sem Ano Letivo';
navigateTo('dashboard');
};

// ============ PAGE ROUTER ============
window.loadPage=function(page){
const pc=document.getElementById('pageContent');
if(!pc)return;

switch(page){
case'dashboard':PageDashboard.render(pc);break;
case'anoletivo':PageAnoLetivo.render(pc);break;
case'classes':PageClasses.render(pc);break;
case'turmas':PageTurmas.render(pc);break;
case'turnos':PageTurnos.render(pc);break;
case'disciplinas':PageDisciplinas.render(pc);break;
case'atribuicoes':PageAtribuicoes.render(pc);break;
case'estudantes':PageEstudantes.render(pc);break;
case'funcionarios':PageFuncionarios.render(pc);break;
case'notas':PageNotas.render(pc);break;
case'pautas':PagePautas.render(pc);break;
case'presencas':PagePresencas.render(pc);break;
case'historico':PageHistorico.render(pc);break;
case'boletins':PageBoletins.render(pc);break;
case'declaracoes':PageDeclaracoes.render(pc);break;
case'certificados':PageCertificados.render(pc);break;
case'passes':PagePasses.render(pc);break;
case'configFinanceira':PageConfigFinanceira.render(pc);break;
case'pagamentos':PagePagamentos.render(pc);break;
case'receitasDespesas':PageReceitasDespesas.render(pc);break;
case'estatisticas':PageEstatisticas.render(pc);break;
case'relatorios':PageRelatorios.render(pc);break;
case'patrimonio':PagePatrimonio.render(pc);break;
case'mensagens':PageMensagens.render(pc);break;
case'eventos':PageEventos.render(pc);break;
case'escolas':PageEscolas.render(pc);break;
case'backup':PageBackup.render(pc);break;
case'configuracoes':PageConfiguracoes.render(pc);break;
case'utilidades':PageUtilidades.render(pc);break;
case'perfil':PagePerfil.render(pc);break;
default:pc.innerHTML=`<div class="empty-state"><i class="fas fa-tools"></i><p>Módulo "${page}" em desenvolvimento</p></div>`;
}
};

// ============ DASHBOARD PAGE ============
window.PageDashboard={
async render(container){
const schoolId=APP.currentSchool?APP.currentSchool.id:null;
const yearId=APP.currentYearId;
const role=APP.currentUser.role;

let constraints=[];
if(schoolId)constraints.push(FB.where('schoolId','==',schoolId));

let totalAlunos=0,totalProfs=0,totalTurmas=0,totalClasses=0;
let alunosM=0,alunosF=0,receitas=0,despesas=0;

try{
let alunoQ=[...constraints];
if(yearId)alunoQ.push(FB.where('yearId','==',yearId));
const alunos=await DB.getCollection('alunos',alunoQ.length?alunoQ:undefined);
const alunosAtivos=alunos.filter(a=>a.estado==='Activo'||a.estado==='Ativo');
totalAlunos=alunosAtivos.length;
alunosM=alunosAtivos.filter(a=>(a.sexo||'').toLowerCase()==='m'||(a.sexo||'').toLowerCase()==='masculino').length;
alunosF=totalAlunos-alunosM;

let userQ=[...constraints];
if(role!=='superadmin'&&schoolId)userQ=[FB.where('schoolId','==',schoolId)];
const users=await DB.getCollection('users',userQ.length?userQ:undefined);
totalProfs=users.filter(u=>u.role==='professor'&&u.active!==false).length;

let turmaQ=[...constraints];
if(yearId)turmaQ.push(FB.where('yearId','==',yearId));
const turmas=await DB.getCollection('turmas',turmaQ.length?turmaQ:undefined);
totalTurmas=turmas.length;

const classes=await DB.getCollection('classes',constraints.length?constraints:undefined);
totalClasses=classes.length;

let finQ=[...constraints];
if(yearId)finQ.push(FB.where('yearId','==',yearId));
const recs=await DB.getCollection('receitas',finQ.length?finQ:undefined);
const desps=await DB.getCollection('despesas',finQ.length?finQ:undefined);
receitas=recs.reduce((s,r)=>s+(parseFloat(r.valor)||0),0);
despesas=desps.reduce((s,r)=>s+(parseFloat(r.valor)||0),0);
}catch(e){console.error(e)}

container.innerHTML=`
<h2 class="page-title"><i class="fas fa-tachometer-alt"></i> Painel de Controlo</h2>
<div class="stats-grid">
<div class="stat-card"><div class="stat-icon blue"><i class="fas fa-user-graduate"></i></div>
<div class="stat-info"><h3>${totalAlunos}</h3><p>Alunos Activos</p></div></div>
<div class="stat-card"><div class="stat-icon green"><i class="fas fa-chalkboard-teacher"></i></div>
<div class="stat-info"><h3>${totalProfs}</h3><p>Professores</p></div></div>
<div class="stat-card"><div class="stat-icon purple"><i class="fas fa-users"></i></div>
<div class="stat-info"><h3>${totalTurmas}</h3><p>Turmas</p></div></div>
<div class="stat-card"><div class="stat-icon orange"><i class="fas fa-layer-group"></i></div>
<div class="stat-info"><h3>${totalClasses}</h3><p>Classes</p></div></div>
${['superadmin','diretor','subdiretor_administrativo'].includes(role)?`
<div class="stat-card"><div class="stat-icon green"><i class="fas fa-arrow-up"></i></div>
<div class="stat-info"><h3>${receitas.toLocaleString('pt-AO')} Kz</h3><p>Receitas</p></div></div>
<div class="stat-card"><div class="stat-icon red"><i class="fas fa-arrow-down"></i></div>
<div class="stat-info"><h3>${despesas.toLocaleString('pt-AO')} Kz</h3><p>Despesas</p></div></div>
`:''}
</div>
<div class="grid-2">
<div class="card">
<div class="card-header"><h4><i class="fas fa-venus-mars"></i> Distribuição por Género</h4></div>
<div class="card-body">
<div style="display:flex;justify-content:center;align-items:center;gap:30px;padding:20px">
<div style="text-align:center"><div style="width:80px;height:80px;border-radius:50%;background:#3b82f6;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:700">${alunosM}</div><p style="margin-top:8px;font-size:12px">Masculino</p></div>
<div style="text-align:center"><div style="width:80px;height:80px;border-radius:50%;background:#ec4899;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:700">${alunosF}</div><p style="margin-top:8px;font-size:12px">Feminino</p></div>
</div>
</div>
</div>
<div class="card">
<div class="card-header"><h4><i class="fas fa-info-circle"></i> Informações do Sistema</h4></div>
<div class="card-body">
<p><strong>Ano Letivo:</strong> ${APP.currentYear?APP.currentYear.name:'Nenhum aberto'}</p>
<p class="mt-2"><strong>Escola:</strong> ${APP.currentSchool?APP.currentSchool.name:'N/A'}</p>
<p class="mt-2"><strong>Utilizador:</strong> ${APP.currentUser.name}</p>
<p class="mt-2"><strong>Perfil:</strong> ${getRoleName(APP.currentUser.role)}</p>
<p class="mt-2"><strong>Último acesso:</strong> ${Utils.formatDateTime(APP.currentUser.lastLogin)}</p>
</div>
</div>
</div>`;
}
};
</script>
<script type="module">
// ============================================================
// MÓDULO: ANO LETIVO
// ============================================================
window.PageAnoLetivo = {
  async render(container) {
    const schoolId = APP.currentSchool ? APP.currentSchool.id : null;
    if (!schoolId) {
      container.innerHTML = '<div class="empty-state"><i class="fas fa-school"></i><p>Selecione uma escola primeiro</p></div>';
      return;
    }
    const role = APP.currentUser.role;
    const canEdit = ['superadmin', 'diretor'].includes(role);

    container.innerHTML = `
      <h2 class="page-title"><i class="fas fa-calendar-alt"></i> Ano Letivo</h2>
      <div class="toolbar no-print">
        <div class="toolbar-left">
          <input type="text" class="search-input" id="searchYear" placeholder="Pesquisar ano letivo..." oninput="PageAnoLetivo.filter()">
        </div>
        <div class="toolbar-right">
          ${canEdit ? '<button class="btn btn-primary" onclick="PageAnoLetivo.openModal()"><i class="fas fa-plus"></i> Novo Ano Letivo</button>' : ''}
          <button class="btn btn-outline" onclick="PageAnoLetivo.exportXLSX()"><i class="fas fa-file-excel"></i> Excel</button>
          <button class="btn btn-outline" onclick="PageAnoLetivo.exportPDF()"><i class="fas fa-file-pdf"></i> PDF</button>
        </div>
      </div>
      <div class="table-container">
        <table>
          <thead><tr>
            <th>#</th><th>Nome</th><th>Início</th><th>Fim</th><th>Status</th>
            <th>Trimestre Activo</th><th>Estado Trim.</th>
            ${canEdit ? '<th>Acções</th>' : ''}
          </tr></thead>
          <tbody id="yearTableBody"><tr><td colspan="8" class="text-center">Carregando...</td></tr></tbody>
        </table>
      </div>
      <div id="yearModal" class="modal-overlay">
        <div class="modal-content">
          <div class="modal-header"><h3 id="yearModalTitle">Novo Ano Letivo</h3><button class="modal-close" onclick="PageAnoLetivo.closeModal()">&times;</button></div>
          <div class="modal-body">
            <form id="yearForm">
              <input type="hidden" id="yearId">
              <div class="form-row">
                <div class="form-group"><label>Nome do Ano Letivo *</label>
                  <input type="text" id="yearName" required placeholder="Ex: 2025/2026"></div>
                <div class="form-group"><label>Código</label>
                  <input type="text" id="yearCode" placeholder="Ex: 2025"></div>
              </div>
              <div class="form-row">
                <div class="form-group"><label>Data Início *</label>
                  <input type="date" id="yearStart" required></div>
                <div class="form-group"><label>Data Fim *</label>
                  <input type="date" id="yearEnd" required></div>
              </div>
              <div class="form-row">
                <div class="form-group"><label>Status *</label>
                  <select id="yearStatus" required>
                    <option value="Aberto">Aberto</option>
                    <option value="Fechado">Fechado</option>
                    <option value="Planificação">Planificação</option>
                  </select></div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="PageAnoLetivo.closeModal()">Cancelar</button>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Guardar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
      <div id="trimestreModal" class="modal-overlay">
        <div class="modal-content">
          <div class="modal-header"><h3>Gerir Trimestres</h3><button class="modal-close" onclick="document.getElementById('trimestreModal').classList.remove('active')">&times;</button></div>
          <div class="modal-body" id="trimestreModalBody"></div>
        </div>
      </div>`;

    this.loadData();

    document.getElementById('yearForm').onsubmit = async (e) => {
      e.preventDefault();
      await PageAnoLetivo.save();
    };
  },

  _data: [],
  _filtered: [],

  async loadData() {
    const schoolId = APP.currentSchool.id;
    try {
      const data = await DB.getCollection('academicYears', [FB.where('schoolId', '==', schoolId)]);
      this._data = data.sort((a, b) => (b.name || '').localeCompare(a.name || ''));
      this._filtered = [...this._data];
      this.renderTable();
    } catch (e) {
      console.error(e);
      Utils.toast('Erro ao carregar anos letivos', 'error');
    }
  },

  filter() {
    const term = (document.getElementById('searchYear')?.value || '').toLowerCase();
    this._filtered = this._data.filter(y =>
      (y.name || '').toLowerCase().includes(term) ||
      (y.code || '').toLowerCase().includes(term)
    );
    this.renderTable();
  },

  renderTable() {
    const tbody = document.getElementById('yearTableBody');
    if (!tbody) return;
    const canEdit = ['superadmin', 'diretor'].includes(APP.currentUser.role);

    if (this._filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-center">Nenhum ano letivo cadastrado</td></tr>';
      return;
    }

    tbody.innerHTML = this._filtered.map((y, i) => {
      const statusBadge = y.status === 'Aberto' ? 'badge-success' : y.status === 'Fechado' ? 'badge-danger' : 'badge-warning';
      const trimActivo = y.trimestreActivo || 'Nenhum';
      const trimEstado = y.trimestreEstado || 'N/D';
      const trimBadge = trimEstado === 'Aberto' ? 'badge-success' : trimEstado === 'Fechado' ? 'badge-danger' : 'badge-secondary';

      return `<tr>
        <td>${i + 1}</td>
        <td><strong>${y.name || ''}</strong></td>
        <td>${y.startDate || ''}</td>
        <td>${y.endDate || ''}</td>
        <td><span class="badge ${statusBadge}">${y.status || 'N/D'}</span></td>
        <td>${trimActivo}</td>
        <td><span class="badge ${trimBadge}">${trimEstado}</span></td>
        ${canEdit ? `<td>
          <div style="display:flex;gap:4px">
            <button class="btn btn-sm btn-info" onclick="PageAnoLetivo.openModal('${y.id}')" title="Editar"><i class="fas fa-edit"></i></button>
            <button class="btn btn-sm btn-warning" onclick="PageAnoLetivo.gerirTrimestres('${y.id}')" title="Trimestres"><i class="fas fa-list-ol"></i></button>
            ${y.status === 'Aberto' ? `<button class="btn btn-sm btn-danger" onclick="PageAnoLetivo.fecharAno('${y.id}')" title="Fechar"><i class="fas fa-lock"></i></button>` :
              y.status === 'Fechado' ? `<button class="btn btn-sm btn-success" onclick="PageAnoLetivo.abrirAno('${y.id}')" title="Reabrir"><i class="fas fa-lock-open"></i></button>` : ''}
            <button class="btn btn-sm btn-danger" onclick="PageAnoLetivo.delete('${y.id}')" title="Excluir"><i class="fas fa-trash"></i></button>
          </div>
        </td>` : ''}
      </tr>`;
    }).join('');
  },

  openModal(id = null) {
    document.getElementById('yearModalTitle').textContent = id ? 'Editar Ano Letivo' : 'Novo Ano Letivo';
    document.getElementById('yearId').value = id || '';
    if (id) {
      const y = this._data.find(x => x.id === id);
      if (y) {
        document.getElementById('yearName').value = y.name || '';
        document.getElementById('yearCode').value = y.code || '';
        document.getElementById('yearStart').value = y.startDate || '';
        document.getElementById('yearEnd').value = y.endDate || '';
        document.getElementById('yearStatus').value = y.status || 'Aberto';
      }
    } else {
      document.getElementById('yearForm').reset();
    }
    document.getElementById('yearModal').classList.add('active');
  },

  closeModal() {
    document.getElementById('yearModal').classList.remove('active');
  },

  async save() {
    const id = document.getElementById('yearId').value;
    const schoolId = APP.currentSchool.id;
    const status = document.getElementById('yearStatus').value;

    // Validar único ano aberto
    if (status === 'Aberto') {
      const existing = this._data.find(y => y.status === 'Aberto' && y.id !== id);
      if (existing) {
        Utils.toast('Já existe um ano letivo aberto: ' + existing.name + '. Feche-o primeiro.', 'warning');
        return;
      }
    }

    const data = {
      name: document.getElementById('yearName').value.trim(),
      code: document.getElementById('yearCode').value.trim(),
      startDate: document.getElementById('yearStart').value,
      endDate: document.getElementById('yearEnd').value,
      status: status,
      schoolId: schoolId
    };

    if (!id) {
      data.trimestreActivo = 'Nenhum';
      data.trimestreEstado = 'N/D';
      data.trimestres = {
        '1': { nome: 'I Trimestre', status: 'Fechado', inicio: '', fim: '' },
        '2': { nome: 'II Trimestre', status: 'Fechado', inicio: '', fim: '' },
        '3': { nome: 'III Trimestre', status: 'Fechado', inicio: '', fim: '' }
      };
    }

    showLoading(true);
    try {
      const docId = id || Utils.generateId();
      await DB.saveDoc('academicYears', id || docId, data);

      // Atualizar ano ativo no cache
      if (status === 'Aberto') {
        APP.currentYearId = id || docId;
        APP.currentYear = { id: id || docId, ...data };
        const hyd = document.getElementById('headerYearDisplay');
        if (hyd) hyd.textContent = data.name;
      }

      Utils.toast(id ? 'Ano letivo atualizado!' : 'Ano letivo criado!', 'success');
      this.closeModal();
      await this.loadData();
    } catch (e) {
      Utils.toast('Erro: ' + e.message, 'error');
    }
    showLoading(false);
  },

  async fecharAno(id) {
    const ok = await Utils.confirm('Deseja fechar este ano letivo? Ninguém poderá editar informações deste ano.');
    if (!ok) return;
    showLoading(true);
    try {
      await DB.saveDoc('academicYears', id, {
        status: 'Fechado',
        trimestreActivo: 'Nenhum',
        trimestreEstado: 'Fechado'
      });
      // Tornar alunos inativos neste ano
      const alunos = await DB.getCollection('alunos', [FB.where('yearId', '==', id)]);
      for (const al of alunos) {
        await DB.saveDoc('alunos', al.id, { estado: 'Inactivo' });
      }
      if (APP.currentYearId === id) {
        APP.currentYearId = null;
        APP.currentYear = null;
        document.getElementById('headerYearDisplay').textContent = 'Sem Ano Letivo';
      }
      Utils.toast('Ano letivo fechado com sucesso', 'success');
      await this.loadData();
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  async abrirAno(id) {
    // Verificar se já tem outro aberto
    const existing = this._data.find(y => y.status === 'Aberto' && y.id !== id);
    if (existing) {
      Utils.toast('Feche o ano "' + existing.name + '" antes de reabrir este.', 'warning');
      return;
    }
    const ok = await Utils.confirm('Deseja reabrir este ano letivo?');
    if (!ok) return;
    showLoading(true);
    try {
      await DB.saveDoc('academicYears', id, { status: 'Aberto' });
      const y = this._data.find(x => x.id === id);
      APP.currentYearId = id;
      APP.currentYear = y ? { ...y, status: 'Aberto' } : { id, status: 'Aberto' };
      document.getElementById('headerYearDisplay').textContent = y ? y.name : 'Ano Letivo';
      Utils.toast('Ano letivo reaberto!', 'success');
      await this.loadData();
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  async gerirTrimestres(yearId) {
    const year = this._data.find(y => y.id === yearId);
    if (!year) return;

    const trims = year.trimestres || {
      '1': { nome: 'I Trimestre', status: 'Fechado', inicio: '', fim: '' },
      '2': { nome: 'II Trimestre', status: 'Fechado', inicio: '', fim: '' },
      '3': { nome: 'III Trimestre', status: 'Fechado', inicio: '', fim: '' }
    };

    const body = document.getElementById('trimestreModalBody');
    body.innerHTML = `
      <p class="mb-3"><strong>Ano Letivo:</strong> ${year.name} | <strong>Status:</strong> <span class="badge ${year.status === 'Aberto' ? 'badge-success' : 'badge-danger'}">${year.status}</span></p>
      ${year.status === 'Fechado' ? '<div class="empty-state"><p>O ano letivo está fechado. Reabra para gerir trimestres.</p></div>' : `
      <div class="table-container">
        <table>
          <thead><tr><th>Trimestre</th><th>Início</th><th>Fim</th><th>Estado</th><th>Acções</th></tr></thead>
          <tbody>
            ${['1', '2', '3'].map(t => {
              const tr = trims[t] || { nome: `${t === '1' ? 'I' : t === '2' ? 'II' : 'III'} Trimestre`, status: 'Fechado' };
              return `<tr>
                <td><strong>${tr.nome}</strong></td>
                <td><input type="date" id="trimInicio_${t}" value="${tr.inicio || ''}" style="padding:4px 8px;border:1px solid var(--border);border-radius:4px;font-size:12px"></td>
                <td><input type="date" id="trimFim_${t}" value="${tr.fim || ''}" style="padding:4px 8px;border:1px solid var(--border);border-radius:4px;font-size:12px"></td>
                <td><span class="badge ${tr.status === 'Aberto' ? 'badge-success' : 'badge-danger'}">${tr.status}</span></td>
                <td>
                  ${tr.status === 'Fechado' ?
                    `<button class="btn btn-sm btn-success" onclick="PageAnoLetivo.abrirTrimestre('${yearId}','${t}')"><i class="fas fa-lock-open"></i> Abrir</button>` :
                    `<button class="btn btn-sm btn-danger" onclick="PageAnoLetivo.fecharTrimestre('${yearId}','${t}')"><i class="fas fa-lock"></i> Fechar</button>`
                  }
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
      <div class="modal-footer mt-3">
        <button class="btn btn-primary" onclick="PageAnoLetivo.salvarTrimestres('${yearId}')"><i class="fas fa-save"></i> Guardar Datas</button>
      </div>
      `}`;

    document.getElementById('trimestreModal').classList.add('active');
  },

  async abrirTrimestre(yearId, trimNum) {
    const year = this._data.find(y => y.id === yearId);
    if (!year || year.status !== 'Aberto') {
      Utils.toast('O ano letivo deve estar aberto', 'warning');
      return;
    }
    // Fechar outro trimestre aberto
    const trims = year.trimestres || {};
    for (const k in trims) {
      if (trims[k].status === 'Aberto' && k !== trimNum) {
        trims[k].status = 'Fechado';
      }
    }
    if (!trims[trimNum]) trims[trimNum] = { nome: `${trimNum === '1' ? 'I' : trimNum === '2' ? 'II' : 'III'} Trimestre` };
    trims[trimNum].status = 'Aberto';

    const nomes = { '1': 'I Trimestre', '2': 'II Trimestre', '3': 'III Trimestre' };
    showLoading(true);
    try {
      await DB.saveDoc('academicYears', yearId, {
        trimestres: trims,
        trimestreActivo: nomes[trimNum],
        trimestreEstado: 'Aberto'
      });
      Utils.toast(nomes[trimNum] + ' aberto com sucesso!', 'success');
      await this.loadData();
      this.gerirTrimestres(yearId);
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  async fecharTrimestre(yearId, trimNum) {
    const ok = await Utils.confirm('Deseja fechar este trimestre? As notas não poderão ser editadas.');
    if (!ok) return;
    const year = this._data.find(y => y.id === yearId);
    const trims = year.trimestres || {};
    if (!trims[trimNum]) return;
    trims[trimNum].status = 'Fechado';

    showLoading(true);
    try {
      await DB.saveDoc('academicYears', yearId, {
        trimestres: trims,
        trimestreActivo: 'Nenhum',
        trimestreEstado: 'Fechado'
      });
      Utils.toast('Trimestre fechado!', 'success');
      await this.loadData();
      this.gerirTrimestres(yearId);
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  async salvarTrimestres(yearId) {
    const year = this._data.find(y => y.id === yearId);
    const trims = year.trimestres || {};
    ['1', '2', '3'].forEach(t => {
      if (!trims[t]) trims[t] = { nome: `${t === '1' ? 'I' : t === '2' ? 'II' : 'III'} Trimestre`, status: 'Fechado' };
      trims[t].inicio = document.getElementById(`trimInicio_${t}`)?.value || '';
      trims[t].fim = document.getElementById(`trimFim_${t}`)?.value || '';
    });
    showLoading(true);
    try {
      await DB.saveDoc('academicYears', yearId, { trimestres: trims });
      Utils.toast('Datas dos trimestres atualizadas!', 'success');
      await this.loadData();
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  async delete(id) {
    const ok = await Utils.confirm('Excluir este ano letivo? Todos os dados associados serão perdidos.');
    if (!ok) return;
    showLoading(true);
    try {
      await DB.deleteDocument('academicYears', id);
      if (APP.currentYearId === id) {
        APP.currentYearId = null; APP.currentYear = null;
        document.getElementById('headerYearDisplay').textContent = 'Sem Ano Letivo';
      }
      Utils.toast('Ano letivo excluído!', 'success');
      await this.loadData();
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  exportXLSX() {
    const data = this._filtered.map((y, i) => ({
      '#': i + 1, 'Nome': y.name, 'Início': y.startDate, 'Fim': y.endDate,
      'Status': y.status, 'Trimestre Activo': y.trimestreActivo || '', 'Estado Trim.': y.trimestreEstado || ''
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Anos Letivos');
    XLSX.writeFile(wb, 'anos_letivos.xlsx');
    Utils.toast('Excel exportado!', 'success');
  },

  exportPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    let y = PDFHelper.addHeader(doc, APP.currentSchool, { title: 'ANOS LETIVOS' });
    doc.autoTable({
      startY: y + 5,
      head: [['#', 'Nome', 'Início', 'Fim', 'Status', 'Trimestre']],
      body: this._filtered.map((yr, i) => [i + 1, yr.name, yr.startDate, yr.endDate, yr.status, yr.trimestreActivo || '']),
      styles: { fontSize: 9 }, headStyles: { fillColor: [15, 23, 42] }
    });
    doc.save('anos_letivos.pdf');
    Utils.toast('PDF exportado!', 'success');
  }
};

      const matchTerm = (c.name || '').toLowerCase().includes(term);

    });

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Classes');
    XLSX.writeFile(wb, 'classes.xlsx');

  exportPDF() {

};

            ${canEdit ? '<th>Acções</th>' : ''}
          </tr></thead>
          <tbody id="turmaTableBody"><tr><td colspan="11" class="text-center">Carregando...</td></tr></tbody>
        </table>
      </div>
      <div id="turmaModal" class="modal-overlay">
        <div class="modal-content">
          <div class="modal-header"><h3 id="turmaModalTitle">Nova Turma</h3><button class="modal-close" onclick="PageTurmas.closeModal()">&times;</button></div>
          <div class="modal-body">
            <form id="turmaForm">
              <input type="hidden" id="turmaId">
              <div class="form-row">
                <div class="form-group"><label>Nome da Turma *</label>
                  <input type="text" id="turmaNome" required placeholder="Ex: A, B, C..."></div>
                <div class="form-group"><label>Classe *</label>
                  <select id="turmaClasse" required onchange="PageTurmas.onClasseChange()"><option value="">Selecione</option></select></div>
              </div>
              <div class="form-row">
                <div class="form-group"><label>Turno *</label>
                  <select id="turmaTurno" required><option value="">Selecione</option></select></div>
                <div class="form-group" id="turmaCursoGroup" style="display:none"><label>Curso *</label>
                  <select id="turmaCurso"><option value="">Selecione</option></select></div>
              </div>
              <div class="form-row">
                <div class="form-group"><label>Sala</label>
                  <input type="text" id="turmaSala" placeholder="Ex: Sala 1"></div>
                <div class="form-group"><label>Capacidade</label>
                  <input type="number" id="turmaCapacidade" min="1" max="100" value="45"></div>
              </div>
              <div class="form-group"><label>Status</label>
                <select id="turmaStatus">
                  <option value="Activo">Activo</option>
                  <option value="Inactivo">Inactivo</option>
                </select></div>
              <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="PageTurmas.closeModal()">Cancelar</button>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Guardar</button>
              </div>
            </form>
          </div>
        </div>
      </div>`;

    await this.loadFilters();
    await this.loadData();

    document.getElementById('turmaForm').onsubmit = async (e) => {
      e.preventDefault();
      await PageTurmas.save();
    };
  },

  _data: [],
  _filtered: [],
  _classes: [],
  _turnos: [],

  async loadFilters() {
    const schoolId = APP.currentSchool.id;
    this._classes = await DB.getCollection('classes', [FB.where('schoolId', '==', schoolId)]);
    this._classes.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
    this._turnos = await DB.getCollection('turnos', [FB.where('schoolId', '==', schoolId)]);

    // Filtro classes
    const selC = document.getElementById('filterTurmaClasse');
    const selMC = document.getElementById('turmaClasse');
    this._classes.forEach(c => {
      selC.innerHTML += `<option value="${c.id}">${c.name}</option>`;
      selMC.innerHTML += `<option value="${c.id}" data-ciclo="${c.ciclo}" data-cursos='${JSON.stringify(c.cursos || [])}'>${c.name}</option>`;
    });

    // Filtro turnos
    const selT = document.getElementById('filterTurmaTurno');
    const selMT = document.getElementById('turmaTurno');
    this._turnos.forEach(t => {
      selT.innerHTML += `<option value="${t.id}">${t.name}</option>`;
      selMT.innerHTML += `<option value="${t.id}">${t.name}</option>`;
    });
  },

  onClasseChange() {
    const sel = document.getElementById('turmaClasse');
    const opt = sel.options[sel.selectedIndex];
    const ciclo = opt?.dataset?.ciclo;
    const cursos = JSON.parse(opt?.dataset?.cursos || '[]');
    const cursoGroup = document.getElementById('turmaCursoGroup');
    const cursoSel = document.getElementById('turmaCurso');

    if (ciclo === 'ciclo2' && cursos.length > 0) {
      cursoGroup.style.display = 'block';
      cursoSel.innerHTML = '<option value="">Selecione o Curso</option>';
      cursos.forEach(c => cursoSel.innerHTML += `<option value="${c}">${c}</option>`);
    } else {
      cursoGroup.style.display = 'none';
      cursoSel.innerHTML = '<option value="">N/A</option>';
    }
  },

  async loadData() {
    try {
      let constraints = [FB.where('schoolId', '==', APP.currentSchool.id)];
      if (APP.currentYearId) constraints.push(FB.where('yearId', '==', APP.currentYearId));
      const data = await DB.getCollection('turmas', constraints);
      this._data = data.sort((a, b) => (a.classeName || '').localeCompare(b.classeName || '') || (a.name || '').localeCompare(b.name || ''));

      // Contar alunos por turma
      let alunoConstraints = [FB.where('schoolId', '==', APP.currentSchool.id)];
      if (APP.currentYearId) alunoConstraints.push(FB.where('yearId', '==', APP.currentYearId));
      const alunos = await DB.getCollection('alunos', alunoConstraints);
      this._data.forEach(t => {
        t._numAlunos = alunos.filter(a => a.turmaId === t.id && (a.estado === 'Activo' || a.estado === 'Ativo')).length;
      });

      this._filtered = [...this._data];
      this.renderTable();
    } catch (e) { console.error(e); }
  },

  filter() {
    const term = (document.getElementById('searchTurma')?.value || '').toLowerCase();
    const classeId = document.getElementById('filterTurmaClasse')?.value || '';
    const turnoId = document.getElementById('filterTurmaTurno')?.value || '';
    this._filtered = this._data.filter(t => {
      return ((t.name || '').toLowerCase().includes(term) || (t.classeName || '').toLowerCase().includes(term)) &&
        (!classeId || t.classeId === classeId) &&
        (!turnoId || t.turnoId === turnoId);
    });
    this.renderTable();
  },

  renderTable() {
    const tbody = document.getElementById('turmaTableBody');
    if (!tbody) return;
    const canEdit = ['superadmin', 'diretor', 'subdiretor_pedagogico'].includes(APP.currentUser.role);

    if (this._filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="11" class="text-center">Nenhuma turma cadastrada</td></tr>';
      return;
    }

    tbody.innerHTML = this._filtered.map((t, i) => {
      const cap = t.capacidade || 45;
      const num = t._numAlunos || 0;
      const pct = Math.round((num / cap) * 100);
      let lotacao = 'Disponível', lotBadge = 'badge-success';
      if (pct >= 100) { lotacao = 'Cheia'; lotBadge = 'badge-danger'; }
      else if (pct >= 80) { lotacao = 'Quase Cheia'; lotBadge = 'badge-warning'; }

      return `<tr>
        <td>${i + 1}</td>
        <td><strong>${t.name || ''}</strong></td>
        <td>${t.classeName || ''}</td>
        <td>${t.turnoName || ''}</td>
        <td>${t.curso || '-'}</td>
        <td>${t.sala || '-'}</td>
        <td class="text-center">${cap}</td>
        <td class="text-center">${num}</td>
        <td><span class="badge ${lotBadge}">${lotacao} (${pct}%)</span></td>
        <td><span class="badge ${t.status === 'Activo' ? 'badge-success' : 'badge-danger'}">${t.status || 'Activo'}</span></td>
        ${canEdit ? `<td>
          <div style="display:flex;gap:4px">
            <button class="btn btn-sm btn-info" onclick="PageTurmas.openModal('${t.id}')" title="Editar"><i class="fas fa-edit"></i></button>
            <button class="btn btn-sm btn-danger" onclick="PageTurmas.delete('${t.id}')" title="Excluir"><i class="fas fa-trash"></i></button>
          </div>
        </td>` : ''}
      </tr>`;
    }).join('');
  },

  openModal(id = null) {
    document.getElementById('turmaModalTitle').textContent = id ? 'Editar Turma' : 'Nova Turma';
    document.getElementById('turmaId').value = id || '';

    if (id) {
      const t = this._data.find(x => x.id === id);
      if (t) {
        document.getElementById('turmaNome').value = t.name || '';
        document.getElementById('turmaClasse').value = t.classeId || '';
        document.getElementById('turmaTurno').value = t.turnoId || '';
        document.getElementById('turmaSala').value = t.sala || '';
        document.getElementById('turmaCapacidade').value = t.capacidade || 45;
        document.getElementById('turmaStatus').value = t.status || 'Activo';
        this.onClasseChange();
        setTimeout(() => {
          document.getElementById('turmaCurso').value = t.curso || '';
        }, 100);
      }
    } else {
      document.getElementById('turmaForm').reset();
      document.getElementById('turmaCapacidade').value = 45;
      document.getElementById('turmaCursoGroup').style.display = 'none';
    }
    document.getElementById('turmaModal').classList.add('active');
  },

  closeModal() {
    document.getElementById('turmaModal').classList.remove('active');
  },

  async save() {
    const id = document.getElementById('turmaId').value;
    const classeId = document.getElementById('turmaClasse').value;
    const turnoId = document.getElementById('turmaTurno').value;
    const classe = this._classes.find(c => c.id === classeId);
    const turno = this._turnos.find(t => t.id === turnoId);

    const data = {
      name: document.getElementById('turmaNome').value.trim(),
      classeId: classeId,
      classeName: classe ? classe.name : '',
      classeCiclo: classe ? classe.ciclo : '',
      turnoId: turnoId,
      turnoName: turno ? turno.name : '',
      curso: document.getElementById('turmaCurso').value || '',
      sala: document.getElementById('turmaSala').value.trim(),
      capacidade: parseInt(document.getElementById('turmaCapacidade').value) || 45,
      status: document.getElementById('turmaStatus').value,
      schoolId: APP.currentSchool.id,
      yearId: APP.currentYearId || ''
    };

    showLoading(true);
    try {
      await DB.saveDoc('turmas', id || Utils.generateId(), data);
      Utils.toast(id ? 'Turma atualizada!' : 'Turma criada!', 'success');
      this.closeModal();
      await this.loadData();
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  async delete(id) {
    const ok = await Utils.confirm('Excluir esta turma?');
    if (!ok) return;
    showLoading(true);
    try {
      await DB.deleteDocument('turmas', id);
      Utils.toast('Turma excluída!', 'success');
      await this.loadData();
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  exportXLSX() {
    const data = this._filtered.map((t, i) => ({
      '#': i + 1, 'Turma': t.name, 'Classe': t.classeName, 'Turno': t.turnoName,
      'Curso': t.curso || '', 'Sala': t.sala, 'Capacidade': t.capacidade, 'Alunos': t._numAlunos || 0, 'Status': t.status
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Turmas');
    XLSX.writeFile(wb, 'turmas.xlsx');
  },

  exportPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('landscape');
    let y = PDFHelper.addHeader(doc, APP.currentSchool, { title: 'TURMAS' });
    doc.autoTable({
      startY: y + 5,
      head: [['#', 'Turma', 'Classe', 'Turno', 'Curso', 'Sala', 'Cap.', 'Alunos', 'Status']],
      body: this._filtered.map((t, i) => [i + 1, t.name, t.classeName, t.turnoName, t.curso || '', t.sala, t.capacidade, t._numAlunos || 0, t.status]),
      styles: { fontSize: 8 }, headStyles: { fillColor: [15, 23, 42] }
    });
    doc.save('turmas.pdf');
  }
};

  _data: [],
  _filtered: [],
  _classes: [],

  async loadFilters() {
    this._classes = await DB.getCollection('classes', [FB.where('schoolId', '==', APP.currentSchool.id)]);
    this._classes.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));

    const selF = document.getElementById('filterDiscClasse');
    const selM = document.getElementById('discClasse');
    this._classes.forEach(c => {
      selF.innerHTML += `<option value="${c.id}">${c.name}</option>`;
      selM.innerHTML += `<option value="${c.id}" data-ciclo="${c.ciclo}" data-cursos='${JSON.stringify(c.cursos || [])}'>${c.name}</option>`;
    });
  },

  onClasseChange() {
    const sel = document.getElementById('discClasse');
    const opt = sel.options[sel.selectedIndex];
    const ciclo = opt?.dataset?.ciclo;
    const cursos = JSON.parse(opt?.dataset?.cursos || '[]');
    const group = document.getElementById('discCursoGroup');
    const cursoSel = document.getElementById('discCurso');

    if (ciclo === 'ciclo2' && cursos.length > 0) {
      group.style.display = 'block';
      cursoSel.innerHTML = '<option value="">Todas (Geral)</option>';
      cursos.forEach(c => cursoSel.innerHTML += `<option value="${c}">${c}</option>`);
    } else {
      group.style.display = 'none';
    }
  },

  async loadData() {
    try {
      this._data = await DB.getCollection('disciplinas', [FB.where('schoolId', '==', APP.currentSchool.id)]);
      this._data.sort((a, b) => {
        const ca = this._classes.find(c => c.id === a.classeId);
        const cb = this._classes.find(c => c.id === b.classeId);
        const oa = ca ? ca.ordem : 99;
        const ob = cb ? cb.ordem : 99;
        if (oa !== ob) return oa - ob;
        return (a.ordem || 0) - (b.ordem || 0);
      });
      this._filtered = [...this._data];
      this.renderTable();
    } catch (e) { console.error(e); }
  },

  filter() {
    const term = (document.getElementById('searchDisc')?.value || '').toLowerCase();
    const classeId = document.getElementById('filterDiscClasse')?.value || '';
    const categ = document.getElementById('filterDiscCateg')?.value || '';
    this._filtered = this._data.filter(d => {
      return ((d.name || '').toLowerCase().includes(term)) &&
        (!classeId || d.classeId === classeId) &&
        (!categ || d.categoria === categ);
    });
    this.renderTable();
  },

  renderTable() {
    const tbody = document.getElementById('discTableBody');
    if (!tbody) return;
    const canEdit = ['superadmin', 'diretor', 'subdiretor_pedagogico'].includes(APP.currentUser.role);
    const categNames = { 'geral': 'Formação Geral', 'especifica': 'Formação Específica', 'opcional': 'Disciplina Opcional' };

    if (this._filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="10" class="text-center">Nenhuma disciplina cadastrada</td></tr>';
      return;
    }

    tbody.innerHTML = this._filtered.map((d, i) => {
      const classe = this._classes.find(c => c.id === d.classeId);
      return `<tr>
        <td>${i + 1}</td>
        <td class="text-center">${d.ordem || 0}</td>
        <td><strong>${d.name || ''}</strong></td>
        <td>${classe ? classe.name : d.classeName || ''}</td>
        <td>${d.curso || '-'}</td>
        <td><span class="badge badge-${d.categoria === 'especifica' ? 'info' : d.categoria === 'opcional' ? 'warning' : 'primary'}">${categNames[d.categoria] || 'Geral'}</span></td>
        <td>${d.area || '-'}</td>
        <td class="text-center">${d.cargaHoraria || '-'}</td>
        <td><span class="badge ${d.status === 'Activo' ? 'badge-success' : 'badge-danger'}">${d.status || 'Activo'}</span></td>
        ${canEdit ? `<td>
          <div style="display:flex;gap:4px">
            <button class="btn btn-sm btn-info" onclick="PageDisciplinas.openModal('${d.id}')"><i class="fas fa-edit"></i></button>
            <button class="btn btn-sm btn-warning" onclick="PageDisciplinas.moveOrder('${d.id}',-1)" title="Subir"><i class="fas fa-arrow-up"></i></button>
            <button class="btn btn-sm btn-warning" onclick="PageDisciplinas.moveOrder('${d.id}',1)" title="Descer"><i class="fas fa-arrow-down"></i></button>
            <button class="btn btn-sm btn-danger" onclick="PageDisciplinas.delete('${d.id}')"><i class="fas fa-trash"></i></button>
          </div>
        </td>` : ''}
      </tr>`;
    }).join('');
  },

  async moveOrder(id, direction) {
    const disc = this._data.find(d => d.id === id);
    if (!disc) return;
    const newOrder = (disc.ordem || 0) + direction;
    showLoading(true);
    try {
      await DB.saveDoc('disciplinas', id, { ordem: newOrder });
      await this.loadData();
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  openModal(id = null) {
    document.getElementById('discModalTitle').textContent = id ? 'Editar Disciplina' : 'Nova Disciplina';
    document.getElementById('discId').value = id || '';

    if (id) {
      const d = this._data.find(x => x.id === id);
      if (d) {
        document.getElementById('discNome').value = d.name || '';
        document.getElementById('discClasse').value = d.classeId || '';
        document.getElementById('discCategoria').value = d.categoria || 'geral';
        document.getElementById('discArea').value = d.area || '';
        document.getElementById('discCH').value = d.cargaHoraria || '';
        document.getElementById('discOrdem').value = d.ordem || 0;
        document.getElementById('discStatus').value = d.status || 'Activo';
        this.onClasseChange();
        setTimeout(() => {
          if (d.curso) document.getElementById('discCurso').value = d.curso;
        }, 100);
      }
    } else {
      document.getElementById('discForm').reset();
      document.getElementById('discOrdem').value = 0;
      document.getElementById('discCursoGroup').style.display = 'none';
    }
    document.getElementById('discModal').classList.add('active');
  },

  closeModal() { document.getElementById('discModal').classList.remove('active'); },

  async save() {
    const id = document.getElementById('discId').value;
    const classeId = document.getElementById('discClasse').value;
    const classe = this._classes.find(c => c.id === classeId);

    const data = {
      name: document.getElementById('discNome').value.trim(),
      classeId: classeId,
      classeName: classe ? classe.name : '',
      classeCiclo: classe ? classe.ciclo : '',
      curso: document.getElementById('discCurso')?.value || '',
      categoria: document.getElementById('discCategoria').value,
      area: document.getElementById('discArea').value,
      cargaHoraria: parseInt(document.getElementById('discCH').value) || 0,
      ordem: parseInt(document.getElementById('discOrdem').value) || 0,
      status: document.getElementById('discStatus').value,
      schoolId: APP.currentSchool.id
    };

    showLoading(true);
    try {
      await DB.saveDoc('disciplinas', id || Utils.generateId(), data);
      Utils.toast(id ? 'Disciplina atualizada!' : 'Disciplina criada!', 'success');
      this.closeModal();
      await this.loadData();
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  async delete(id) {
    const ok = await Utils.confirm('Excluir esta disciplina?');
    if (!ok) return;
    showLoading(true);
    try {
      await DB.deleteDocument('disciplinas', id);
      Utils.toast('Disciplina excluída!', 'success');
      await this.loadData();
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  exportXLSX() {
    const categNames = { 'geral': 'Formação Geral', 'especifica': 'Formação Específica', 'opcional': 'Disciplina Opcional' };
    const data = this._filtered.map((d, i) => ({
      '#': i + 1, 'Ordem': d.ordem, 'Disciplina': d.name, 'Classe': d.classeName,
      'Curso': d.curso || '', 'Categoria': categNames[d.categoria] || '', 'Área': d.area || '',
      'C.H.': d.cargaHoraria, 'Status': d.status
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Disciplinas');
    XLSX.writeFile(wb, 'disciplinas.xlsx');
  },

  exportPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    let y = PDFHelper.addHeader(doc, APP.currentSchool, { title: 'DISCIPLINAS' });
    const categNames = { 'geral': 'Geral', 'especifica': 'Específica', 'opcional': 'Opcional' };
    doc.autoTable({
      startY: y + 5,
      head: [['#', 'Ord.', 'Disciplina', 'Classe', 'Curso', 'Categoria', 'C.H.']],
      body: this._filtered.map((d, i) => [i + 1, d.ordem || 0, d.name, d.classeName, d.curso || '', categNames[d.categoria] || '', d.cargaHoraria || '']),
      styles: { fontSize: 8 }, headStyles: { fillColor: [15, 23, 42] }
    });
    doc.save('disciplinas.pdf');
  }
};

    const id = document.getElementById('atribId').value;
    const profId = document.getElementById('atribProfessor').value;
    const classeId = document.getElementById('atribClasse').value;
    const turmaId = document.getElementById('atribTurma').value;
    const discId = document.getElementById('atribDisciplina').value;

    const prof = this._professors.find(p => (p.uid || p.id) === profId);
    const classe = this._classes.find(c => c.id === classeId);
    const turma = this._turmas.find(t => t.id === turmaId);
    const disc = this._disciplinas.find(d => d.id === discId);

    const data = {
      professorId: profId,
      professorName: prof ? prof.name : '',
      classeId: classeId,
      classeName: classe ? classe.name : '',
      turmaId: turmaId,
      turmaName: turma ? turma.name : '',
      turnoName: turma ? turma.turnoName : '',
      curso: turma ? turma.curso : '',
      disciplinaId: discId,
      disciplinaName: disc ? disc.name : '',
      dia: document.getElementById('atribDia').value,
      horaInicio: document.getElementById('atribHoraInicio').value,
      horaFim: document.getElementById('atribHoraFim').value,
      sala: document.getElementById('atribSala').value.trim(),
      schoolId: APP.currentSchool.id,
      yearId: APP.currentYearId || ''
    };

    // Validar conflitos
    const conflito = this._data.find(a => a.id !== id &&
      a.professorId === profId && a.dia === data.dia && data.dia &&
      a.horaInicio === data.horaInicio && data.horaInicio
    );
    if (conflito) {
      Utils.toast('Conflito: Professor já tem aula neste horário!', 'warning');
      return;
    }

    showLoading(true);
    try {
      await DB.saveDoc('atribuicoes', id || Utils.generateId(), data);
      Utils.toast(id ? 'Atribuição atualizada!' : 'Atribuição criada!', 'success');
      this.closeModal();
      await this.loadData();
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  async delete(id) {
    const ok = await Utils.confirm('Excluir esta atribuição?');
    if (!ok) return;
    showLoading(true);
    try {
      await DB.deleteDocument('atribuicoes', id);
      Utils.toast('Atribuição excluída!', 'success');
      await this.loadData();
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  exportPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('landscape');
    let y = PDFHelper.addHeader(doc, APP.currentSchool, { title: 'ATRIBUIÇÕES - PROFESSOR / DISCIPLINA / TURMA' });
    doc.autoTable({
      startY: y + 5,
      head: [['#', 'Professor', 'Disciplina', 'Classe', 'Turma', 'Turno', 'Curso', 'Horário', 'Sala']],
      body: this._filtered.map((a, i) => [
        i + 1, a.professorName, a.disciplinaName, a.classeName, a.turmaName,
        a.turnoName, a.curso || '', a.dia ? `${a.dia} ${a.horaInicio}-${a.horaFim}` : '', a.sala || ''
      ]),
      styles: { fontSize: 7 }, headStyles: { fillColor: [15, 23, 42] }
    });
    doc.save('atribuicoes.pdf');
  }
};

  _data: [],

  async loadFilters() {

    // Preencher filtros

    const selMC = document.getElementById('alunoClasse');
    const selRC = document.getElementById('rematriculaClasse');

    const selFT = document.getElementById('filterAlunoTurma');

      if (selFT) selFT.innerHTML += `<option value="${t.id}">${t.classeName} - ${t.name} ${t.curso ? '(' + t.curso + ')' : ''}</option>`;
