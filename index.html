        <div id="devedoresStats" class="stats-grid mb-3"></div>
        <div class="table-container">
          <table>
            <thead><tr><th>#</th><th>Aluno</th><th>Classe</th><th>Turma</th><th>Título</th><th>Valor (Kz)</th><th>Mês</th><th>Estado</th></tr></thead>
            <tbody id="devedoresTableBody"><tr><td colspan="8" class="text-center">Selecione filtros para carregar</td></tr></tbody>
          </table>
        </div>
      </div>

      <div id="tabPagHistorico" class="tab-content">
        <div class="toolbar mb-3">
          <div class="toolbar-left">
            <input type="text" class="search-input" id="histPagSearch" placeholder="Pesquisar..." oninput="PagePagamentos.filterHistorico()">
          </div>
          <div class="toolbar-right">
            <button class="btn btn-outline" onclick="PagePagamentos.exportHistoricoPDF()"><i class="fas fa-file-pdf"></i></button>
            <button class="btn btn-outline" onclick="PagePagamentos.exportHistoricoXLSX()"><i class="fas fa-file-excel"></i></button>
          </div>
        </div>
        <div class="table-container">
          <table>
            <thead><tr><th>#</th><th>Data</th><th>Aluno</th><th>Título</th><th>Valor (Kz)</th><th>Mês</th><th>Forma</th><th>Recibo</th></tr></thead>
            <tbody id="histPagTableBody"><tr><td colspan="8" class="text-center">Carregando...</td></tr></tbody>
          </table>
        </div>
      </div>`;

    await this.loadData();
  },

  _titulos: [], _pagamentos: [], _filteredPag: [], _allAlunos: [], _selectedAluno: null, _devedores: [],

  async loadData() {
    const sid = APP.currentSchool.id;
    this._titulos = await DB.getCollection('titulosPagamento', [FB.where('schoolId', '==', sid), FB.where('status', '==', 'Activo')]);

    let pagQ = [FB.where('schoolId', '==', sid)];
    if (APP.currentYearId) pagQ.push(FB.where('yearId', '==', APP.currentYearId));
    this._pagamentos = await DB.getCollection('pagamentos', pagQ);
    this._pagamentos.sort((a, b) => (b.data || '').localeCompare(a.data || ''));
    this._filteredPag = [...this._pagamentos];

    let alunoQ = [FB.where('schoolId', '==', sid)];
    if (APP.currentYearId) alunoQ.push(FB.where('yearId', '==', APP.currentYearId));
    this._allAlunos = await DB.getCollection('alunos', alunoQ);

    // Preencher filtros
    const selT = document.getElementById('pagTitulo');
    const selDT = document.getElementById('devTitulo');
    this._titulos.forEach(t => {
      if (selT) selT.innerHTML += `<option value="${t.id}" data-valor="${t.valor}">${t.name} - ${(parseFloat(t.valor) || 0).toLocaleString('pt-AO')} Kz</option>`;
      if (selDT) selDT.innerHTML += `<option value="${t.id}">${t.name}</option>`;
    });

    this.renderHistorico();
  },

  switchTab(tab) {
    document.querySelectorAll('.tab-item').forEach((t, i) => t.classList.toggle('active', (i === 0 && tab === 'registar') || (i === 1 && tab === 'devedores') || (i === 2 && tab === 'historico')));
    document.getElementById('tabPagRegistar').classList.toggle('active', tab === 'registar');
    document.getElementById('tabPagDevedores').classList.toggle('active', tab === 'devedores');
    document.getElementById('tabPagHistorico').classList.toggle('active', tab === 'historico');
    if (tab === 'devedores') this.loadDevedores();
  },

  searchAluno() {
    const term = (document.getElementById('pagSearchAluno')?.value || '').toLowerCase().trim();
    const div = document.getElementById('pagSearchResults');
    if (!term || term.length < 2) { div.style.display = 'none'; return; }
    const matches = this._allAlunos.filter(a =>
      (a.estado === 'Activo' || a.estado === 'Ativo') &&
      ((a.name || '').toLowerCase().includes(term) || (a.bi || '').toLowerCase().includes(term) || (a.matricula || '').toLowerCase().includes(term))
    ).slice(0, 8);
    div.innerHTML = matches.map(a => `
      <div style="padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--border)"
           onmouseover="this.style.background='#f0f4ff'" onmouseout="this.style.background=''"
           onclick="PagePagamentos.selectAluno('${a.id}')">
        <strong style="color:var(--angola-red)">${a.name}</strong> - ${a.classeName || ''} | Mat: ${a.matricula || ''}
      </div>`).join('');
    div.style.display = 'block';
  },

  selectAluno(id) {
    document.getElementById('pagSearchResults').style.display = 'none';
    this._selectedAluno = this._allAlunos.find(a => a.id === id);
    if (!this._selectedAluno) return;

    const a = this._selectedAluno;
    // Pagamentos deste aluno
    const pagAluno = this._pagamentos.filter(p => p.alunoId === id);

    document.getElementById('pagAlunoInfo').style.display = 'block';
    document.getElementById('pagAlunoInfo').innerHTML = `
      <div style="background:#f8fafc;padding:12px;border-radius:var(--radius);display:flex;gap:12px;align-items:center">
        ${a.photo ? `<img src="${a.photo}" class="photo-small" style="width:50px;height:50px">` : '<i class="fas fa-user-circle" style="font-size:40px;color:var(--text-light)"></i>'}
        <div>
          <h4 style="color:var(--angola-red)">${a.name}</h4>
          <p>Classe: ${a.classeName || ''} | Turma: ${a.turmaName || ''} | Mat: ${a.matricula || ''}</p>
          <p>Pagamentos feitos: ${pagAluno.length} | Total pago: ${pagAluno.reduce((s, p) => s + (parseFloat(p.valor) || 0), 0).toLocaleString('pt-AO')} Kz</p>
        </div>
      </div>`;

    document.getElementById('pagForm').style.display = 'block';
  },

  onTituloChange() {
    const sel = document.getElementById('pagTitulo');
    const opt = sel.options[sel.selectedIndex];
    document.getElementById('pagValor').value = opt?.dataset?.valor || '';
  },

  async registarPagamento() {
    const aluno = this._selectedAluno;
    if (!aluno) { Utils.toast('Selecione um aluno', 'warning'); return; }
    const tituloId = document.getElementById('pagTitulo').value;
    const valor = parseFloat(document.getElementById('pagValor').value);
    if (!tituloId || !valor) { Utils.toast('Selecione título e valor', 'warning'); return; }

    const titulo = this._titulos.find(t => t.id === tituloId);
    const data = {
      alunoId: aluno.id,
      alunoName: aluno.name,
      classeName: aluno.classeName || '',
      turmaName: aluno.turmaName || '',
      tituloId: tituloId,
      tituloName: titulo ? titulo.name : '',
      valor: valor,
      mes: document.getElementById('pagMes').value,
      forma: document.getElementById('pagForma').value,
      observacao: document.getElementById('pagObs').value.trim(),
      data: new Date().toISOString().split('T')[0],
      recibo: 'REC-' + Date.now().toString().slice(-8),
      registadoPor: APP.currentUser.name,
      schoolId: APP.currentSchool.id,
      yearId: APP.currentYearId || '',
      status: 'pago'
    };

    showLoading(true);
    try {
      const pagId = Utils.generateId();
      await DB.saveDoc('pagamentos', pagId, data);

      // Registar como receita automaticamente
      await DB.saveDoc('receitas', Utils.generateId(), {
        descricao: `${titulo ? titulo.name : 'Pagamento'} - ${aluno.name}`,
        valor: valor,
        data: data.data,
        categoria: 'Propina/Taxa',
        referencia: data.recibo,
        pagamentoId: pagId,
        schoolId: APP.currentSchool.id,
        yearId: APP.currentYearId || ''
      });

      Utils.toast(`Pagamento registado! Recibo: ${data.recibo}`, 'success');

      // Reset
      document.getElementById('pagForm').style.display = 'none';
      document.getElementById('pagAlunoInfo').style.display = 'none';
      document.getElementById('pagSearchAluno').value = '';
      this._selectedAluno = null;
      await this.loadData();
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  // ====== DEVEDORES ======
  async loadDevedores() {
    const tituloId = document.getElementById('devTitulo')?.value || '';
    const mes = document.getElementById('devMes')?.value || '';

    const alunosAtivos = this._allAlunos.filter(a => a.estado === 'Activo' || a.estado === 'Ativo');
    const titulos = tituloId ? this._titulos.filter(t => t.id === tituloId) : this._titulos.filter(t => t.periodo === 'mensal');

    this._devedores = [];

    alunosAtivos.forEach(aluno => {
      titulos.forEach(titulo => {
        // Verificar se classes são aplicáveis
        if (titulo.classes && !titulo.classes.includes('todas') && !titulo.classes.includes(aluno.classeId)) return;

        const meses = mes ? [mes] : ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

        meses.forEach(m => {
          const pago = this._pagamentos.find(p => p.alunoId === aluno.id && p.tituloId === titulo.id && p.mes === m && p.status === 'pago');
          if (!pago) {
            this._devedores.push({
              aluno: aluno.name,
              alunoId: aluno.id,
              classe: aluno.classeName,
              turma: aluno.turmaName,
              titulo: titulo.name,
              valor: titulo.valor,
              mes: m,
              estado: 'Pendente'
            });
          }
        });
      });
    });

    // Stats
    const totalDivida = this._devedores.reduce((s, d) => s + (parseFloat(d.valor) || 0), 0);
    document.getElementById('devedoresStats').innerHTML = `
      <div class="stat-card"><div class="stat-icon red"><i class="fas fa-exclamation-triangle"></i></div><div class="stat-info"><h3>${this._devedores.length}</h3><p>Pagamentos Pendentes</p></div></div>
      <div class="stat-card"><div class="stat-icon orange"><i class="fas fa-money-bill"></i></div><div class="stat-info"><h3>${totalDivida.toLocaleString('pt-AO')} Kz</h3><p>Total em Dívida</p></div></div>
    `;

    this.renderDevedores();
  },

  renderDevedores() {
    const tbody = document.getElementById('devedoresTableBody');
    if (!tbody) return;
    if (this._devedores.length === 0) { tbody.innerHTML = '<tr><td colspan="8" class="text-center">Nenhum devedor encontrado</td></tr>'; return; }
    tbody.innerHTML = this._devedores.slice(0, 100).map((d, i) => `<tr>
      <td>${i + 1}</td>
      <td><strong class="nome-aluno">${d.aluno}</strong></td>
      <td>${d.classe || ''}</td>
      <td>${d.turma || ''}</td>
      <td>${d.titulo || ''}</td>
      <td><strong style="color:var(--danger)">${(parseFloat(d.valor) || 0).toLocaleString('pt-AO')} Kz</strong></td>
      <td>${d.mes || ''}</td>
      <td><span class="badge badge-danger">${d.estado}</span></td>
    </tr>`).join('');
  },

  // ====== HISTÓRICO ======
  filterHistorico() {
    const term = (document.getElementById('histPagSearch')?.value || '').toLowerCase();
    this._filteredPag = this._pagamentos.filter(p => (p.alunoName || '').toLowerCase().includes(term) || (p.tituloName || '').toLowerCase().includes(term) || (p.recibo || '').toLowerCase().includes(term));
    this.renderHistorico();
  },

  renderHistorico() {
    const tbody = document.getElementById('histPagTableBody');
    if (!tbody) return;
    if (this._filteredPag.length === 0) { tbody.innerHTML = '<tr><td colspan="8" class="text-center">Nenhum pagamento encontrado</td></tr>'; return; }
    tbody.innerHTML = this._filteredPag.map((p, i) => `<tr>
      <td>${i + 1}</td>
      <td>${p.data || ''}</td>
      <td><strong class="nome-aluno">${p.alunoName || ''}</strong></td>
      <td>${p.tituloName || ''}</td>
      <td><strong style="color:var(--success)">${(parseFloat(p.valor) || 0).toLocaleString('pt-AO')} Kz</strong></td>
      <td>${p.mes || ''}</td>
      <td>${p.forma || ''}</td>
      <td><small>${p.recibo || ''}</small></td>
    </tr>`).join('');
  },

  // ====== EXPORTS ======
  exportDevedoresPDF() {
    if (!this._devedores.length) return;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    let y = PDFHelper.addHeader(doc, APP.currentSchool, { title: 'LISTA DE DEVEDORES' });
    doc.autoTable({
      startY: y + 5,
      head: [['#', 'Aluno', 'Classe', 'Título', 'Valor (Kz)', 'Mês', 'Estado']],
      body: this._devedores.slice(0, 200).map((d, i) => [i + 1, d.aluno, d.classe, d.titulo, (parseFloat(d.valor) || 0).toLocaleString('pt-AO'), d.mes, d.estado]),
      styles: { fontSize: 7 }, headStyles: { fillColor: [15, 23, 42] }
    });
    doc.save('devedores.pdf');
  },

  exportDevedoresXLSX() {
    const data = this._devedores.map((d, i) => ({ '#': i + 1, 'Aluno': d.aluno, 'Classe': d.classe, 'Turma': d.turma, 'Título': d.titulo, 'Valor': d.valor, 'Mês': d.mes, 'Estado': d.estado }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Devedores');
    XLSX.writeFile(wb, 'devedores.xlsx');
  },

  exportHistoricoPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    let y = PDFHelper.addHeader(doc, APP.currentSchool, { title: 'HISTÓRICO DE PAGAMENTOS' });
    doc.autoTable({
      startY: y + 5,
      head: [['#', 'Data', 'Aluno', 'Título', 'Valor (Kz)', 'Mês', 'Forma', 'Recibo']],
      body: this._filteredPag.map((p, i) => [i + 1, p.data, p.alunoName, p.tituloName, (parseFloat(p.valor) || 0).toLocaleString('pt-AO'), p.mes || '', p.forma, p.recibo]),
      styles: { fontSize: 7 }, headStyles: { fillColor: [15, 23, 42] }
    });
    doc.save('pagamentos.pdf');
  },

  exportHistoricoXLSX() {
    const data = this._filteredPag.map((p, i) => ({ '#': i + 1, 'Data': p.data, 'Aluno': p.alunoName, 'Título': p.tituloName, 'Valor': p.valor, 'Mês': p.mes, 'Forma': p.forma, 'Recibo': p.recibo }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Pagamentos');
    XLSX.writeFile(wb, 'pagamentos.xlsx');
  }
};

    document.getElementById('receitaForm').onsubmit = async (e) => { e.preventDefault(); await PageReceitasDespesas.saveReceita(); };
    document.getElementById('despesaForm').onsubmit = async (e) => { e.preventDefault(); await PageReceitasDespesas.saveDespesa(); };
  },

  _receitas: [], _despesas: [], _filteredRec: [], _filteredDesp: [],

  async loadData() {
    const sid = APP.currentSchool.id;
    let q = [FB.where('schoolId', '==', sid)];
    if (APP.currentYearId) q.push(FB.where('yearId', '==', APP.currentYearId));

    this._receitas = await DB.getCollection('receitas', q);
    this._receitas.sort((a, b) => (b.data || '').localeCompare(a.data || ''));
    this._filteredRec = [...this._receitas];

    this._despesas = await DB.getCollection('despesas', q);
    this._despesas.sort((a, b) => (b.data || '').localeCompare(a.data || ''));
    this._filteredDesp = [...this._despesas];

    // Categorias de despesas
    const cats = await DB.getCollection('categoriasDespesa', [FB.where('schoolId', '==', sid)]);
    const selCat = document.getElementById('despesaCat');
    if (selCat) {
      cats.filter(c => c.tipo === 'despesa').forEach(c => { selCat.innerHTML += `<option value="${c.name}">${c.name}</option>`; });
    }

    this.renderStats();
    this.renderReceitas();
    this.renderDespesas();
  },

  switchTab(tab) {
    document.querySelectorAll('.tab-item').forEach((t, i) => t.classList.toggle('active', (i === 0 && tab === 'receitas') || (i === 1 && tab === 'despesas')));
    document.getElementById('tabReceitas').classList.toggle('active', tab === 'receitas');
    document.getElementById('tabDespesas').classList.toggle('active', tab === 'despesas');
  },

  renderStats() {
    const totalRec = this._receitas.reduce((s, r) => s + (parseFloat(r.valor) || 0), 0);
    const totalDesp = this._despesas.reduce((s, r) => s + (parseFloat(r.valor) || 0), 0);
    const saldo = totalRec - totalDesp;
    document.getElementById('finStats').innerHTML = `
      <div class="stat-card"><div class="stat-icon green"><i class="fas fa-arrow-up"></i></div><div class="stat-info"><h3>${totalRec.toLocaleString('pt-AO')} Kz</h3><p>Total Receitas</p></div></div>
      <div class="stat-card"><div class="stat-icon red"><i class="fas fa-arrow-down"></i></div><div class="stat-info"><h3>${totalDesp.toLocaleString('pt-AO')} Kz</h3><p>Total Despesas</p></div></div>
      <div class="stat-card"><div class="stat-icon ${saldo >= 0 ? 'blue' : 'red'}"><i class="fas fa-balance-scale"></i></div><div class="stat-info"><h3>${saldo.toLocaleString('pt-AO')} Kz</h3><p>Saldo</p></div></div>
    `;
  },

  filterReceitas() {
    const term = (document.getElementById('searchReceita')?.value || '').toLowerCase();
    this._filteredRec = this._receitas.filter(r => (r.descricao || '').toLowerCase().includes(term) || (r.categoria || '').toLowerCase().includes(term));
    this.renderReceitas();
  },

  filterDespesas() {
    const term = (document.getElementById('searchDespesa')?.value || '').toLowerCase();
    this._filteredDesp = this._despesas.filter(d => (d.descricao || '').toLowerCase().includes(term) || (d.categoria || '').toLowerCase().includes(term));
    this.renderDespesas();
  },

  renderReceitas() {
    const tbody = document.getElementById('receitaTableBody');
    if (!tbody) return;
    if (this._filteredRec.length === 0) { tbody.innerHTML = '<tr><td colspan="7" class="text-center">Nenhuma receita registada</td></tr>'; return; }
    tbody.innerHTML = this._filteredRec.map((r, i) => `<tr>
      <td>${i + 1}</td><td>${r.data || ''}</td><td>${r.descricao || ''}</td><td>${r.categoria || ''}</td>
      <td><strong style="color:var(--success)">${(parseFloat(r.valor) || 0).toLocaleString('pt-AO')} Kz</strong></td>
      <td><small>${r.referencia || ''}</small></td>
      <td>
        <button class="btn btn-sm btn-info" onclick="PageReceitasDespesas.openReceitaModal('${r.id}')"><i class="fas fa-edit"></i></button>
        <button class="btn btn-sm btn-danger" onclick="PageReceitasDespesas.deleteReceita('${r.id}')"><i class="fas fa-trash"></i></button>
      </td>
    </tr>`).join('');
  },

  renderDespesas() {
    const tbody = document.getElementById('despesaTableBody');
    if (!tbody) return;
    if (this._filteredDesp.length === 0) { tbody.innerHTML = '<tr><td colspan="7" class="text-center">Nenhuma despesa registada</td></tr>'; return; }
    tbody.innerHTML = this._filteredDesp.map((d, i) => `<tr>
      <td>${i + 1}</td><td>${d.data || ''}</td><td>${d.descricao || ''}</td><td>${d.categoria || ''}</td>
      <td><strong style="color:var(--danger)">${(parseFloat(d.valor) || 0).toLocaleString('pt-AO')} Kz</strong></td>
      <td><small>${d.beneficiario || ''}</small></td>
      <td>
        <button class="btn btn-sm btn-info" onclick="PageReceitasDespesas.openDespesaModal('${d.id}')"><i class="fas fa-edit"></i></button>
        <button class="btn btn-sm btn-danger" onclick="PageReceitasDespesas.deleteDespesa('${d.id}')"><i class="fas fa-trash"></i></button>
      </td>
    </tr>`).join('');
  },

  openReceitaModal(id = null) {
    document.getElementById('receitaModalTitle').textContent = id ? 'Editar Receita' : 'Nova Receita';
    document.getElementById('receitaId').value = id || '';
    if (id) {
      const r = this._receitas.find(x => x.id === id);
      if (r) { document.getElementById('receitaData').value = r.data || ''; document.getElementById('receitaDesc').value = r.descricao || ''; document.getElementById('receitaCat').value = r.categoria || ''; document.getElementById('receitaValor').value = r.valor || ''; document.getElementById('receitaRef').value = r.referencia || ''; }
    } else { document.getElementById('receitaForm').reset(); document.getElementById('receitaData').value = new Date().toISOString().split('T')[0]; }
    document.getElementById('receitaModal').classList.add('active');
  },

  openDespesaModal(id = null) {
    document.getElementById('despesaModalTitle').textContent = id ? 'Editar Despesa' : 'Nova Despesa';
    document.getElementById('despesaId').value = id || '';
    if (id) {
      const d = this._despesas.find(x => x.id === id);
      if (d) { document.getElementById('despesaData').value = d.data || ''; document.getElementById('despesaDesc').value = d.descricao || ''; document.getElementById('despesaCat').value = d.categoria || ''; document.getElementById('despesaValor').value = d.valor || ''; document.getElementById('despesaBenef').value = d.beneficiario || ''; }
    } else { document.getElementById('despesaForm').reset(); document.getElementById('despesaData').value = new Date().toISOString().split('T')[0]; }
    document.getElementById('despesaModal').classList.add('active');
  },

  async saveReceita() {
    const id = document.getElementById('receitaId').value;
    const data = {
      data: document.getElementById('receitaData').value,
      descricao: document.getElementById('receitaDesc').value.trim(),
      categoria: document.getElementById('receitaCat').value.trim(),
      valor: parseFloat(document.getElementById('receitaValor').value) || 0,
      referencia: document.getElementById('receitaRef').value.trim(),
      schoolId: APP.currentSchool.id,
      yearId: APP.currentYearId || ''
    };
    showLoading(true);
    try {
      await DB.saveDoc('receitas', id || Utils.generateId(), data);
      Utils.toast('Receita salva!', 'success');
      document.getElementById('receitaModal').classList.remove('active');
      await this.loadData();
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  async saveDespesa() {
    const id = document.getElementById('despesaId').value;
    const data = {
      data: document.getElementById('despesaData').value,
      descricao: document.getElementById('despesaDesc').value.trim(),
      categoria: document.getElementById('despesaCat').value,
      valor: parseFloat(document.getElementById('despesaValor').value) || 0,
      beneficiario: document.getElementById('despesaBenef').value.trim(),
      schoolId: APP.currentSchool.id,
      yearId: APP.currentYearId || ''
    };
    showLoading(true);
    try {
      await DB.saveDoc('despesas', id || Utils.generateId(), data);
      Utils.toast('Despesa salva!', 'success');
      document.getElementById('despesaModal').classList.remove('active');
      await this.loadData();
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  async deleteReceita(id) {
    const ok = await Utils.confirm('Excluir esta receita?');
    if (!ok) return;
    showLoading(true);
    try { await DB.deleteDocument('receitas', id); Utils.toast('Excluída!', 'success'); await this.loadData(); }
    catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  async deleteDespesa(id) {
    const ok = await Utils.confirm('Excluir esta despesa?');
    if (!ok) return;
    showLoading(true);
    try { await DB.deleteDocument('despesas', id); Utils.toast('Excluída!', 'success'); await this.loadData(); }
    catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  exportReceitasPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    let y = PDFHelper.addHeader(doc, APP.currentSchool, { title: 'MAPA DE RECEITAS' });
    doc.autoTable({
      startY: y + 5,
      head: [['#', 'Data', 'Descrição', 'Categoria', 'Valor (Kz)', 'Referência']],
      body: this._filteredRec.map((r, i) => [i + 1, r.data, r.descricao, r.categoria, (parseFloat(r.valor) || 0).toLocaleString('pt-AO'), r.referencia || '']),
      styles: { fontSize: 8 }, headStyles: { fillColor: [5, 150, 105] },
      foot: [['', '', '', 'TOTAL:', this._filteredRec.reduce((s, r) => s + (parseFloat(r.valor) || 0), 0).toLocaleString('pt-AO') + ' Kz', '']],
      footStyles: { fillColor: [240, 240, 240], fontStyle: 'bold' }
    });
    doc.save('receitas.pdf');
  },

  exportReceitasXLSX() {
    const data = this._filteredRec.map((r, i) => ({ '#': i + 1, 'Data': r.data, 'Descrição': r.descricao, 'Categoria': r.categoria, 'Valor': r.valor, 'Referência': r.referencia }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Receitas');
    XLSX.writeFile(wb, 'receitas.xlsx');
  },

  exportDespesasPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    let y = PDFHelper.addHeader(doc, APP.currentSchool, { title: 'MAPA DE DESPESAS' });
    doc.autoTable({
      startY: y + 5,
      head: [['#', 'Data', 'Descrição', 'Categoria', 'Valor (Kz)', 'Beneficiário']],
      body: this._filteredDesp.map((d, i) => [i + 1, d.data, d.descricao, d.categoria, (parseFloat(d.valor) || 0).toLocaleString('pt-AO'), d.beneficiario || '']),
      styles: { fontSize: 8 }, headStyles: { fillColor: [220, 38, 38] },
      foot: [['', '', '', 'TOTAL:', this._filteredDesp.reduce((s, d) => s + (parseFloat(d.valor) || 0), 0).toLocaleString('pt-AO') + ' Kz', '']],
      footStyles: { fillColor: [240, 240, 240], fontStyle: 'bold' }
    });
    doc.save('despesas.pdf');
  },

  exportDespesasXLSX() {
    const data = this._filteredDesp.map((d, i) => ({ '#': i + 1, 'Data': d.data, 'Descrição': d.descricao, 'Categoria': d.categoria, 'Valor': d.valor, 'Beneficiário': d.beneficiario }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Despesas');
    XLSX.writeFile(wb, 'despesas.xlsx');
  }
};

<script type="module">
// ============================================================
// MÓDULO: ESTATÍSTICAS
// ============================================================
window.PageEstatisticas = {
  async render(container) {
    const schoolId = APP.currentSchool ? APP.currentSchool.id : null;
    if (!schoolId) {
      container.innerHTML = '<div class="empty-state"><i class="fas fa-school"></i><p>Selecione uma escola primeiro</p></div>';
      return;
    }

    container.innerHTML = `
      <h2 class="page-title"><i class="fas fa-chart-bar"></i> Estatísticas</h2>
      <div class="tabs no-print">
        <div class="tab-item active" onclick="PageEstatisticas.switchTab('geral')">Visão Geral</div>
        <div class="tab-item" onclick="PageEstatisticas.switchTab('academico')">Académico</div>
        <div class="tab-item" onclick="PageEstatisticas.switchTab('frequencia')">Frequência</div>
        <div class="tab-item" onclick="PageEstatisticas.switchTab('financeiro')">Financeiro</div>
      </div>

      <div id="tabEstGeral" class="tab-content active">
        <div id="estGeralStats" class="stats-grid mb-3"></div>
        <div class="grid-2">
          <div class="card"><div class="card-header"><h4><i class="fas fa-users"></i> Alunos por Classe</h4></div>
            <div class="card-body" id="estAlunosPorClasse"></div></div>
          <div class="card"><div class="card-header"><h4><i class="fas fa-venus-mars"></i> Distribuição por Género</h4></div>
            <div class="card-body" id="estGenero"></div></div>
        </div>
        <div class="grid-2 mt-3">
          <div class="card"><div class="card-header"><h4><i class="fas fa-user-check"></i> Estado dos Alunos</h4></div>
            <div class="card-body" id="estEstados"></div></div>
          <div class="card"><div class="card-header"><h4><i class="fas fa-chalkboard-teacher"></i> Funcionários por Cargo</h4></div>
            <div class="card-body" id="estFuncionarios"></div></div>
        </div>
      </div>

      <div id="tabEstAcademico" class="tab-content">
        <div class="card mb-3 no-print">
          <div class="card-body">
            <div class="filter-grid" style="padding:0;box-shadow:none">
              <div class="form-group"><label>Classe</label>
                <select id="estAcadClasse" onchange="PageEstatisticas.onAcadClasseChange()"><option value="">Todas</option></select></div>
              <div class="form-group"><label>Turma</label>
                <select id="estAcadTurma"><option value="">Todas</option></select></div>
              <div class="form-group"><label>Trimestre</label>
                <select id="estAcadTrim"><option value="">Anual</option><option value="1">I Trimestre</option><option value="2">II Trimestre</option><option value="3">III Trimestre</option></select></div>
              <div class="form-group" style="padding-top:20px">
                <button class="btn btn-primary" onclick="PageEstatisticas.loadAcademico()"><i class="fas fa-search"></i> Analisar</button>
              </div>
            </div>
          </div>
        </div>
        <div id="estAcadContent"></div>
      </div>

      <div id="tabEstFrequencia" class="tab-content">
        <div class="card mb-3 no-print">
          <div class="card-body">
            <div class="filter-grid" style="padding:0;box-shadow:none">
              <div class="form-group"><label>Classe</label>
                <select id="estFreqClasse" onchange="PageEstatisticas.onFreqClasseChange()"><option value="">Todas</option></select></div>
              <div class="form-group"><label>Turma</label>
                <select id="estFreqTurma"><option value="">Todas</option></select></div>
              <div class="form-group"><label>Período</label>
                <div class="form-row" style="gap:4px"><input type="date" id="estFreqDe" style="font-size:12px"><input type="date" id="estFreqAte" style="font-size:12px" value="${new Date().toISOString().split('T')[0]}"></div></div>
              <div class="form-group" style="padding-top:20px">
                <button class="btn btn-primary" onclick="PageEstatisticas.loadFrequencia()"><i class="fas fa-search"></i> Analisar</button>
              </div>
            </div>
          </div>
        </div>
        <div id="estFreqContent"></div>
      </div>

      <div id="tabEstFinanceiro" class="tab-content">
        <div id="estFinContent"></div>
      </div>

      <div class="mt-3 no-print" style="text-align:right">
        <button class="btn btn-outline" onclick="PageEstatisticas.exportPDF()"><i class="fas fa-file-pdf"></i> Exportar PDF</button>
        <button class="btn btn-outline" onclick="PageEstatisticas.exportXLSX()"><i class="fas fa-file-excel"></i> Exportar XLSX</button>
      </div>`;

    await this.loadGeral();
    await this.loadFilters();
  },

  _classes: [], _turmas: [], _alunos: [], _users: [],

  switchTab(tab) {
    const tabs = ['geral', 'academico', 'frequencia', 'financeiro'];
    document.querySelectorAll('.tab-item').forEach((t, i) => t.classList.toggle('active', tabs[i] === tab));
    tabs.forEach(t => {
      const el = document.getElementById('tabEst' + t.charAt(0).toUpperCase() + t.slice(1));
      if (el) el.classList.toggle('active', t === tab);
    });
    if (tab === 'financeiro') this.loadFinanceiro();
  },

  async loadFilters() {
    const sid = APP.currentSchool.id;
    this._classes = await DB.getCollection('classes', [FB.where('schoolId', '==', sid)]);
    this._classes.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
    let tQ = [FB.where('schoolId', '==', sid)];
    if (APP.currentYearId) tQ.push(FB.where('yearId', '==', APP.currentYearId));
    this._turmas = await DB.getCollection('turmas', tQ);

    ['estAcadClasse', 'estFreqClasse'].forEach(selId => {
      const sel = document.getElementById(selId);
      if (sel) this._classes.forEach(c => { sel.innerHTML += `<option value="${c.id}">${c.name}</option>`; });
    });
  },

  onAcadClasseChange() {
    const cid = document.getElementById('estAcadClasse').value;
    const sel = document.getElementById('estAcadTurma');
    sel.innerHTML = '<option value="">Todas</option>';
    this._turmas.filter(t => t.classeId === cid).forEach(t => { sel.innerHTML += `<option value="${t.id}">${t.name}</option>`; });
  },

  onFreqClasseChange() {
    const cid = document.getElementById('estFreqClasse').value;
    const sel = document.getElementById('estFreqTurma');
    sel.innerHTML = '<option value="">Todas</option>';
    this._turmas.filter(t => t.classeId === cid).forEach(t => { sel.innerHTML += `<option value="${t.id}">${t.name}</option>`; });
  },

  async loadGeral() {
    const sid = APP.currentSchool.id;
    showLoading(true);
    try {
      let alunoQ = [FB.where('schoolId', '==', sid)];
      if (APP.currentYearId) alunoQ.push(FB.where('yearId', '==', APP.currentYearId));
      this._alunos = await DB.getCollection('alunos', alunoQ);
      this._users = await DB.getCollection('users', [FB.where('schoolId', '==', sid)]);

      const ativos = this._alunos.filter(a => a.estado === 'Activo' || a.estado === 'Ativo');
      const masc = ativos.filter(a => (a.sexo || '').toUpperCase() === 'M').length;
      const fem = ativos.filter(a => (a.sexo || '').toUpperCase() === 'F').length;
      const transf = this._alunos.filter(a => a.estado === 'Transferido').length;
      const desist = this._alunos.filter(a => a.estado === 'Desistente').length;
      const profs = this._users.filter(u => u.role === 'professor' && u.active !== false).length;

      document.getElementById('estGeralStats').innerHTML = `
        <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-users"></i></div><div class="stat-info"><h3>${this._alunos.length}</h3><p>Total Alunos</p></div></div>
        <div class="stat-card"><div class="stat-icon green"><i class="fas fa-user-check"></i></div><div class="stat-info"><h3>${ativos.length}</h3><p>Activos</p></div></div>
        <div class="stat-card"><div class="stat-icon purple"><i class="fas fa-chalkboard-teacher"></i></div><div class="stat-info"><h3>${profs}</h3><p>Professores</p></div></div>
        <div class="stat-card"><div class="stat-icon orange"><i class="fas fa-users"></i></div><div class="stat-info"><h3>${this._turmas.length}</h3><p>Turmas</p></div></div>
      `;

      // Alunos por classe
      const porClasse = {};
      ativos.forEach(a => { const cn = a.classeName || 'N/D'; porClasse[cn] = (porClasse[cn] || 0) + 1; });
      const classesOrd = Object.keys(porClasse).sort((a, b) => Utils.getClasseNum(a) - Utils.getClasseNum(b));
      const maxVal = Math.max(...Object.values(porClasse), 1);

      document.getElementById('estAlunosPorClasse').innerHTML = `
        <div class="chart-bar">
          ${classesOrd.map(c => {
            const h = Math.round((porClasse[c] / maxVal) * 160);
            return `<div class="bar" style="height:${h}px;background:var(--primary)"><span class="bar-value">${porClasse[c]}</span><span class="bar-label">${c.replace(' Classe', '')}</span></div>`;
          }).join('')}
        </div>`;

      // Género
      document.getElementById('estGenero').innerHTML = `
        <div style="display:flex;justify-content:center;gap:40px;padding:20px">
          <div style="text-align:center"><div style="width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#1d4ed8);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:700">${masc}</div><p style="margin-top:8px;font-weight:600">Masculino</p><p style="font-size:12px;color:var(--text-light)">${ativos.length > 0 ? Math.round(masc / ativos.length * 100) : 0}%</p></div>
          <div style="text-align:center"><div style="width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#ec4899,#be185d);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:700">${fem}</div><p style="margin-top:8px;font-weight:600">Feminino</p><p style="font-size:12px;color:var(--text-light)">${ativos.length > 0 ? Math.round(fem / ativos.length * 100) : 0}%</p></div>
        </div>`;

      // Estados
      document.getElementById('estEstados').innerHTML = `
        <div style="display:flex;flex-direction:column;gap:8px;padding:10px">
          ${[
            { label: 'Activos', val: ativos.length, color: '#059669', pct: this._alunos.length > 0 ? Math.round(ativos.length / this._alunos.length * 100) : 0 },
            { label: 'Transferidos', val: transf, color: '#d97706', pct: this._alunos.length > 0 ? Math.round(transf / this._alunos.length * 100) : 0 },
            { label: 'Desistentes', val: desist, color: '#dc2626', pct: this._alunos.length > 0 ? Math.round(desist / this._alunos.length * 100) : 0 }
          ].map(s => `
            <div>
              <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px"><span>${s.label}</span><span><strong>${s.val}</strong> (${s.pct}%)</span></div>
              <div style="width:100%;height:10px;background:#f0f0f0;border-radius:5px;overflow:hidden"><div style="width:${s.pct}%;height:100%;background:${s.color};border-radius:5px"></div></div>
            </div>`).join('')}
        </div>`;

  async loadAcademico() {
    const classeId = document.getElementById('estAcadClasse').value;
    const turmaId = document.getElementById('estAcadTurma').value;
    const trimestre = document.getElementById('estAcadTrim').value;

    showLoading(true);
    try {
      let alunoQ = [FB.where('schoolId', '==', APP.currentSchool.id)];
      if (classeId) alunoQ.push(FB.where('classeId', '==', classeId));
      if (turmaId) alunoQ.push(FB.where('turmaId', '==', turmaId));
      if (APP.currentYearId) alunoQ.push(FB.where('yearId', '==', APP.currentYearId));
      let alunos = await DB.getCollection('alunos', alunoQ);
      alunos = alunos.filter(a => a.estado === 'Activo' || a.estado === 'Ativo');

      let notaQ = [FB.where('schoolId', '==', APP.currentSchool.id)];
      if (classeId) notaQ.push(FB.where('classeId', '==', classeId));
      if (turmaId) notaQ.push(FB.where('turmaId', '==', turmaId));
      if (APP.currentYearId) notaQ.push(FB.where('yearId', '==', APP.currentYearId));
      const notas = await DB.getCollection('notas', notaQ);

      // Calcular estatísticas por disciplina
      const porDisc = {};
      notas.forEach(n => {
        const disc = n.disciplina || n.disciplinaName || 'N/D';
        if (!porDisc[disc]) porDisc[disc] = { total: 0, soma: 0, positivas: 0, negativas: 0 };
        const classe = n.classeName || '';
        const calc = Utils.calcularMedia(n, classe);
        let media = null;
        if (trimestre === '1') media = calc.mt1;
        else if (trimestre === '2') media = calc.mt2;
        else media = calc.mfd;

        if (media !== null) {
          const pos = Utils.getNotaPositiva(classe);
          porDisc[disc].total++;
          porDisc[disc].soma += media;
          if (media >= pos) porDisc[disc].positivas++;
          else porDisc[disc].negativas++;
        }
      });

      const discKeys = Object.keys(porDisc).sort();
      const aprovados = alunos.filter(a => {
        const notasAluno = notas.filter(n => n.alunoId === a.id);
        if (notasAluno.length === 0) return false;
        return notasAluno.every(n => {
          const calc = Utils.calcularMedia(n, a.classeName || '');
          const pos = Utils.getNotaPositiva(a.classeName || '');
          const media = trimestre === '1' ? calc.mt1 : trimestre === '2' ? calc.mt2 : calc.mfd;
          return media !== null && media >= pos;
        });
      }).length;

      const taxaAprovacao = alunos.length > 0 ? Math.round(aprovados / alunos.length * 100) : 0;

      let html = `
        <div class="stats-grid mb-3">
          <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-users"></i></div><div class="stat-info"><h3>${alunos.length}</h3><p>Alunos Analisados</p></div></div>
          <div class="stat-card"><div class="stat-icon green"><i class="fas fa-check-circle"></i></div><div class="stat-info"><h3>${taxaAprovacao}%</h3><p>Taxa de Aprovação</p></div></div>
          <div class="stat-card"><div class="stat-icon purple"><i class="fas fa-book"></i></div><div class="stat-info"><h3>${discKeys.length}</h3><p>Disciplinas</p></div></div>
        </div>

        <div class="card mb-3"><div class="card-header"><h4>Desempenho por Disciplina</h4></div><div class="card-body">
          <div class="table-container"><table class="table-sm">
            <thead><tr><th>Disciplina</th><th class="text-center">Avaliados</th><th class="text-center">Média</th><th class="text-center">Positivas</th><th class="text-center">Negativas</th><th class="text-center">Taxa Aprov.</th></tr></thead>
            <tbody>${discKeys.map(d => {
              const info = porDisc[d];
              const media = info.total > 0 ? Math.round(info.soma / info.total * 10) / 10 : 0;
              const taxa = info.total > 0 ? Math.round(info.positivas / info.total * 100) : 0;
              return `<tr><td><strong>${d}</strong></td><td class="text-center">${info.total}</td>
                <td class="text-center"><strong>${media}</strong></td>
                <td class="text-center nota-positiva">${info.positivas}</td>
                <td class="text-center nota-negativa">${info.negativas}</td>
                <td class="text-center"><span class="badge ${taxa >= 60 ? 'badge-success' : taxa >= 40 ? 'badge-warning' : 'badge-danger'}">${taxa}%</span></td></tr>`;
            }).join('')}</tbody>
          </table></div>
        </div></div>

        <div class="card"><div class="card-header"><h4>Ranking de Disciplinas (Média)</h4></div><div class="card-body">
          ${discKeys.sort((a, b) => {
            const ma = porDisc[a].total > 0 ? porDisc[a].soma / porDisc[a].total : 0;
            const mb = porDisc[b].total > 0 ? porDisc[b].soma / porDisc[b].total : 0;
            return mb - ma;
          }).map((d, i) => {
            const info = porDisc[d];
            const media = info.total > 0 ? Math.round(info.soma / info.total * 10) / 10 : 0;
            const maxMedia = 20;
            const pct = Math.round(media / maxMedia * 100);
            return `<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px"><span>${i + 1}. ${d}</span><span><strong>${media}</strong></span></div>
              <div style="width:100%;height:8px;background:#f0f0f0;border-radius:4px"><div style="width:${pct}%;height:100%;background:${pct >= 50 ? 'var(--success)' : 'var(--danger)'};border-radius:4px"></div></div></div>`;
          }).join('')}
        </div></div>`;

      document.getElementById('estAcadContent').innerHTML = html;
    } catch (e) { console.error(e); Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  async loadFrequencia() {
    const classeId = document.getElementById('estFreqClasse').value;
    const turmaId = document.getElementById('estFreqTurma').value;
    const de = document.getElementById('estFreqDe').value;
    const ate = document.getElementById('estFreqAte').value;

    showLoading(true);
    try {
      let presQ = [FB.where('schoolId', '==', APP.currentSchool.id), FB.where('tipo', '==', 'aluno')];
      if (classeId) presQ.push(FB.where('classeId', '==', classeId));
      if (turmaId) presQ.push(FB.where('turmaId', '==', turmaId));
      let presencas = await DB.getCollection('presencas', presQ);

      if (de) presencas = presencas.filter(p => p.data >= de);
      if (ate) presencas = presencas.filter(p => p.data <= ate);

      const total = presencas.length;
      const presentes = presencas.filter(p => p.status === 'P').length;
      const faltas = presencas.filter(p => p.status === 'F').length;
      const justif = presencas.filter(p => p.status === 'J').length;
      const atrasos = presencas.filter(p => p.status === 'A').length;
      const taxaFreq = total > 0 ? Math.round((presentes + justif) / total * 100) : 0;

      // Por aluno - top faltosos
      const faltasPorAluno = {};
      presencas.filter(p => p.status === 'F').forEach(p => {
        const name = p.alunoName || 'N/D';
        faltasPorAluno[name] = (faltasPorAluno[name] || 0) + 1;
      });
      const topFaltosos = Object.entries(faltasPorAluno).sort((a, b) => b[1] - a[1]).slice(0, 15);

      document.getElementById('estFreqContent').innerHTML = `
        <div class="stats-grid mb-3">
          <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-clipboard-list"></i></div><div class="stat-info"><h3>${total}</h3><p>Total Registos</p></div></div>
          <div class="stat-card"><div class="stat-icon green"><i class="fas fa-check"></i></div><div class="stat-info"><h3>${presentes}</h3><p>Presenças</p></div></div>
          <div class="stat-card"><div class="stat-icon red"><i class="fas fa-times"></i></div><div class="stat-info"><h3>${faltas}</h3><p>Faltas</p></div></div>
          <div class="stat-card"><div class="stat-icon orange"><i class="fas fa-file-medical"></i></div><div class="stat-info"><h3>${justif}</h3><p>Justificadas</p></div></div>
          <div class="stat-card"><div class="stat-icon teal"><i class="fas fa-percentage"></i></div><div class="stat-info"><h3>${taxaFreq}%</h3><p>Taxa Frequência</p></div></div>
        </div>
        <div class="card"><div class="card-header"><h4><i class="fas fa-exclamation-triangle"></i> Top Alunos com Mais Faltas</h4></div>
          <div class="card-body">
            ${topFaltosos.length === 0 ? '<p style="color:var(--text-light)">Sem dados</p>' :
              '<div class="table-container"><table class="table-sm"><thead><tr><th>#</th><th>Aluno</th><th class="text-center">Faltas</th></tr></thead><tbody>' +
              topFaltosos.map(([name, count], i) => `<tr><td>${i + 1}</td><td><strong class="nome-aluno">${name}</strong></td><td class="text-center"><span class="badge badge-danger">${count}</span></td></tr>`).join('') +
              '</tbody></table></div>'}
          </div>
        </div>`;

    } catch (e) { console.error(e); Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  async loadFinanceiro() {
    showLoading(true);
    try {
      let q = [FB.where('schoolId', '==', APP.currentSchool.id)];
      if (APP.currentYearId) q.push(FB.where('yearId', '==', APP.currentYearId));
      const receitas = await DB.getCollection('receitas', q);
      const despesas = await DB.getCollection('despesas', q);
      const pagamentos = await DB.getCollection('pagamentos', q);

      const totalRec = receitas.reduce((s, r) => s + (parseFloat(r.valor) || 0), 0);
      const totalDesp = despesas.reduce((s, d) => s + (parseFloat(d.valor) || 0), 0);
      const saldo = totalRec - totalDesp;
      const totalPag = pagamentos.reduce((s, p) => s + (parseFloat(p.valor) || 0), 0);

      // Por mês
      const recMes = {}, despMes = {};
      const meses = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
      meses.forEach(m => { recMes[m] = 0; despMes[m] = 0; });
      receitas.forEach(r => { if (r.data) { const m = parseInt(r.data.split('-')[1]) - 1; if (m >= 0 && m < 12) recMes[meses[m]] += parseFloat(r.valor) || 0; } });
      despesas.forEach(d => { if (d.data) { const m = parseInt(d.data.split('-')[1]) - 1; if (m >= 0 && m < 12) despMes[meses[m]] += parseFloat(d.valor) || 0; } });

      const maxMes = Math.max(...Object.values(recMes), ...Object.values(despMes), 1);

      document.getElementById('estFinContent').innerHTML = `
        <div class="stats-grid mb-3">
          <div class="stat-card"><div class="stat-icon green"><i class="fas fa-arrow-up"></i></div><div class="stat-info"><h3>${totalRec.toLocaleString('pt-AO')} Kz</h3><p>Total Receitas</p></div></div>
          <div class="stat-card"><div class="stat-icon red"><i class="fas fa-arrow-down"></i></div><div class="stat-info"><h3>${totalDesp.toLocaleString('pt-AO')} Kz</h3><p>Total Despesas</p></div></div>
          <div class="stat-card"><div class="stat-icon ${saldo >= 0 ? 'blue' : 'red'}"><i class="fas fa-balance-scale"></i></div><div class="stat-info"><h3>${saldo.toLocaleString('pt-AO')} Kz</h3><p>Saldo</p></div></div>
          <div class="stat-card"><div class="stat-icon purple"><i class="fas fa-money-check"></i></div><div class="stat-info"><h3>${pagamentos.length}</h3><p>Pagamentos Recebidos</p></div></div>
        </div>
        <div class="card"><div class="card-header"><h4>Receitas vs Despesas Mensal</h4></div><div class="card-body">
          <div style="display:flex;gap:4px;align-items:flex-end;height:200px;padding-top:20px">
            ${meses.map(m => {
              const hr = Math.round((recMes[m] / maxMes) * 160);
              const hd = Math.round((despMes[m] / maxMes) * 160);
              return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px">
                <div style="display:flex;gap:1px;align-items:flex-end;height:170px">
                  <div style="width:12px;height:${hr}px;background:var(--success);border-radius:2px 2px 0 0" title="Rec: ${recMes[m].toLocaleString()}"></div>
                  <div style="width:12px;height:${hd}px;background:var(--danger);border-radius:2px 2px 0 0" title="Desp: ${despMes[m].toLocaleString()}"></div>
                </div>
                <span style="font-size:9px">${m}</span>
              </div>`;
            }).join('')}
          </div>
          <div style="display:flex;gap:16px;justify-content:center;margin-top:12px;font-size:12px">
            <span><span style="display:inline-block;width:12px;height:12px;background:var(--success);border-radius:2px;vertical-align:middle"></span> Receitas</span>
            <span><span style="display:inline-block;width:12px;height:12px;background:var(--danger);border-radius:2px;vertical-align:middle"></span> Despesas</span>
          </div>
        </div></div>`;

    } catch (e) { console.error(e); }
    showLoading(false);
  },

  exportPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    let y = PDFHelper.addHeader(doc, APP.currentSchool, { title: 'RELATÓRIO ESTATÍSTICO' });
    doc.setFontSize(10);
    doc.text(`Ano Letivo: ${APP.currentYear?.name || 'N/D'}`, 14, y + 3);
    doc.text(`Data: ${Utils.getCurrentDate()}`, 14, y + 8); y += 14;

    const ativos = this._alunos.filter(a => a.estado === 'Activo' || a.estado === 'Ativo');
    doc.autoTable({
      startY: y,
      head: [['Indicador', 'Valor']],
      body: [
        ['Total Alunos', this._alunos.length],
        ['Alunos Activos', ativos.length],
        ['Masculinos', ativos.filter(a => (a.sexo || '').toUpperCase() === 'M').length],
        ['Femininos', ativos.filter(a => (a.sexo || '').toUpperCase() === 'F').length],
        ['Transferidos', this._alunos.filter(a => a.estado === 'Transferido').length],
        ['Desistentes', this._alunos.filter(a => a.estado === 'Desistente').length],
        ['Professores', this._users.filter(u => u.role === 'professor' && u.active !== false).length],
        ['Turmas', this._turmas.length]
      ],
      styles: { fontSize: 9 }, headStyles: { fillColor: [15, 23, 42] }
    });
    doc.save('estatisticas.pdf');
    Utils.toast('PDF exportado!', 'success');
  },

  exportXLSX() {
    const ativos = this._alunos.filter(a => a.estado === 'Activo' || a.estado === 'Ativo');
    const data = [
      { 'Indicador': 'Total Alunos', 'Valor': this._alunos.length },
      { 'Indicador': 'Activos', 'Valor': ativos.length },
      { 'Indicador': 'Masculinos', 'Valor': ativos.filter(a => (a.sexo || '').toUpperCase() === 'M').length },
      { 'Indicador': 'Femininos', 'Valor': ativos.filter(a => (a.sexo || '').toUpperCase() === 'F').length },
      { 'Indicador': 'Transferidos', 'Valor': this._alunos.filter(a => a.estado === 'Transferido').length },
      { 'Indicador': 'Desistentes', 'Valor': this._alunos.filter(a => a.estado === 'Desistente').length },
    ];
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Estatísticas');
    XLSX.writeFile(wb, 'estatisticas.xlsx');
  }
};

        </div>
      </div>`;

  _cardRel(title, icon, color, action) {
    return `<div class="card clickable" onclick="PageRelatorios.generate('${action}')" style="transition:transform 0.2s" onmouseover="this.style.transform='translateY(-3px)'" onmouseout="this.style.transform=''">
      <div class="card-body" style="text-align:center;padding:30px">

        <p style="font-size:11px;color:var(--text-light);margin-top:4px">Clique para gerar PDF</p>
      </div>
    </div>`;
  },

  switchTab(tab) {
    const tabs = ['academico', 'financeiro', 'administrativo'];
    document.querySelectorAll('.tab-item').forEach((t, i) => t.classList.toggle('active', tabs[i] === tab));
    tabs.forEach(t => {
      const el = document.getElementById('tabRel' + t.charAt(0).toUpperCase() + t.slice(1));
      if (el) el.classList.toggle('active', t === tab);
    });
  },

  async generate(action) {
    showLoading(true);
    const { jsPDF } = window.jspdf;
    const sid = APP.currentSchool.id;

    try {
      switch (action) {
        case 'relListaAlunos': {
          let q = [FB.where('schoolId', '==', sid)];
          if (APP.currentYearId) q.push(FB.where('yearId', '==', APP.currentYearId));
          const alunos = await DB.getCollection('alunos', q);
          alunos.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
          const doc = new jsPDF('landscape');
          let y = PDFHelper.addHeader(doc, APP.currentSchool, { title: 'LISTA GERAL DE ALUNOS' });
          doc.autoTable({
            startY: y + 5,
            head: [['#', 'Nome', 'Sexo', 'Classe', 'Turma', 'Matrícula', 'BI', 'Encarregado', 'Telefone', 'Estado']],
            body: alunos.map((a, i) => [i + 1, a.name, a.sexo, a.classeName, a.turmaName, a.matricula, a.bi || '', a.encarregado || '', a.telEncarregado || '', a.estado]),
            styles: { fontSize: 6 }, headStyles: { fillColor: [15, 23, 42] },
            didParseCell: d => { if (d.column.index === 1 && d.section === 'body') { d.cell.styles.textColor = [206, 17, 38]; d.cell.styles.fontStyle = 'bold'; } }
          });
          doc.save('lista_geral_alunos.pdf');
          break;
        }
        case 'relAproveitamento': {
          let q = [FB.where('schoolId', '==', sid)];
          if (APP.currentYearId) q.push(FB.where('yearId', '==', APP.currentYearId));
          const alunos = await DB.getCollection('alunos', q);
          const notas = await DB.getCollection('notas', q);

          const doc = new jsPDF();
          let y = PDFHelper.addHeader(doc, APP.currentSchool, { title: 'MAPA DE APROVEITAMENTO' });

          // Por classe
          const classes = await DB.getCollection('classes', [FB.where('schoolId', '==', sid)]);
          classes.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));

          const body = classes.map(c => {
            const alunosC = alunos.filter(a => a.classeId === c.id && (a.estado === 'Activo' || a.estado === 'Ativo'));
            const comNotas = alunosC.filter(a => notas.some(n => n.alunoId === a.id));
            const aprovados = comNotas.filter(a => {
              const notasA = notas.filter(n => n.alunoId === a.id);
              return notasA.every(n => { const calc = Utils.calcularMedia(n, c.name); return calc.mfd !== null && calc.mfd >= Utils.getNotaPositiva(c.name); });
            }).length;
            return [c.name, alunosC.length, comNotas.length, aprovados, comNotas.length - aprovados,
              comNotas.length > 0 ? Math.round(aprovados / comNotas.length * 100) + '%' : 'N/D'];
          });

          doc.autoTable({
            startY: y + 5,
            head: [['Classe', 'Matriculados', 'Avaliados', 'Aprovados', 'Reprovados', 'Taxa Aprov.']],
            body, styles: { fontSize: 9 }, headStyles: { fillColor: [15, 23, 42] }
          });
          doc.save('mapa_aproveitamento.pdf');
          break;
        }
        case 'relFuncionarios': {
          const users = await DB.getCollection('users', [FB.where('schoolId', '==', sid)]);
          const doc = new jsPDF('landscape');
          let y = PDFHelper.addHeader(doc, APP.currentSchool, { title: 'LISTA DE FUNCIONÁRIOS' });
          doc.autoTable({
            startY: y + 5,
            head: [['#', 'Nome', 'Cargo', 'BI', 'N° Agente', 'Formação', 'Email', 'Telefone', 'Estado']],
            body: users.filter(u => u.role !== 'superadmin').map((u, i) => [i + 1, u.name, getRoleName(u.role), u.bi || '', u.agente || '', u.formacao || '', u.email, u.phone || '', u.active !== false ? 'Activo' : 'Inactivo']),
            styles: { fontSize: 7 }, headStyles: { fillColor: [15, 23, 42] }
          });
          doc.save('funcionarios.pdf');
          break;
        }
        case 'relReceitas': {
          let q = [FB.where('schoolId', '==', sid)];
          if (APP.currentYearId) q.push(FB.where('yearId', '==', APP.currentYearId));
          const receitas = await DB.getCollection('receitas', q);
          const doc = new jsPDF();
          let y = PDFHelper.addHeader(doc, APP.currentSchool, { title: 'MAPA DE RECEITAS' });
          const total = receitas.reduce((s, r) => s + (parseFloat(r.valor) || 0), 0);
          doc.autoTable({
            startY: y + 5,
            head: [['#', 'Data', 'Descrição', 'Categoria', 'Valor (Kz)']],
            body: receitas.map((r, i) => [i + 1, r.data, r.descricao, r.categoria || '', (parseFloat(r.valor) || 0).toLocaleString('pt-AO')]),
            foot: [['', '', '', 'TOTAL:', total.toLocaleString('pt-AO') + ' Kz']],
            styles: { fontSize: 8 }, headStyles: { fillColor: [5, 150, 105] }, footStyles: { fillColor: [240, 240, 240], fontStyle: 'bold' }
          });
          doc.save('mapa_receitas.pdf');
          break;
        }
        case 'relDespesas': {
          let q = [FB.where('schoolId', '==', sid)];
          if (APP.currentYearId) q.push(FB.where('yearId', '==', APP.currentYearId));
          const despesas = await DB.getCollection('despesas', q);
          const doc = new jsPDF();
          let y = PDFHelper.addHeader(doc, APP.currentSchool, { title: 'MAPA DE DESPESAS' });
          const total = despesas.reduce((s, d) => s + (parseFloat(d.valor) || 0), 0);
          doc.autoTable({
            startY: y + 5,
            head: [['#', 'Data', 'Descrição', 'Categoria', 'Valor (Kz)', 'Beneficiário']],
            body: despesas.map((d, i) => [i + 1, d.data, d.descricao, d.categoria || '', (parseFloat(d.valor) || 0).toLocaleString('pt-AO'), d.beneficiario || '']),
            foot: [['', '', '', 'TOTAL:', total.toLocaleString('pt-AO') + ' Kz', '']],
            styles: { fontSize: 8 }, headStyles: { fillColor: [220, 38, 38] }, footStyles: { fillColor: [240, 240, 240], fontStyle: 'bold' }
          });
          doc.save('mapa_despesas.pdf');
          break;
        }
        default:
          Utils.toast('Relatório em desenvolvimento', 'info');
      }
      Utils.toast('Relatório gerado!', 'success');
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  }
};

        <div class="table-container">

        <div class="table-container">

      <div id="bemModal" class="modal-overlay">

          <div class="modal-body">
            <form id="bemForm">
              <input type="hidden" id="bemId">

                <div class="form-group"><label>Código</label><input type="text" id="bemCodigo" placeholder="Auto-gerado"></div>

                <div class="form-group"><label>Quantidade *</label><input type="number" id="bemQtd" required min="1" value="1"></div>

      <div id="movModal" class="modal-overlay">
        <div class="modal-content" style="max-width:500px">
          <div class="modal-header"><h3 id="movModalTitle">Novo Movimento</h3><button class="modal-close" onclick="document.getElementById('movModal').classList.remove('active')">&times;</button></div>
          <div class="modal-body">
            <form id="movForm">
              <input type="hidden" id="movTipo">
              <div class="form-group"><label>Bem *</label>
                <select id="movBem" required><option value="">Selecione</option></select></div>
              <div class="form-row">
                <div class="form-group"><label>Quantidade *</label><input type="number" id="movQtd" required min="1" value="1"></div>
                <div class="form-group"><label>Data *</label><input type="date" id="movData" required value="${new Date().toISOString().split('T')[0]}"></div>
              </div>
              <div class="form-group"><label>Motivo / Descrição</label><input type="text" id="movMotivo" placeholder="Motivo do movimento"></div>
              <div class="form-group"><label>Responsável</label><input type="text" id="movResp" placeholder="Nome do responsável"></div>
              <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="document.getElementById('movModal').classList.remove('active')">Cancelar</button>

    await this.loadData();
    document.getElementById('bemForm').onsubmit = async (e) => { e.preventDefault(); await PagePatrimonio.saveBem(); };
    document.getElementById('movForm').onsubmit = async (e) => { e.preventDefault(); await PagePatrimonio.saveMov(); };
  },

  _bens: [], _filteredBens: [], _movimentos: [], _filteredMov: [],

  switchTab(tab) {
    document.querySelectorAll('.tab-item').forEach((t, i) => t.classList.toggle('active', (i === 0 && tab === 'bens') || (i === 1 && tab === 'movimentos')));
    document.getElementById('tabPatBens').classList.toggle('active', tab === 'bens');
    document.getElementById('tabPatMovimentos').classList.toggle('active', tab === 'movimentos');
  },

  async loadData() {
    const sid = APP.currentSchool.id;
    this._bens = await DB.getCollection('patrimonio', [FB.where('schoolId', '==', sid)]);
    this._bens.sort((a, b) => (a.descricao || '').localeCompare(b.descricao || ''));
    this._filteredBens = [...this._bens];

    this._movimentos = await DB.getCollection('patrimonioMovimentos', [FB.where('schoolId', '==', sid)]);
    this._movimentos.sort((a, b) => (b.data || '').localeCompare(a.data || ''));
    this._filteredMov = [...this._movimentos];

    this.renderBens();
    this.renderMovimentos();
    this.renderStats();
  },

  renderStats() {
    const total = this._bens.length;
    const totalValor = this._bens.reduce((s, b) => s + ((parseFloat(b.valor) || 0) * (parseInt(b.quantidade) || 1)), 0);
    const bom = this._bens.filter(b => b.estado === 'Bom').length;
    const avariado = this._bens.filter(b => b.estado === 'Avariado' || b.estado === 'Mau').length;

    document.getElementById('patStats').innerHTML = `
      <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-boxes"></i></div><div class="stat-info"><h3>${total}</h3><p>Total Bens</p></div></div>
      <div class="stat-card"><div class="stat-icon green"><i class="fas fa-money-bill"></i></div><div class="stat-info"><h3>${totalValor.toLocaleString('pt-AO')} Kz</h3><p>Valor Total</p></div></div>
      <div class="stat-card"><div class="stat-icon teal"><i class="fas fa-check-circle"></i></div><div class="stat-info"><h3>${bom}</h3><p>Bom Estado</p></div></div>
      <div class="stat-card"><div class="stat-icon red"><i class="fas fa-exclamation-circle"></i></div><div class="stat-info"><h3>${avariado}</h3><p>Avariados/Mau</p></div></div>
    `;
  },

  filterBens() {
    const term = (document.getElementById('searchPatrimonio')?.value || '').toLowerCase();
    const cat = document.getElementById('filterPatCategoria')?.value || '';
    this._filteredBens = this._bens.filter(b => ((b.descricao || '').toLowerCase().includes(term) || (b.codigo || '').toLowerCase().includes(term)) && (!cat || b.categoria === cat));
    this.renderBens();
  },

  filterMovimentos() {
    const tipo = document.getElementById('filterMovTipo')?.value || '';
    this._filteredMov = this._movimentos.filter(m => !tipo || m.tipo === tipo);
    this.renderMovimentos();
  },

  renderBens() {
    const tbody = document.getElementById('bensTableBody');
    if (!tbody) return;
    if (this._filteredBens.length === 0) { tbody.innerHTML = '<tr><td colspan="10" class="text-center">Nenhum bem cadastrado</td></tr>'; return; }
    tbody.innerHTML = this._filteredBens.map((b, i) => {
      const valorTotal = ((parseFloat(b.valor) || 0) * (parseInt(b.quantidade) || 1));
      const estadoBadge = b.estado === 'Bom' ? 'badge-success' : b.estado === 'Regular' ? 'badge-warning' : 'badge-danger';
      return `<tr>
        <td>${i + 1}</td>
        <td><small>${b.codigo || ''}</small></td>
        <td><strong>${b.descricao || ''}</strong></td>
        <td>${b.categoria || ''}</td>
        <td class="text-center">${b.quantidade || 1}</td>
        <td>${(parseFloat(b.valor) || 0).toLocaleString('pt-AO')} Kz</td>
        <td><strong>${valorTotal.toLocaleString('pt-AO')} Kz</strong></td>
        <td>${b.localizacao || ''}</td>
        <td><span class="badge ${estadoBadge}">${b.estado || 'N/D'}</span></td>
        <td>
          <button class="btn btn-sm btn-info" onclick="PagePatrimonio.openBemModal('${b.id}')"><i class="fas fa-edit"></i></button>
          <button class="btn btn-sm btn-danger" onclick="PagePatrimonio.deleteBem('${b.id}')"><i class="fas fa-trash"></i></button>
        </td>
      </tr>`;
    }).join('');
  },

  renderMovimentos() {
    const tbody = document.getElementById('movTableBody');
    if (!tbody) return;
    if (this._filteredMov.length === 0) { tbody.innerHTML = '<tr><td colspan="8" class="text-center">Nenhum movimento registado</td></tr>'; return; }
    tbody.innerHTML = this._filteredMov.map((m, i) => `<tr>
      <td>${i + 1}</td>
      <td>${m.data || ''}</td>
      <td><span class="badge ${m.tipo === 'entrada' ? 'badge-success' : 'badge-danger'}">${m.tipo === 'entrada' ? '↓ Entrada' : '↑ Saída'}</span></td>
      <td><strong>${m.bemDescricao || ''}</strong></td>
      <td class="text-center">${m.quantidade || 1}</td>
      <td>${m.motivo || ''}</td>
      <td>${m.responsavel || ''}</td>
      <td><button class="btn btn-sm btn-danger" onclick="PagePatrimonio.deleteMov('${m.id}')"><i class="fas fa-trash"></i></button></td>
    </tr>`).join('');
  },

  openBemModal(id = null) {
    document.getElementById('bemModalTitle').textContent = id ? 'Editar Bem' : 'Novo Bem';
    document.getElementById('bemId').value = id || '';
    if (id) {
      const b = this._bens.find(x => x.id === id);
      if (b) {
        document.getElementById('bemCodigo').value = b.codigo || '';
        document.getElementById('bemDescricao').value = b.descricao || '';
        document.getElementById('bemCategoria').value = b.categoria || '';
        document.getElementById('bemQtd').value = b.quantidade || 1;
        document.getElementById('bemValor').value = b.valor || '';
        document.getElementById('bemDataAq').value = b.dataAquisicao || '';
        document.getElementById('bemLocal').value = b.localizacao || '';
        document.getElementById('bemEstado').value = b.estado || 'Bom';
        document.getElementById('bemObs').value = b.observacoes || '';
      }
    } else {
      document.getElementById('bemForm').reset();
      document.getElementById('bemCodigo').value = 'PAT-' + Date.now().toString().slice(-6);
      document.getElementById('bemQtd').value = 1;
      document.getElementById('bemEstado').value = 'Bom';
    }
    document.getElementById('bemModal').classList.add('active');
  },

  closeBemModal() { document.getElementById('bemModal').classList.remove('active'); },

  async saveBem() {
    const id = document.getElementById('bemId').value;
    const data = {
      codigo: document.getElementById('bemCodigo').value.trim(),
      descricao: document.getElementById('bemDescricao').value.trim(),
      categoria: document.getElementById('bemCategoria').value,
      quantidade: parseInt(document.getElementById('bemQtd').value) || 1,
      valor: parseFloat(document.getElementById('bemValor').value) || 0,
      dataAquisicao: document.getElementById('bemDataAq').value,
      localizacao: document.getElementById('bemLocal').value.trim(),
      estado: document.getElementById('bemEstado').value,
      observacoes: document.getElementById('bemObs').value.trim(),
      schoolId: APP.currentSchool.id
    };
    showLoading(true);
    try {
      await DB.saveDoc('patrimonio', id || Utils.generateId(), data);
      Utils.toast(id ? 'Bem atualizado!' : 'Bem cadastrado!', 'success');
      this.closeBemModal();
      await this.loadData();
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  async deleteBem(id) {
    const ok = await Utils.confirm('Excluir este bem?');
    if (!ok) return;
    showLoading(true);
    try { await DB.deleteDocument('patrimonio', id); Utils.toast('Excluído!', 'success'); await this.loadData(); }
    catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  openMovModal(tipo) {
    document.getElementById('movModalTitle').textContent = tipo === 'entrada' ? 'Registar Entrada' : 'Registar Saída';
    document.getElementById('movTipo').value = tipo;
    const selBem = document.getElementById('movBem');
    selBem.innerHTML = '<option value="">Selecione</option>';
    this._bens.forEach(b => { selBem.innerHTML += `<option value="${b.id}">${b.descricao} (${b.codigo || 'S/C'})</option>`; });
    document.getElementById('movForm').reset();
    document.getElementById('movTipo').value = tipo;
    document.getElementById('movData').value = new Date().toISOString().split('T')[0];
    document.getElementById('movQtd').value = 1;
    document.getElementById('movModal').classList.add('active');
  },

  async saveMov() {
    const tipo = document.getElementById('movTipo').value;
    const bemId = document.getElementById('movBem').value;
    const bem = this._bens.find(b => b.id === bemId);
    if (!bemId || !bem) { Utils.toast('Selecione um bem', 'warning'); return; }

    const qtd = parseInt(document.getElementById('movQtd').value) || 1;

    // Se for saída, verificar stock
    if (tipo === 'saida' && qtd > (bem.quantidade || 0)) {
      Utils.toast('Quantidade insuficiente em stock', 'error');
      return;
    }

    const data = {
      tipo: tipo,
      bemId: bemId,
      bemDescricao: bem.descricao,
      bemCodigo: bem.codigo,
      quantidade: qtd,
      data: document.getElementById('movData').value,
      motivo: document.getElementById('movMotivo').value.trim(),
      responsavel: document.getElementById('movResp').value.trim() || APP.currentUser.name,
      schoolId: APP.currentSchool.id
    };

    showLoading(true);
    try {
      await DB.saveDoc('patrimonioMovimentos', Utils.generateId(), data);

      // Atualizar quantidade do bem
      const novaQtd = tipo === 'entrada' ? (bem.quantidade || 0) + qtd : (bem.quantidade || 0) - qtd;
      await DB.saveDoc('patrimonio', bemId, { quantidade: novaQtd });

      Utils.toast('Movimento registado!', 'success');
      document.getElementById('movModal').classList.remove('active');
      await this.loadData();
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  async deleteMov(id) {
    const ok = await Utils.confirm('Excluir este movimento?');
    if (!ok) return;
    showLoading(true);
    try { await DB.deleteDocument('patrimonioMovimentos', id); Utils.toast('Excluído!', 'success'); await this.loadData(); }
    catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  exportBensPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('landscape');
    let y = PDFHelper.addHeader(doc, APP.currentSchool, { title: 'MAPA PATRIMONIAL' });
    const total = this._filteredBens.reduce((s, b) => s + ((parseFloat(b.valor) || 0) * (parseInt(b.quantidade) || 1)), 0);
    doc.autoTable({
      startY: y + 5,
      head: [['#', 'Código', 'Descrição', 'Categoria', 'Qtd', 'Valor Unit.', 'Valor Total', 'Local', 'Estado']],
      body: this._filteredBens.map((b, i) => [i + 1, b.codigo, b.descricao, b.categoria, b.quantidade || 1, (parseFloat(b.valor) || 0).toLocaleString('pt-AO'), ((parseFloat(b.valor) || 0) * (parseInt(b.quantidade) || 1)).toLocaleString('pt-AO'), b.localizacao || '', b.estado]),
      foot: [['', '', '', '', '', 'TOTAL:', total.toLocaleString('pt-AO') + ' Kz', '', '']],
      styles: { fontSize: 7 }, headStyles: { fillColor: [15, 23, 42] }, footStyles: { fillColor: [240, 240, 240], fontStyle: 'bold' }
    });
    doc.save('patrimonio.pdf');
    Utils.toast('PDF exportado!', 'success');
  },

  exportBensXLSX() {
    const data = this._filteredBens.map((b, i) => ({ '#': i + 1, 'Código': b.codigo, 'Descrição': b.descricao, 'Categoria': b.categoria, 'Qtd': b.quantidade, 'Valor Unit.': b.valor, 'Valor Total': (parseFloat(b.valor) || 0) * (parseInt(b.quantidade) || 1), 'Local': b.localizacao, 'Estado': b.estado }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Património');
    XLSX.writeFile(wb, 'patrimonio.xlsx');
  },

  exportMovPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    let y = PDFHelper.addHeader(doc, APP.currentSchool, { title: 'MOVIMENTOS PATRIMONIAIS - ENTRADAS E SAÍDAS' });
    doc.autoTable({
      startY: y + 5,
      head: [['#', 'Data', 'Tipo', 'Bem', 'Qtd', 'Motivo', 'Responsável']],
      body: this._filteredMov.map((m, i) => [i + 1, m.data, m.tipo === 'entrada' ? 'Entrada' : 'Saída', m.bemDescricao, m.quantidade, m.motivo || '', m.responsavel || '']),
      styles: { fontSize: 8 }, headStyles: { fillColor: [15, 23, 42] },
      didParseCell: d => { if (d.column.index === 2 && d.section === 'body') { d.cell.styles.textColor = d.cell.raw === 'Entrada' ? [5, 150, 105] : [220, 38, 38]; d.cell.styles.fontStyle = 'bold'; } }
    });
    doc.save('movimentos_patrimonio.pdf');
    Utils.toast('PDF exportado!', 'success');
  }
};
