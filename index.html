<script type="module">
// ============================================================
// MÓDULO: COORDENAÇÃO
// ============================================================
window.PageCoordenacao = {
  async render(container) {
    const schoolId = APP.currentSchool ? APP.currentSchool.id : null;
    if (!schoolId) {
      container.innerHTML = '<div class="empty-state"><i class="fas fa-school"></i><p>Selecione uma escola primeiro</p></div>';
      return;
    }
    const role = APP.currentUser.role;
    const canManage = ['superadmin', 'diretor', 'subdiretor_pedagogico'].includes(role);

    container.innerHTML = `
      <h2 class="page-title"><i class="fas fa-sitemap"></i> Coordenação</h2>
      <div class="tabs no-print">
        <div class="tab-item active" onclick="PageCoordenacao.switchTab('areas')">Áreas da Direcção</div>
        <div class="tab-item" onclick="PageCoordenacao.switchTab('coord')">Coordenadores</div>
        <div class="tab-item" onclick="PageCoordenacao.switchTab('dashboard')">Dashboard</div>
      </div>

      <div id="tabCoordAreas" class="tab-content active">
        <div class="stats-grid mb-3" id="coordAreasStats"></div>
        <div class="grid-3" style="gap:16px">
          ${this._renderAreaCard('Director Geral', 'fas fa-user-tie', 'diretor', '#1a56db')}
          ${this._renderAreaCard('Subdirector Pedagógico', 'fas fa-chalkboard-teacher', 'subdiretor_pedagogico', '#7c3aed')}
          ${this._renderAreaCard('Subdirector Administrativo', 'fas fa-briefcase', 'subdiretor_administrativo', '#059669')}
          ${this._renderAreaCard('Secretaria', 'fas fa-file-alt', 'secretario', '#d97706')}
          ${this._renderAreaCard('Coordenação Pedagógica', 'fas fa-sitemap', 'coordenador', '#0891b2')}
          ${this._renderAreaCard('Corpo Docente', 'fas fa-users', 'professor', '#dc2626')}
        </div>
        <div class="card mt-3" id="coordAreaDetail" style="display:none"></div>
      </div>

      <div id="tabCoordCoord" class="tab-content">
        <div class="toolbar mb-3">
          <div class="toolbar-left">
            <input type="text" class="search-input" id="searchCoord" placeholder="Pesquisar coordenador..." oninput="PageCoordenacao.filterCoord()">
          </div>
          <div class="toolbar-right">
            ${canManage ? '<button class="btn btn-primary" onclick="PageCoordenacao.openCoordModal()"><i class="fas fa-plus"></i> Atribuir Coordenador</button>' : ''}
          </div>
        </div>
        <div class="table-container">
          <table>
            <thead><tr><th>#</th><th>Nome</th><th>Tipo Coord.</th><th>Área/Turno/Classe</th><th>Contacto</th><th>Status</th>
              ${canManage ? '<th>Acções</th>' : ''}
            </tr></thead>
            <tbody id="coordTableBody"><tr><td colspan="7" class="text-center">Carregando...</td></tr></tbody>
          </table>
        </div>
      </div>

      <div id="tabCoordDashboard" class="tab-content">
        <div id="coordDashContent"></div>
      </div>

      <div id="coordModal" class="modal-overlay">
        <div class="modal-content">
          <div class="modal-header"><h3 id="coordModalTitle">Atribuir Coordenador</h3><button class="modal-close" onclick="PageCoordenacao.closeCoordModal()">&times;</button></div>
          <div class="modal-body">
            <form id="coordForm">
              <input type="hidden" id="coordId">
              <div class="form-group"><label>Funcionário *</label>
                <select id="coordFuncionario" required><option value="">Selecione</option></select></div>
              <div class="form-group"><label>Tipo de Coordenação *</label>
                <select id="coordTipo" required onchange="PageCoordenacao.onCoordTipoChange()">
                  <option value="">Selecione</option>
                  <option value="turno">Coordenador de Turno</option>
                  <option value="classe">Coordenador de Classe</option>
                  <option value="area">Coordenador de Área (Disciplinas)</option>
                  <option value="ciclo">Coordenador de Ciclo</option>
                </select></div>
              <div class="form-group" id="coordTurnoGroup" style="display:none">
                <label>Turno</label>
                <select id="coordTurno"><option value="">Selecione</option></select></div>
              <div class="form-group" id="coordClasseGroup" style="display:none">
                <label>Classe</label>
                <select id="coordClasse"><option value="">Selecione</option></select></div>
              <div class="form-group" id="coordAreaGroup" style="display:none">
                <label>Área de Disciplinas</label>
                <select id="coordArea">
                  <option value="">Selecione</option>
                  <option value="Exatas">Ciências Exatas</option>
                  <option value="Humanas">Ciências Humanas</option>
                  <option value="Biológicas">Ciências Biológicas</option>
                  <option value="Linguagens">Linguagens</option>
                  <option value="Artes">Artes</option>
                  <option value="Educação Física">Educação Física</option>
                  <option value="Técnica">Técnica</option>
                </select></div>
              <div class="form-group"><label>Observações</label>
                <textarea id="coordObs" rows="2" placeholder="Responsabilidades, notas..."></textarea></div>
              <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="PageCoordenacao.closeCoordModal()">Cancelar</button>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Guardar</button>
              </div>
            </form>
          </div>
        </div>
      </div>`;

    await this.loadData();
    document.getElementById('coordForm').onsubmit = async (e) => { e.preventDefault(); await PageCoordenacao.saveCoord(); };
  },

  _users: [], _coordenadores: [], _filteredCoord: [], _classes: [], _turnos: [],

  _renderAreaCard(title, icon, role, color) {
    return `<div class="card clickable" onclick="PageCoordenacao.showAreaDetail('${role}')" style="border-top:3px solid ${color}">
      <div class="card-body" style="text-align:center;padding:24px">
        <i class="${icon}" style="font-size:32px;color:${color};margin-bottom:10px"></i>
        <h4 style="font-size:14px">${title}</h4>
        <p style="font-size:11px;color:var(--text-light);margin-top:6px" id="areaCount_${role}">Carregando...</p>
      </div>
    </div>`;
  },

  switchTab(tab) {
    const tabs = ['areas', 'coord', 'dashboard'];
    document.querySelectorAll('.tab-item').forEach((t, i) => t.classList.toggle('active', tabs[i] === tab));
    tabs.forEach(t => {
      const el = document.getElementById('tabCoord' + t.charAt(0).toUpperCase() + t.slice(1));
      if (el) el.classList.toggle('active', t === tab);
    });
    if (tab === 'dashboard') this.loadDashboard();
  },

  async loadData() {
    const sid = APP.currentSchool.id;
    try {
      this._users = await DB.getCollection('users', [FB.where('schoolId', '==', sid)]);
      this._users = this._users.filter(u => u.active !== false && u.role !== 'superadmin');
      this._coordenadores = await DB.getCollection('coordenacoes', [FB.where('schoolId', '==', sid)]);
      this._filteredCoord = [...this._coordenadores];
      this._classes = await DB.getCollection('classes', [FB.where('schoolId', '==', sid)]);
      this._classes.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
      this._turnos = await DB.getCollection('turnos', [FB.where('schoolId', '==', sid)]);

      // Stats por área
      const roles = ['diretor', 'subdiretor_pedagogico', 'subdiretor_administrativo', 'secretario', 'coordenador', 'professor'];
      roles.forEach(r => {
        const el = document.getElementById('areaCount_' + r);
        if (el) {
          const count = this._users.filter(u => u.role === r).length;
          el.textContent = count + (count === 1 ? ' membro' : ' membros');
        }
      });

      // Preencher selects
      const selF = document.getElementById('coordFuncionario');
      if (selF) {
        selF.innerHTML = '<option value="">Selecione</option>';
        this._users.forEach(u => { selF.innerHTML += `<option value="${u.uid || u.id}">${u.name} (${getRoleName(u.role)})</option>`; });
      }
      const selC = document.getElementById('coordClasse');
      if (selC) { selC.innerHTML = '<option value="">Selecione</option>'; this._classes.forEach(c => { selC.innerHTML += `<option value="${c.id}">${c.name}</option>`; }); }
      const selT = document.getElementById('coordTurno');
      if (selT) { selT.innerHTML = '<option value="">Selecione</option>'; this._turnos.forEach(t => { selT.innerHTML += `<option value="${t.id}">${t.name}</option>`; }); }

      this.renderCoordTable();
    } catch (e) { console.error(e); }
  },

  onCoordTipoChange() {
    const tipo = document.getElementById('coordTipo').value;
    document.getElementById('coordTurnoGroup').style.display = tipo === 'turno' ? 'block' : 'none';
    document.getElementById('coordClasseGroup').style.display = tipo === 'classe' ? 'block' : 'none';
    document.getElementById('coordAreaGroup').style.display = tipo === 'area' ? 'block' : 'none';
  },

  filterCoord() {
    const term = (document.getElementById('searchCoord')?.value || '').toLowerCase();
    this._filteredCoord = this._coordenadores.filter(c => (c.funcionarioName || '').toLowerCase().includes(term) || (c.tipo || '').toLowerCase().includes(term));
    this.renderCoordTable();
  },

  renderCoordTable() {
    const tbody = document.getElementById('coordTableBody');
    if (!tbody) return;
    const canManage = ['superadmin', 'diretor', 'subdiretor_pedagogico'].includes(APP.currentUser.role);
    const tipoNames = { turno: 'Coord. de Turno', classe: 'Coord. de Classe', area: 'Coord. de Área', ciclo: 'Coord. de Ciclo' };

    if (this._filteredCoord.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-center">Nenhum coordenador atribuído</td></tr>';
      return;
    }

    tbody.innerHTML = this._filteredCoord.map((c, i) => {
      let areaDesc = '';
      if (c.tipo === 'turno') areaDesc = c.turnoName || '';
      else if (c.tipo === 'classe') areaDesc = c.classeName || '';
      else if (c.tipo === 'area') areaDesc = c.area || '';
      else if (c.tipo === 'ciclo') areaDesc = c.cicloName || '';

      const user = this._users.find(u => (u.uid || u.id) === c.funcionarioId);

      return `<tr>
        <td>${i + 1}</td>
        <td><strong>${c.funcionarioName || ''}</strong></td>
        <td><span class="badge badge-primary">${tipoNames[c.tipo] || c.tipo}</span></td>
        <td>${areaDesc}</td>
        <td>${user ? (user.phone || user.telefone || user.email || '') : ''}</td>
        <td><span class="badge badge-success">Activo</span></td>
        ${canManage ? `<td>
          <button class="btn btn-sm btn-info" onclick="PageCoordenacao.openCoordModal('${c.id}')"><i class="fas fa-edit"></i></button>
          <button class="btn btn-sm btn-danger" onclick="PageCoordenacao.deleteCoord('${c.id}')"><i class="fas fa-trash"></i></button>
        </td>` : ''}
      </tr>`;
    }).join('');
  },

  async showAreaDetail(role) {
    const membros = this._users.filter(u => u.role === role);
    const detail = document.getElementById('coordAreaDetail');
    detail.style.display = 'block';
    detail.innerHTML = `
      <div class="card-header"><h4>${getRoleName(role)} (${membros.length})</h4></div>
      <div class="card-body">
        ${membros.length === 0 ? '<p style="color:var(--text-light)">Nenhum membro nesta área</p>' :
          '<div class="table-container"><table class="table-sm"><thead><tr><th>#</th><th>Nome</th><th>Email</th><th>Telefone</th><th>BI</th></tr></thead><tbody>' +
          membros.map((m, i) => `<tr><td>${i + 1}</td><td><strong>${m.name}</strong></td><td>${m.email || ''}</td><td>${m.phone || m.telefone || ''}</td><td>${m.bi || ''}</td></tr>`).join('') +
          '</tbody></table></div>'}
      </div>`;
    detail.scrollIntoView({ behavior: 'smooth' });
  },

  openCoordModal(id = null) {
    document.getElementById('coordModalTitle').textContent = id ? 'Editar Coordenação' : 'Atribuir Coordenador';
    document.getElementById('coordId').value = id || '';

    if (id) {
      const c = this._coordenadores.find(x => x.id === id);
      if (c) {
        document.getElementById('coordFuncionario').value = c.funcionarioId || '';
        document.getElementById('coordTipo').value = c.tipo || '';
        this.onCoordTipoChange();
        setTimeout(() => {
          if (c.turnoId) document.getElementById('coordTurno').value = c.turnoId;
          if (c.classeId) document.getElementById('coordClasse').value = c.classeId;
          if (c.area) document.getElementById('coordArea').value = c.area;
        }, 100);
        document.getElementById('coordObs').value = c.observacoes || '';
      }
    } else {
      document.getElementById('coordForm').reset();
      document.getElementById('coordTurnoGroup').style.display = 'none';
      document.getElementById('coordClasseGroup').style.display = 'none';
      document.getElementById('coordAreaGroup').style.display = 'none';
    }
    document.getElementById('coordModal').classList.add('active');
  },

  closeCoordModal() { document.getElementById('coordModal').classList.remove('active'); },

  async saveCoord() {
    const id = document.getElementById('coordId').value;
    const funcId = document.getElementById('coordFuncionario').value;
    const tipo = document.getElementById('coordTipo').value;
    const func = this._users.find(u => (u.uid || u.id) === funcId);

    if (!funcId || !tipo) { Utils.toast('Selecione funcionário e tipo', 'warning'); return; }

    const data = {
      funcionarioId: funcId,
      funcionarioName: func ? func.name : '',
      tipo: tipo,
      schoolId: APP.currentSchool.id,
      observacoes: document.getElementById('coordObs').value.trim()
    };

    if (tipo === 'turno') {
      const turnoId = document.getElementById('coordTurno').value;
      const turno = this._turnos.find(t => t.id === turnoId);
      data.turnoId = turnoId;
      data.turnoName = turno ? turno.name : '';
    } else if (tipo === 'classe') {
      const classeId = document.getElementById('coordClasse').value;
      const classe = this._classes.find(c => c.id === classeId);
      data.classeId = classeId;
      data.classeName = classe ? classe.name : '';
    } else if (tipo === 'area') {
      data.area = document.getElementById('coordArea').value;
    }

    showLoading(true);
    try {
      await DB.saveDoc('coordenacoes', id || Utils.generateId(), data);
      // Atualizar role do funcionário para coordenador se não for já
      if (func && !['diretor', 'subdiretor_pedagogico', 'subdiretor_administrativo'].includes(func.role)) {
        await DB.saveDoc('users', funcId, { role: 'coordenador' });
      }
      Utils.toast(id ? 'Coordenação atualizada!' : 'Coordenador atribuído!', 'success');
      this.closeCoordModal();
      await this.loadData();
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);
  },

  async deleteCoord(id) {
    const ok = await Utils.confirm('Remover esta coordenação?');
    if (!ok) return;
    showLoading(true);
    try {
      await DB.deleteDocument('coordenacoes', id);
      Utils.toast('Coordenação removida!', 'success');
      await this.loadData();
    } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
    showLoading(false);

window.ConsultaAluno = {
  async consultar(term) {
    if (!term || term.length < 2) return [];

    try {
      const allAlunos = await DB.getCollection('alunos');
      const results = allAlunos.filter(a => {
        const activo = a.estado === 'Activo' || a.estado === 'Ativo';
        if (!activo) return false;
        return (a.bi && a.bi.toLowerCase().includes(term.toLowerCase())) ||
          (a.processo && a.processo.toLowerCase().includes(term.toLowerCase())) ||
          (a.matricula && a.matricula.toLowerCase().includes(term.toLowerCase())) ||
          (a.name && a.name.toLowerCase().includes(term.toLowerCase()));
      });
      return results;
    } catch (e) {
      console.error(e);
      return [];
    }
  },

  async getFullInfo(alunoId) {
    try {
      const aluno = await DB.getDoc('alunos', alunoId);
      if (!aluno) return null;

      const school = aluno.schoolId ? await DB.getDoc('schools', aluno.schoolId) : null;
      const notas = await DB.getCollection('notas', [FB.where('alunoId', '==', alunoId)]);
      const notasHist = await DB.getCollection('notasHistorico', [FB.where('alunoId', '==', alunoId)]);
      
      let faltas = [];
      try {
        faltas = await DB.getCollection('presencas', [FB.where('alunoId', '==', alunoId), FB.where('status', '==', 'F')]);
      } catch (e) {}

      let pagamentos = [];
      try {
        pagamentos = await DB.getCollection('pagamentos', [FB.where('alunoId', '==', alunoId)]);
      } catch (e) {}

      // Dívidas
      let titulos = [];
      if (aluno.schoolId) {
        titulos = await DB.getCollection('titulosPagamento', [FB.where('schoolId', '==', aluno.schoolId), FB.where('status', '==', 'Activo')]);
      }

      const dividas = [];
      const meses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
      titulos.filter(t => t.periodo === 'mensal').forEach(titulo => {
        if (titulo.classes && !titulo.classes.includes('todas') && !titulo.classes.includes(aluno.classeId)) return;
        meses.forEach(m => {
          const pago = pagamentos.find(p => p.tituloId === titulo.id && p.mes === m && p.status === 'pago');
          if (!pago) {
            dividas.push({ titulo: titulo.name, mes: m, valor: titulo.valor });
          }
        });
      });

      return {
        aluno, school,
        notas: [...notas, ...notasHist],
        faltas,
        pagamentos,
        dividas,
        totalDivida: dividas.reduce((s, d) => s + (parseFloat(d.valor) || 0), 0)
      };
    } catch (e) {
      console.error(e);
      return null;
    }
  },

  renderFullInfo(info) {
    if (!info || !info.aluno) return '<p>Aluno não encontrado</p>';
    const a = info.aluno;
    const pos = Utils.getNotaPositiva(a.classeName || '');

    let html = `
      <div class="card mb-3">
        <div class="card-header" style="background:linear-gradient(135deg,var(--angola-red),#8b0000);color:#fff">
          <div style="display:flex;align-items:center;gap:12px">
            ${a.photo ? `<img src="${a.photo}" style="width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid #fff">` :
              '<div style="width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center"><i class="fas fa-user" style="font-size:24px"></i></div>'}
            <div>
              <h3 style="color:#fff">${a.name}</h3>
              <p style="opacity:0.8">Classe: ${a.classeName || ''} | Turma: ${a.turmaName || ''} | Mat: ${a.matricula || ''}</p>
            </div>
          </div>
          <span class="badge ${a.estado === 'Activo' || a.estado === 'Ativo' ? 'badge-success' : 'badge-danger'}">${a.estado}</span>
        </div>
      </div>

      <div class="grid-2 mb-3">
        <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-book"></i></div>
          <div class="stat-info"><h3>${info.notas.length}</h3><p>Disciplinas c/ Notas</p></div></div>
        <div class="stat-card"><div class="stat-icon red"><i class="fas fa-times-circle"></i></div>
          <div class="stat-info"><h3>${info.faltas.length}</h3><p>Faltas</p></div></div>
        <div class="stat-card"><div class="stat-icon green"><i class="fas fa-check-circle"></i></div>
          <div class="stat-info"><h3>${info.pagamentos.length}</h3><p>Pagamentos</p></div></div>
        <div class="stat-card"><div class="stat-icon orange"><i class="fas fa-exclamation-triangle"></i></div>
          <div class="stat-info"><h3>${info.totalDivida.toLocaleString('pt-AO')} Kz</h3><p>Dívida</p></div></div>
      </div>`;

    // Notas
    if (info.notas.length > 0) {
      const notasFiltradas = info.notas.filter(n => n.classeId === a.classeId || n.classeName === a.classeName);
      if (notasFiltradas.length > 0) {
        html += `<div class="card mb-3"><div class="card-header"><h4><i class="fas fa-star"></i> Notas</h4></div><div class="card-body">
          <div class="table-container"><table class="table-sm">
            <thead><tr><th>Disciplina</th><th class="text-center">MT₁</th><th class="text-center">MT₂</th><th class="text-center">MFD</th><th class="text-center">Obs.</th></tr></thead>
            <tbody>${notasFiltradas.map(n => {
              const calc = Utils.calcularMedia(n, a.classeName || '');
              const mt1Class = calc.mt1 !== null ? (calc.mt1 >= pos ? 'nota-positiva' : 'nota-negativa') : '';
              const mt2Class = calc.mt2 !== null ? (calc.mt2 >= pos ? 'nota-positiva' : 'nota-negativa') : '';
              const mfdClass = calc.mfd !== null ? (calc.mfd >= pos ? 'nota-positiva' : 'nota-negativa') : '';
              const obs = calc.mfd !== null ? (calc.mfd >= pos ? Utils.genero(a.sexo, 'aprovado') : Utils.genero(a.sexo, 'reprovado')) : '';
              return `<tr>
                <td>${n.disciplina || n.disciplinaName || ''}</td>
                <td class="text-center ${mt1Class}">${calc.mt1 ?? '-'}</td>
                <td class="text-center ${mt2Class}">${calc.mt2 ?? '-'}</td>
                <td class="text-center ${mfdClass}"><strong>${calc.mfd ?? '-'}</strong></td>
                <td class="text-center" style="font-size:11px;${obs.includes('aprov') ? 'color:var(--success)' : obs.includes('reprov') ? 'color:var(--danger)' : ''}">${obs}</td>
              </tr>`;
            }).join('')}</tbody>
          </table></div>
        </div></div>`;
      }
    }

    // Dívidas
    if (info.dividas.length > 0) {
      html += `<div class="card mb-3"><div class="card-header"><h4><i class="fas fa-money-bill"></i> Pagamentos Pendentes</h4></div><div class="card-body">
        <div class="table-container"><table class="table-sm">
          <thead><tr><th>Título</th><th>Mês</th><th>Valor</th></tr></thead>
          <tbody>${info.dividas.slice(0, 20).map(d => `<tr>
            <td>${d.titulo}</td><td>${d.mes}</td>
            <td><strong style="color:var(--danger)">${(parseFloat(d.valor) || 0).toLocaleString('pt-AO')} Kz</strong></td>
          </tr>`).join('')}</tbody>
        </table></div>
        ${info.dividas.length > 20 ? `<p style="color:var(--text-light);margin-top:8px">... e mais ${info.dividas.length - 20} pendências</p>` : ''}
      </div></div>`;
    }

    // Faltas
    if (info.faltas.length > 0) {
      html += `<div class="card"><div class="card-header"><h4><i class="fas fa-clipboard-check"></i> Últimas Faltas (${info.faltas.length} total)</h4></div><div class="card-body">
        <div class="table-container"><table class="table-sm">
          <thead><tr><th>Data</th><th>Observação</th></tr></thead>
          <tbody>${info.faltas.sort((a, b) => (b.data || '').localeCompare(a.data || '')).slice(0, 10).map(f =>
            `<tr><td>${f.data || ''}</td><td>${f.observacao || ''}</td></tr>`
          ).join('')}</tbody>
        </table></div>
      </div></div>`;
    }

    return html;
  }
};

window.PageFaltas = {
  async render(container) {
    const schoolId = APP.currentSchool ? APP.currentSchool.id : null;
    if (!schoolId) {
      container.innerHTML = '<div class="empty-state"><i class="fas fa-school"></i><p>Selecione uma escola primeiro</p></div>';
      return;
    }

    container.innerHTML = `
      <h2 class="page-title"><i class="fas fa-user-times"></i> Mapa de Faltas</h2>
      <div class="card mb-3 no-print">
        <div class="card-body">
          <div class="filter-grid" style="padding:0;box-shadow:none">
            <div class="form-group"><label>Classe</label>
              <select id="faltaClasse" onchange="PageFaltas.onClasseChange()"><option value="">Todas</option></select></div>
            <div class="form-group"><label>Turma</label>
              <select id="faltaTurma"><option value="">Todas</option></select></div>
            <div class="form-group"><label>Período</label>
              <div style="display:flex;gap:4px">
                <input type="date" id="faltaDe" style="font-size:12px">
                <input type="date" id="faltaAte" style="font-size:12px" value="${new Date().toISOString().split('T')[0]}">
              </div></div>
            <div class="form-group" style="padding-top:20px">
              <button class="btn btn-primary" onclick="PageFaltas.carregar()"><i class="fas fa-search"></i> Carregar</button>
            </div>
          </div>
        </div>
      </div>
      <div id="faltasContent"></div>`;

    await this.loadFilters();
  },

  _classes: [], _turmas: [],

  async loadFilters() {
    const sid = APP.currentSchool.id;
    this._classes = await DB.getCollection('classes', [FB.where('schoolId', '==', sid)]);
    this._classes.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
    let tQ = [FB.where('schoolId', '==', sid)];
    if (APP.currentYearId) tQ.push(FB.where('yearId', '==', APP.currentYearId));
    this._turmas = await DB.getCollection('turmas', tQ);

    const sel = document.getElementById('faltaClasse');
    this._classes.forEach(c => { sel.innerHTML += `<option value="${c.id}">${c.name}</option>`; });
  },

  onClasseChange() {
    const cid = document.getElementById('faltaClasse').value;
    const sel = document.getElementById('faltaTurma');
    sel.innerHTML = '<option value="">Todas</option>';
    this._turmas.filter(t => t.classeId === cid).forEach(t => {
      sel.innerHTML += `<option value="${t.id}">${t.name}</option>`;
    });
  },

  async carregar() {
    const classeId = document.getElementById('faltaClasse').value;
    const turmaId = document.getElementById('faltaTurma').value;
    const de = document.getElementById('faltaDe').value;
    const ate = document.getElementById('faltaAte').value;

    showLoading(true);
    try {
      let q = [FB.where('schoolId', '==', APP.currentSchool.id), FB.where('tipo', '==', 'aluno'), FB.where('status', '==', 'F')];
      if (classeId) q.push(FB.where('classeId', '==', classeId));
      if (turmaId) q.push(FB.where('turmaId', '==', turmaId));

      let faltas = await DB.getCollection('presencas', q);
      if (de) faltas = faltas.filter(f => f.data >= de);
      if (ate) faltas = faltas.filter(f => f.data <= ate);

      // Agrupar por aluno
      const porAluno = {};
      faltas.forEach(f => {
        const key = f.alunoId;
        if (!porAluno[key]) porAluno[key] = { name: f.alunoName || 'N/D', faltas: 0, justificadas: 0, datas: [] };
        porAluno[key].faltas++;
        porAluno[key].datas.push(f.data);
      });

      // Justificadas
      let justQ = [FB.where('schoolId', '==', APP.currentSchool.id), FB.where('tipo', '==', 'aluno'), FB.where('status', '==', 'J')];
      if (classeId) justQ.push(FB.where('classeId', '==', classeId));
      if (turmaId) justQ.push(FB.where('turmaId', '==', turmaId));
      let justificadas = await DB.getCollection('presencas', justQ);
      if (de) justificadas = justificadas.filter(f => f.data >= de);
      if (ate) justificadas = justificadas.filter(f => f.data <= ate);

      justificadas.forEach(j => {
        if (porAluno[j.alunoId]) porAluno[j.alunoId].justificadas++;
      });

      const sorted = Object.entries(porAluno).sort((a, b) => b[1].faltas - a[1].faltas);

      document.getElementById('faltasContent').innerHTML = `
        <div class="stats-grid mb-3">
          <div class="stat-card"><div class="stat-icon red"><i class="fas fa-times"></i></div>
            <div class="stat-info"><h3>${faltas.length}</h3><p>Total Faltas</p></div></div>
          <div class="stat-card"><div class="stat-icon orange"><i class="fas fa-file-medical"></i></div>
            <div class="stat-info"><h3>${justificadas.length}</h3><p>Justificadas</p></div></div>
          <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-users"></i></div>
            <div class="stat-info"><h3>${sorted.length}</h3><p>Alunos com Faltas</p></div></div>
        </div>
        <div class="flex-between mb-2 no-print">
          <h4>Mapa de Faltas por Aluno</h4>
          <div style="display:flex;gap:6px">
            <button class="btn btn-sm btn-outline" onclick="PageFaltas.exportPDF()"><i class="fas fa-file-pdf"></i></button>
            <button class="btn btn-sm btn-outline" onclick="PageFaltas.exportXLSX()"><i class="fas fa-file-excel"></i></button>
          </div>
        </div>
        <div class="table-container">
          <table>
            <thead><tr><th>#</th><th>Aluno</th><th class="text-center">Faltas</th><th class="text-center">Justificadas</th><th class="text-center">Total</th><th>Alerta</th></tr></thead>
            <tbody>${sorted.map(([id, info], i) => {
              const total = info.faltas + info.justificadas;
              const alerta = info.faltas > 10 ? 'badge-danger' : info.faltas > 5 ? 'badge-warning' : 'badge-success';
              const alertaText = info.faltas > 10 ? 'Crítico' : info.faltas > 5 ? 'Atenção' : 'Normal';
              return `<tr>

// ============ MELHORIA: Cálculo MFD classes finais corrigido ============
// MFD = (CT3×0.6) + (Exame×0.4) para 6ª, 9ª, 12ª e 13ª
const origCalcMedia = window.Utils.calcularMedia;
window.Utils.calcularMedia = function(notas, classe) {
  const max = Utils.getMaxNota(classe);
  const isFinal = Utils.isClasseFinal(classe);

  let mac1=notas.mac1, npt1=notas.npt1;
  let mac2=notas.mac2, npt2=notas.npt2;
  let mac3=notas.mac3;
  let npt3=notas.npt3;
  let exame=notas.exame;

  let mt1=null, mt2=null, ct1=null, ct2=null, ct3=null, mfd=null;

  // I Trimestre
  if (mac1!==null && mac1!==undefined && npt1!==null && npt1!==undefined) {
    mt1 = Math.round(((parseFloat(mac1)+parseFloat(npt1))/2)*10)/10;
  }
  ct1 = mt1;

  // II Trimestre
  if (mac2!==null && mac2!==undefined && npt2!==null && npt2!==undefined) {
    mt2 = Math.round(((parseFloat(mac2)+parseFloat(npt2))/2)*10)/10;
  }
  ct2 = mt2;

  // III Trimestre
  if (isFinal) {
    // Classes finais: CT3 = (CT1+CT2+MAC3)/3, MFD = CT3*0.6 + Exame*0.4
    if (ct1!==null && ct2!==null && mac3!==null && mac3!==undefined) {
      ct3 = Math.round(((ct1+ct2+parseFloat(mac3))/3)*10)/10;
      if (exame!==null && exame!==undefined) {
        mfd = Math.round(((ct3*0.6)+(parseFloat(exame)*0.4))*10)/10;
      }
    }
  } else {
    // Classes não finais: MT3 = (MAC3+NPT3)/2, MFD = (CT1+CT2+MT3)/3
    if (mac3!==null && mac3!==undefined && npt3!==null && npt3!==undefined) {
      let mt3 = Math.round(((parseFloat(mac3)+parseFloat(npt3))/2)*10)/10;
      if (ct1!==null && ct2!==null) {
        ct3 = mt3;
        mfd = Math.round(((ct1+ct2+mt3)/3)*10)/10;
      }
    }
  }

  return { mt1, mt2, ct1, ct2, ct3, mfd };
};

const origGetCollection = DB.getCollection;
DB.getCollection = async function(path, constraints) {
  try {
    return await origGetCollection.call(this, path, constraints);
  } catch(e) {
    if (e.message && e.message.includes('index')) {
      console.warn('Índice necessário para:', path, '. Tentando sem ordenação...');
      // Tentar sem a última constraint
      if (constraints && constraints.length > 2) {
        try {
          return await origGetCollection.call(this, path, constraints.slice(0, -1));
        } catch(e2) {
          console.error('Fallback também falhou:', e2);
          return [];
        }
      }
      // Tentar sem constraints
      try {
        let allData = await origGetCollection.call(this, path);
        // Filtrar manualmente
        return allData;
      } catch(e3) {
        return [];
      }
    }
    throw e;
  }
};

window.Utils.decompressPhoto = function(base64, maxWidth=600, quality=0.9) {
  return new Promise((resolve) => {
    if (!base64) { resolve(null); return; }
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if (w > maxWidth) { h = h*(maxWidth/w); w = maxWidth; }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => resolve(base64);
    img.src = base64;
  });
};

// ============ FIX 3: CONFIRM MODAL - Recriar corretamente ============
window.Utils.confirm = function(msg) {
  return new Promise(resolve => {
    // Remover modais de confirmação anteriores
    document.querySelectorAll('.confirm-modal-dynamic').forEach(m => m.remove());

    const modal = document.createElement('div');
    modal.className = 'confirm-modal-dynamic';
    modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:100001;';

    const box = document.createElement('div');
    box.style.cssText = 'background:#fff;padding:30px;border-radius:12px;text-align:center;max-width:420px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.3);z-index:100002;position:relative;';

    box.innerHTML = `
      <i class="fas fa-question-circle" style="font-size:44px;color:#d97706;margin-bottom:12px"></i>
      <p style="font-size:15px;margin:12px 0 24px;color:#1e293b;line-height:1.5">${msg}</p>
      <div style="display:flex;gap:12px;justify-content:center">
        <button id="_confirmNo" style="padding:10px 24px;border:1px solid #e2e8f0;background:#fff;border-radius:8px;cursor:pointer;font-size:14px;color:#64748b;display:flex;align-items:center;gap:6px;transition:all 0.2s">
          <i class="fas fa-times"></i> Não
        </button>
        <button id="_confirmYes" style="padding:10px 24px;border:none;background:#059669;color:#fff;border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:6px;transition:all 0.2s">
          <i class="fas fa-check"></i> Sim
        </button>
      </div>
    `;

    modal.appendChild(box);
    document.body.appendChild(modal);

    // Prevenir que loading bloqueie
    const loadScreen = document.getElementById('loadingScreen');
    const wasLoading = loadScreen && loadScreen.style.display === 'flex';
    if (wasLoading) loadScreen.style.display = 'none';

    const cleanup = () => {
      modal.remove();
      if (wasLoading) loadScreen.style.display = 'flex';
    };

    box.querySelector('#_confirmNo').onclick = () => { cleanup(); resolve(false); };
    box.querySelector('#_confirmYes').onclick = () => { cleanup(); resolve(true); };

    // Fechar ao clicar fora
    modal.addEventListener('click', (e) => {
      if (e.target === modal) { cleanup(); resolve(false); }
    });

    // ESC para fechar
    const escHandler = (e) => {
      if (e.key === 'Escape') { document.removeEventListener('keydown', escHandler); cleanup(); resolve(false); }
    };
    document.addEventListener('keydown', escHandler);
  });
};

  };

  if (!schoolData.directorEmail) { Utils.toast('Email do director é obrigatório', 'warning'); return; }

  if (isNew) {
    const pw = document.getElementById('dirPassword').value;
    const pw2 = document.getElementById('dirPassword2').value;
    if (!pw || pw.length < 6) { Utils.toast('Senha deve ter mínimo 6 caracteres', 'warning'); return; }
    if (pw !== pw2) { Utils.toast('As senhas não coincidem', 'error'); return; }
  }

  // Fechar o modal ANTES da confirmação para evitar conflito de z-index
  this.closeModal();

  const ok = await Utils.confirm(isNew
    ? `Confirma a criação da escola "${schoolData.name}" e as credenciais do director?`
    : `Confirma as alterações na escola "${schoolData.name}"?`
  );
  if (!ok) {
    // Reabrir o modal se cancelar
    this.openModal(id);
    return;
  }

  showLoading(true);
  try {
    if (isNew) {
      // Criar escola primeiro
      const schoolId = Utils.generateId();
      await DB.saveDoc('schools', schoolId, schoolData);

      // Criar conta do director
      try {
        const dirEmail = document.getElementById('dirEmail')?.value?.trim() || schoolData.directorEmail;

        const cred = await FB.createUserWithEmailAndPassword(FB.auth, dirEmail, dirPw);

          uid: cred.user.uid,
          role: 'diretor',
          name: schoolData.directorName,
          email: dirEmail,
          sexo: schoolData.directorSexo,
          phone: schoolData.directorPhone,
          bi: schoolData.directorBi,
          agente: schoolData.directorAgente,
          schoolId: schoolId,
          active: true,
          createdAt: FB.serverTimestamp()
        });

        await DB.saveDoc('schools', schoolId, { directorId: cred.user.uid });

        // Re-autenticar como super admin (createUser muda o auth state)
        // Nota: Em produção usar Cloud Functions
        Utils.toast('Escola e director criados com sucesso! Email: ' + dirEmail, 'success');

      } catch (authError) {
        console.error('Erro ao criar utilizador director:', authError);
        if (authError.code === 'auth/email-already-in-use') {
          // Se email já existe, vincular ao director existente
          const existingUsers = await DB.getCollection('users', [FB.where('email', '==', schoolData.directorEmail)]);
          if (existingUsers.length > 0) {
            const existingUser = existingUsers[0];
            await DB.saveDoc('users', existingUser.uid || existingUser.id, {
              role: 'diretor',
              schoolId: schoolId,
              name: schoolData.directorName
            });
            await DB.saveDoc('schools', schoolId, { directorId: existingUser.uid || existingUser.id });
            Utils.toast('Escola criada! Director vinculado (email já existente).', 'success');
          } else {
            Utils.toast('Escola criada mas erro ao criar director: ' + authError.message, 'warning');
          }
        } else {
          Utils.toast('Escola criada mas erro ao criar director: ' + authError.message, 'warning');
        }
      }
    } else {
      // Editar escola
      await DB.saveDoc('schools', id, schoolData);
      Utils.toast('Escola atualizada com sucesso!', 'success');
    }

    await this.loadData();
    if (typeof loadSchoolSelector === 'function') loadSchoolSelector();
  } catch (e) {
    Utils.toast('Erro: ' + e.message, 'error');
  }
  showLoading(false);
};

        });

// ============ FIX RAIZ: calcularMedia retornava undefined ============
// O erro "Unsupported field value: undefined" ocorre porque ct3/mfd
// ficam undefined quando condições não são atendidas
// SOLUÇÃO: Garantir que TODOS os campos retornam null (nunca undefined)

window.Utils.calcularMedia = function(notas, classe) {
  if (!notas) return { mt1: null, mt2: null, ct1: null, ct2: null, ct3: null, mfd: null };

  const isFinal = Utils.isClasseFinal(classe);

  // Converter para float ou null (NUNCA undefined)
  const toNum = (v) => {
    if (v === null || v === undefined || v === '') return null;
    const n = parseFloat(v);
    return isNaN(n) ? null : n;
  };

  const mac1 = toNum(notas.mac1);
  const npt1 = toNum(notas.npt1);
  const mac2 = toNum(notas.mac2);
  const npt2 = toNum(notas.npt2);
  const mac3 = toNum(notas.mac3);
  const npt3 = toNum(notas.npt3);
  const exame = toNum(notas.exame);

  // I Trimestre: MT1 = (MAC1 + NPT1) / 2
  let mt1 = null;
  if (mac1 !== null && npt1 !== null) {
    mt1 = Math.round(((mac1 + npt1) / 2) * 10) / 10;
  }

  // II Trimestre: MT2 = (MAC2 + NPT2) / 2
  let mt2 = null;
  if (mac2 !== null && npt2 !== null) {
    mt2 = Math.round(((mac2 + npt2) / 2) * 10) / 10;
  }

  let ct1 = mt1;  // CT1 = MT1
  let ct2 = mt2;  // CT2 = MT2
  let ct3 = null;
  let mfd = null;

  if (isFinal) {
    // Classes finais (6ª, 9ª, 12ª, 13ª):
    // CT3 = (CT1 + CT2 + MAC3) / 3
    // MFD = (CT3 × 0.6) + (Exame × 0.4)
    if (ct1 !== null && ct2 !== null && mac3 !== null) {
      ct3 = Math.round(((ct1 + ct2 + mac3) / 3) * 10) / 10;
      if (exame !== null) {
        mfd = Math.round(((ct3 * 0.6) + (exame * 0.4)) * 10) / 10;
      }
    }
  } else {
    // Classes não finais:
    // MT3 = (MAC3 + NPT3) / 2
    // MFD = (CT1 + CT2 + MT3) / 3
    if (mac3 !== null && npt3 !== null) {
      const mt3 = Math.round(((mac3 + npt3) / 2) * 10) / 10;
      if (ct1 !== null && ct2 !== null) {
        ct3 = mt3;
        mfd = Math.round(((ct1 + ct2 + mt3) / 3) * 10) / 10;
      }
    }
  }

  // GARANTIR que nenhum valor é undefined (sempre null)
  return {
    mt1: mt1 !== undefined ? mt1 : null,
    mt2: mt2 !== undefined ? mt2 : null,
    ct1: ct1 !== undefined ? ct1 : null,
    ct2: ct2 !== undefined ? ct2 : null,
    ct3: ct3 !== undefined ? ct3 : null,
    mfd: mfd !== undefined ? mfd : null
  };
};

// ============ FIX: Função para limpar undefined antes de salvar ============
function cleanForFirestore(obj) {
  const clean = {};
  for (const key in obj) {
    if (obj[key] === undefined) {
      clean[key] = null;
    } else if (obj[key] !== null && typeof obj[key] === 'object' && !Array.isArray(obj[key]) && !(obj[key] instanceof Date) && !obj[key].toDate) {
      clean[key] = cleanForFirestore(obj[key]);
    } else {
      clean[key] = obj[key];
    }
  }
  return clean;
}

// ============ FIX: DB.saveDoc limpa undefined automaticamente ============
const origSaveDoc = DB.saveDoc;
DB.saveDoc = async function(path, id, data) {
  const cleanData = cleanForFirestore(data);
  return origSaveDoc.call(this, path, id, cleanData);
};

  const maxNota = Utils.getMaxNota(this._currentClasse.name);

    const alunoId = input.dataset.aluno;

      if (isNaN(val) || val < 0 || val > maxNota) {
        hasError = true;
        input.style.borderColor = 'red';
        return;
      }
      input.style.borderColor = '';
    }

    if (!updates[alunoId]) updates[alunoId] = {};
    updates[alunoId][field] = val;
  });

  if (hasError) {
    Utils.toast(`Notas inválidas detectadas (0 a ${maxNota})`, 'error');
    return;
  }

  showLoading(true);
  let saved = 0;

  try {
    for (const alunoId in updates) {
      const aluno = this._alunos.find(a => a.id === alunoId);
      if (!aluno) continue;

      const existing = this._notas[alunoId] || {};

      // Construir objeto de notas completo (merge)
      const merged = {
        mac1: updates[alunoId].hasOwnProperty('mac1') ? updates[alunoId].mac1 : (existing.mac1 != null ? existing.mac1 : null),
        npt1: updates[alunoId].hasOwnProperty('npt1') ? updates[alunoId].npt1 : (existing.npt1 != null ? existing.npt1 : null),
        mac2: updates[alunoId].hasOwnProperty('mac2') ? updates[alunoId].mac2 : (existing.mac2 != null ? existing.mac2 : null),
        npt2: updates[alunoId].hasOwnProperty('npt2') ? updates[alunoId].npt2 : (existing.npt2 != null ? existing.npt2 : null),
        mac3: updates[alunoId].hasOwnProperty('mac3') ? updates[alunoId].mac3 : (existing.mac3 != null ? existing.mac3 : null),
        npt3: updates[alunoId].hasOwnProperty('npt3') ? updates[alunoId].npt3 : (existing.npt3 != null ? existing.npt3 : null),
        exame: updates[alunoId].hasOwnProperty('exame') ? updates[alunoId].exame : (existing.exame != null ? existing.exame : null),
      };

      // Calcular médias (retorna null, nunca undefined)
      const calc = Utils.calcularMedia(merged, this._currentClasse.name);

      const docData = {
        mac1: merged.mac1,
        npt1: merged.npt1,
        mac2: merged.mac2,
        npt2: merged.npt2,
        mac3: merged.mac3,
        npt3: merged.npt3,
        exame: merged.exame,
        mt1: calc.mt1,
        mt2: calc.mt2,
        ct1: calc.ct1,
        ct2: calc.ct2,
        ct3: calc.ct3,
        mfd: calc.mfd,
        alunoId: alunoId,
        alunoName: aluno.name || '',
        alunoSexo: aluno.sexo || '',
        disciplinaId: this._currentDisc.id,
        disciplina: this._currentDisc.name,
        disciplinaName: this._currentDisc.name,
        classeId: this._currentClasse.id,
        classeName: this._currentClasse.name,
        turmaId: this._currentTurma.id,
        turmaName: this._currentTurma.name,
        curso: this._currentTurma.curso || '',
        schoolId: APP.currentSchool.id,
        yearId: APP.currentYearId || '',
        lastTrimestre: this._currentTrim,
        lastEditBy: APP.currentUser.name || '',
        lastEditAt: new Date().toISOString()
      };

      const id = existing.id || Utils.generateId();
      await DB.saveDoc('notas', id, docData);
      this._notas[alunoId] = { id: id, ...docData };
      saved++;
    }

    Utils.toast(`${saved} notas salvas com sucesso!`, 'success');
    this.renderNotasTable();

  } catch (e) {
    console.error('Erro ao salvar notas:', e);
    Utils.toast('Erro ao salvar: ' + e.message, 'error');
  }
  showLoading(false);
};

// ============ FIX: Renderizar tabela de notas com cálculos ============
PageNotas.renderNotasTable = function() {
  const thead = document.getElementById('notasTableHead');
  const tbody = document.getElementById('notasTableBody');
  if (!thead || !tbody) return;

  const trim = this._currentTrim;
  const classe = this._currentClasse;
  if (!classe) return;

  const isFinal = Utils.isClasseFinal(classe.name);
  const maxNota = Utils.getMaxNota(classe.name);
  const notaPos = Utils.getNotaPositiva(classe.name);
  const disabled = this._isLocked ? 'disabled' : '';
  const inpS = `style="width:55px;padding:4px;text-align:center;border:1px solid var(--border);border-radius:4px;font-size:13px"`;

  // Cabeçalho
  let hdr = '<th>#</th><th style="min-width:180px">Nome do Aluno</th>';
  if (trim === '1') {
    hdr += '<th class="text-center">MAC₁</th><th class="text-center">NPT₁</th><th class="text-center">MT₁</th>';
  } else if (trim === '2') {
    hdr += '<th class="text-center">MAC₂</th><th class="text-center">NPT₂</th><th class="text-center">MT₂</th>';
  } else if (isFinal) {
    hdr += '<th class="text-center">CT₁</th><th class="text-center">CT₂</th><th class="text-center">MAC₃</th><th class="text-center">CT₃</th><th class="text-center">Exame</th><th class="text-center">MFD</th>';
  } else {
    hdr += '<th class="text-center">MAC₃</th><th class="text-center">NPT₃</th><th class="text-center">MT₃</th><th class="text-center">MFD</th>';
  }
  hdr += '<th class="text-center">Obs.</th>';
  thead.innerHTML = `<tr>${hdr}</tr>`;

  if (this._alunos.length === 0) {
    tbody.innerHTML = '<tr><td colspan="12" class="text-center">Nenhum aluno nesta turma</td></tr>';
    return;
  }

  const notaCls = (val) => {
    if (val === null) return '';
    return val >= notaPos ? 'nota-positiva' : 'nota-negativa';
  };

  tbody.innerHTML = this._alunos.map((aluno, i) => {
    const n = this._notas[aluno.id] || {};
    const calc = Utils.calcularMedia(n, classe.name);
    let cells = `<td>${i + 1}</td><td><strong class="nome-aluno">${aluno.name}</strong></td>`;

    if (trim === '1') {
      cells += `<td class="text-center"><input type="number" ${inpS} min="0" max="${maxNota}" step="0.1" value="${n.mac1 != null ? n.mac1 : ''}" data-field="mac1" data-aluno="${aluno.id}" ${disabled}></td>`;
      cells += `<td class="text-center"><input type="number" ${inpS} min="0" max="${maxNota}" step="0.1" value="${n.npt1 != null ? n.npt1 : ''}" data-field="npt1" data-aluno="${aluno.id}" ${disabled}></td>`;
      cells += `<td class="text-center ${notaCls(calc.mt1)}"><strong>${calc.mt1 !== null ? calc.mt1 : ''}</strong></td>`;

    } else if (trim === '2') {
      cells += `<td class="text-center"><input type="number" ${inpS} min="0" max="${maxNota}" step="0.1" value="${n.mac2 != null ? n.mac2 : ''}" data-field="mac2" data-aluno="${aluno.id}" ${disabled}></td>`;
      cells += `<td class="text-center"><input type="number" ${inpS} min="0" max="${maxNota}" step="0.1" value="${n.npt2 != null ? n.npt2 : ''}" data-field="npt2" data-aluno="${aluno.id}" ${disabled}></td>`;
      cells += `<td class="text-center ${notaCls(calc.mt2)}"><strong>${calc.mt2 !== null ? calc.mt2 : ''}</strong></td>`;

    } else if (isFinal) {
      cells += `<td class="text-center ${notaCls(calc.ct1)}">${calc.ct1 !== null ? calc.ct1 : '-'}</td>`;
      cells += `<td class="text-center ${notaCls(calc.ct2)}">${calc.ct2 !== null ? calc.ct2 : '-'}</td>`;
      cells += `<td class="text-center"><input type="number" ${inpS} min="0" max="${maxNota}" step="0.1" value="${n.mac3 != null ? n.mac3 : ''}" data-field="mac3" data-aluno="${aluno.id}" ${disabled}></td>`;
      cells += `<td class="text-center ${notaCls(calc.ct3)}"><strong>${calc.ct3 !== null ? calc.ct3 : ''}</strong></td>`;
      cells += `<td class="text-center"><input type="number" ${inpS} min="0" max="${maxNota}" step="0.1" value="${n.exame != null ? n.exame : ''}" data-field="exame" data-aluno="${aluno.id}" ${disabled}></td>`;
      cells += `<td class="text-center ${notaCls(calc.mfd)}"><strong>${calc.mfd !== null ? calc.mfd : ''}</strong></td>`;

    } else {
      cells += `<td class="text-center"><input type="number" ${inpS} min="0" max="${maxNota}" step="0.1" value="${n.mac3 != null ? n.mac3 : ''}" data-field="mac3" data-aluno="${aluno.id}" ${disabled}></td>`;
      cells += `<td class="text-center"><input type="number" ${inpS} min="0" max="${maxNota}" step="0.1" value="${n.npt3 != null ? n.npt3 : ''}" data-field="npt3" data-aluno="${aluno.id}" ${disabled}></td>`;
      let mt3 = null;
      if (n.mac3 != null && n.npt3 != null) mt3 = Math.round(((parseFloat(n.mac3) + parseFloat(n.npt3)) / 2) * 10) / 10;
      cells += `<td class="text-center ${notaCls(mt3)}"><strong>${mt3 !== null ? mt3 : ''}</strong></td>`;
      cells += `<td class="text-center ${notaCls(calc.mfd)}"><strong>${calc.mfd !== null ? calc.mfd : ''}</strong></td>`;
    }

    // Observação
    let obs = '';
    if (aluno.estado === 'Transferido') obs = Utils.genero(aluno.sexo, 'transferido');
    else if (aluno.estado === 'Desistente') obs = 'Desistente';
    else if (calc.mfd !== null) obs = calc.mfd >= notaPos ? Utils.genero(aluno.sexo, 'aprovado') : Utils.genero(aluno.sexo, 'reprovado');
    const obsCls = obs.toLowerCase().includes('aprov') ? 'nota-positiva' : obs.toLowerCase().includes('reprov') ? 'nota-negativa' : '';
    cells += `<td class="text-center ${obsCls}"><small>${obs ? obs.charAt(0).toUpperCase() + obs.slice(1) : ''}</small></td>`;

    return `<tr>${cells}</tr>`;
  }).join('');
};

// ============ FIX: Histórico - Apenas MFD ============
PageHistorico.selectAluno = async function(id) {
  document.getElementById('histSearchResults').style.display = 'none';
  this._selectedAluno = this._allAlunos.find(a => a.id === id);
  if (!this._selectedAluno) return;

  showLoading(true);
  try {
    const notas = await DB.getCollection('notas', [FB.where('alunoId', '==', id)]);
    const notasHist = await DB.getCollection('notasHistorico', [FB.where('alunoId', '==', id)]);
    const disciplinas = await DB.getCollection('disciplinas', [FB.where('schoolId', '==', APP.currentSchool.id)]);
    disciplinas.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));

    const todas = [...notas, ...notasHist];
    const porClasse = {};
    todas.forEach(n => {
      const key = n.classeName || n.classe || 'N/D';
      if (!porClasse[key]) porClasse[key] = [];
      porClasse[key].push(n);
    });

    const classesOrd = Object.keys(porClasse).sort((a, b) => Utils.getClasseNum(a) - Utils.getClasseNum(b));
    const aluno = this._selectedAluno;

    let html = `<div class="card mb-3">
      <div class="card-header">
        <div><h3 style="color:var(--angola-red)">${aluno.name}</h3>
          <small>Mat: ${aluno.matricula || 'N/D'} | Proc: ${aluno.processo || 'N/D'} | BI: ${aluno.bi || 'N/D'}</small></div>
        <button class="btn btn-sm btn-primary no-print" onclick="PageHistorico.exportPDF('${id}')"><i class="fas fa-file-pdf"></i> PDF</button>
      </div>
      <div class="card-body">`;

    if (classesOrd.length === 0) {
      html += '<div class="empty-state"><p>Nenhuma nota encontrada</p></div>';
    } else {
      classesOrd.forEach(classe => {
        const nd = porClasse[classe];
        const pos = Utils.getNotaPositiva(classe);
        nd.sort((a, b) => {
          const da = disciplinas.find(d => d.id === a.disciplinaId || d.name === (a.disciplina || a.disciplinaName));
          const db = disciplinas.find(d => d.id === b.disciplinaId || d.name === (b.disciplina || b.disciplinaName));
          return ((da?.ordem || 99) - (db?.ordem || 99));
        });

        html += `<h4 style="margin:16px 0 8px;color:var(--primary)"><i class="fas fa-layer-group"></i> ${classe}</h4>
          <div class="table-container mb-3"><table class="table-sm">
          <thead><tr><th>Disciplina</th><th class="text-center">Média Final</th><th>Por Extenso</th></tr></thead><tbody>`;

        nd.forEach(n => {
          const calc = Utils.calcularMedia(n, classe);
          const mfd = calc.mfd !== null ? calc.mfd : (n.mfd != null ? parseFloat(n.mfd) : null);
          const cls = mfd !== null ? (mfd >= pos ? 'nota-positiva' : 'nota-negativa') : '';
          html += `<tr><td><strong>${n.disciplina || n.disciplinaName || ''}</strong></td>
            <td class="text-center ${cls}"><strong>${mfd !== null ? mfd : '-'}</strong></td>
            <td>${mfd !== null ? Utils.valorExtenso(mfd) : '-'}</td></tr>`;
        });
        html += '</tbody></table></div>';
      });
    }
    html += '</div></div>';
    document.getElementById('histContent').innerHTML = html;
  } catch (e) { console.error(e); Utils.toast('Erro: ' + e.message, 'error'); }
  showLoading(false);
};

// ============ FIX: Histórico adicionar - Apenas MFD ============
PageHistorico.loadDiscHistorico = async function() {
  const classeId = document.getElementById('histAddClasse').value;
  const sel = document.getElementById('histAddClasse');
  const classeName = sel.options[sel.selectedIndex]?.dataset?.name || '';
  if (!classeId) return;

  const disciplinas = await DB.getCollection('disciplinas', [FB.where('schoolId', '==', APP.currentSchool.id), FB.where('classeId', '==', classeId)]);
  disciplinas.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));

  const notasHist = await DB.getCollection('notasHistorico', [FB.where('alunoId', '==', this._selectedAluno.id), FB.where('classeId', '==', classeId)]);
  const notasMap = {};
  notasHist.forEach(n => { notasMap[n.disciplinaId] = n; });

  const maxN = Utils.getMaxNota(classeName);
  const container = document.getElementById('histAddDiscContainer');

  if (disciplinas.length === 0) {
    container.innerHTML = '<div class="empty-state"><p>Nenhuma disciplina para esta classe</p></div>';
    return;
  }

  container.innerHTML = `<div class="table-container"><table class="table-sm">
    <thead><tr><th>Disciplina</th><th class="text-center">Média Final (MFD)</th><th>Por Extenso</th></tr></thead>
    <tbody>${disciplinas.map(d => {
      const n = notasMap[d.id] || {};
      const mfd = n.mfd != null ? n.mfd : '';
      return `<tr><td><strong>${d.name}</strong></td>
        <td class="text-center"><input type="number" style="width:65px;padding:4px;text-align:center;border:1px solid var(--border);border-radius:4px" min="0" max="${maxN}" step="0.1" value="${mfd}" data-disc="${d.id}" oninput="document.getElementById('ext_${d.id}').textContent=this.value?Utils.valorExtenso(parseFloat(this.value)):''"></td>
        <td id="ext_${d.id}">${mfd !== '' ? Utils.valorExtenso(parseFloat(mfd)) : ''}</td></tr>`;
    }).join('')}</tbody></table></div>
    <div style="margin-top:12px;text-align:right">
      <button class="btn btn-success" onclick="PageHistorico.salvarNotasHistorico()"><i class="fas fa-save"></i> Salvar</button>
    </div>`;
};

// ============ FIX: Salvar histórico - Apenas MFD ============
PageHistorico.salvarNotasHistorico = async function() {
  const classeId = document.getElementById('histAddClasse').value;
  const sel = document.getElementById('histAddClasse');
  const classeName = sel.options[sel.selectedIndex]?.dataset?.name || '';
  const anoLetivo = document.getElementById('histAddAno')?.value || '';
  const aluno = this._selectedAluno;
  if (!classeId || !aluno) return;

  const inputs = document.querySelectorAll('#histAddDiscContainer input[data-disc]');
  const disciplinas = await DB.getCollection('disciplinas', [FB.where('schoolId', '==', APP.currentSchool.id), FB.where('classeId', '==', classeId)]);

  showLoading(true);
  let saved = 0;
  try {
    for (const inp of inputs) {
      const discId = inp.dataset.disc;
      const mfdVal = inp.value !== '' ? parseFloat(inp.value) : null;
      if (isNaN(mfdVal) && mfdVal !== null) continue;
      const disc = disciplinas.find(d => d.id === discId);

      const data = {
        mfd: mfdVal,
        alunoId: aluno.id, alunoName: aluno.name,
        disciplinaId: discId, disciplina: disc ? disc.name : '', disciplinaName: disc ? disc.name : '',
        classeId, classeName, classe: classeName, anoLetivo,
        schoolId: APP.currentSchool.id, tipo: 'historico'
      };

      const existing = await DB.getCollection('notasHistorico', [FB.where('alunoId', '==', aluno.id), FB.where('disciplinaId', '==', discId), FB.where('classeId', '==', classeId)]);
      await DB.saveDoc('notasHistorico', existing.length > 0 ? existing[0].id : Utils.generateId(), data);
      saved++;
    }
    Utils.toast(`${saved} notas salvas!`, 'success');
    this.loadDiscHistorico();
  } catch (e) { Utils.toast('Erro: ' + e.message, 'error'); }
  showLoading(false);
};

// ============ FIX: Histórico PDF - Apenas MFD ============
PageHistorico.exportPDF = async function(alunoId) {
  const aluno = this._allAlunos.find(a => a.id === alunoId) || this._selectedAluno;

  disciplinas.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));

  const todas = [...notas, ...notasHist];
  const porClasse = {};
  todas.forEach(n => { const k = n.classeName || n.classe || 'N/D'; if (!porClasse[k]) porClasse[k] = []; porClasse[k].push(n); });
  const classesOrd = Object.keys(porClasse).sort((a, b) => Utils.getClasseNum(a) - Utils.getClasseNum(b));

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const pw = doc.internal.pageSize.getWidth();

  doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('REPÚBLICA DE ANGOLA', pw/2, y, {align:'center'}); y += 5;
  doc.setFontSize(9); doc.setFont('helvetica','normal');
  doc.text('MINISTÉRIO DA EDUCAÇÃO', pw/2, y, {align:'center'}); y += 8;
  doc.setFontSize(13); doc.setFont('helvetica','bold');
  doc.text('HISTÓRICO ESCOLAR', pw/2, y, {align:'center'}); y += 8;
  doc.setTextColor(206,17,38);
  doc.text(aluno.name, pw/2, y, {align:'center'}); y += 5;
  doc.setTextColor(0,0,0); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(`Mat: ${aluno.matricula||'N/D'} | Proc: ${aluno.processo||'N/D'} | BI: ${aluno.bi||'N/D'}`, pw/2, y, {align:'center'}); y += 8;

  classesOrd.forEach(classe => {
    const nd = porClasse[classe];
    nd.sort((a,b) => {
      const da = disciplinas.find(d=>d.id===a.disciplinaId||d.name===(a.disciplina||a.disciplinaName));
      const db = disciplinas.find(d=>d.id===b.disciplinaId||d.name===(b.disciplina||b.disciplinaName));
      return ((da?.ordem||99)-(db?.ordem||99));
    });
    if (y > 250) { doc.addPage(); y = 15; }
    doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.text(classe, 14, y); y += 2;
    doc.autoTable({
      startY: y,
      head:[['Disciplina','Média Final','Por Extenso']],
      body: nd.map(n => {
        const calc = Utils.calcularMedia(n, classe);
        const mfd = calc.mfd !== null ? calc.mfd : (n.mfd != null ? parseFloat(n.mfd) : null);
        return [n.disciplina||n.disciplinaName||'', mfd !== null ? mfd : '-', mfd !== null ? Utils.valorExtenso(mfd) : '-'];
      }),
      styles:{fontSize:8,halign:'center'}, headStyles:{fillColor:[15,23,42]},
      columnStyles:{0:{halign:'left'}}, margin:{left:14,right:14}
    });
    y = doc.lastAutoTable.finalY + 8;
  });
  doc.save(`historico_${(aluno.name||'').replace(/\s/g,'_')}.pdf`);
  Utils.toast('PDF gerado!','success');
};

    doc.text(al.name,pos.x+2,y);doc.setTextColor(0,0,0);y+=2.5;
    doc.setFont('helvetica','normal');doc.setFontSize(4.5);
    doc.text(`Classe: ${d.classe?.name||''} | Turma: ${d.turma?.name||''} ${d.turma?.curso?'('+d.turma.curso+')':''}`,pos.x+2,y);y+=3;

    const head=[['Disciplina','MAC','NPT','MT']];
    const body=d.discs.map(dc=>{
      const nota=d.notasMap[`${al.id}_${dc.id}`];
      const calc=nota?Utils.calcularMedia(nota,d.classe.name):{mt1:null,mt2:null,mfd:null};
      let mac='',npt='',mt=null;
      if(d.trimestre==='1'){mac=nota?.mac1??'';npt=nota?.npt1??'';mt=calc.mt1;}
      else if(d.trimestre==='2'){mac=nota?.mac2??'';npt=nota?.npt2??'';mt=calc.mt2;}
      else{mac=nota?.mac3??'';npt=nota?.npt3??'';mt=calc.mfd;}
      return[dc.name,mac,npt,mt!==null?mt:''];
    });

    doc.autoTable({startY:y,head,body,
      styles:{fontSize:4.5,cellPadding:1,halign:'center'},
      headStyles:{fillColor:[15,23,42],fontSize:4.5},
      columnStyles:{0:{halign:'left',cellWidth:bw*0.45}},
      tableWidth:bw-4,margin:{left:pos.x+2,right:pw-pos.x-bw+2}

    const aY=Math.min(doc.lastAutoTable.finalY+3,pos.y+bh-14);
    doc.setFontSize(3.8);doc.setFont('helvetica','normal');
    const aw=(bw-8)/3;

    doc.line(pos.x+2,aY,pos.x+2+aw-2,aY);
    doc.text('Enc. de Educação',pos.x+2+(aw-2)/2,aY+2.5,{align:'center'});

    const pL=ped?(ped.sexo==='F'?'A Subdir. Ped.':'O Subdir. Ped.'):'Subdir. Ped.';
    doc.line(pos.x+2+aw+1,aY,pos.x+2+aw*2-1,aY);
    doc.text(pL,pos.x+2+aw+1+(aw-2)/2,aY+2.5,{align:'center'});
    if(ped)doc.text(ped.name.substring(0,18),pos.x+2+aw+1+(aw-2)/2,aY+4.5,{align:'center'});
    // Director
    const dL=dir?(dir.sexo==='F'?'A Directora':'O Director'):'O Director';
    doc.line(pos.x+2+aw*2+2,aY,pos.x+bw-2,aY);
    doc.text(dL,pos.x+2+aw*2+2+(bw-4-aw*2-2)/2,aY+2.5,{align:'center'});
    if(dir)doc.text(dir.name.substring(0,18),pos.x+2+aw*2+2+(bw-4-aw*2-2)/2,aY+4.5,{align:'center'});
  }

  doc.save(`boletins_${d.classe?.name}_${d.turma?.name}.pdf`);
  Utils.toast('Boletins PDF gerados!','success');
};

PageDeclaracoes._renderDeclaracaoPage = async function(doc,aluno) {
  const pw=doc.internal.pageSize.getWidth();
  const school=APP.currentSchool;
  if(!APP.insigniaBase64){const ins=await DB.getInsignia();if(ins)APP.insigniaBase64=ins;}

  const dir=users.find(u=>u.role==='diretor');
  const ped=users.find(u=>u.role==='subdiretor_pedagogico');

  let notas=await DB.getCollection('notas',[FB.where('alunoId','==',aluno.id)]);
  const nh=await DB.getCollection('notasHistorico',[FB.where('alunoId','==',aluno.id),FB.where('classeId','==',aluno.classeId)]);
  notas=[...notas.filter(n=>n.classeId===aluno.classeId),...nh];
  const discs=await DB.getCollection('disciplinas',[FB.where('schoolId','==',school.id),FB.where('classeId','==',aluno.classeId)]);

  let y=12;

  doc.setFontSize(11);doc.setFont('helvetica','bold');
  doc.text('REPÚBLICA DE ANGOLA',pw/2,y,{align:'center'});y+=5;
  doc.setFontSize(9);doc.setFont('helvetica','normal');
  doc.text('MINISTÉRIO DA EDUCAÇÃO',pw/2,y,{align:'center'});y+=10;
  doc.setFontSize(14);doc.setFont('helvetica','bold');
  doc.text('DECLARAÇÃO',pw/2,y,{align:'center'});y+=12;

  const pedN=ped?ped.name:'____________________';
  const pedC=ped?(ped.sexo==='F'?'Subdirectora Pedagógica':'Subdirector Pedagógico'):'Subdirector Pedagógico';
  const nascD=aluno.nascimento?aluno.nascimento.split('-').reverse().join('/'):'.../.../....';

  doc.setFontSize(10);doc.setFont('helvetica','normal');
  const corpo=`${pedN}, ${pedC} ${school.denominacao||school.name||'________'}, declara para os devidos efeitos que ${aluno.name}, ${Utils.genero(aluno.sexo,'filho')} de ${aluno.nomePai||'________'} e de ${aluno.nomeMae||'________'}, ${Utils.genero(aluno.sexo,'nascido')} aos ${nascD}, ${Utils.genero(aluno.sexo,'natural')} de ${aluno.naturalidade||'________'}, município de ${aluno.municipio||'________'}, província ${aluno.provincia||'________'}, ${Utils.genero(aluno.sexo,'portador')} do B.I. n° ${aluno.bi||'________'}, passado pelo Arquivo de Identificação de ${aluno.biLocal||'________'}, frequentou neste estabelecimento de ensino no ano lectivo ${aluno.yearName||'20.../20...'}, a ${aluno.classeName||'________'}, com as seguintes classificações:`;

  const lines=doc.splitTextToSize(corpo,pw-30);
  doc.text(lines,15,y,{align:'justify',maxWidth:pw-30});

  if(notas.length>0){

      return[d.name,mfd!==null?mfd:'-',mfd!==null?Utils.valorExtenso(mfd):'-'];

    if(td.length>0){
      doc.autoTable({startY:y,head:[['Disciplina','Nota','Por Extenso']],body:td,

PagePasses._exportPassesPDF = async function(pessoas,tipo) {
  const{jsPDF}=window.jspdf;const doc=new jsPDF();
  const pw=doc.internal.pageSize.getWidth(),ph=doc.internal.pageSize.getHeight();
  const school=APP.currentSchool;const isAl=tipo==='aluno';

  if(!APP.insigniaBase64){const ins=await DB.getInsignia();if(ins)APP.insigniaBase64=ins;}
  const users=await DB.getCollection('users',[FB.where('schoolId','==',school.id)]);
  const dir=users.find(u=>u.role==='diretor');
  const dL=dir?(dir.sexo==='F'?'A Directora':'O Director'):'O Director';
  const dN=dir?dir.name:'';

  const cW=(pw-25)/2,cH=(ph-25)/3;
  const pos=[];for(let r=0;r<3;r++)for(let c=0;c<2;c++)pos.push({x:8+c*(cW+6),y:8+r*(cH+3)});

  for(let i=0;i<pessoas.length;i++){
    const pi=i%6;if(i>0&&pi===0)doc.addPage();
    const p=pos[pi],pe=pessoas[i];let y=p.y;

    doc.setDrawColor(206,17,38);doc.setLineWidth(0.8);doc.roundedRect(p.x,p.y,cW,cH-4,3,3);
    doc.setFillColor(206,17,38);doc.roundedRect(p.x,p.y,cW,14,3,3,'F');doc.rect(p.x,p.y+7,cW,7,'F');

    if(APP.insigniaBase64){try{doc.addImage(APP.insigniaBase64,'PNG',p.x+2,y+1.5,9,9);}catch(e){}}
    doc.setTextColor(255,255,255);doc.setFontSize(5.5);doc.setFont('helvetica','bold');
    doc.text((school.name||'').substring(0,35),p.x+13+(cW-15)/2,y+5,{align:'center',maxWidth:cW-15});
    doc.setFontSize(4);doc.setFont('helvetica','normal');
    doc.text(`${school.municipality||''} - ${school.province||''}`,p.x+cW/2,y+9,{align:'center'});
    y+=16;doc.setTextColor(0,0,0);

    const phX=p.x+4,phY=y;
    if(pe.photo){try{doc.addImage(pe.photo,'JPEG',phX,phY,18,22);}catch(e){doc.setDrawColor(200);doc.rect(phX,phY,18,22);}}
    else{doc.setDrawColor(200);doc.rect(phX,phY,18,22);doc.setFontSize(5);doc.text('FOTO',phX+9,phY+12,{align:'center'});}

    const dX=p.x+25;let dY=y+2;
    doc.setFontSize(6.5);doc.setFont('helvetica','bold');doc.setTextColor(206,17,38);
    const nl=doc.splitTextToSize(pe.name||'',cW-28);doc.text(nl,dX,dY);dY+=nl.length*3+1;
    doc.setTextColor(0,0,0);doc.setFontSize(5);doc.setFont('helvetica','normal');

    if(isAl){
      doc.text(`Classe: ${pe.classeName||''}`,dX,dY);dY+=2.8;
      doc.text(`Turma: ${pe.turmaName||''} ${pe.curso?'('+pe.curso+')':''}`,dX,dY);dY+=2.8;
      doc.text(`N° Mat.: ${pe.matricula||''}`,dX,dY);dY+=2.8;
    }else{
      doc.text(`Cargo: ${getRoleName(pe.role)}`,dX,dY);dY+=2.8;
      doc.text(`N° Agente: ${pe.agente||'N/D'}`,dX,dY);dY+=2.8;
      doc.text(`BI: ${pe.bi||''}`,dX,dY);dY+=2.8;
    }

    // Assinatura Director
    const aY=p.y+cH-14;doc.setFontSize(3.5);
    doc.line(p.x+cW/2-18,aY,p.x+cW/2+18,aY);
    doc.text(dL,p.x+cW/2,aY+2.5,{align:'center'});
    if(dN)doc.text(dN.substring(0,25),p.x+cW/2,aY+4.5,{align:'center'});

    const bY=p.y+cH-8;doc.setFillColor(249,214,22);doc.rect(p.x,bY,cW,4,'F');
    doc.setFontSize(4.5);doc.setFont('helvetica','bold');doc.setTextColor(0,0,0);
    doc.text(`ANO LECTIVO ${APP.currentYear?.name||''}`,p.x+cW/2,bY+2.8,{align:'center'});
  }
  doc.save(`passes_${tipo}s.pdf`);Utils.toast('Passes PDF gerados!','success');
};

PagePautas.loadFilters = async function() {
  const schoolId = APP.currentSchool.id;
  const role = APP.currentUser.role;
  const isProfessor = role === 'professor';

  this._classes = await DB.getCollection('classes', [FB.where('schoolId', '==', schoolId)]);
  this._classes.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));

  let tQ = [FB.where('schoolId', '==', schoolId)];
  if (APP.currentYearId) tQ.push(FB.where('yearId', '==', APP.currentYearId));
  this._turmas = await DB.getCollection('turmas', tQ);

  this._disciplinas = await DB.getCollection('disciplinas', [FB.where('schoolId', '==', schoolId)]);
  this._disciplinas.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));

  // Se professor, carregar atribuições
  if (isProfessor) {
    let atQ = [FB.where('schoolId', '==', schoolId), FB.where('professorId', '==', APP.currentUser.uid)];
    if (APP.currentYearId) atQ.push(FB.where('yearId', '==', APP.currentYearId));
    this._atribuicoes = await DB.getCollection('atribuicoes', atQ);

    const classeIds = [...new Set(this._atribuicoes.map(a => a.classeId))];
    const selC = document.getElementById('pautaClasse');
    this._classes.filter(c => classeIds.includes(c.id)).forEach(c => {
      selC.innerHTML += `<option value="${c.id}">${c.name}</option>`;
    });
  } else {
    this._atribuicoes = [];
    const selC = document.getElementById('pautaClasse');
    this._classes.forEach(c => { selC.innerHTML += `<option value="${c.id}">${c.name}</option>`; });
  }
};

PagePautas.onClasseChange = function() {
  const classeId = document.getElementById('pautaClasse').value;
  const selT = document.getElementById('pautaTurma');
  selT.innerHTML = '<option value="">Selecione</option>';

  const isProfessor = APP.currentUser.role === 'professor';

  if (isProfessor) {
    const turmaIds = [...new Set(this._atribuicoes.filter(a => a.classeId === classeId).map(a => a.turmaId))];
    this._turmas.filter(t => turmaIds.includes(t.id)).forEach(t => {
      selT.innerHTML += `<option value="${t.id}">${t.name} ${t.curso ? '(' + t.curso + ')' : ''}</option>`;
    });
  } else {
    this._turmas.filter(t => t.classeId === classeId).forEach(t => {
      selT.innerHTML += `<option value="${t.id}">${t.name} ${t.curso ? '(' + t.curso + ')' : ''}</option>`;
    });
  }

  // Limpar disciplina do professor
  const selD = document.getElementById('pautaDisciplina');
  if (selD) selD.innerHTML = '<option value="">Selecione turma primeiro</option>';
};

PagePautas.onTurmaChangeProf = function() {
  const classeId = document.getElementById('pautaClasse').value;
  const turmaId = document.getElementById('pautaTurma').value;
  const selD = document.getElementById('pautaDisciplina');
  if (!selD) return;
  selD.innerHTML = '<option value="">Selecione</option>';

  const discIds = [...new Set(this._atribuicoes.filter(a => a.classeId === classeId && a.turmaId === turmaId).map(a => a.disciplinaId))];
  this._disciplinas.filter(d => discIds.includes(d.id)).forEach(d => {
    selD.innerHTML += `<option value="${d.id}">${d.name}</option>`;
  });
};

    if (trimestre === '1') html += '<th class="text-center">MAC₁</th><th class="text-center">NPT₁</th><th class="text-center">MT₁</th>';
    else if (trimestre === '2') html += '<th class="text-center">MAC₂</th><th class="text-center">NPT₂</th><th class="text-center">MT₂</th>';
    else if (isFinal) html += '<th class="text-center">CT₁</th><th class="text-center">CT₂</th><th class="text-center">MAC₃</th><th class="text-center">CT₃</th><th class="text-center">Exame</th><th class="text-center">MFD</th>';
    else html += '<th class="text-center">MAC₃</th><th class="text-center">NPT₃</th><th class="text-center">MT₃</th><th class="text-center">MFD</th>';

    html += '<th class="text-center">Obs.</th></tr></thead><tbody>';

    alunos.forEach((a, i) => {
      const n = notasMap[a.id] || {};
      const calc = Utils.calcularMedia(n, classe.name);
      const notaCls = (v) => v !== null ? (v >= notaPos ? 'nota-positiva' : 'nota-negativa') : '';

      html += `<tr><td>${i + 1}</td><td><strong class="nome-aluno">${a.name}</strong></td>`;

      if (trimestre === '1') {
        html += `<td class="text-center">${n.mac1 != null ? n.mac1 : ''}</td><td class="text-center">${n.npt1 != null ? n.npt1 : ''}</td><td class="text-center ${notaCls(calc.mt1)}"><strong>${calc.mt1 !== null ? calc.mt1 : ''}</strong></td>`;
      } else if (trimestre === '2') {
        html += `<td class="text-center">${n.mac2 != null ? n.mac2 : ''}</td><td class="text-center">${n.npt2 != null ? n.npt2 : ''}</td><td class="text-center ${notaCls(calc.mt2)}"><strong>${calc.mt2 !== null ? calc.mt2 : ''}</strong></td>`;
      } else if (isFinal) {
        html += `<td class="text-center ${notaCls(calc.ct1)}">${calc.ct1 !== null ? calc.ct1 : '-'}</td>`;
        html += `<td class="text-center ${notaCls(calc.ct2)}">${calc.ct2 !== null ? calc.ct2 : '-'}</td>`;
        html += `<td class="text-center">${n.mac3 != null ? n.mac3 : ''}</td>`;
        html += `<td class="text-center ${notaCls(calc.ct3)}"><strong>${calc.ct3 !== null ? calc.ct3 : ''}</strong></td>`;
        html += `<td class="text-center">${n.exame != null ? n.exame : ''}</td>`;
        html += `<td class="text-center ${notaCls(calc.mfd)}"><strong>${calc.mfd !== null ? calc.mfd : ''}</strong></td>`;
      } else {
        html += `<td class="text-center">${n.mac3 != null ? n.mac3 : ''}</td><td class="text-center">${n.npt3 != null ? n.npt3 : ''}</td>`;
        let mt3 = (n.mac3 != null && n.npt3 != null) ? Math.round(((parseFloat(n.mac3) + parseFloat(n.npt3)) / 2) * 10) / 10 : null;
        html += `<td class="text-center ${notaCls(mt3)}"><strong>${mt3 !== null ? mt3 : ''}</strong></td>`;
        html += `<td class="text-center ${notaCls(calc.mfd)}"><strong>${calc.mfd !== null ? calc.mfd : ''}</strong></td>`;
      }

      let obs = '';
      if (a.estado === 'Transferido') obs = Utils.genero(a.sexo, 'transferido');
      else if (a.estado === 'Desistente') obs = 'Desistente';
      else if (calc.mfd !== null) obs = calc.mfd >= notaPos ? Utils.genero(a.sexo, 'aprovado') : Utils.genero(a.sexo, 'reprovado');
      const obsCls = obs.toLowerCase().includes('aprov') ? 'nota-positiva' : obs.toLowerCase().includes('reprov') ? 'nota-negativa' : '';
      html += `<td class="text-center ${obsCls}"><small>${obs ? obs.charAt(0).toUpperCase() + obs.slice(1) : ''}</small></td></tr>`;
    });

    html += `</tbody></table></div>
        <div style="margin-top:30px;text-align:center">
          <p style="font-size:11px;margin-bottom:20px">${APP.currentSchool.province || ''}, ${Utils.getCurrentDate()}</p>
          <div style="margin:0 auto;width:200px">
            <p style="font-size:10px">O Professor</p>
            <div style="border-top:1px solid #000;width:180px;margin:20px auto 4px"></div>
            <p style="font-size:10px;font-weight:600">${APP.currentUser.name}</p>
          </div>
        </div>
      </div></div>`;

    this._miniPautaData = { alunos, disc, classe, turma, trimestre, notasMap, notaPos, isFinal };
    document.getElementById('pautaContent').innerHTML = html;

  } catch (e) { console.error(e); Utils.toast('Erro: ' + e.message, 'error'); }
  showLoading(false);
};

PagePautas.exportMiniPautaPDF = function() {
  if (!this._miniPautaData) return;

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  let y = PDFHelper.addHeader(doc, APP.currentSchool, { title: 'MINI-PAUTA' });
  doc.setFontSize(9);
  doc.text(`Prof: ${APP.currentUser.name} | Disciplina: ${d.disc?.name} | ${d.classe?.name} | Turma: ${d.turma?.name} | ${trimN[d.trimestre]}`, 14, y + 3);
  y += 8;

  let head, body;

    body = d.alunos.map((a, i) => { const n = d.notasMap[a.id] || {}; const c = Utils.calcularMedia(n, d.classe.name); return [i + 1, a.name, n.mac1 ?? '', n.npt1 ?? '', c.mt1 ?? '', '']; });
  } else if (d.trimestre === '2') {
    head = [['#', 'Nome', 'MAC₂', 'NPT₂', 'MT₂', 'Obs.']];
    body = d.alunos.map((a, i) => { const n = d.notasMap[a.id] || {}; const c = Utils.calcularMedia(n, d.classe.name); return [i + 1, a.name, n.mac2 ?? '', n.npt2 ?? '', c.mt2 ?? '', '']; });
  } else {
    head = [['#', 'Nome', 'MAC₃', d.isFinal ? 'Exame' : 'NPT₃', 'MFD', 'Obs.']];
    body = d.alunos.map((a, i) => { const n = d.notasMap[a.id] || {}; const c = Utils.calcularMedia(n, d.classe.name); return [i + 1, a.name, n.mac3 ?? '', d.isFinal ? (n.exame ?? '') : (n.npt3 ?? ''), c.mfd ?? '', '']; });

PagePautas.exportMiniPautaXLSX = function() {

    else if (d.trimestre === '2') { row['MAC₂'] = n.mac2 ?? ''; row['NPT₂'] = n.npt2 ?? ''; row['MT₂'] = c.mt2 ?? ''; }
    else { row['MAC₃'] = n.mac3 ?? ''; row[d.isFinal ? 'Exame' : 'NPT₃'] = d.isFinal ? (n.exame ?? '') : (n.npt3 ?? ''); row['MFD'] = c.mfd ?? ''; }
